<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Login – Pureore Capital</title>
    <!-- Firebase SDKs (load first) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0A0A0C;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/h1VhncPQ/file-00000000aa24724689b8a29a4dd17046.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.85) contrast(1.05);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
            z-index: -1;
        }

        /* ===== STATIC 4‑COLOR ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: #00E676;
            top: 10%; left: -5%;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: #00E5FF;
            bottom: 10%; right: -5%;
        }
        .orb-3 {
            width: 280px; height: 280px;
            background: #FFD700;
            top: 50%; left: 80%;
        }
        .orb-4 {
            width: 220px; height: 220px;
            background: #2979FF;
            bottom: 20%; left: 10%;
        }

        /* ===== CONTAINER ===== */
        .admin-prompt {
            width: 100%;
            max-width: 400px;
            margin: 2rem;
            position: relative;
            z-index: 10;
        }

        /* ===== CARD (Static gradient border, no blur) ===== */
        .auth-card {
            position: relative;
            background: rgba(15, 17, 29, 0.92);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(15, 17, 29, 0.92), rgba(15, 17, 29, 0.92)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }

        /* ===== HEADING (Animated 4‑color gradient) ===== */
        h2 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            background: linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-size: 300% 300%;
            animation: gradientShift 6s ease-in-out infinite alternate;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .auth-card p {
            color: #ccc;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }

        /* ===== INPUTS (Static 4‑color gradient border) ===== */
        input {
            width: 100%;
            padding: 0.9rem;
            margin: 0.6rem 0;
            border-radius: 40px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            text-align: center;
            transition: 0.2s ease;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(15, 17, 29, 0.9), rgba(15, 17, 29, 0.9)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }
        input:focus {
            outline: none;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        input::placeholder {
            color: rgba(255,255,255,0.35);
            font-weight: 300;
        }

        /* ===== BUTTON (Cycling 4‑color gradient) ===== */
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #00E676, #00E5FF, #2979FF);
            background-size: 200% 200%;
            animation: btnShift 6s ease-in-out infinite alternate;
            padding: 0.9rem;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            color: #0A0A0C;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.2);
        }
        @keyframes btnShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* ===== ERROR & BACK LINK ===== */
        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.6rem;
            border-radius: 20px;
            text-align: center;
            margin-top: 1rem;
        }
        .back-link {
            margin-top: 1rem;
            display: inline-block;
            color: #00E5FF;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
            color: #FFD700;
        }
        #message {
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <!-- ===== 4 STATIC COLOR ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="admin-prompt">
        <div class="auth-card">
            <h2>🔐 Admin Access</h2>
            <p>Login with your admin credentials</p>
            <input type="email" id="adminEmail" placeholder="Email" autocomplete="email" autofocus>
            <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password">
            <button id="loginBtn" class="btn">Login</button>
            <div id="message"></div>
            <a href="login.html" class="back-link">← Back to user login</a>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG (UNTOUCHED) =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ========== FIX: Clean up any stale auth state before admin login ==========
        (async function cleanupStaleSession() {
            try {
                await auth.signOut();
                await new Promise(resolve => setTimeout(resolve, 300));
            } catch (e) {
                console.log("Pre-admin-login cleanup (non-critical):", e);
            }
        })();
        // ==========================================================================

        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const messageDiv = document.getElementById('message');

        function showError(msg) {
            messageDiv.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => {
                if (messageDiv.innerHTML === `<div class="error">${msg}</div>`) messageDiv.innerHTML = '';
            }, 5000);
        }

        async function adminLogin(email, password) {
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            messageDiv.innerHTML = '';
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const user = userCred.user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    await auth.signOut();
                    throw new Error('Admin profile not found. Contact support.');
                }
                const userData = userDoc.data();
                if (userData.isBlocked === true) {
                    await auth.signOut();
                    throw new Error('Your admin account has been blocked.');
                }
                if (userData.role !== 'admin') {
                    await auth.signOut();
                    throw new Error('Access denied. Not an admin account.');
                }
                window.location.href = 'admin-dashboard.html';
            } catch (error) {
                console.error("Admin login error:", error);
                let errorMsg = error.message;
                if (error.code === 'auth/user-not-found') errorMsg = 'No account found with this email.';
                if (error.code === 'auth/wrong-password') errorMsg = 'Incorrect password.';
                if (error.code === 'auth/invalid-email') errorMsg = 'Invalid email format.';
                if (error.code === 'auth/too-many-requests') errorMsg = 'Too many failed attempts. Try again later.';
                showError(errorMsg);
                passwordInput.value = '';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        function handleLoginClick() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }
            adminLogin(email, password);
        }

        loginBtn.addEventListener('click', handleLoginClick);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLoginClick();
        });
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLoginClick();
        });

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists && userDoc.data().role === 'admin' && userDoc.data().isBlocked !== true) {
                        window.location.href = 'admin-dashboard.html';
                    }
                } catch (err) {
                    console.warn("Auto-redirect check failed:", err);
                }
            }
        });
    </script>
</body>
</html>
