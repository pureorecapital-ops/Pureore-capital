<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Chat | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #050505;
            color: #FFFFFF;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #050505 0%, #0a0a0a 25%, #111111 50%, #0a0a0a 75%, #050505 100%);
            background-size: 400% 400%;
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: -3;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 4 FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            z-index: -2;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: #FFD700;
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #00E5FF;
            bottom: -10%;
            right: -10%;
            animation-delay: 3s;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: #FFD700;
            top: 40%;
            left: 75%;
            animation-delay: 6s;
        }
        .orb-4 {
            width: 280px;
            height: 280px;
            background: #00C853;
            bottom: 30%;
            left: -5%;
            animation-delay: 9s;
        }
        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            z-index: 2;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFD700;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 215, 0, 0.15);
            text-decoration: none;
            margin-bottom: 0.3rem;
            width: fit-content;
        }
        .back-arrow:hover {
            background: #FFD700;
            color: #050505;
            transform: translateX(-4px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .back-arrow svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title svg {
            width: 28px;
            height: 28px;
            fill: url(#goldGrad);
        }

        /* ===== CHAT AVATAR ===== */
        .chat-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #F59E0B, #00C853);
            background-size: 200% 200%;
            animation: avatarFlow 4s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
        }
        @keyframes avatarFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        .chat-avatar svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* ===== CHAT BOX ===== */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 0.5rem 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 0.5rem 0.2rem;
            scroll-behavior: smooth;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== MESSAGES ===== */
        .message {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            position: relative;
        }
        .message .msg-icon {
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #00C853, #009624);
            color: #050505;
            border-bottom-right-radius: 4px;
            border-color: rgba(0, 200, 83, 0.2);
        }
        .ai-message {
            align-self: flex-start;
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-bottom-left-radius: 4px;
            color: #FFFFFF;
        }
        .ai-message .msg-icon {
            filter: brightness(0) invert(1);
        }
        .ai-message a {
            color: #FFD700;
            text-decoration: none;
        }
        .ai-message a:hover {
            text-decoration: underline;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex;
            gap: 0.5rem;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 0.3rem 0.5rem;
            align-items: center;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(17, 17, 17, 0.95), rgba(17, 17, 17, 0.95)),
                              linear-gradient(135deg, #FFD700, #00C853, #FFD700);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            transition: border-color 0.3s;
        }
        .input-area:focus-within {
            border-color: transparent;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-area input::placeholder {
            color: #666;
        }
        .send-btn {
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            flex-shrink: 0;
            color: #050505;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.25);
        }
        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: #050505;
        }

        /* ===== EMPTY STATE ===== */
        .empty-msg {
            text-align: center;
            color: #666;
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .message {
                max-width: 90%;
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }
            .page-title {
                font-size: 1.4rem;
            }
            .chat-avatar {
                width: 45px;
                height: 45px;
            }
            .chat-avatar svg {
                width: 24px;
                height: 24px;
            }
            .input-area input {
                font-size: 0.9rem;
                padding: 0.6rem;
            }
            .send-btn {
                width: 40px;
                height: 40px;
            }
            .send-btn svg {
                width: 18px;
                height: 18px;
            }
        }

        /* ===== HIDDEN SVG GRADIENT DEFINITION ===== */
        svg defs {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== 4 FLOATING ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <a href="dashboard.html" class="back-arrow">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    Back
                </a>
                <div class="page-title">
                    <svg viewBox="0 0 24 24">
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFD700"/>
                            <stop offset="100%" stop-color="#F59E0B"/>
                        </linearGradient>
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
                    </svg>
                    Pureore Assistant
                </div>
            </div>
            <!-- Chat Avatar -->
            <div class="chat-avatar" title="Pureore Assistant">
                <svg viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
                </svg>
            </div>
        </div>

        <!-- ===== CHAT BOX ===== -->
        <div class="chat-box" id="chatBox"></div>

        <!-- ===== INPUT AREA ===== -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask me anything about Pureore Capital...">
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);
        db.settings({ persistence: true });

        // ===== DOM REFS =====
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentUserId = null;
        let messagesRef = null;
        let unsubscribe = null;

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function saveMessage(text, isUser) {
            if (!currentUserId) return;
            if (!messagesRef) {
                messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
            }
            await messagesRef.add({
                text: text,
                isUser: isUser,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function displayMessage(doc) {
            const data = doc.data();
            if (!data.text) return;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${data.isUser ? 'user-message' : 'ai-message'}`;
            // Convert line breaks to <br> for proper formatting
            if (!data.isUser) {
                msgDiv.innerHTML = data.text.replace(/\n/g, '<br>');
            } else {
                msgDiv.innerText = data.text;
            }
            chatBox.appendChild(msgDiv);
            scrollToBottom();
        }

        function loadChatHistory() {
            if (unsubscribe) unsubscribe();
            if (!currentUserId) return;
            messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
            const query = messagesRef.orderBy('timestamp', 'asc');
            unsubscribe = query.onSnapshot((snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach(doc => displayMessage(doc));
                if (snapshot.empty) {
                    const welcomeText =
                        "Hello! I'm Pureore Assistant, your personal guide.\n\nAsk me anything about deposits, withdrawals, investments, daily income, platform rules, or referral bonuses.\n\nI can explain how to use every page: Register, Login, Dashboard, Deposit, Withdraw, Treasure, Voucher, Loan, News, Change Password, Income, Team, Mk Vip, J Product, and more.\n\nHow can I help you today?";
                    saveMessage(welcomeText, false).catch(console.warn);
                }
            }, error => {
                console.error("Chat listener error:", error);
                chatBox.innerHTML =
                    '<div class="empty-msg">Error loading chat. Please refresh. Make sure Firestore rules allow reading "chats" collection.</div>';
            });
        }

        // ================================================================
        // AI RESPONSE GENERATOR – UPDATED: No manager numbers, Telegram only
        // ================================================================
        function getAIResponse(userMessage) {
            const msg = userMessage.toLowerCase();

            // Blocked keywords – no admin/owner info
            const blockedKeywords = ['admin', 'owner', 'pathy', 'ceo', 'founder', 'who runs', 'who created', 'server password',
                'hack', 'exploit', 'danger', 'illegal'
            ];
            for (let kw of blockedKeywords) {
                if (msg.includes(kw)) {
                    return "I cannot share admin or owner information for security and privacy reasons.\n\nIf you have an account issue, please reach out to our official Telegram community: @pureorecapital.\n\nI'm here to help with platform features!";
                }
            }

            // ── Contact / Support ──
            if (msg.includes('contact') || msg.includes('support') || msg.includes('whatsapp') || msg.includes('telegram') ||
                msg.includes('help')) {
                return "You can connect with us through these channels:\n\n" +
                    "📱 Telegram: @pureorecapital (official community & support)\n" +
                    "💬 WhatsApp Group: https://chat.whatsapp.com/CAphZ7CmNScGkp9un8MSjB\n\n" +
                    "Join our community for real‑time updates, news, and direct assistance from the Pureore team.";
            }

            // ── Why find manager/agent before deposit ──
            if ((msg.includes('deposit') && (msg.includes('why') || msg.includes('find') || msg.includes('before'))) ||
                (msg.includes('agent') && msg.includes('deposit'))) {
                return "Before making any deposit, it is important to verify the correct agent details.\n\n" +
                    "Here's why:\n" +
                    "• Agent numbers may change – always confirm with an official representative.\n" +
                    "• To avoid scams – only use verified agent numbers provided by Pureore.\n" +
                    "• To ensure your deposit is tracked correctly to your account.\n" +
                    "• The agent will confirm the amount and network before you send.\n" +
                    "• After payment, they will guide you on SMS verification.\n\n" +
                    "For the latest agent details and support, join our Telegram: @pureorecapital or WhatsApp: https://chat.whatsapp.com/CAphZ7CmNScGkp9un8MSjB";
            }

            // ── Origin / Where from ──
            if (msg.includes('origin') || msg.includes('where from') || msg.includes('uk') || msg.includes('africa') || msg
                .includes('country')) {
                return "Pureore Capital was first launched in Manchester, United Kingdom – a small but innovative place.\n\n" +
                    "Today we have a growing family of members both in the UK and across Africa. The scrolling flags you see (UK, Congo, Tanzania, Ghana, Zimbabwe, Zambia) represent our friendly global community.\n\nWe believe in friendship and financial growth together!";
            }

            // ── Agent information ──
            if (msg.includes('agent') && !msg.includes('why')) {
                return "Pureore has verified agents for each network:\n\n" +
                    "• MTN: John Kabwe, Getrude Sonpo\n" +
                    "• Airtel: John Kabwe\n" +
                    "• Zamtel: Jeremiah Ilunga\n\n" +
                    "All agents are committed to your financial success. For the latest updates, join our Telegram: @pureorecapital.";
            }

            // ── Register ──
            if (msg.includes('register') || msg.includes('create account') || msg.includes('sign up')) {
                return "To register, go to the Register page.\n\n" +
                    "Fill in your full name, email, password (min 6 chars), and a valid referral code (required).\n\n" +
                    "You'll receive a 20 ZMW welcome bonus instantly.\n\n" +
                    "After registration, you'll be redirected to your dashboard.";
            }

            // ── Login ──
            if (msg.includes('login') || msg.includes('sign in')) {
                return "Go to the login page, enter your email and password.\n\n" +
                    "If you forgot your password, use the 'Forgot password?' link in the profile page (Me > Change Password > Forgot password).\n\n" +
                    "For assistance, contact us on Telegram: @pureorecapital.";
            }

            // ── Dashboard ──
            if (msg.includes('dashboard')) {
                return "Your dashboard shows your current balance, deposit and withdraw buttons, and three quick actions: Treasure, Loan, and Voucher.\n\n" +
                    "Below that, you'll find investment plans. Use the floating buttons for transaction history and support.";
            }

            // ── Deposit ──
            if (msg.includes('deposit') && !msg.includes('why') && !msg.includes('agent')) {
                return "To deposit:\n\n" +
                    "1. Go to Dashboard → tap 'Deposit'\n" +
                    "2. Choose your network (MTN / Airtel / Zamtel)\n" +
                    "3. Enter your phone number (9 digits after +260)\n" +
                    "4. Select an amount (min 70 ZMW) or type custom amount\n" +
                    "5. Check 'I'm ready to pay'\n" +
                    "6. You'll see agent details – confirm with us on Telegram: @pureorecapital\n" +
                    "7. Send the exact amount to the agent\n" +
                    "8. Paste the SMS you received → Click Verify & Complete\n\n" +
                    "Admin approval (usually within 24h) adds the funds to your balance.";
            }

            // ── Withdraw ──
            if (msg.includes('withdraw')) {
                return "To withdraw:\n\n" +
                    "1. Go to Dashboard → tap 'Withdraw'\n" +
                    "2. Choose network or bank\n" +
                    "3. For mobile money: enter your phone number and account name\n" +
                    "4. For bank: select bank and enter 16‑digit card number\n" +
                    "5. Enter amount (min 20 ZMW) – a 20% fee applies\n" +
                    "6. You must have at least one completed deposit and one active investment\n" +
                    "7. No active loans allowed for withdrawal\n" +
                    "8. Withdrawals are processed Monday–Friday\n\n" +
                    "After submission, admin approves within 24h.";
            }

            // ── Investment plans ──
            if (msg.includes('invest') || msg.includes('investment plan') || msg.includes('mkvip') || msg.includes(
                'jproduct')) {
                return "We offer two investment sections:\n\n" +
                    "• Mk Vip – multiple plans with different investment amounts, daily returns, and durations.\n" +
                    "• J Product – designed for steady, long‑term earnings.\n\n" +
                    "To invest, go to the respective page (from bottom navigation or dashboard), choose a plan, tap 'Invest Now'.\n\n" +
                    "Your balance will be deducted, and you'll start earning daily returns. You can view active plans in the 'Income' page.";
            }

            // ── Claim daily income ──
            if (msg.includes('claim') || msg.includes('daily income') || msg.includes('income page')) {
                return "In the 'Income' page, you'll see your active plans under the 'Active' tab.\n\n" +
                    "After 24 hours have passed since your last claim (or since the start date), the 'Claim Daily Income' button turns green.\n\n" +
                    "Tap it to receive that day's profit directly into your balance.\n\n" +
                    "Claims are only allowed on weekdays (Monday–Friday). You can claim once every 24 hours per investment.\n\n" +
                    "If you have only one active plan and it has 2 days or less remaining, claiming is blocked until you purchase a second plan – this encourages reinvestment.";
            }

            // ── Rules ──
            if (msg.includes('rule') || msg.includes('rules') || msg.includes('policy')) {
                return "Key rules:\n\n" +
                    "• Minimum deposit: 70 ZMW\n" +
                    "• Minimum withdrawal: 20 ZMW (20% fee)\n" +
                    "• Withdrawals require at least one completed deposit and one active investment\n" +
                    "• No active loans allowed for withdrawal\n" +
                    "• Withdrawals only Monday–Friday\n" +
                    "• Loans: 15% interest, due in 15 days\n" +
                    "• Daily income: claim once every 24 hours (weekdays only)\n" +
                    "• Referral bonus: 5% of first deposit (when referred user invests)\n" +
                    "• No fraud or multiple accounts. Read full Terms in footer.";
            }

            // ── Referral / Team ──
            if (msg.includes('referral') || msg.includes('team') || msg.includes('bonus') || msg.includes('invite')) {
                return "Your referral code is in the 'Team' page. Share your unique link.\n\n" +
                    "When someone registers using your code, makes their first completed deposit (any amount) AND purchases their first investment plan, you receive 5% of that deposit as a bonus.\n\n" +
                    "There's no limit on team size. The bonus is automatically added to your balance and appears in your 'Team' earnings.";
            }

            // ── Loan ──
            if (msg.includes('loan')) {
                return "Loans are available from the dashboard middle icon (Loan).\n\n" +
                    "You can request between 6,000 and 100,000 ZMW (multiples of 6,000).\n" +
                    "• 15% interest, repayable in 15 days\n" +
                    "• You need a balance of at least 10,000 ZMW\n" +
                    "• Total invested amount ≥ 15,000 ZMW\n" +
                    "• At least 15 team members who have both deposited and invested\n\n" +
                    "After repayment, you must contact admin to enable new loan requests.";
            }

            // ── Treasure / Voucher ──
            if (msg.includes('treasure') || msg.includes('voucher')) {
                return "Treasure and Voucher are promotional features.\n\n" +
                    "• Treasure codes: 7 characters (letters + numbers)\n" +
                    "• Vouchers: 10 characters with amount embedded\n\n" +
                    "Enter unique codes in the respective pages. Codes are posted on our Telegram: @pureorecapital and WhatsApp group.\n\n" +
                    "Each code can be used only once and gives you free ZMW. Stay tuned for daily codes!";
            }

            // ── News ──
            if (msg.includes('news')) {
                return "The News page shows official announcements, updates, and new investment opportunities.\n\nCheck it regularly to stay informed about the latest developments at Pureore Capital.";
            }

            // ── Change Password ──
            if (msg.includes('change password') || msg.includes('me page') || msg.includes('profile')) {
                return "To change your password:\n\n" +
                    "1. Go to 'Me' page (bottom navigation)\n" +
                    "2. Tap 'Change Password'\n" +
                    "3. Enter your email, old password, new password (min 6 chars), and confirm\n" +
                    "4. After successful change, you'll be logged out\n\n" +
                    "If you forgot your password, use the 'Forgot password?' link there – you'll need to contact us on Telegram: @pureorecapital for recovery.";
            }

            // ── Team members ──
            if (msg.includes('team members') || (msg.includes('team') && !msg.includes('referral'))) {
                return "The 'Team' page shows your referral link, how many people have joined using your code, and the total bonus you've earned from referrals.\n\nEach referred user appears in the list with their bonus amount.";
            }

            // ── Greetings ──
            if (msg.match(/^(hi|hello|hey|good morning|good afternoon|good evening)$/)) {
                return "Hello! I'm Pureore Assistant, your personal guide.\n\nAsk me anything about deposits, withdrawals, investments, daily income, rules, referral bonuses, or any platform feature.\n\nHow can I help you today?";
            }

            // ── Default ──
            return "I'm here to help with Pureore Capital!\n\n" +
                "You can ask about:\n" +
                "• Registration, Login, Dashboard\n" +
                "• Deposit, Withdrawal\n" +
                "• Investment plans (Mk Vip / J Product)\n" +
                "• Daily income claiming\n" +
                "• Loans, Treasure, Voucher codes\n" +
                "• News, Changing password\n" +
                "• Team referrals\n" +
                "• WhatsApp / Telegram support\n" +
                "• Platform rules\n\n" +
                "Please rephrase your question or ask something specific.\n\n" +
                "For direct support, join our Telegram: @pureorecapital or WhatsApp group: https://chat.whatsapp.com/CAphZ7CmNScGkp9un8MSjB";
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            if (!currentUserId) return;
            await saveMessage(text, true);
            const reply = getAIResponse(text);
            setTimeout(async () => {
                await saveMessage(reply, false);
            }, 500);
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (text) {
                sendMessage(text);
                userInput.value = '';
            }
        }

        // ===== AUTH STATE =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            loadChatHistory();
        });

        // ===== EVENT LISTENERS =====
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
