<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chat | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 0.5rem;
        }
        .message {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 24px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background: #2ecc71;
            color: #0A0A0C;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            align-self: flex-start;
            background: #1E1E2A;
            border: 1px solid #2ecc71;
            border-bottom-left-radius: 4px;
            color: #FFFFFF;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            background: #111116;
            border-radius: 60px;
            padding: 0.3rem 0.5rem;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .send-btn {
            background: #2ecc71;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
            color: #0A0A0C;
            font-weight: bold;
        }
        .send-btn:hover {
            background: #27ae60;
            transform: scale(1.02);
        }
        .typing {
            font-style: italic;
            color: #aaa;
            font-size: 0.8rem;
            padding: 0.3rem 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
        }
        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .input-area input { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">🤖 Pureore African Assistant</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me anything about Pureore Capital...">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);
    db.settings({ persistence: true });

    // DOM elements
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let currentUserId = null;
    let messagesRef = null;
    let unsubscribe = null;

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function saveMessage(text, isUser) {
        if (!currentUserId) return;
        if (!messagesRef) {
            messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
        }
        await messagesRef.add({
            text: text,
            isUser: isUser,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    function displayMessage(doc) {
        const data = doc.data();
        if (!data.text) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${data.isUser ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = data.text;
        chatBox.appendChild(msgDiv);
        scrollToBottom();
    }

    function loadChatHistory() {
        if (unsubscribe) unsubscribe();
        if (!currentUserId) return;
        messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
        const query = messagesRef.orderBy('timestamp', 'asc');
        unsubscribe = query.onSnapshot((snapshot) => {
            chatBox.innerHTML = '';
            snapshot.forEach(doc => displayMessage(doc));
            if (snapshot.empty) {
                const welcomeText = "Hello! I'm Pureore African, your personal assistant. Ask me anything about deposits, withdrawals, investments, daily income, platform rules, or referral bonuses. I can also explain how to use any page: Register, Login, Dashboard, Deposit, Withdraw, Treasure, Voucher, Loan, News, Change Password, Income, Team, Mk Vip, J Product, and even WhatsApp groups. How can I help you today?";
                saveMessage(welcomeText, false).catch(console.warn);
            }
        }, error => {
            console.error("Chat listener error:", error);
            chatBox.innerHTML = '<div class="empty-msg">Error loading chat. Please refresh. Make sure Firestore rules allow reading "chats" collection.</div>';
        });
    }

    // AI response generator (improved)
    function getAIResponse(userMessage) {
        const msg = userMessage.toLowerCase();

        // Blocked topics (admin/owner info)
        const blockedKeywords = ['admin', 'owner', 'pathy', 'ceo', 'founder', 'who runs', 'who created', 'server password', 'hack', 'exploit', 'danger', 'illegal'];
        for (let kw of blockedKeywords) {
            if (msg.includes(kw)) {
                return "I cannot share admin or owner information for security and privacy reasons. If you have an account issue, please contact our customer support via WhatsApp: Assistant +260 96 139 1022 or Manager +260 95 135 9357. I'm here to help with platform features!";
            }
        }

        // Origin
        if (msg.includes('origin') || msg.includes('where from') || msg.includes('uk') || msg.includes('africa') || msg.includes('country') || msg.includes('friends')) {
            return "Pureore Capital was first launched in Manchester, United Kingdom – a small but innovative place. Today we have a growing family of members both in the UK and across Africa. The scrolling flags you see (UK, Congo, Tanzania, Ghana, Zimbabwe, Zambia) represent our friendly global community. We believe in friendship and financial growth together!";
        }

        // Agent explanation
        if (msg.includes('agent') || msg.includes('zambian agent') || msg.includes('why agent')) {
            return "The Zambian agents (John Kabwe, Getrude Sonpo for MTN; John Kabwe for Airtel; Jeremiah Ilunga for Zamtel) are carefully chosen to help our African users build their futures and grow their income. They assist with deposits and provide local support. All agents are verified and committed to your financial success.";
        }

        // WhatsApp & support
        if (msg.includes('whatsapp') || msg.includes('contact support') || msg.includes('blocked') || msg.includes('manager') || msg.includes('assistant')) {
            return "For direct support:\n📞 Assistant (Deposit/Withdraw issues): +260 96 139 1022 (WhatsApp)\n📞 Manager (Account & blocking issues): +260 95 135 9357 (WhatsApp)\nJoin our WhatsApp group for community updates: https://chat.whatsapp.com/KnggKPDuxj98Wxo1HAE6FP\nWhatsApp Channel: https://whatsapp.com/channel/0029VbCoP1qFcowAHv8uFV2Y\nTelegram: https://t.me/pureorecapital\nIf your account is blocked, please contact the Manager immediately.";
        }

        // Registration
        if (msg.includes('register') || msg.includes('create account') || msg.includes('sign up')) {
            return "To register, go to the Register page. Fill in your full name, email, password (min 6 chars), and a valid referral code (required). You'll receive a 20 ZMW welcome bonus instantly. After registration, you'll be redirected to your dashboard.";
        }

        // Login
        if (msg.includes('login') || msg.includes('sign in')) {
            return "Go to the login page, enter your email and password. If you forgot your password, use the 'Forgot password?' link in the profile page (Me > Change Password > Forgot password) – you'll need to contact the manager via WhatsApp for recovery.";
        }

        // Dashboard
        if (msg.includes('dashboard')) {
            return "Your dashboard shows your current balance, deposit and withdraw buttons, and three quick actions: Treasure, Loan, and Voucher. Below that, you'll find investment plans. Use the floating buttons for transaction history and support.";
        }

        // Deposit
        if (msg.includes('deposit')) {
            return "To deposit: Go to Dashboard → tap 'Deposit'. Choose your network (MTN/Airtel/Zamtel). Enter your phone number (9 digits after +260) and your full name. Select an amount (min 70 ZMW) or type custom amount. Check 'I'm ready to pay'. You'll see agent details. Send the exact amount to the agent, then paste the SMS you received. Click Verify & Complete. After admin approval (usually within 24h), your balance increases. No screenshot needed anymore.";
        }

        // Withdraw
        if (msg.includes('withdraw')) {
            return "To withdraw: Go to Dashboard → tap 'Withdraw'. Choose network or bank. For mobile money, enter your phone number and account name; for bank, select bank and enter 16‑digit card number. Enter amount (min 20 ZMW). A 20% fee applies. You must have at least one completed deposit and one active investment, and no active loans. Withdrawals are processed Monday–Friday. After submission, admin approves within 24h.";
        }

        // Investment plans
        if (msg.includes('invest') || msg.includes('investment plan') || msg.includes('mkvip') || msg.includes('jproduct')) {
            return "We offer two investment sections: Mk Vip and J Product. Each has multiple plans with different investment amounts, daily returns, and durations. To invest, go to the respective page (from bottom navigation or dashboard), choose a plan, tap 'Invest Now'. Your balance will be deducted, and you'll start earning daily returns. You can view active plans in the 'Income' page.";
        }

        // Daily income claim
        if (msg.includes('claim') || msg.includes('daily income') || msg.includes('income page')) {
            return "In the 'Income' page, you'll see your active plans under 'Active' tab. After 24 hours have passed since your last claim (or since the start date), the 'Claim Daily Income' button turns green. Tap it to receive that day's profit directly into your balance. Claims are only allowed on weekdays (Monday–Friday). You can claim once every 24 hours per investment. If you have only one active plan and it has 2 days or less remaining, claiming is blocked until you purchase a second plan – this encourages reinvestment.";
        }

        // Platform rules
        if (msg.includes('rule') || msg.includes('rules') || msg.includes('policy')) {
            return "📌 Key rules:\n• Minimum deposit: 70 ZMW\n• Minimum withdrawal: 20 ZMW (20% fee)\n• Withdrawals require at least one completed deposit and one active investment\n• No active loans allowed for withdrawal\n• Withdrawals only Monday–Friday\n• Loans: 15% interest, due in 15 days\n• Daily income: claim once every 24 hours (weekdays only)\n• Referral bonus: 5% of first deposit (when referred user invests)\n• No fraud or multiple accounts. Read full Terms in footer.";
        }

        // Referral / Team
        if (msg.includes('referral') || msg.includes('team') || msg.includes('bonus') || msg.includes('invite')) {
            return "Your referral code is in the 'Team' page. Share your unique link. When someone registers using your code, makes their first completed deposit (any amount) AND purchases their first investment plan, you receive 5% of that deposit as a bonus. There's no limit on team size. The bonus is automatically added to your balance and appears in your 'Team' earnings.";
        }

        // Loan
        if (msg.includes('loan')) {
            return "Loans are available from the dashboard middle icon (Loan). You can request between 6,000 and 100,000 ZMW (multiples of 6,000). 15% interest, repayable in 15 days. You need a balance of at least 10,000 ZMW, total invested amount ≥ 15,000 ZMW, and at least 15 team members who have both deposited and invested. After repayment, you must contact admin to enable new loan requests.";
        }

        // Treasure / Voucher
        if (msg.includes('treasure') || msg.includes('voucher')) {
            return "Treasure and Voucher are promotional features. Enter unique codes (treasure codes are 7 characters, vouchers are 10 characters with amount embedded) in the respective pages. Codes are posted on our WhatsApp group and channel. Each code can be used only once and gives you free ZMW. Stay tuned for daily codes!";
        }

        // News
        if (msg.includes('news')) {
            return "The News page shows official announcements, updates, and new investment opportunities. Check it regularly to stay informed.";
        }

        // Change password / Me
        if (msg.includes('change password') || msg.includes('me page') || msg.includes('profile')) {
            return "To change your password: Go to 'Me' page (bottom navigation). Tap 'Change Password'. Enter your email, old password, new password (min 6 chars), and confirm. After successful change, you'll be logged out. If you forgot your password, use the 'Forgot password?' link there – you'll need to contact the manager via WhatsApp for recovery.";
        }

        // Team page (referral list)
        if (msg.includes('team members') || (msg.includes('team') && !msg.includes('referral'))) {
            return "The 'Team' page shows your referral link, how many people have joined using your code, and the total bonus you've earned from referrals. Each referred user appears in the list with their bonus amount.";
        }

        // Greetings
        if (msg.match(/^(hi|hello|hey|good morning|good afternoon|good evening)$/)) {
            return "Hello! I'm Pureore African, your personal assistant. Ask me anything about deposits, withdrawals, investments, daily income, rules, referral bonuses, or any platform feature. How can I help you today?";
        }

        // Default response
        return "I'm here to help with Pureore Capital! You can ask about registration, login, dashboard, deposit, withdrawal, investment plans (Mk Vip / J Product), daily income claiming, loans, treasure/voucher codes, news, changing password, team referrals, WhatsApp support, platform rules, and more. Please rephrase your question or ask something specific.";
    }

    async function sendMessage(text) {
        if (!text.trim()) return;
        if (!currentUserId) return;
        await saveMessage(text, true);
        const reply = getAIResponse(text);
        // Simulate typing delay (optional)
        setTimeout(async () => {
            await saveMessage(reply, false);
        }, 500);
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (text) {
            sendMessage(text);
            userInput.value = '';
        }
    }

    // Auth state
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUserId = user.uid;
        loadChatHistory();
    });

    // Event listeners
    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>
</body>
</html>
