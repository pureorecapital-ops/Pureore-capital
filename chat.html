<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Chat | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --dark: #0a0815;
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100%;
            color: #fff;
            background: var(--dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.05) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 450px;
            height: 450px;
            background: var(--violet);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 380px;
            height: 380px;
            background: var(--cyan);
            bottom: -10%;
            right: -10%;
            animation-delay: 6s;
        }
        .orb-3 {
            width: 320px;
            height: 320px;
            background: var(--gold);
            top: 45%;
            left: 65%;
            animation-delay: 12s;
            opacity: 0.04;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(30px, -40px) scale(1.08);
            }
            100% {
                transform: translate(-20px, 30px) scale(0.92);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 1.2rem 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        /* ----- CHAT BOX (scrollable) ----- */
        .chat-box {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem 0.2rem 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: auto;
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* ===== MESSAGES ===== */
        .message {
            max-width: 82%;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            animation: msgFadeIn 0.25s ease;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        @keyframes msgFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ----- USER MESSAGE: BLUE background, white text ----- */
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.15);
        }
        .user-message .msg-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .user-message a {
            color: #bbdefb;
            text-decoration: underline;
        }
        .user-message a:hover {
            color: #fff;
        }

        /* ----- AI MESSAGE: WHITE background, dark text ----- */
        .ai-message {
            align-self: flex-start;
            background: #ffffff;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.04);
        }
        .ai-message .msg-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            stroke: #7c6df0;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-top: 2px;
        }
        .ai-message .msg-content {
            flex: 1;
        }
        .ai-message a {
            color: #0d47a1;
            text-decoration: underline;
        }
        .ai-message a:hover {
            color: #1a73e8;
        }
        .ai-message ul,
        .ai-message ol {
            padding-left: 1.4rem;
            margin: 0.3rem 0;
        }
        .ai-message li {
            margin-bottom: 0.2rem;
        }
        .ai-message strong {
            color: #f97316;
        }
        .ai-message .section-title {
            font-weight: 700;
            color: #0d47a1;
            display: block;
            margin-top: 0.4rem;
        }

        /* ----- TYPING INDICATOR ----- */
        .typing-indicator {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 0.6rem 1rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: msgFadeIn 0.3s ease;
        }
        .typing-indicator .dots {
            display: inline-flex;
            gap: 4px;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: rgba(255, 255, 255, 0.15);
            align-self: center;
            margin: auto 0;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .empty-state .title {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
        }
        .empty-state .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 0.2rem;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex;
            gap: 0.5rem;
            background: rgba(10, 8, 21, 0.65);
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
            border-radius: 60px;
            padding: 0.2rem 0.4rem 0.2rem 1rem;
            align-items: center;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-area:focus-within {
            border-color: rgba(246, 201, 110, 0.15);
            box-shadow: 0 0 30px rgba(246, 201, 110, 0.02);
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 0;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }
        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        .send-btn {
            background: linear-gradient(135deg, var(--gold), #f5a623);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex-shrink: 0;
            color: #0a0815;
            box-shadow: 0 4px 20px var(--gold-glow);
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px var(--gold-glow);
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 0.8rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.1rem;
            }
            .message {
                max-width: 88%;
                font-size: 0.88rem;
                padding: 0.6rem 0.8rem;
            }
            .message .msg-icon {
                width: 22px;
                height: 22px;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 5px 10px;
            }
            .input-area {
                padding: 0.1rem 0.3rem 0.1rem 0.8rem;
            }
            .input-area input {
                font-size: 0.88rem;
                padding: 0.5rem 0;
            }
            .send-btn {
                width: 40px;
                height: 40px;
            }
            .send-btn svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 400px) {
            .message {
                max-width: 92%;
                font-size: 0.82rem;
                padding: 0.5rem 0.7rem;
            }
            .message .msg-icon {
                width: 20px;
                height: 20px;
            }
            .page-title {
                font-size: 1rem;
            }
            .back-btn {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
            .send-btn {
                width: 36px;
                height: 36px;
            }
            .send-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="6 6 18 6 6 18 18 18" />
                    </svg>
                </div>
                <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                <span class="brand-badge">Chat</span>
            </div>
        </div>

        <!-- ===== BACK ROW ===== -->
        <div class="back-row">
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
                Back
            </button>
            <span class="page-title">💬 Assistant</span>
            <span class="page-sub" style="margin-left:auto;">AI · 24/7</span>
        </div>

        <!-- ===== CHAT BOX ===== -->
        <div class="chat-box" id="chatBox">
            <div class="empty-state" id="emptyState">
                <span class="icon">🤖</span>
                <div class="title">Pureore Assistant</div>
                <div class="sub">Ask me anything about the platform</div>
            </div>
        </div>

        <!-- ===== INPUT AREA ===== -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about deposits, withdrawals, plans..." />
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>

    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // GEMINI API CONFIGURATION
        // ================================================================
        // Replace this with your own Gemini API key from Google AI Studio.
        // If the key is missing or the API fails, the assistant falls back
        // to the static response system.
        var GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY_HERE';
        var GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=' +
            GEMINI_API_KEY;

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // DOM REFS
        // ================================================================
        var chatBox = document.getElementById('chatBox');
        var emptyState = document.getElementById('emptyState');
        var userInput = document.getElementById('userInput');
        var sendBtn = document.getElementById('sendBtn');
        var backBtn = document.getElementById('backBtn');

        var currentUserId = null;
        var messagesRef = null;
        var unsubscribe = null;
        var isFirstLoad = true;
        var typingIndicator = null;

        // ================================================================
        // SCROLL MANAGEMENT – stable, no jumping
        // ================================================================
        var scrollRAF = null;

        function scrollToBottom() {
            if (scrollRAF) cancelAnimationFrame(scrollRAF);
            scrollRAF = requestAnimationFrame(function() {
                chatBox.scrollTop = chatBox.scrollHeight;
                scrollRAF = null;
            });
        }

        function scrollToBottomImmediate() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // SVG ICONS
        // ================================================================
        var userIconSVG =
            '<svg class="msg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

        var botIconSVG =
            '<svg class="msg-icon" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M8 12h8"/><path d="M8 16h6"/><circle cx="10" cy="10" r="0.5" fill="currentColor"/><circle cx="14" cy="10" r="0.5" fill="currentColor"/></svg>';

        // ================================================================
        // FORMAT AI RESPONSE: convert markdown-like syntax to HTML
        // ================================================================
        function formatAIResponse(text) {
            // Preserve line breaks
            var html = text.replace(/\n/g, '<br>');

            // Convert numbered lists: "1. item" -> <ol><li>item</li></ol>
            // We'll handle ordered lists by detecting lines starting with number+dot
            var lines = text.split('\n');
            var inList = false;
            var listType = null;
            var listItems = [];
            var result = [];

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                // Check for ordered list item: "1. item" or "1. item"
                var olMatch = line.match(/^(\d+)\.\s+(.+)/);
                // Check for unordered list item: "- item" or "• item"
                var ulMatch = line.match(/^[-•]\s+(.+)/);

                if (olMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) {
                            // close previous list
                            result.push('</' + (listType === 'ol' ? 'ol' : 'ul') + '>');
                        }
                        inList = true;
                        listType = 'ol';
                        result.push('<ol>');
                    }
                    result.push('<li>' + olMatch[2] + '</li>');
                } else if (ulMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) {
                            result.push('</' + (listType === 'ol' ? 'ol' : 'ul') + '>');
                        }
                        inList = true;
                        listType = 'ul';
                        result.push('<ul>');
                    }
                    result.push('<li>' + ulMatch[1] + '</li>');
                } else {
                    if (inList) {
                        result.push('</' + (listType === 'ol' ? 'ol' : 'ul') + '>');
                        inList = false;
                        listType = null;
                    }
                    // If line is empty, just add a line break
                    if (line === '') {
                        result.push('<br>');
                    } else {
                        // Detect section titles: lines ending with ':' or starting with '──'
                        var sectionMatch = line.match(/^─+$/);
                        if (sectionMatch) {
                            result.push('<hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 0.3rem 0;">');
                        } else if (line.endsWith(':')) {
                            result.push('<span class="section-title">' + line + '</span>');
                        } else {
                            result.push(line);
                        }
                    }
                }
            }
            if (inList) {
                result.push('</' + (listType === 'ol' ? 'ol' : 'ul') + '>');
            }

            var finalHtml = result.join('<br>');

            // Convert URLs to clickable blue underlined links
            var urlRegex = /(https?:\/\/[^\s]+)/g;
            finalHtml = finalHtml.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" rel="noopener" style="color: #0d47a1; text-decoration: underline;">' +
                    url + '</a>';
            });

            // Convert @mentions to Telegram links
            finalHtml = finalHtml.replace(/@(\w+)/g, function(match, username) {
                return '<a href="https://t.me/' + username + '" target="_blank" rel="noopener" style="color: #0d47a1; text-decoration: underline;">@' +
                    username + '</a>';
            });

            return finalHtml;
        }

        // ================================================================
        // GEMINI API – REAL AI
        // ================================================================
        async function getGeminiResponse(userMessage) {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY_HERE') {
                console.warn('Gemini API key not set. Using fallback responses.');
                return null;
            }

            try {
                var response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "You are Pureore Assistant, a helpful AI assistant for Pureore Capital, an African-focused investment platform. Answer questions about the platform, deposits, withdrawals, investments, rules, loans, referrals, etc. Keep answers clear, structured with numbered lists or bullet points, and be friendly. Always direct users to official support channels (Telegram @pureorecapital, WhatsApp group). If you don't know something, say so and suggest contacting support. Here is the user's question: " +
                                    userMessage
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    console.warn('Gemini API error:', response.status);
                    return null;
                }

                var data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    var content = data.candidates[0].content;
                    if (content && content.parts && content.parts.length > 0) {
                        return content.parts[0].text;
                    }
                }
                return null;
            } catch (err) {
                console.warn('Gemini API error:', err);
                return null;
            }
        }

            if (!currentUserId) return;

            // Disable input
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Save user message
            await saveMessage(text, true);

            // Show typing indicator
            showTyping();

            try {
                // Try Gemini API first
                var reply = await getGeminiResponse(text);

                // If Gemini failed, use fallback
                if (!reply) {
                    reply = getFallbackResponse(text);
                }

                // Remove typing indicator
                removeTyping();

                // Save AI response
                await saveMessage(reply, false);

                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();

            } catch (err) {
                console.error('Error in sendMessage:', err);
                removeTyping();
                var fallbackReply = getFallbackResponse(text);
                await saveMessage(fallbackReply, false);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                showToast('Using fallback responses – AI service unavailable.', true);
            }
        }
