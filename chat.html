<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chat | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 0.5rem;
        }
        .message {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 24px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .user-message {
            align-self: flex-end;
            background: #2ecc71;
            color: #0A0A0C;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            align-self: flex-start;
            background: #1E1E2A;
            border: 1px solid #2ecc71;
            border-bottom-left-radius: 4px;
            color: #FFFFFF;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            background: #111116;
            border-radius: 60px;
            padding: 0.3rem 0.5rem;
            align-items: center;
            position: relative;
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .icon-btn {
            background: #2C2C3A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: #2ecc71;
            color: #0A0A0C;
        }
        .icon-btn.recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .file-label {
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        .typing {
            font-style: italic;
            color: #aaa;
            font-size: 0.8rem;
            padding: 0.3rem 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Emoji picker panel */
        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 10px;
            background: #1E1E2A;
            border-radius: 20px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 220px;
            border: 1px solid #2ecc71;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .emoji-picker span {
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 12px;
            transition: 0.1s;
        }
        .emoji-picker span:hover {
            background: #2ecc71;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .input-area input { font-size: 0.9rem; }
            .emoji-picker { width: 180px; gap: 5px; }
            .emoji-picker span { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">🤖 Pureore African Assistant</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area" id="inputArea">
        <!-- Left: Emoji button (fun stuff) -->
        <button class="icon-btn" id="emojiBtn">😊</button>
        <!-- Center: Text input -->
        <input type="text" id="userInput" placeholder="Ask me anything about Pureore Capital...">
        <!-- Right side inside: Attach image -->
        <label class="icon-btn file-label" id="imageBtn">🖼️</label>
        <input type="file" id="imageUpload" accept="image/*">
        <!-- Right side outside: Voice button (hold to record) -->
        <button class="icon-btn" id="voiceBtn">🎤</button>
    </div>
    <!-- Emoji picker panel (hidden by default) -->
    <div id="emojiPicker" class="emoji-picker hidden">
        <span>😊</span><span>😂</span><span>❤️</span><span>👍</span><span>🎉</span>
        <span>🔥</span><span>💰</span><span>📈</span><span>🏦</span><span>🤝</span>
        <span>⭐</span><span>💎</span>
    </div>
</div>

<script>
    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // Auth check
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'login.html';
    });

    // DOM elements
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const imageUpload = document.getElementById('imageUpload');
    const imageBtn = document.getElementById('imageBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');

    // Helper: add message to chat
    function addMessage(text, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerText = 'Pureore African is thinking...';
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function hideTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    // ==================== ENHANCED AI RESPONSE ====================
    function getAIResponse(userMessage) {
        const msg = userMessage.toLowerCase();

        // Specific: pending deposit
        if (msg.includes('deposit pending') || (msg.includes('pending') && msg.includes('deposit'))) {
            return "Admin is busy. I will approve it around 18:00hrs.";
        }

        // Block dangerous / admin / owner topics
        const blockedKeywords = ['admin', 'owner', 'pathy', 'ceo', 'founder', 'who runs', 'who created', 'server password', 'hack', 'exploit', 'danger', 'illegal'];
        for (let kw of blockedKeywords) {
            if (msg.includes(kw)) {
                return "I cannot share admin or owner information for security and privacy reasons. If you have an account issue, please contact our customer support via WhatsApp: Assistant +260 96 139 1022 or Manager +260 95 135 9357. I'm here to help with platform features!";
            }
        }

        // Platform origins and friendly countries
        if (msg.includes('origin') || msg.includes('where from') || msg.includes('uk') || msg.includes('africa') || msg.includes('country') || msg.includes('friends')) {
            return "Pureore Capital was first launched in Manchester, United Kingdom – a small but innovative place. Today we have a growing family of members both in the UK and across Africa. The scrolling flags you see (UK, Congo, Tanzania, Ghana, Zimbabwe, Zambia) represent our friendly global community. We believe in friendship and financial growth together!";
        }

        // Agents explanation
        if (msg.includes('agent') || msg.includes('zambian agent') || msg.includes('why agent')) {
            return "The Zambian agents (John Kabwe, Getrude Sonpo for MTN; John Kabwe for Airtel; Jeremiah Ilunga for Zamtel) are carefully chosen to help our African users build their futures and grow their income. They assist with deposits and provide local support. All agents are verified and committed to your financial success.";
        }

        // WhatsApp support numbers
        if (msg.includes('whatsapp') || msg.includes('contact support') || msg.includes('blocked') || msg.includes('manager') || msg.includes('assistant')) {
            return "For direct support:\n📞 Assistant (Deposit/Withdraw issues): +260 96 139 1022 (WhatsApp)\n📞 Manager (Account & blocking issues): +260 95 135 9357 (WhatsApp)\nJoin our WhatsApp group for community updates: https://chat.whatsapp.com/KnggKPDuxj98Wxo1HAE6FP\nWhatsApp Channel: https://whatsapp.com/channel/0029VbCoP1qFcowAHv8uFV2Y\nTelegram: https://t.me/pureorecapital\nIf your account is blocked, please contact the Manager immediately.";
        }

        // Registration
        if (msg.includes('register') || msg.includes('create account') || msg.includes('sign up')) {
            return "To register, go to the main page and click 'Get started now'. Fill in your full name, email, password (min 6 chars), and optional referral code. You'll receive a 20 ZMW welcome bonus instantly. After registration, you'll be redirected to your dashboard.";
        }

        // Login
        if (msg.includes('login') || msg.includes('sign in') || msg.includes('log in')) {
            return "Go to the login page, enter your email and password. If you forgot your password, use the 'Forgot password?' link in the profile page (Me > Change Password > Forgot password) – you'll need to contact the manager via WhatsApp for recovery.";
        }

        // Dashboard
        if (msg.includes('dashboard')) {
            return "Your dashboard shows your current balance, deposit and withdraw buttons, and three quick actions: Treasure, Loan, and Voucher. Below that, you'll find investment plans. Use the floating buttons for transaction history and support.";
        }

        // Deposit
        if (msg.includes('deposit') || msg.includes('how to deposit')) {
            return "To deposit: Go to Dashboard → tap 'Deposit'. Choose your network (MTN/Airtel/Zamtel). Enter your phone number (9 digits after +260). Select an amount (min 70 ZMW) or type custom amount. Check 'I'm ready to pay'. You'll see agent details. Send the exact amount to the agent, then paste the SMS and upload a screenshot. After admin approval (usually within 24h), your balance increases.";
        }

        // Withdraw
        if (msg.includes('withdraw') || msg.includes('withdrawal')) {
            return "To withdraw: Go to Dashboard → tap 'Withdraw'. Choose network or bank. For mobile money, enter your phone number; for bank, select bank and enter 16‑digit card number. Enter amount (min 20 ZMW). A 20% fee applies. You must have at least one completed deposit and one active investment, and no active loans. Withdrawals are processed Monday–Friday. After submission, admin approves within 24h.";
        }

        // Investment plans
        if (msg.includes('invest') || msg.includes('investment plan') || msg.includes('mkvip') || msg.includes('jproduct')) {
            return "We offer two investment sections: Mk Vip and J Product. Each has multiple plans with different investment ranges, daily returns, and durations. To invest, go to the respective page (from bottom navigation or dashboard), choose a plan, tap 'Invest Now', and enter the amount within the plan’s limits. Your balance will be deducted, and you'll start earning daily returns. You can view active plans in the 'Income' page.";
        }

        // Daily income claiming
        if (msg.includes('claim') || msg.includes('daily income') || msg.includes('income page')) {
            return "In the 'Income' page, you'll see your active plans under 'Active' tab. After 24 hours have passed since your last claim (or since the start date), the 'Claim Daily Income' button turns green. Tap it to receive that day's profit directly into your balance. Claims are only allowed on weekdays (Monday–Friday). You can claim once every 24 hours per investment.";
        }

        // Rules / policies
        if (msg.includes('rule') || msg.includes('rules') || msg.includes('policy')) {
            return "📌 Key rules:\n• Minimum deposit: 70 ZMW\n• Minimum withdrawal: 20 ZMW (20% fee)\n• Withdrawals require at least one completed deposit and one active investment\n• No active loans allowed for withdrawal\n• Withdrawals only Monday–Friday\n• Loans: 15% interest, due in 15 days\n• Daily income: claim once every 24 hours (weekdays only)\n• Referral bonus: 5% of first deposit (when referred user invests)\n• No fraud or multiple accounts. Read full Terms in footer.";
        }

        // Referral / team / bonus
        if (msg.includes('referral') || msg.includes('team') || msg.includes('bonus') || msg.includes('invite')) {
            return "Your referral code is in the 'Team' page. Share your unique link. When someone registers using your code, makes their first completed deposit (any amount) AND purchases their first investment plan, you receive 5% of that deposit as a bonus. There's no limit on team size. The bonus is automatically added to your balance and appears in your 'Team' earnings.";
        }

        // Loan
        if (msg.includes('loan')) {
            return "Loans are available from the dashboard middle icon (Loan). You can request between 6,000 and 100,000 ZMW (multiples of 6,000). 15% interest, repayable in 15 days. You need a balance of at least 10,000 ZMW, total invested amount ≥ 15,000 ZMW, and at least 15 team members who have both deposited and invested. After repayment, you must contact admin to enable new loan requests.";
        }

        // Treasure / Voucher
        if (msg.includes('treasure') || msg.includes('voucher')) {
            return "Treasure and Voucher are promotional features. Enter unique codes (treasure codes are 7 characters, vouchers are 10 characters with amount embedded) in the respective pages. Codes are posted on our WhatsApp group and channel. Each code can be used only once and gives you free ZMW. Stay tuned for daily codes!";
        }

        // News
        if (msg.includes('news')) {
            return "The News page shows official announcements, updates, and new investment opportunities. Check it regularly to stay informed.";
        }

        // Change password (in Me)
        if (msg.includes('change password') || msg.includes('me page') || msg.includes('profile')) {
            return "To change your password: Go to 'Me' page (bottom navigation). Tap 'Change Password'. Enter your email, old password, new password (min 6 chars), and confirm. After successful change, you'll be logged out. If you forgot your password, use the 'Forgot password?' link there – you'll need to contact the manager via WhatsApp for recovery.";
        }

        // Team page
        if (msg.includes('team members') || (msg.includes('team') && !msg.includes('referral'))) {
            return "The 'Team' page shows your referral link, how many people have joined using your code, and the total bonus you've earned from referrals. Each referred user appears in the list with their bonus amount.";
        }

        // Greeting
        if (msg.match(/^(hi|hello|hey|good morning|good afternoon|good evening)$/)) {
            return "Hello! I'm Pureore African, your personal assistant. Ask me anything about deposits, withdrawals, investments, daily income, rules, referral bonuses, or any platform feature. How can I help you today?";
        }

        // Default
        return "I'm here to help with Pureore Capital! You can ask about registration, login, dashboard, deposit, withdrawal, investment plans (Mk Vip / J Product), daily income claiming, loans, treasure/voucher codes, news, changing password, team referrals, WhatsApp support, platform rules, and more. Please rephrase your question or tap one of the suggested topics.";
    }

    async function sendMessage(text) {
        if (!text.trim()) return;
        addMessage(text, true);
        userInput.value = '';
        showTyping();
        setTimeout(() => {
            hideTyping();
            const reply = getAIResponse(text);
            addMessage(reply, false);
        }, 600);
    }

    // Send button removed – we use Enter key to send.
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage(userInput.value);
    });

    // ==================== EMOJI PICKER ====================
    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.classList.toggle('hidden');
    });
    // Close picker when clicking outside
    document.addEventListener('click', (e) => {
        if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
            emojiPicker.classList.add('hidden');
        }
    });
    // Insert emoji into input
    document.querySelectorAll('#emojiPicker span').forEach(span => {
        span.addEventListener('click', () => {
            const emoji = span.innerText;
            userInput.value += emoji;
            userInput.focus();
            emojiPicker.classList.add('hidden');
        });
    });

    // ==================== VOICE INPUT (HOLD TO RECORD) ====================
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recognition = null;

    // Use Web Speech API for transcription (easier)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = false;

        let holdTimer = null;
        let isRecognizing = false;

        const startRecording = () => {
            if (isRecognizing) return;
            try {
                recognition.start();
                isRecognizing = true;
                voiceBtn.classList.add('recording');
                addMessage("🎤 Listening... Speak now (release button to stop).", false);
            } catch (err) {
                console.warn(err);
                addMessage("Voice recognition failed. Please try again.", false);
            }
        };

        const stopRecording = () => {
            if (!isRecognizing) return;
            recognition.stop();
            isRecognizing = false;
            voiceBtn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            sendMessage(transcript);
        };
        recognition.onerror = (event) => {
            console.error(event.error);
            if (event.error !== 'no-speech') {
                addMessage("Voice recognition error. Please try again.", false);
            }
            voiceBtn.classList.remove('recording');
            isRecognizing = false;
        };
        recognition.onend = () => {
            voiceBtn.classList.remove('recording');
            isRecognizing = false;
        };

        // Hold to record: pointerdown starts, pointerup stops
        voiceBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (holdTimer) clearTimeout(holdTimer);
            holdTimer = setTimeout(() => {
                startRecording();
            }, 100); // small delay to avoid accidental triggers
        });
        voiceBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            stopRecording();
        });
        voiceBtn.addEventListener('pointerleave', (e) => {
            // if finger slides off button, stop recording
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            stopRecording();
        });
    } else {
        voiceBtn.style.opacity = '0.5';
        voiceBtn.disabled = true;
        voiceBtn.title = "Voice not supported in this browser";
    }

    // ==================== IMAGE UPLOAD ====================
    imageBtn.addEventListener('click', () => imageUpload.click());
    imageUpload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            addMessage("Please upload an image file (PNG, JPG, etc.).", false);
            imageUpload.value = '';
            return;
        }
        addMessage("📷 I've uploaded a screenshot. Let me analyze...", true);
        showTyping();
        setTimeout(() => {
            hideTyping();
            const fileName = file.name.toLowerCase();
            let reply = "";
            if (fileName.includes('deposit') || fileName.includes('payment') || fileName.includes('screenshot')) {
                reply = "This looks like a deposit screenshot. After sending money to the agent, paste the SMS and upload the screenshot in the verification step. Click 'Verify'. If you have issues, contact support via WhatsApp.";
            } else if (fileName.includes('dashboard') || fileName.includes('balance')) {
                reply = "This seems to be your dashboard. Your balance is shown at the top. Use Deposit and Withdraw buttons. Investment plans are below. The floating buttons show history and support.";
            } else if (fileName.includes('withdraw') || fileName.includes('withdrawal')) {
                reply = "This is the withdrawal page. Select network or bank, enter amount, and confirm. Remember you need at least one completed deposit and one active investment to withdraw, and no active loans.";
            } else if (fileName.includes('income') || fileName.includes('claim')) {
                reply = "Income page shows your active investments. The green Claim button appears after 24 hours (weekdays only). Tap it to receive daily profit.";
            } else if (fileName.includes('history')) {
                reply = "History page shows your deposits, withdrawals, and loans. Pending items are marked in yellow. Once admin approves, status changes to completed.";
            } else {
                reply = "I cannot clearly identify this screenshot. Could you describe which page it is from? I can help with deposit, withdrawal, investment, income, history, or dashboard views.";
            }
            addMessage(reply, false);
        }, 1500);
        imageUpload.value = '';
    });

    // ==================== WELCOME MESSAGE ====================
    setTimeout(() => {
        addMessage("Hello! I'm Pureore African, your personal assistant. Ask me anything about deposits, withdrawals, investments, daily income, platform rules, or referral bonuses. I can also explain how to use any page: Register, Login, Dashboard, Deposit, Withdraw, Treasure, Voucher, Loan, News, Change Password, Income, Team, Mk Vip, J Product, and even WhatsApp groups. How can I help you today?", false);
    }, 500);
</script>
</body>
</html>
