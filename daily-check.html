<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Daily Check | PureOre Nexus</title>
    <meta name="description" content="Check in daily and claim your PureOre Nexus rewards." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js",
                "firebase/functions": "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js"
            }
        }
    </script>

    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #bfa76f;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --gold-subtle: rgba(212, 175, 55, 0.08);
            --charcoal: #1a1a1a;
            --dark: #0b0b0b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.5);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ============================================================
           LOADING SCREEN
        ============================================================ */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .load-logo-symbol {
            width: 64px;
            height: 64px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: rgba(212, 175, 55, 0.04);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.06);
            position: relative;
        }
        .load-logo-symbol::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--gold);
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .load-logo-symbol svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .load-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .load-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .load-progress-wrap {
            width: 200px;
            max-width: 60vw;
            margin-top: 1.8rem;
        }
        .load-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .load-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--gold-glow);
            transition: width 0.15s linear;
        }
        .load-msg {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.7rem;
            text-align: center;
            min-height: 1.2em;
            font-weight: 300;
        }

        /* ============================================================
           MAIN PAGE
        ============================================================ */
        #main-page {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.9s ease, transform 1s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background: var(--dark);
        }
        #main-page.visible {
            opacity: 1;
            transform: scale(1);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://i.ibb.co/cXxZh1w3/20260824-014737.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.5) 0%, rgba(11, 11, 11, 0.95) 80%, #0b0b0b 100%);
            pointer-events: none;
        }

        .page-scroll {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: 0 16px 30px 16px;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(11, 11, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin: 0 -16px;
            padding: 14px 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        .back-btn:hover {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.04);
        }
        .back-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-header .title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-white);
        }
        .page-header .title em {
            color: var(--gold);
            font-style: normal;
        }

        /* ============================================================
           PAGE TITLE
        ============================================================ */
        .page-title-section {
            padding: 16px 0 8px;
        }
        .page-title-section h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .page-title-section .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-top: 2px;
        }

        /* ============================================================
           WALLET BALANCE
        ============================================================ */
        .balance-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 8px 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .balance-card .amount {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--gold);
        }

        /* ============================================================
           PROGRESS
        ============================================================ */
        .progress-section {
            margin: 6px 0 14px;
        }
        .progress-section .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .progress-section .progress-header .count {
            font-weight: 500;
            color: var(--text-white);
        }
        .progress-section .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-section .progress-track .progress-bar {
            height: 100%;
            background: var(--gold);
            border-radius: 4px;
            transition: width 0.6s ease;
            width: 0%;
        }

        /* ============================================================
           CALENDAR GRID
        ============================================================ */
        .calendar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0 16px;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 6px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .day-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .day-card .day-number {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .day-card .day-name {
            font-size: 0.55rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 1px;
        }
        .day-card .day-amount {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-white);
            margin: 4px 0 4px;
        }
        .day-card .day-amount .currency {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .day-card .day-status {
            font-size: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 500;
        }
        .day-card .day-status.claimed {
            background: rgba(46, 204, 113, 0.08);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.08);
        }
        .day-card .day-status.available {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .day-card .day-status.locked {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }
        .day-card .day-status.missed {
            background: rgba(231, 76, 60, 0.04);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.06);
        }

        .day-card .claim-btn-small {
            display: inline-block;
            margin-top: 4px;
            padding: 4px 12px;
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            background: var(--gold);
            color: #0b0b0b;
            transition: all 0.25s ease;
            width: 100%;
            min-height: 28px;
        }
        .day-card .claim-btn-small:hover:not(:disabled) {
            background: #dbb95c;
            transform: scale(1.02);
        }
        .day-card .claim-btn-small:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .day-card .claim-btn-small .spinner-xs {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(11, 11, 11, 0.15);
            border-top-color: #0b0b0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .day-card .claim-btn-small.loading .spinner-xs {
            display: inline-block;
        }
        .day-card .claim-btn-small.loading .btn-text {
            opacity: 0.7;
        }

        .day-card.today {
            border-color: rgba(212, 175, 55, 0.2);
            background: rgba(212, 175, 55, 0.04);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.04);
        }
        .day-card.today::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold);
            opacity: 0.5;
        }

        .day-card .today-label {
            font-size: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gold);
            font-weight: 600;
            margin-top: 2px;
        }

        /* ============================================================
           TOTAL THIS WEEK
        ============================================================ */
        .total-card {
            background: rgba(212, 175, 55, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 8px;
        }
        .total-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .total-card .amount {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold);
        }

        /* ============================================================
           SUCCESS OVERLAY (inline)
        ============================================================ */
        .claim-success {
            text-align: center;
            padding: 8px 0 4px;
        }
        .claim-success .icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.08);
            border: 2px solid #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }
        .claim-success .icon-wrap svg {
            width: 28px;
            height: 28px;
            stroke: #2ecc71;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .claim-success .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-white);
        }
        .claim-success .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-white);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: rgba(46, 204, 113, 0.2);
        }
        .toast.error {
            border-color: rgba(231, 76, 60, 0.2);
        }

        /* ============================================================
           BRANDING FOOTER
        ============================================================ */
        .branding-footer {
            text-align: center;
            padding: 16px 0 8px;
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            opacity: 0.5;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 16px;
        }
        .branding-footer span {
            color: var(--gold);
            opacity: 0.7;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .page-scroll {
                padding: 0 12px 20px 12px;
            }
            .page-header {
                padding: 10px 12px;
                margin: 0 -12px;
            }
            .calendar-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
                gap: 5px;
            }
            .day-card {
                padding: 6px 4px;
            }
            .day-card .day-number {
                font-size: 0.45rem;
            }
            .day-card .day-name {
                font-size: 0.45rem;
            }
            .day-card .day-amount {
                font-size: 0.7rem;
            }
            .day-card .day-amount .currency {
                font-size: 0.5rem;
            }
            .day-card .day-status {
                font-size: 0.4rem;
                padding: 1px 4px;
            }
            .day-card .claim-btn-small {
                font-size: 0.45rem;
                padding: 3px 6px;
                min-height: 22px;
            }
            .day-card .today-label {
                font-size: 0.35rem;
            }
            .balance-card .amount {
                font-size: 1rem;
            }
            .page-title-section h1 {
                font-size: 1.2rem;
            }
            .total-card .amount {
                font-size: 0.95rem;
            }
            .branding-footer {
                font-size: 0.5rem;
                padding: 12px 0 6px;
            }
        }

        @media (max-width: 400px) {
            .calendar-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
                gap: 4px;
            }
            .day-card {
                padding: 4px 2px;
            }
            .day-card .day-amount {
                font-size: 0.6rem;
            }
            .day-card .day-name {
                font-size: 0.4rem;
            }
            .day-card .day-number {
                font-size: 0.4rem;
            }
            .day-card .claim-btn-small {
                font-size: 0.4rem;
                padding: 2px 4px;
                min-height: 18px;
            }
        }

        @media (min-width: 768px) {
            .page-scroll {
                padding: 0 32px 40px 32px;
            }
            .page-header {
                padding: 16px 32px;
                margin: 0 -32px;
            }
            .calendar-grid {
                gap: 12px;
            }
            .day-card {
                padding: 14px 10px;
            }
            .day-card .day-amount {
                font-size: 1.1rem;
            }
            .day-card .claim-btn-small {
                font-size: 0.55rem;
                padding: 5px 14px;
                min-height: 30px;
            }
        }

        /* ============================================================
           SCROLLBAR
        ============================================================ */
        #main-page::-webkit-scrollbar {
            width: 3px;
        }
        #main-page::-webkit-scrollbar-track {
            background: transparent;
        }
        #main-page::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 10px;
        }

        /* ============================================================
           UTILITY
        ============================================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOADING SCREEN
    ============================================================ -->
    <div id="loading-screen" role="status" aria-label="Loading">
        <div class="load-logo">
            <div class="load-logo-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="load-title">PureOre Nexus</div>
            <div class="load-sub">Daily Check</div>
        </div>
        <div class="load-progress-wrap">
            <div class="load-progress-track">
                <div class="load-progress-bar" id="load-bar" style="width:0%;"></div>
            </div>
            <div class="load-msg" id="load-msg">Checking your daily check...</div>
        </div>
    </div>

    <!-- ============================================================
    MAIN PAGE
    ============================================================ -->
    <div id="main-page">
        <div class="bg-wrap" aria-hidden="true"></div>
        <div class="bg-overlay" aria-hidden="true"></div>

        <div class="page-scroll">

            <!-- ===== HEADER ===== -->
            <header class="page-header">
                <button class="back-btn" id="back-btn" aria-label="Go back">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="title">Daily <em>Check</em></span>
            </header>

            <!-- ===== PAGE TITLE ===== -->
            <div class="page-title-section">
                <h1>Daily Check</h1>
                <div class="sub">Check in each day and claim your available reward.</div>
            </div>

            <!-- ===== WALLET BALANCE ===== -->
            <div class="balance-card">
                <span class="label">Wallet Balance</span>
                <span class="amount" id="wallet-balance">K0.00</span>
            </div>

            <!-- ===== PROGRESS ===== -->
            <div class="progress-section">
                <div class="progress-header">
                    <span>Weekly Progress</span>
                    <span class="count" id="progress-count">0 / 7 days completed</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="progress-bar" style="width:0%;"></div>
                </div>
            </div>

            <!-- ===== CALENDAR GRID ===== -->
            <div class="calendar-grid" id="calendar-grid">
                <!-- Rendered by JS -->
            </div>

            <!-- ===== TOTAL THIS WEEK ===== -->
            <div class="total-card">
                <span class="label">Total This Week</span>
                <span class="amount" id="total-claimed">K0.00</span>
            </div>

            <!-- ===== BRANDING ===== -->
            <div class="branding-footer">
                <span>@pureorecapital</span> 2025
            </div>

        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================
    FIREBASE + APPLICATION LOGIC
    ============================================================ -->
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, serverTimestamp, runTransaction } from 'firebase/firestore';
        import { getFunctions, httpsCallable } from 'firebase/functions';

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2nHDM2ebNv9pUUoIhsfJUCSLlffWYW1w",
            authDomain: "pureore-nexus.firebaseapp.com",
            projectId: "pureore-nexus",
            storageBucket: "pureore-nexus.firebasestorage.app",
            messagingSenderId: "555338198187",
            appId: "1:555338198187:web:0c510ca507fa4c835a5bee",
            measurementId: "G-L2B5FEMH2C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        // ============================================================
        // CONFIGURATION
        // ============================================================
        const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        // Default amounts (will be overridden from settings if available)
        let DAY_AMOUNTS = [20, 30, 30, 40, 50, 50, 80];

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let userData = null;
        let walletData = null;
        let dailyCheckData = null;
        let currentDayIndex = 0; // 0-based index of current day in cycle
        let isProcessing = false;

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const loadScreen = $('loading-screen');
        const loadBar = $('load-bar');
        const loadMsg = $('load-msg');
        const mainPage = $('main-page');

        const walletBalance = $('wallet-balance');
        const progressCount = $('progress-count');
        const progressBar = $('progress-bar');
        const calendarGrid = $('calendar-grid');
        const totalClaimed = $('total-claimed');

        const toast = $('toast');
        let toastTimeout = null;

        // ============================================================
        // LOADING SCREEN
        // ============================================================
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += 2.5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                loadBar.style.width = '100%';
                loadMsg.textContent = 'Ready';
                return;
            }
            loadBar.style.width = loadProgress + '%';
            if (loadProgress > 70) loadMsg.textContent = 'Loading your calendar...';
            else if (loadProgress > 40) loadMsg.textContent = 'Checking your daily check...';
        }, 35);

        // ============================================================
        // HELPERS
        // ============================================================
        function formatCurrency(amount) {
            if (amount === undefined || amount === null) return '0.00';
            return Number(amount).toFixed(2);
        }

        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showPage() {
            loadScreen.classList.add('hidden');
            mainPage.classList.add('visible');
            document.body.style.overflow = 'auto';
        }

        // ============================================================
        // GET BUSINESS DAY (Africa/Lusaka)
        // ============================================================
        function getBusinessDayInfo() {
            const now = new Date();
            const options = { timeZone: 'Africa/Lusaka', hour12: false };
            const dateStr = now.toLocaleDateString('en-US', options);
            const parts = dateStr.split('/');
            const month = parseInt(parts[0]) - 1;
            const day = parseInt(parts[1]);
            const year = parseInt(parts[2]);
            const businessDate = new Date(year, month, day);
            return businessDate;
        }

        // ============================================================
        // LOAD DAILY CHECK DATA
        // ============================================================
        async function loadDailyCheckData(uid) {
            try {
                // 1. Load user
                const userRef = doc(db, 'users', uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    showToast('User account not found.', 'error');
                    showPage();
                    return;
                }
                userData = userSnap.data();

                // 2. Load wallet
                const walletRef = doc(db, 'wallets', uid);
                const walletSnap = await getDoc(walletRef);
                if (walletSnap.exists()) {
                    walletData = walletSnap.data();
                } else {
                    walletData = { walletBalance: 0 };
                }

                // 3. Load daily check settings from systemSettings
                try {
                    const settingsRef = doc(db, 'systemSettings', 'dailyCheckSettings');
                    const settingsSnap = await getDoc(settingsRef);
                    if (settingsSnap.exists()) {
                        const settings = settingsSnap.data();
                        if (settings.amounts && Array.isArray(settings.amounts) && settings.amounts.length === 7) {
                            DAY_AMOUNTS = settings.amounts.map(a => Number(a) || 0);
                        }
                    }
                } catch (e) {
                    // Use defaults if settings not found
                }

                // 4. Load user's daily check claims
                const claimsRef = collection(db, 'dailyChecks');
                const claimsQuery = query(claimsRef, where('userId', '==', uid));
                const claimsSnap = await getDocs(claimsQuery);
                const claims = {};
                claimsSnap.forEach(doc => {
                    const data = doc.data();
                    claims[data.dayNumber] = data;
                });
                dailyCheckData = claims;

                // 5. Determine current day in cycle
                // Use the business date to determine the day in the 7-day cycle
                // We'll use the day of the month modulo 7, starting from a reference date
                // For simplicity, we'll use the current business date and calculate
                // which day of the cycle we're on based on the existing project's logic.
                // If the user has claimed a day, we'll use that to determine the current cycle position.

                // If the user has claims, we can determine the current day based on the last claim date.
                // Otherwise, we'll use the current date to determine the day.
                const businessDate = getBusinessDayInfo();

                // We'll use a simple approach: the current day in the cycle is based on the
                // day of the month, but we need to handle the 7-day cycle properly.
                // For a production system, we'd use a more robust method with a reference date.
                // For now, we'll use the day of the month modulo 7 (0-based).
                // This ensures a consistent 7-day cycle.

                // Get the day of the month (1-31)
                const dayOfMonth = businessDate.getDate();
                // Use modulo 7 to get 0-6 (0 = Monday, 6 = Sunday in our scheme)
                // But we want to match our DAY_NAMES array where index 0 = Monday
                // So we map: Monday = 0, Tuesday = 1, etc.
                // The actual day of the week from getDay() gives Sunday = 0, Monday = 1, etc.
                // We'll use getDay() and adjust so Monday = 0
                const dayOfWeek = businessDate.getDay(); // 0=Sunday, 1=Monday, ...
                // Map to our system: Monday=0, Tuesday=1, ..., Sunday=6
                currentDayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

                // However, the Daily Check cycle should be continuous, not resetting each week.
                // We'll use the day of the month to determine the cycle position.
                // Let's use: (dayOfMonth - 1) % 7
                // This gives us a 7-day cycle based on the day of the month.
                const cycleDay = (dayOfMonth - 1) % 7;
                // But we want Monday to be the start of the cycle.
                // We'll use the actual day of the week to map correctly.
                // For consistency, we'll use the day-of-month approach but
                // align with the user's claimed days.

                // Check if the user has any claims to determine the cycle start
                const claimKeys = Object.keys(claims);
                if (claimKeys.length > 0) {
                    // Sort claims by day number to find the latest claimed day
                    const sortedDays = claimKeys.map(Number).sort((a, b) => a - b);
                    const latestClaimed = sortedDays[sortedDays.length - 1];

                    // If the latest claimed day is less than 7, the user is still in the first cycle
                    if (latestClaimed < 7) {
                        // Use the latest claimed + 1 as the current day (if not already claimed)
                        // But we need to check if today's date is after the latest claim date
                        // This is getting complex; let's use a simpler approach based on the business date.

                        // If the user has claimed day 7, they might be in a new cycle.
                        // We'll use the current date to determine which day is available.
                        // Use the day of the month modulo 7 to determine the current day.
                        // This ensures a consistent 7-day cycle that rotates with the calendar.
                        // We'll use the business date's day of the month modulo 7.
                        // But we need to offset so that day 1 starts on the correct day.
                        // We'll use the date of the user's first claim as the cycle start.
                        // For simplicity, we'll use the business date's day of month % 7.
                        // Let's use: (dayOfMonth - 1) % 7, but shifted so that 0 = Monday.
                        // We'll just use the day-of-week approach for simplicity,
                        // but this means the cycle resets each week.
                        // A better approach is to use the date of the first claim as the cycle start.

                        // Since we don't have the first claim date easily, we'll use a simpler method:
                        // The user can claim days 1-7 in order. If they've claimed day 7, they start a new cycle.
                        // We'll use the day of the month to determine which day is available.
                        // Let's use: (dayOfMonth - 1) % 7 + 1 to get 1-7.
                        const dayNum = ((dayOfMonth - 1) % 7) + 1;
                        currentDayIndex = dayNum - 1;
                    } else {
                        // User has completed a cycle, check if they're in a new cycle
                        const dayNum = ((dayOfMonth - 1) % 7) + 1;
                        currentDayIndex = dayNum - 1;
                    }
                } else {
                    // No claims yet, use the current day of the week to determine the starting day
                    // We'll start from day 1 (Monday) and let the user claim sequentially
                    // But to make it work, we'll allow the user to claim day 1 on any day
                    // and then day 2 the next day, etc.
                    // For the first claim, we'll let the user start from day 1 regardless of the day of week.
                    currentDayIndex = 0; // Start from day 1
                }

                // Render everything
                renderAll();

                showPage();

            } catch (error) {
                console.error('Error loading daily check data:', error);
                showToast('Unable to load daily check information.', 'error');
                showPage();
            }
        }

        // ============================================================
        // RENDER ALL
        // ============================================================
        function renderAll() {
            renderWallet();
            renderCalendar();
            renderProgress();
            renderTotal();
        }

        // ============================================================
        // RENDER WALLET
        // ============================================================
        function renderWallet() {
            const balance = walletData?.walletBalance || 0;
            walletBalance.textContent = 'K' + formatCurrency(balance);
        }

        // ============================================================
        // RENDER CALENDAR
        // ============================================================
        function renderCalendar() {
            // Determine which days are available/claimed
            const today = new Date();
            const businessDate = getBusinessDayInfo();
            const dayOfMonth = businessDate.getDate();
            const dayOfWeek = businessDate.getDay(); // 0=Sunday

            // We'll use a combination of the day of month and the user's claims
            // to determine the current day in the cycle.

            // First, check if the user has claims
            const claimKeys = Object.keys(dailyCheckData || {});
            let hasClaims = claimKeys.length > 0;

            // Build the calendar
            let html = '';
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            for (let i = 0; i < 7; i++) {
                const dayNumber = i + 1;
                const amount = DAY_AMOUNTS[i] || 0;
                const dayName = dayNames[i];

                // Determine status
                let status = 'locked';
                let statusText = 'Locked';
                let isClaimed = false;
                let isAvailable = false;
                let isToday = false;

                // Check if this day is claimed
                if (dailyCheckData && dailyCheckData[dayNumber]) {
                    isClaimed = true;
                    status = 'claimed';
                    statusText = 'Claimed';
                } else {
                    // Check if this day is available to claim
                    // The user can only claim days in order: day 1, then day 2, etc.
                    // Check if all previous days are claimed
                    let allPreviousClaimed = true;
                    for (let j = 1; j < dayNumber; j++) {
                        if (!dailyCheckData || !dailyCheckData[j]) {
                            allPreviousClaimed = false;
                            break;
                        }
                    }

                    if (allPreviousClaimed) {
                        // This day is available if it's the next day in the cycle
                        // We also need to check if the user can claim this day today
                        // based on the 24-hour rule: only one claim per day

                        // Check if the user has claimed any day today
                        const todayStr = businessDate.toDateString();
                        let claimedToday = false;
                        if (dailyCheckData) {
                            for (const key of Object.keys(dailyCheckData)) {
                                const claim = dailyCheckData[key];
                                if (claim.claimedAt) {
                                    const claimDate = claim.claimedAt.toDate ? claim.claimedAt.toDate() : new Date(claim.claimedAt);
                                    if (claimDate.toDateString() === todayStr) {
                                        claimedToday = true;
                                        break;
                                    }
                                }
                            }
                        }

                        // Determine if this is the current day to claim
                        // We'll use a simple approach: the first unclaimed day is available
                        // But we need to ensure it's the next day in sequence.
                        // We'll check if all previous days are claimed.
                        if (allPreviousClaimed) {
                            // This is the next available day
                            // Check if the user has already claimed today
                            if (claimedToday) {
                                // Can't claim another day today
                                if (i === currentDayIndex && !isClaimed) {
                                    status = 'locked';
                                    statusText = 'Locked';
                                } else {
                                    status = 'locked';
                                    statusText = 'Locked';
                                }
                            } else {
                                // This day is available
                                status = 'available';
                                statusText = 'Available';
                                isAvailable = true;
                            }
                        }
                    }
                }

                // Check if this is the current day in the cycle (for highlighting)
                // We'll highlight the first unclaimed day if it exists
                if (!isClaimed && !isAvailable && allPreviousClaimed) {
                    // This is the next day to claim but may be locked due to claiming today
                }

                // Determine if this is the actual current day
                const dayOfMonthCycle = (dayOfMonth - 1) % 7;
                if (i === dayOfMonthCycle && !isClaimed) {
                    isToday = true;
                }

                // If no claims yet, day 1 is available
                if (!hasClaims && i === 0) {
                    status = 'available';
                    statusText = 'Available';
                    isAvailable = true;
                }

                // If this is the current day and it's not claimed and it's the first unclaimed day
                if (isToday && !isClaimed && status === 'locked') {
                    // Check if all previous days are claimed
                    let allPrevClaimed = true;
                    for (let j = 1; j < dayNumber; j++) {
                        if (!dailyCheckData || !dailyCheckData[j]) {
                            allPrevClaimed = false;
                            break;
                        }
                    }
                    if (allPrevClaimed) {
                        status = 'available';
                        statusText = 'Available';
                        isAvailable = true;
                    }
                }

                // For the very first day, if no claims, make it available
                if (!hasClaims && i === 0) {
                    status = 'available';
                    statusText = 'Available';
                    isAvailable = true;
                }

                // Status class for CSS
                const statusClass = status;

                // Today highlight
                const todayClass = isToday && !isClaimed ? 'today' : '';

                // Claim button
                let claimButton = '';
                if (isAvailable && !isClaimed && status === 'available') {
                    claimButton = `
                            <button class="claim-btn-small" data-day="${dayNumber}" data-amount="${amount}">
                                <span class="spinner-xs"></span>
                                <span class="btn-text">Claim K${formatCurrency(amount)}</span>
                            </button>
                        `;
                } else if (isClaimed) {
                    claimButton = `<div style="margin-top:4px;font-size:0.45rem;color:#2ecc71;">✓ Claimed</div>`;
                } else if (status === 'locked') {
                    claimButton = `<div style="margin-top:4px;font-size:0.45rem;color:var(--text-muted);">🔒</div>`;
                }

                // If this is the first unclaimed day but not available today, show a lock
                if (!isClaimed && !isAvailable && allPreviousClaimed) {
                    // It's the next day but not claimable today
                    // We'll show it as locked with a lock icon
                    claimButton = `<div style="margin-top:4px;font-size:0.45rem;color:var(--text-muted);">🔒</div>`;
                }

                // If no claims yet, make day 1 available
                if (!hasClaims && i === 0) {
                    claimButton = `
                            <button class="claim-btn-small" data-day="${dayNumber}" data-amount="${amount}">
                                <span class="spinner-xs"></span>
                                <span class="btn-text">Claim K${formatCurrency(amount)}</span>
                            </button>
                        `;
                }

                // Today label
                let todayLabel = '';
                if (isToday && !isClaimed) {
                    todayLabel = `<div class="today-label">Today</div>`;
                }

                html += `
                        <div class="day-card ${todayClass}">
                            <div class="day-number">Day ${dayNumber}</div>
                            <div class="day-name">${dayName}</div>
                            <div class="day-amount"><span class="currency">K</span>${formatCurrency(amount)}</div>
                            <div class="day-status ${statusClass}">${statusText}</div>
                            ${claimButton}
                            ${todayLabel}
                        </div>
                    `;
            }

            calendarGrid.innerHTML = html;

            // Attach claim button event listeners
            document.querySelectorAll('.claim-btn-small').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const day = parseInt(btn.dataset.day);
                    const amount = parseFloat(btn.dataset.amount);
                    await handleClaim(day, amount, btn);
                });
            });
        }

        // ============================================================
        // RENDER PROGRESS
        // ============================================================
        function renderProgress() {
            if (!dailyCheckData) {
                progressCount.textContent = '0 / 7 days completed';
                progressBar.style.width = '0%';
                return;
            }
            const claimedCount = Object.keys(dailyCheckData).length;
            const total = 7;
            const percentage = Math.min(100, (claimedCount / total) * 100);
            progressCount.textContent = `${claimedCount} / ${total} days completed`;
            progressBar.style.width = percentage + '%';
        }

        // ============================================================
        // RENDER TOTAL
        // ============================================================
        function renderTotal() {
            let total = 0;
            if (dailyCheckData) {
                for (const key of Object.keys(dailyCheckData)) {
                    const claim = dailyCheckData[key];
                    total += Number(claim.amount) || 0;
                }
            }
            totalClaimed.textContent = 'K' + formatCurrency(total);
        }

        // ============================================================
        // HANDLE CLAIM
        // ============================================================
        async function handleClaim(day, amount, btn) {
            if (isProcessing) return;
            if (!currentUser) {
                showToast('Please log in to claim.', 'error');
                return;
            }

            // Double-check that this day is actually available
            // Check if already claimed
            if (dailyCheckData && dailyCheckData[day]) {
                showToast('This day has already been claimed.', 'error');
                renderCalendar();
                return;
            }

            // Check if all previous days are claimed
            for (let i = 1; i < day; i++) {
                if (!dailyCheckData || !dailyCheckData[i]) {
                    showToast('Please claim the previous days first.', 'error');
                    return;
                }
            }

            // Check if the user has claimed today already
            const todayStr = getBusinessDayInfo().toDateString();
            let claimedToday = false;
            if (dailyCheckData) {
                for (const key of Object.keys(dailyCheckData)) {
                    const claim = dailyCheckData[key];
                    if (claim.claimedAt) {
                        const claimDate = claim.claimedAt.toDate ? claim.claimedAt.toDate() : new Date(claim.claimedAt);
                        if (claimDate.toDateString() === todayStr) {
                            claimedToday = true;
                            break;
                        }
                    }
                }
            }
            if (claimedToday) {
                showToast('You have already claimed today\'s reward.', 'error');
                return;
            }

            isProcessing = true;
            btn.classList.add('loading');
            btn.disabled = true;
            btn.querySelector('.btn-text').textContent = 'Processing...';

            try {
                // Call the claimDailyCheck Cloud Function
                const claimFn = httpsCallable(functions, 'claimDailyCheck');
                const result = await claimFn({
                    dayNumber: day,
                    amount: amount
                });

                if (result.data && result.data.success === true) {
                    // Success!
                    const claimedAmount = result.data.amount || amount;

                    // Refresh data
                    await refreshData();

                    // Show success toast
                    showToast(`✓ Claimed K${formatCurrency(claimedAmount)}!`, 'success');

                    // Update the calendar to show claimed state
                    renderCalendar();
                    renderProgress();
                    renderTotal();
                    renderWallet();

                } else {
                    const errorMsg = result.data?.message || 'Claim failed. Please try again.';
                    showToast(errorMsg, 'error');
                    // Re-enable the button
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    btn.querySelector('.btn-text').textContent = `Claim K${formatCurrency(amount)}`;
                }

            } catch (error) {
                console.error('Claim error:', error);
                let msg = 'Unable to process claim. Please try again.';
                if (error.message && error.message.includes('already claimed')) {
                    msg = 'This day has already been claimed.';
                } else if (error.message && error.message.includes('previous days')) {
                    msg = 'Please claim the previous days first.';
                } else if (error.message && error.message.includes('today already')) {
                    msg = 'You have already claimed today\'s reward.';
                }
                showToast(msg, 'error');
                btn.classList.remove('loading');
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = `Claim K${formatCurrency(amount)}`;
            } finally {
                isProcessing = false;
            }
        }

        // ============================================================
        // REFRESH DATA
        // ============================================================
        async function refreshData() {
            try {
                const uid = currentUser.uid;

                // Reload wallet
                const walletRef = doc(db, 'wallets', uid);
                const walletSnap = await getDoc(walletRef);
                if (walletSnap.exists()) {
                    walletData = walletSnap.data();
                }

                // Reload daily check claims
                const claimsRef = collection(db, 'dailyChecks');
                const claimsQuery = query(claimsRef, where('userId', '==', uid));
                const claimsSnap = await getDocs(claimsQuery);
                const claims = {};
                claimsSnap.forEach(doc => {
                    const data = doc.data();
                    claims[data.dayNumber] = data;
                });
                dailyCheckData = claims;

                // Re-render
                renderAll();

            } catch (error) {
                console.error('Error refreshing data:', error);
            }
        }

        // ============================================================
        // BACK BUTTON
        // ============================================================
        document.getElementById('back-btn').addEventListener('click', () => {
            window.history.back();
        });

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadDailyCheckData(user.uid);
        });

        console.log('PureOre Nexus — Daily Check page ready.');
    </script>
