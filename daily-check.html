<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Daily Check – Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BODY ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0b1120;
            min-height: 100vh;
            padding-top: 70px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            color: #f1f5f9;
        }

        /* ----- HEADER ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(11, 17, 32, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            text-decoration: none;
        }
        .logo-text .pc {
            color: #3b82f6;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 1rem;
            flex: 1;
            width: 100%;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .page-title p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- COIN BALANCE ----- */
        .coin-balance {
            text-align: center;
            font-size: 1.1rem;
            color: #facc15;
            margin-bottom: 1.5rem;
        }
        .coin-balance span {
            font-weight: 700;
            background: rgba(250, 204, 21, 0.06);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }

        /* ----- GRID (7 days) ----- */
        .checkin-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        @media (min-width: 500px) {
            .checkin-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 0.8rem 0.3rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .day-card.active {
            border-color: #facc15;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.08);
        }

        .day-card.claimed {
            border-color: #22c55e;
            opacity: 0.7;
        }
        .day-card.claimed .day-reward {
            text-decoration: line-through;
            color: #22c55e;
        }
        .day-card .day-number {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-weight: 600;
        }

        .day-card .day-reward {
            font-size: 1.3rem;
            font-weight: 700;
            color: #facc15;
            margin: 0.2rem 0;
        }
        .day-card .day-reward .plus {
            font-size: 1rem;
            color: #94a3b8;
            margin-right: 2px;
        }

        .day-card .day-check {
            font-size: 0.65rem;
            font-weight: 600;
            color: #22c55e;
        }

        .day-card .day-lock {
            font-size: 0.65rem;
            font-weight: 600;
            color: #64748b;
        }

        /* ----- CHECK-IN BUTTON ----- */
        .checkin-btn-wrap {
            text-align: center;
            margin: 1.2rem 0 1.5rem;
        }

        .btn-checkin {
            background: linear-gradient(135deg, #facc15, #f5a623);
            border: none;
            border-radius: 60px;
            padding: 0.9rem 3.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            color: #0b1120;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 30px rgba(250, 204, 21, 0.15);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-checkin:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(250, 204, 21, 0.25);
        }

        .btn-checkin:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-checkin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-checkin .coin-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        /* ----- TURNOVER / STATUS ----- */
        .turnover {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.2rem;
        }
        .turnover strong {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* ----- TOAST (custom) ----- */
        .toast-claim {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            z-index: 200;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            max-width: 90%;
            width: 400px;
        }
        .toast-claim.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast-claim .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .toast-claim .amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: #facc15;
        }
        .toast-claim .label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .toast-claim .sub {
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
        .toast-claim .btn-ok {
            background: linear-gradient(135deg, #facc15, #f5a623);
            border: none;
            border-radius: 40px;
            padding: 0.6rem 2.5rem;
            font-weight: 700;
            font-family: inherit;
            color: #0b1120;
            cursor: pointer;
            margin-top: 1.2rem;
            font-size: 1rem;
            transition: 0.2s;
        }
        .toast-claim .btn-ok:hover {
            transform: scale(1.05);
        }

        /* ----- OVERLAY ----- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }
            .container {
                padding: 1rem 0.8rem;
            }
            .page-title h1 {
                font-size: 1.3rem;
            }
            .day-card .day-reward {
                font-size: 1.1rem;
            }
            .btn-checkin {
                padding: 0.7rem 2.5rem;
                font-size: 1rem;
            }
            .checkin-grid {
                gap: 0.5rem;
            }
            .day-card {
                padding: 0.6rem 0.2rem;
            }
        }

        @media (max-width: 400px) {
            .checkin-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .day-card .day-reward {
                font-size: 1rem;
            }
        }

        @media (max-width: 340px) {
            .checkin-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="index.html" class="logo-text">Pureore<span class="pc">·PC</span></a>
        <a href="dashboard.html" class="back-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </a>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <div class="page-title">
            <h1> Daily Checkin</h1>
            <p>Check in each day to earn coins. If you miss a day, that reward is lost.</p>
        </div>

        <!-- Coin balance -->
        <div class="coin-balance">
            <span> <span id="coinBalance">0</span> coins</span>
        </div>

        <!-- Turnover status -->
        <div class="turnover" id="turnoverDisplay">
            Today's checkin: <strong id="todayStatus"> Pending</strong>
        </div>

        <!-- 7-day grid -->
        <div class="checkin-grid" id="checkinGrid">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- Check-in button -->
        <div class="checkin-btn-wrap">
            <button class="btn-checkin" id="checkinBtn" disabled>
                <span class="coin-icon"></span> Check In
            </button>
        </div>

    </main>

    <!-- OVERLAY & TOAST (success message) -->
    <div class="overlay" id="overlay"></div>
    <div class="toast-claim" id="toastClaim">
        <div class="icon"></div>
        <div class="amount" id="claimAmount">+0</div>
        <div class="label">coins earned!</div>
        <div class="sub">You're on a roll – keep checking in daily.</div>
        <button class="btn-ok" id="toastOkBtn">Go to Profile</button>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // STATE
        // ================================================================
        var currentUser = null;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var todayStr = formatDateKey(today);

        // Default rewards (will be overridden by Firestore)
        var defaultRewards = [20, 30, 30, 40, 50, 50, 80];

        // ================================================================
        // HELPERS
        // ================================================================
        function formatDateKey(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getDate() === d2.getDate();
        }

        function daysBetween(d1, d2) {
            // difference in days (d2 - d1)
            var t1 = d1.getTime();
            var t2 = d2.getTime();
            return Math.floor((t2 - t1) / (1000 * 60 * 60 * 24));
        }

        // ================================================================
        // FIREBASE AUTH
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadData();
        });

        // ================================================================
        // LOAD DATA & RENDER
        // ================================================================
        var rewards = [];
        var userState = { day: 0, lastCheckin: null };
        var todayClaimed = false;
        var nextDayToClaim = 0; // 1-7, 0 means none

        function loadData() {
            if (!currentUser) return;

            var configRef = db.collection('checkinConfig').doc('daily');
            var userRef = db.collection('users').doc(currentUser.uid);
            var claimRef = userRef.collection('checkins').doc(todayStr);

            Promise.all([
                configRef.get(),
                userRef.get(),
                claimRef.get()
            ]).then(function(results) {
                var configDoc = results[0];
                var userDoc = results[1];
                var claimDoc = results[2];

                // Parse rewards
                if (configDoc.exists) {
                    var data = configDoc.data();
                    rewards = [];
                    for (var i = 1; i <= 7; i++) {
                        rewards.push(data['day' + i] || defaultRewards[i - 1]);
                    }
                } else {
                    rewards = defaultRewards.slice();
                }

                // Parse user state
                if (userDoc.exists) {
                    var userData = userDoc.data();
                    userState.day = userData.checkinDay || 0;
                    userState.lastCheckin = userData.lastCheckin ? userData.lastCheckin.toDate() : null;
                } else {
                    userState.day = 0;
                    userState.lastCheckin = null;
                }

                todayClaimed = claimDoc.exists;
                if (todayClaimed) {
                    // Claimed today – no next day to claim
                    nextDayToClaim = 0;
                } else {
                    // Determine next day to claim
                    if (userState.day === 0) {
                        // Never claimed – can claim day 1 today
                        nextDayToClaim = 1;
                    } else if (userState.day >= 7) {
                        // Already completed all 7 days – cannot claim more
                        nextDayToClaim = 0;
                    } else {
                        // Check when last checkin was
                        if (userState.lastCheckin) {
                            var diff = daysBetween(userState.lastCheckin, today);
                            if (diff === 0) {
                                // Should not happen because we already checked todayClaimed, but just in case
                                nextDayToClaim = 0;
                            } else {
                                // User can claim the next day after the last claimed day,
                                // but they lose rewards for skipped days.
                                // We advance the day count by the number of days since last checkin.
                                // Example: lastCheckin = day 3, today is day 5 (diff=2) -> they skipped day 4,
                                // they can claim day 5? Actually they should claim day 4 + diff? Let's think:
                                // They claimed day 3, skipped day 4, so they lost day 4. They can claim day 5 today.
                                // So nextDayToClaim = userState.day + diff (capped at 7)
                                var newDay = userState.day + diff;
                                if (newDay > 7) newDay = 0; // completed all
                                nextDayToClaim = newDay;
                            }
                        } else {
                            // lastCheckin is null but userState.day > 0? shouldn't happen
                            nextDayToClaim = userState.day + 1;
                            if (nextDayToClaim > 7) nextDayToClaim = 0;
                        }
                    }
                }

                renderPage();
            }).catch(function(err) {
                console.error('Error loading data:', err);
                document.getElementById('checkinGrid').innerHTML = '<p style="color:#f87171;text-align:center;">Error loading data. Please refresh.</p>';
            });
        }

        // ================================================================
        // RENDER
        // ================================================================
        function renderPage() {
            var grid = document.getElementById('checkinGrid');
            var btn = document.getElementById('checkinBtn');
            var statusEl = document.getElementById('todayStatus');
            var coinBalanceEl = document.getElementById('coinBalance');

            // Build grid
            var html = '';
            for (var i = 0; i < 7; i++) {
                var dayNum = i + 1;
                var reward = rewards[i] || 0;
                var isClaimed = false;
                var isActive = false;

                // Determine if this day is claimed:
                // If today is claimed, that day is claimed.
                // Also, if the user's claimed day is greater than or equal to this day, and they have claimed sequentially? 
                // But we have the nextDayToClaim and userState.day.
                // Actually, we know that the user has claimed all days from 1 up to userState.day (if they never skipped? but they might have skipped)
                // But with the new logic, if they skip, they lose that day's reward, so they cannot claim it later.
                // So the claimed days are those from 1 to (userState.day + number of claims?) complicated.
                // Simpler: we can store claimed days in a separate array? But we don't have that.
                // We'll use a different approach: we know that if todayClaimed, the claimed day is nextDayToClaim? Actually, if todayClaimed, then the user claimed today, so today's day is the one they claimed.
                // But we don't know which day they claimed today without storing it.
                // We can store the day number in the claim document, which we did not.
                // Let's modify to store day in claim doc. But for now, we'll rely on userState.day and nextDayToClaim.
                // We'll mark as claimed if dayNum <= userState.day (but if they skipped, userState.day might be less than dayNum? Actually userState.day is the last claimed day number.
                // If they skipped, userState.day stays the same (e.g., they claimed day 3, then skipped days, so userState.day = 3, and nextDayToClaim = 5).
                // Then day 4 is lost, not claimed. So day 4 should be marked as lost (not claimed, not active).
                // So we need to know which days are claimed. We can store claimed days in a subcollection or array.
                // For simplicity, we'll store the day number in the claim document.
                // Since we have todayClaimed, we can fetch the claim doc to get the day number.
                // But we already have claimDoc from loadData? We didn't store it globally. We'll re-fetch.
                // Alternatively, we can compute: if todayClaimed, then the active/claimed day is the one they claimed today, which we can get from userState.day? Actually userState.day is updated after claim, so if todayClaimed, userState.day should be the day they claimed today.
                // So we can use that.
                // We'll mark as claimed if dayNum < userState.day (when todayClaimed, userState.day is the claimed day) or if dayNum <= userState.day when not todayClaimed (previous claims).
                // Actually, when not todayClaimed, userState.day is the last claimed day. So days <= userState.day are claimed.
                // When todayClaimed, userState.day is the claimed day (today). So days <= userState.day are claimed.
                // So claimed days = dayNum <= userState.day.
                // However, if they skipped, userState.day might be 3, and todayClaimed false, so days 1,2,3 are claimed. Day 4 is not claimed (lost). So day 4 should be shown as locked or lost.
                // So we can use this logic.

                var claimed = (dayNum <= userState.day);
                // Also, if todayClaimed and dayNum === userState.day, it's the one claimed today.
                // Active day: the day they can claim today (nextDayToClaim) if not claimed today.
                var active = (!todayClaimed && dayNum === nextDayToClaim && nextDayToClaim > 0);

                var cardClass = 'day-card';
                if (claimed) cardClass += ' claimed';
                if (active) cardClass += ' active';

                var statusHtml = '';
                if (claimed) {
                    statusHtml = '<div class="day-check"></div>';
                } else if (active) {
                    statusHtml = '<div class="day-check" style="color:#facc15;"> Claim</div>';
                } else {
                    // lost or future
                    if (dayNum > userState.day && !active) {
                        // This day is either lost (if dayNum <= nextDayToClaim-1?) Actually, if skipped, days between userState.day+1 and nextDayToClaim-1 are lost.
                        // We can show a "missed" indicator.
                        if (nextDayToClaim > 0 && dayNum < nextDayToClaim && dayNum > userState.day) {
                            statusHtml = '<div class="day-lock" style="color:#ef4444;"> Missed</div>';
                        } else {
                            statusHtml = '<div class="day-lock"></div>';
                        }
                    } else {
                        statusHtml = '<div class="day-lock"></div>';
                    }
                }

                html += '<div class="' + cardClass + '">';
                html += '<div class="day-number">Day ' + dayNum + '</div>';
                html += '<div class="day-reward"><span class="plus">+</span>' + reward + '</div>';
                html += statusHtml;
                html += '</div>';
            }
            grid.innerHTML = html;

            // Update status
            if (todayClaimed) {
                statusEl.textContent = ' Claimed (Day ' + userState.day + ')';
                statusEl.style.color = '#22c55e';
            } else if (userState.day >= 7) {
                statusEl.textContent = ' Completed! All 7 days claimed.';
                statusEl.style.color = '#facc15';
            } else if (nextDayToClaim > 0) {
                statusEl.textContent = ' Day ' + nextDayToClaim + ' ready to claim';
                statusEl.style.color = '#facc15';
            } else {
                statusEl.textContent = ' No check-in available';
                statusEl.style.color = '#94a3b8';
            }

            // Update balance
            db.collection('users').doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists) {
                    var bal = doc.data().walletBalance || 0;
                    coinBalanceEl.textContent = bal.toFixed(2);
                }
            }).catch(console.warn);

            // Enable/disable button
            var canClaim = !todayClaimed && nextDayToClaim > 0 && nextDayToClaim <= 7;
            btn.disabled = !canClaim;
            if (canClaim) {
                btn.textContent = ' Check In';
                btn.style.opacity = '1';
            } else {
                if (todayClaimed) {
                    btn.textContent = ' Claimed Today';
                } else if (userState.day >= 7) {
                    btn.textContent = ' All Claimed!';
                } else {
                    btn.textContent = ' Come Back Tomorrow';
                }
            }
        }

        // ================================================================
        // CHECK-IN ACTION
        // ================================================================
        document.getElementById('checkinBtn').addEventListener('click', function() {
            if (this.disabled) return;
            var uid = currentUser.uid;

            this.disabled = true;
            this.textContent = 'Processing...';

            // Run transaction
            db.runTransaction(function(transaction) {
                var configRef = db.collection('checkinConfig').doc('daily');
                var userRef = db.collection('users').doc(uid);
                var claimRef = userRef.collection('checkins').doc(todayStr);

                return transaction.get(configRef).then(function(configDoc) {
                    var rewards = defaultRewards.slice();
                    if (configDoc.exists) {
                        var data = configDoc.data();
                        for (var i = 1; i <= 7; i++) {
                            if (data['day' + i] !== undefined) rewards[i - 1] = data['day' + i];
                        }
                    }

                    return transaction.get(userRef).then(function(userDoc) {
                        var userData = userDoc.exists ? userDoc.data() : {};
                        var currentDay = userData.checkinDay || 0;
                        var lastCheckin = userData.lastCheckin ? userData.lastCheckin.toDate() : null;

                        // Determine next day to claim
                        var nextDay = 0;
                        if (currentDay === 0) {
                            nextDay = 1;
                        } else {
                            // Calculate days since last checkin
                            var diff = lastCheckin ? daysBetween(lastCheckin, today) : 0;
                            if (diff === 0) {
                                // Already claimed today – shouldn't happen
                                throw new Error('Already claimed today');
                            }
                            // Next day = currentDay + diff (capped at 7)
                            var candidate = currentDay + diff;
                            if (candidate > 7) candidate = 0; // all done
                            nextDay = candidate;
                        }

                        if (nextDay === 0 || nextDay > 7) {
                            throw new Error('All days already claimed or no claim available.');
                        }

                        var rewardAmount = rewards[nextDay - 1] || 0;

                        // Check if claim already exists for today
                        return transaction.get(claimRef).then(function(claimDoc) {
                            if (claimDoc.exists) {
                                throw new Error('Already claimed today');
                            }

                            // Create claim record with day number
                            transaction.set(claimRef, {
                                day: nextDay,
                                amount: rewardAmount,
                                claimedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            // Update user
                            var updateData = {
                                checkinDay: nextDay,
                                lastCheckin: firebase.firestore.FieldValue.serverTimestamp()
                            };
                            if (rewardAmount > 0) {
                                transaction.update(userRef, {
                                    walletBalance: firebase.firestore.FieldValue.increment(rewardAmount),
                                    balance: firebase.firestore.FieldValue.increment(rewardAmount),
                                    totalIncome: firebase.firestore.FieldValue.increment(rewardAmount)
                                });
                            }
                            transaction.update(userRef, updateData);

                            return rewardAmount;
                        });
                    });
                });
            }).then(function(amount) {
                // Show success toast and redirect to me.html
                showClaimSuccess(amount);
            }).catch(function(err) {
                console.error('Check-in error:', err);
                alert(' ' + err.message);
                document.getElementById('checkinBtn').disabled = false;
                document.getElementById('checkinBtn').textContent = ' Check In';
            });
        });

        // ================================================================
        // SUCCESS TOAST + REDIRECT
        // ================================================================
        function showClaimSuccess(amount) {
            var overlay = document.getElementById('overlay');
            var toast = document.getElementById('toastClaim');
            var amountEl = document.getElementById('claimAmount');

            amountEl.textContent = '+' + amount;
            overlay.classList.add('show');
            toast.classList.add('show');

            document.getElementById('toastOkBtn').addEventListener('click', function() {
                // Redirect to me.html
                window.location.href = 'me.html';
            });

            // Also allow clicking outside to dismiss? We'll just keep the button.
        }

        // ================================================================
        // INIT
        // ================================================================
        console.log(' Daily Check-in – Skip-aware, no reset on missed days.');
    </script>
</body>
</html>
