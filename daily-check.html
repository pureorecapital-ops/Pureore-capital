<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Daily Check – Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BODY ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0b1120;
            min-height: 100vh;
            padding-top: 70px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            color: #f1f5f9;
        }

        /* ----- HEADER ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(11, 17, 32, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            text-decoration: none;
        }
        .logo-text .pc {
            color: #3b82f6;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 1rem;
            flex: 1;
            width: 100%;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .page-title p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- COIN BALANCE ----- */
        .coin-balance {
            text-align: center;
            font-size: 1.1rem;
            color: #facc15;
            margin-bottom: 1.5rem;
        }
        .coin-balance span {
            font-weight: 700;
            background: rgba(250, 204, 21, 0.06);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }

        /* ----- GRID (7 days) ----- */
        .checkin-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        @media (min-width: 500px) {
            .checkin-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 0.8rem 0.3rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .day-card.active {
            border-color: #facc15;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.08);
        }

        .day-card.claimed {
            border-color: #22c55e;
            opacity: 0.7;
        }
        .day-card.claimed .day-reward {
            text-decoration: line-through;
            color: #22c55e;
        }

        .day-card .day-number {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-weight: 600;
        }

        .day-card .day-reward {
            font-size: 1.3rem;
            font-weight: 700;
            color: #facc15;
            margin: 0.2rem 0;
        }
        .day-card .day-reward .plus {
            font-size: 1rem;
            color: #94a3b8;
            margin-right: 2px;
        }

        .day-card .day-check {
            font-size: 0.65rem;
            font-weight: 600;
            color: #22c55e;
        }

        .day-card .day-lock {
            font-size: 0.65rem;
            font-weight: 600;
            color: #64748b;
        }

        .day-card .day-available {
            font-size: 0.65rem;
            font-weight: 600;
            color: #facc15;
        }

        /* ----- CHECK-IN BUTTON ----- */
        .checkin-btn-wrap {
            text-align: center;
            margin: 1.2rem 0 1.5rem;
        }

        .btn-checkin {
            background: linear-gradient(135deg, #facc15, #f5a623);
            border: none;
            border-radius: 60px;
            padding: 0.9rem 3.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            color: #0b1120;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 30px rgba(250, 204, 21, 0.15);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-checkin:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(250, 204, 21, 0.25);
        }

        .btn-checkin:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-checkin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-checkin .coin-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        /* ----- TURNOVER / STATUS ----- */
        .turnover {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.2rem;
        }
        .turnover strong {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* ----- TOAST (success) ----- */
        .toast-claim {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            z-index: 200;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            max-width: 90%;
            width: 400px;
        }
        .toast-claim.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast-claim .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .toast-claim .amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: #facc15;
        }
        .toast-claim .label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .toast-claim .sub {
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
        .toast-claim .btn-ok {
            background: linear-gradient(135deg, #facc15, #f5a623);
            border: none;
            border-radius: 40px;
            padding: 0.6rem 2.5rem;
            font-weight: 700;
            font-family: inherit;
            color: #0b1120;
            cursor: pointer;
            margin-top: 1.2rem;
            font-size: 1rem;
            transition: 0.2s;
        }
        .toast-claim .btn-ok:hover {
            transform: scale(1.05);
        }

        /* ----- OVERLAY ----- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }
            .container {
                padding: 1rem 0.8rem;
            }
            .page-title h1 {
                font-size: 1.3rem;
            }
            .day-card .day-reward {
                font-size: 1.1rem;
            }
            .btn-checkin {
                padding: 0.7rem 2.5rem;
                font-size: 1rem;
            }
            .checkin-grid {
                gap: 0.5rem;
            }
            .day-card {
                padding: 0.6rem 0.2rem;
            }
        }

        @media (max-width: 400px) {
            .checkin-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .day-card .day-reward {
                font-size: 1rem;
            }
        }

        @media (max-width: 340px) {
            .checkin-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="index.html" class="logo-text">Pureore<span class="pc">·PC</span></a>
        <a href="dashboard.html" class="back-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </a>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <div class="page-title">
            <h1> Daily Checkin</h1>
            <p>Check in once per day to claim your reward in order. Miss a day? You can pick up where you left off.</p>
        </div>

        <!-- Coin balance -->
        <div class="coin-balance">
            <span> <span id="coinBalance">0</span> coins</span>
        </div>

        <!-- Turnover status -->
        <div class="turnover" id="turnoverDisplay">
            Today's checkin: <strong id="todayStatus"> Pending</strong>
        </div>

        <!-- 7-day grid -->
        <div class="checkin-grid" id="checkinGrid">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- Check-in button -->
        <div class="checkin-btn-wrap">
            <button class="btn-checkin" id="checkinBtn" disabled>
                <span class="coin-icon"></span> Check In
            </button>
        </div>

    </main>

    <!-- OVERLAY & TOAST (success message) -->
    <div class="overlay" id="overlay"></div>
    <div class="toast-claim" id="toastClaim">
        <div class="icon"></div>
        <div class="amount" id="claimAmount">+0</div>
        <div class="label">coins earned!</div>
        <div class="sub">Keep checking in to unlock all rewards.</div>
        <button class="btn-ok" id="toastOkBtn">Go to Profile</button>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // STATE
        // ================================================================
        var currentUser = null;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var todayStr = formatDateKey(today);

        // Default rewards (will be overridden by Firestore)
        var defaultRewards = [20, 30, 30, 40, 50, 50, 80];

        // ================================================================
        // HELPERS
        // ================================================================
        function formatDateKey(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getDate() === d2.getDate();
        }

        // ================================================================
        // FIREBASE AUTH
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadData();
        });

        // ================================================================
        // LOAD DATA & RENDER
        // ================================================================
        var rewards = [];
        var lastClaimedDay = 0; // 0 = none, 1-7
        var todayClaimed = false;

        function loadData() {
            if (!currentUser) return;

            var configRef = db.collection('checkinConfig').doc('daily');
            var userRef = db.collection('users').doc(currentUser.uid);
            var claimRef = userRef.collection('checkins').doc(todayStr);

            Promise.all([
                configRef.get(),
                userRef.get(),
                claimRef.get()
            ]).then(function(results) {
                var configDoc = results[0];
                var userDoc = results[1];
                var claimDoc = results[2];

                // Parse rewards
                if (configDoc.exists) {
                    var data = configDoc.data();
                    rewards = [];
                    for (var i = 1; i <= 7; i++) {
                        rewards.push(data['day' + i] || defaultRewards[i - 1]);
                    }
                } else {
                    rewards = defaultRewards.slice();
                }

                // Parse user state
                if (userDoc.exists) {
                    var userData = userDoc.data();
                    lastClaimedDay = userData.checkinDay || 0;
                } else {
                    lastClaimedDay = 0;
                }

                // Check if already claimed today
                todayClaimed = claimDoc.exists;

                renderPage();
            }).catch(function(err) {
                console.error('Error loading data:', err);
                document.getElementById('checkinGrid').innerHTML = '<p style="color:#f87171;text-align:center;">Error loading data. Please refresh.</p>';
            });
        }

        // ================================================================
        // RENDER
        // ================================================================
        function renderPage() {
            var grid = document.getElementById('checkinGrid');
            var btn = document.getElementById('checkinBtn');
            var statusEl = document.getElementById('todayStatus');
            var coinBalanceEl = document.getElementById('coinBalance');

            // Determine next claimable day
            var nextDay = lastClaimedDay + 1;
            var canClaimToday = !todayClaimed && nextDay <= 7;

            // Build grid
            var html = '';
            for (var i = 0; i < 7; i++) {
                var dayNum = i + 1;
                var reward = rewards[i] || 0;
                var claimed = (dayNum <= lastClaimedDay);
                var active = (dayNum === nextDay && canClaimToday);

                var cardClass = 'day-card';
                if (claimed) cardClass += ' claimed';
                if (active) cardClass += ' active';

                var statusHtml = '';
                if (claimed) {
                    statusHtml = '<div class="day-check"></div>';
                } else if (active) {
                    statusHtml = '<div class="day-available"> Claim</div>';
                } else if (dayNum < nextDay) {
                    // This should never happen because we increment lastClaimedDay sequentially
                    statusHtml = '<div class="day-lock"></div>';
                } else {
                    statusHtml = '<div class="day-lock"></div>';
                }

                html += '<div class="' + cardClass + '">';
                html += '<div class="day-number">Day ' + dayNum + '</div>';
                html += '<div class="day-reward"><span class="plus">+</span>' + reward + '</div>';
                html += statusHtml;
                html += '</div>';
            }
            grid.innerHTML = html;

            // Update status
            if (todayClaimed) {
                statusEl.textContent = ' Claimed today (Day ' + lastClaimedDay + ')';
                statusEl.style.color = '#22c55e';
            } else if (lastClaimedDay >= 7) {
                statusEl.textContent = ' All 7 days claimed!';
                statusEl.style.color = '#facc15';
            } else if (canClaimToday) {
                statusEl.textContent = ' Day ' + nextDay + ' ready to claim';
                statusEl.style.color = '#facc15';
            } else {
                statusEl.textContent = ' Come back tomorrow';
                statusEl.style.color = '#94a3b8';
            }

            // Update balance
            db.collection('users').doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists) {
                    var bal = doc.data().walletBalance || 0;
                    coinBalanceEl.textContent = bal.toFixed(2);
                }
            }).catch(console.warn);

            // Enable/disable button
            var canClaim = canClaimToday;
            btn.disabled = !canClaim;
            if (canClaim) {
                btn.innerHTML = '<span class="coin-icon"></span> Check In (Day ' + nextDay + ')';
            } else {
                if (todayClaimed) {
                    btn.innerHTML = '<span class="coin-icon"></span> Claimed Today';
                } else if (lastClaimedDay >= 7) {
                    btn.innerHTML = '<span class="coin-icon"></span> All Claimed!';
                } else {
                    btn.innerHTML = '<span class="coin-icon"></span> Come Back Tomorrow';
                }
            }
        }

        // ================================================================
        // CHECK-IN ACTION
        // ================================================================
        document.getElementById('checkinBtn').addEventListener('click', function() {
            if (this.disabled) return;
            var uid = currentUser.uid;

            this.disabled = true;
            this.innerHTML = ' Processing...';

            // Run transaction
            db.runTransaction(function(transaction) {
                var configRef = db.collection('checkinConfig').doc('daily');
                var userRef = db.collection('users').doc(uid);
                var claimRef = userRef.collection('checkins').doc(todayStr);

                return transaction.get(configRef).then(function(configDoc) {
                    var rewards = defaultRewards.slice();
                    if (configDoc.exists) {
                        var data = configDoc.data();
                        for (var i = 1; i <= 7; i++) {
                            if (data['day' + i] !== undefined) rewards[i - 1] = data['day' + i];
                        }
                    }

                    return transaction.get(userRef).then(function(userDoc) {
                        var userData = userDoc.exists ? userDoc.data() : {};
                        var currentDay = userData.checkinDay || 0;

                        // Next day to claim
                        var nextDay = currentDay + 1;
                        if (nextDay > 7) {
                            throw new Error('All days already claimed.');
                        }

                        var rewardAmount = rewards[nextDay - 1] || 0;

                        // Check if claim already exists for today
                        return transaction.get(claimRef).then(function(claimDoc) {
                            if (claimDoc.exists) {
                                throw new Error('Already claimed today');
                            }

                            // Create claim record with day number
                            transaction.set(claimRef, {
                                day: nextDay,
                                amount: rewardAmount,
                                claimedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            // Update user: increment checkinDay and walletBalance
                            var updateData = {
                                checkinDay: nextDay,
                                lastCheckin: firebase.firestore.FieldValue.serverTimestamp()
                            };
                            if (rewardAmount > 0) {
                                // Only update walletBalance (consistent with income.html)
                                transaction.update(userRef, {
                                    walletBalance: firebase.firestore.FieldValue.increment(rewardAmount)
                                });
                            }
                            transaction.update(userRef, updateData);

                            return rewardAmount;
                        });
                    });
                });
            }).then(function(amount) {
                // Show success toast and redirect to me.html
                showClaimSuccess(amount);
            }).catch(function(err) {
                console.error('Check-in error:', err);
                alert(' ' + err.message);
                document.getElementById('checkinBtn').disabled = false;
                document.getElementById('checkinBtn').innerHTML = '<span class="coin-icon"></span> Check In';
            });
        });

        // ================================================================
        // SUCCESS TOAST + REDIRECT
        // ================================================================
        function showClaimSuccess(amount) {
            var overlay = document.getElementById('overlay');
            var toast = document.getElementById('toastClaim');
            var amountEl = document.getElementById('claimAmount');

            amountEl.textContent = '+' + amount;
            overlay.classList.add('show');
            toast.classList.add('show');

            document.getElementById('toastOkBtn').addEventListener('click', function() {
                window.location.href = 'me.html';
            });
        }

        // ================================================================
        // INIT
        // ================================================================
        console.log(' Daily Check-in – Simple sequential claims, no lost days.');
    </script>
</body>
</html>
