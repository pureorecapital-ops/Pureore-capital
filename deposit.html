<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deposit | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #0A0A0C;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 100px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0A0A0C 0%, #0d1a0d 25%, #0a0d1a 50%, #1a0d0a 75%, #0A0A0C 100%);
            background-size: 400% 400%;
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: -3;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 4 FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.20;
            z-index: -2;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #00E676; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #00E5FF; bottom: -10%; right: -10%; animation-delay: 3s; }
        .orb-3 { width: 300px; height: 300px; background: #FFD700; top: 40%; left: 75%; animation-delay: 6s; }
        .orb-4 { width: 280px; height: 280px; background: #2979FF; bottom: 30%; left: -5%; animation-delay: 9s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* ===== CONTAINER ===== */
        .container { max-width: 600px; margin: 0 auto; position: relative; z-index: 2; }

        /* ===== BACK BUTTON ===== */
        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30,30,42,0.8);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #00E676;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(0,230,118,0.2);
            margin-bottom: 0.5rem;
            text-decoration: none;
        }
        .back-arrow:hover {
            background: #00E676;
            color: #0A0A0C;
            transform: translateX(-4px);
            box-shadow: 0 0 20px rgba(0,230,118,0.3);
        }
        .back-arrow svg { width: 18px; height: 18px; fill: currentColor; }

        /* ===== HEADER ===== */
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #FFD700, #F59E0B, #00E676);
            background-size: 200% 200%;
            animation: gradientShift 4s ease-in-out infinite alternate;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ===== GLASS CARD ===== */
        .card {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(18, 18, 24, 0.85), rgba(18, 18, 24, 0.85)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== AMOUNT BUTTONS ===== */
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        @media (max-width: 450px) {
            .amount-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .amount-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 0.6rem 0.3rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ccc;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .amount-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(0,230,118,0.3);
        }
        .amount-btn.active {
            border-color: #00E676;
            background: rgba(0,230,118,0.1);
            color: #00E676;
            box-shadow: 0 0 20px rgba(0,230,118,0.1);
        }

        /* ===== CUSTOM AMOUNT INPUT ===== */
        .custom-amount input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 40px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(20,22,36,0.9), rgba(20,22,36,0.9)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            text-align: center;
        }
        .custom-amount input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0,229,255,0.15);
        }
        .custom-amount input::placeholder { color: rgba(255,255,255,0.3); }

        /* ===== NETWORK OPTIONS (All 3 networks, but Airtel has no agents) ===== */
        .network-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin: 1rem 0;
        }
        @media (max-width: 450px) {
            .network-grid { grid-template-columns: 1fr 1fr 1fr; }
        }
        .network-option {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 0.8rem 0.3rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .network-option:hover {
            transform: translateY(-3px);
            border-color: rgba(0,230,118,0.3);
        }
        .network-option.active {
            border-color: #00E676;
            background: rgba(0,230,118,0.08);
            box-shadow: 0 0 20px rgba(0,230,118,0.1);
        }
        .network-option img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px;
        }
        .network-option .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #ccc;
        }

        /* ===== PHONE INPUT ===== */
        .phone-prefix {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            border: 2px solid transparent;
            padding: 0 0.5rem;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(20,22,36,0.9), rgba(20,22,36,0.9)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }
        .phone-prefix span { color: #aaa; padding: 0.85rem 0 0.85rem 0.5rem; font-weight: 600; }
        .phone-prefix input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 0.85rem 0.5rem;
            color: white;
            font-size: 1rem;
        }
        .phone-prefix input:focus { outline: none; }
        .phone-prefix input::placeholder { color: rgba(255,255,255,0.3); }

        /* ===== CHECKBOX ===== */
        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 1rem 0;
            color: #ccc;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #00E676;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #00E676, #00E5FF, #2979FF);
            background-size: 200% 200%;
            animation: btnShift 4s ease-in-out infinite alternate;
            padding: 0.9rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #0A0A0C;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,230,118,0.2);
        }
        @keyframes btnShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 8px 30px rgba(0,230,118,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-success {
            width: 100%;
            background: linear-gradient(135deg, #00E676, #00C853);
            padding: 0.9rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #0A0A0C;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,230,118,0.2);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-success:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* ===== AGENT CARD ===== */
        .agent-card {
            background: rgba(255,215,0,0.05);
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.03), transparent, rgba(0,229,255,0.03), transparent);
            animation: spinAgent 10s linear infinite;
            pointer-events: none;
        }
        @keyframes spinAgent {
            to { transform: rotate(360deg); }
        }
        .agent-card > * { position: relative; z-index: 1; }
        .agent-header { font-size: 0.7rem; color: #aaa; letter-spacing: 1px; }
        .agent-name { font-size: 1.3rem; font-weight: 700; color: #FFD700; }
        .agent-number-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.3rem;
            flex-wrap: wrap;
        }
        .agent-number {
            font-size: 1.2rem;
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #fff;
        }
        .copy-btn {
            background: #00E676;
            border: none;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #0A0A0C;
            cursor: pointer;
            transition: 0.3s;
        }
        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,230,118,0.3);
        }

        /* ===== SMS TEXTAREA ===== */
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            color: white;
            font-family: monospace;
            resize: vertical;
            min-height: 120px;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(20,22,36,0.9), rgba(20,22,36,0.9)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }
        textarea:focus { outline: none; box-shadow: 0 0 20px rgba(0,229,255,0.1); }

        /* ===== MESSAGES ===== */
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 0.3rem; }
        .success-msg { color: #00E676; font-size: 0.9rem; font-weight: 600; text-align: center; }
        .warning-msg { color: #FFD700; font-size: 0.8rem; margin-top: 0.3rem; }

        /* ===== HIDDEN ===== */
        .hidden { display: none !important; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            z-index: 9999;
            animation: toastIn 0.4s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.success { background: #00E676; color: #0A0A0C; }
        .toast.error { background: #ef4444; color: white; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== FIREWORKS ===== */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            display: none;
        }

        @media (max-width: 600px) {
            .page-title { font-size: 1.4rem; }
            .amount-grid { grid-template-columns: repeat(3, 1fr); }
            .network-option img { width: 35px; height: 35px; }
            .agent-number { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 4 FLOATING ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">

        <!-- ===== BACK BUTTON ===== -->
        <a href="dashboard.html" class="back-arrow" id="backArrow">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            Back
        </a>

        <!-- ===== HEADER ===== -->

        <!-- ======================================================== -->

        <div id="step2Card" class="card hidden">
            <div class="card-title">📌 Agent Details</div>

            <!-- Agent Info -->
            <div id="agentInfo"></div>

            <!-- SMS Verification -->
            <div style="margin-top: 1rem;">
                <div style="font-weight: 600; color: #ddd; margin-bottom: 0.5rem;">📝 Paste Your Transaction SMS</div>
                <textarea id="smsText" rows="4" placeholder="Paste the SMS from MTN, Airtel or Zamtel here"></textarea>
                <div style="font-size: 0.7rem; color: #666; margin-top: 0.3rem;">The system will verify the SMS content automatically.</div>
            </div>

            <button id="verifyBtn" class="btn-success" style="margin-top: 1.2rem;">🔍 Verify & Complete</button>
            <div id="verifyMessage" style="margin-top: 0.8rem;"></div>
        </div>

    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ===== STATE =====
        let currentUser = null;
        let userId = null;
        let selectedAmount = null;
        let selectedNetwork = null;
        let currentAgent = null;
        let isProcessing = false;

        // ===== DOM REFS =====
        const step1Card = document.getElementById('step1Card');
        const step2Card = document.getElementById('step2Card');
        const amountBtns = document.querySelectorAll('.amount-btn');
        const customAmountInput = document.getElementById('customAmount');
        const amountError = document.getElementById('amountError');
        const networkOptions = document.querySelectorAll('.network-option');
        const phoneInput = document.getElementById('phoneNumber');
        const phoneError = document.getElementById('phoneError');
        const readyCheckbox = document.getElementById('readyToPay');
        const payNowBtn = document.getElementById('payNowBtn');
        const agentInfoDiv = document.getElementById('agentInfo');
        const smsTextarea = document.getElementById('smsText');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyMessage = document.getElementById('verifyMessage');
        const backArrow = document.getElementById('backArrow');

        let depositRules = {
            requireAmountMatch: true,
            requireAgentName: true,
            requireNetworkKeyword: true,
            requireTxKeyword: true
        };

        // ============================================================
        // ===== LOAD DEPOSIT RULES =====
        // ============================================================
        async function loadDepositRules() {
            try {
                const doc = await db.collection('systemSettings').doc('depositRules').get();
                if (doc.exists) {
                    const data = doc.data();
                    depositRules.requireAmountMatch = data.requireAmountMatch !== false;
                    depositRules.requireAgentName = data.requireAgentName !== false;
                    depositRules.requireNetworkKeyword = data.requireNetworkKeyword !== false;
                    depositRules.requireTxKeyword = data.requireTxKeyword !== false;
                }
            } catch (err) {
                console.warn("Could not load deposit rules, using defaults", err);
            }
        }

        // ============================================================
        // ===== AGENT LOGIC (No agents for Airtel) =====
        // ============================================================
        function getHardcodedAgents(network) {
            // MTN Agents
            const mtnAgents = [
                { name: "John Kabwe", number: "0963070992", agentId: null },
                { name: "Getrude Sompo", number: "0960338304", agentId: null }
            ];
            // Zamtel Agents
            const zamtelAgents = [
                { name: "Jeremiah Ilunga", number: "0951359357", agentId: null }
            ];
            // ❌ No agents for Airtel
            if (network === 'mtn') return mtnAgents;
            if (network === 'zamtel') return zamtelAgents;
            return [];
        }

        async function loadFirestoreAgents(network) {
            try {
                const agentsSnap = await db.collection('agents').where('status', '==', 'active').get();
                const firestoreAgents = [];
                agentsSnap.forEach(doc => {
                    const agent = doc.data();
                    let number = null;
                    if (network === 'mtn' && agent.mtnNumber) number = agent.mtnNumber;
                    else if (network === 'airtel' && agent.airtelNumber) number = agent.airtelNumber;
                    else if (network === 'zamtel' && agent.zamtelNumber) number = agent.zamtelNumber;
                    if (number) {
                        firestoreAgents.push({
                            name: agent.name,
                            number: number,
                            agentId: doc.id,
                            source: 'firestore'
                        });
                    }
                });
                return firestoreAgents;
            } catch (err) {
                console.error("Error loading Firestore agents:", err);
                return [];
            }
        }

        function mergeAgents(firestoreAgents, hardcodedAgents) {
            const merged = [...firestoreAgents];
            for (const hc of hardcodedAgents) {
                const exists = merged.some(fa => fa.name === hc.name && fa.number === hc.number);
                if (!exists) {
                    merged.push({ ...hc, source: 'hardcoded' });
                }
            }
            return merged;
        }

        async function loadAndSetAgentForNetwork(network) {
            if (!network) return null;

            // 🚫 No agents for Airtel – return null immediately
            if (network === 'airtel') {
                return null;
            }

            const firestoreAgents = await loadFirestoreAgents(network);
            const hardcodedAgents = getHardcodedAgents(network);
            const combined = mergeAgents(firestoreAgents, hardcodedAgents);
            if (combined.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * combined.length);
            return combined[randomIndex];
        }

        // ============================================================
        // ===== DISPLAY AGENT =====
        // ============================================================
        function displayAgent(agent) {
            if (!agent) {
                // Show different messages based on network
                let message = '⚠️ No agent found for this network. Please contact admin.';
                if (selectedNetwork === 'airtel') {
                    message = 'Agents coming soon – try other available agents for other networks.';
                }
                agentInfoDiv.innerHTML = `
                    <div class="agent-card">
                        <div class="agent-header">ℹ️ Information</div>
                        <div style="color:#FFD700; font-size:0.95rem; text-align:center;">${message}</div>
                    </div>
                `;
                return;
            }

            // Display agent details for MTN and Zamtel
            const agentHtml = `
                <div class="agent-card">
                    <div class="agent-header">📌 PAYMENT AGENT (${selectedNetwork.toUpperCase()})</div>
                    <div class="agent-name">${escapeHtml(agent.name)}</div>
                    <div class="agent-number-wrapper">
                        <span class="agent-number">${escapeHtml(agent.number)}</span>
                        <button class="copy-btn" data-number="${escapeHtml(agent.number)}">📋 Copy</button>
                    </div>
                    ${agent.agentId ? `<div style="font-size:0.65rem; color:#666; margin-top:0.3rem;">✓ Official verified agent</div>` : ''}
                    <div style="font-size:0.7rem; color:#888; margin-top:0.3rem;">Send the exact amount to this number</div>
                </div>
            `;
            agentInfoDiv.innerHTML = agentHtml;

            // Copy to clipboard
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const number = this.dataset.number;
                    navigator.clipboard.writeText(number).then(() => {
                        this.textContent = '✅ Copied!';
                        setTimeout(() => { this.textContent = '📋 Copy'; }, 2000);
                    }).catch(() => {
                        // Fallback
                        const textArea = document.createElement('textarea');
                        textArea.value = number;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        textArea.remove();
                        this.textContent = '✅ Copied!';
                        setTimeout(() => { this.textContent = '📋 Copy'; }, 2000);
                    });
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        // ============================================================
        // ===== SMS VALIDATION =====
        // ============================================================
        function validateSms(sms, amount, network) {
            const lowerSms = sms.toLowerCase();
            if (depositRules.requireAmountMatch) {
                const amountRegex = new RegExp(`\\b${amount}\\b`);
                if (!amountRegex.test(sms)) {
                    return { valid: false, error: `SMS amount does not match your deposit amount (${amount} ZMW).` };
                }
            }
            if (depositRules.requireNetworkKeyword) {
                let networkKeyword = '';
                if (network === 'mtn') networkKeyword = 'mtn';
                else if (network === 'airtel') networkKeyword = 'airtel';
                else if (network === 'zamtel') networkKeyword = 'zamtel';
                if (!lowerSms.includes(networkKeyword)) {
                    return { valid: false, error: `SMS does not contain the network name (${network.toUpperCase()}).` };
                }
            }
            if (depositRules.requireAgentName && currentAgent) {
                if (!lowerSms.includes(currentAgent.name.toLowerCase())) {
                    return { valid: false, error: `SMS does not contain the agent name "${currentAgent.name}". Please make sure you paid the correct agent.` };
                }
            }
            if (depositRules.requireTxKeyword) {
                const txKeywords = /send|sent|received|deposit|paid|transfer|successful|payment/i;
                if (!txKeywords.test(sms)) {
                    return { valid: false, error: 'SMS does not contain a recognised transaction keyword (send, sent, received, etc.).' };
                }
            }
            return { valid: true, error: null };
        }

        // ============================================================
        // ===== PHONE VALIDATION =====
        // ============================================================
        function validatePhone() {
            const digits = phoneInput.value.trim();
            if (!selectedNetwork) return false;
            if (digits.length !== 9 || !/^\d{9}$/.test(digits)) {
                phoneError.innerText = 'Enter exactly 9 digits after +260';
                return false;
            }
            const prefix = digits.substring(0, 2);
            let valid = false;
            if (selectedNetwork === 'mtn') valid = (prefix === '96' || prefix === '76');
            else if (selectedNetwork === 'airtel') valid = (prefix === '97' || prefix === '77' || prefix === '57');
            else if (selectedNetwork === 'zamtel') valid = (prefix === '95' || prefix === '75');
            phoneError.innerText = valid ? '' : `Invalid prefix for ${selectedNetwork.toUpperCase()}.`;
            return valid;
        }

        function getFullPhone() {
            const digits = phoneInput.value.trim();
            return digits ? '+260' + digits : '';
        }

        // ============================================================
        // ===== PAY BUTTON VALIDATION =====
        // ============================================================
        function validatePayButton() {
            const amountOk = selectedAmount && selectedAmount >= 70;
            const networkOk = selectedNetwork !== null;
            // Agent must be present for MTN and Zamtel, but for Airtel we skip this check
            let agentOk = true;
            if (selectedNetwork !== 'airtel') {
                agentOk = currentAgent !== null;
            } else {
                // For Airtel, we don't require an agent to enable the button, but we should still show the message.
                // Actually, let's keep the button disabled if no agent is found, so the user can't proceed.
                // Wait, the user said "Let all three select networks shows only agents information on airtel remove it".
                // This means they just want the info removed, but they might still want to pay.
                // However, if there's no agent, they can't pay. So disabling the button is correct.
                agentOk = false; // Since we return null for Airtel, this will be false.
            }
            const phoneOk = validatePhone();
            const ready = readyCheckbox.checked;
            payNowBtn.disabled = !(amountOk && networkOk && agentOk && phoneOk && ready);
        }

        // ============================================================
        // ===== EVENT LISTENERS =====
        // ============================================================

        // Amount Buttons
        amountBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedAmount = parseInt(btn.dataset.amt);
                customAmountInput.value = selectedAmount;
                amountBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                amountError.innerText = '';
                validatePayButton();
            });
        });

        // Custom Amount
        customAmountInput.addEventListener('input', () => {
            let val = parseFloat(customAmountInput.value);
            if (!isNaN(val) && val >= 70) {
                selectedAmount = val;
                amountBtns.forEach(b => b.classList.remove('active'));
                amountError.innerText = '';
            } else {
                selectedAmount = null;
                if (customAmountInput.value !== '') amountError.innerText = 'Minimum amount is 70 ZMW';
            }
            validatePayButton();
        });

        // Network Selection
        networkOptions.forEach(opt => {
            opt.addEventListener('click', async () => {
                networkOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedNetwork = opt.dataset.network;
                payNowBtn.disabled = true;
                payNowBtn.innerText = 'Loading agent...';
                currentAgent = await loadAndSetAgentForNetwork(selectedNetwork);
                // Display agent info (or the "coming soon" message)
                displayAgent(currentAgent);
                payNowBtn.disabled = false;
                payNowBtn.innerText = '💸 Pay Now';
                validatePhone();
                validatePayButton();
            });
        });

        // Phone Input
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 9);
            validatePhone();
            validatePayButton();
        });

        // Ready Checkbox
        readyCheckbox.addEventListener('change', validatePayButton);

        // ============================================================
        // ===== PAY NOW =====
        // ============================================================
        payNowBtn.addEventListener('click', async () => {
            if (payNowBtn.disabled) return;

            // If no agent is found, show a message and return
            if (!currentAgent) {
                if (selectedNetwork === 'airtel') {
                    alert('Agents coming soon – try other available agents for other networks.');
                } else {
                    alert('No agent available for this network. Please contact admin.');
                }
                return;
            }

            displayAgent(currentAgent);

            // Store deposit info in session
            sessionStorage.setItem('depositAmount', selectedAmount);
            sessionStorage.setItem('depositNetwork', selectedNetwork);
            sessionStorage.setItem('depositPhone', getFullPhone());
            sessionStorage.setItem('depositPhoneDigits', phoneInput.value);

            step1Card.classList.add('hidden');
            step2Card.classList.remove('hidden');
        });

        // ============================================================
        // ===== BACK BUTTON =====
        // ============================================================
        backArrow.addEventListener('click', (e) => {
            e.preventDefault();
            if (!step2Card.classList.contains('hidden')) {
                step2Card.classList.add('hidden');
                step1Card.classList.remove('hidden');
            } else {
                window.location.href = 'dashboard.html';
            }
        });

        // ============================================================
        // ===== VERIFY & COMPLETE =====
        // ============================================================
        verifyBtn.addEventListener('click', async () => {
            if (verifyBtn.disabled || isProcessing) return;
            isProcessing = true;
            verifyBtn.disabled = true;

            const sms = smsTextarea.value.trim();
            if (!sms) {
                verifyMessage.innerHTML = '<div class="error-msg">❌ Please paste the SMS.</div>';
                isProcessing = false;
                verifyBtn.disabled = false;
                return;
            }

            const amount = parseFloat(sessionStorage.getItem('depositAmount'));
            const network = sessionStorage.getItem('depositNetwork');
            const phone = sessionStorage.getItem('depositPhone');
            if (!amount || !network || !phone) {
                verifyMessage.innerHTML = '<div class="error-msg">Session expired. Please go back and start over.</div>';
                isProcessing = false;
                verifyBtn.disabled = false;
                return;
            }

            const validation = validateSms(sms, amount, network);
            if (!validation.valid) {
                verifyMessage.innerHTML = `<div class="error-msg">${validation.error}</div>`;
                isProcessing = false;
                verifyBtn.disabled = false;
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            verifyBtn.innerText = 'Submitting...';
            verifyMessage.innerHTML = '<div class="success-msg">⏳ Processing...</div>';

            try {
                const depositData = {
                    userId: user.uid,
                    amount: amount,
                    paymentMethod: network,
                    phone: phone,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    smsText: sms,
                    agentName: currentAgent ? currentAgent.name : '',
                    agentNumber: currentAgent ? currentAgent.number : ''
                };
                if (currentAgent && currentAgent.agentId) {
                    depositData.agentId = currentAgent.agentId;
                }
                await db.collection('deposits').add(depositData);

                verifyMessage.innerHTML = '<div class="success-msg">✅ Deposit request submitted! Admin will verify and credit your balance. Redirecting...</div>';
                setTimeout(() => {
                    window.location.href = 'history.html';
                }, 2500);

            } catch (err) {
                console.error(err);
                verifyMessage.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
                isProcessing = false;
                verifyBtn.disabled = false;
                verifyBtn.innerText = '🔍 Verify & Complete';
            }
        });

        // ============================================================
        // ===== AUTH STATE =====
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            userId = user.uid;
            loadDepositRules();
        });

        console.log('✅ Deposit page loaded successfully!');
        console.log('📌 MTN & Zamtel agents available. Airtel agents removed.');
    </script>
</body>
</html>
