<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Deposit – Sajvera Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #060d1a;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
        }

        /* ----- FULL SCREEN BLURRED BACKGROUND (YOUR IMAGE) ----- */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Zt8nS8N/IMG-20260731-WA1244.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.3) saturate(0.8);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 22, 40, 0.40) 0%, rgba(6, 13, 26, 0.85) 100%);
        }

        /* ----- HEADER (TRANSLUCENT GLASS) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(10, 22, 40, 0.60);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.5s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.2rem;
            letter-spacing: -0.3px;
        }

        .glass-card .card-title span {
            color: #60a5fa;
        }

        .glass-card .card-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* ----- INPUT WRAP ----- */
        .input-wrap {
            margin-bottom: 0.3rem;
        }

        .input-wrap label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            display: block;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrap input {
            width: 100%;
            padding: 1rem 1rem;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            font-size: 1.2rem;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
            font-weight: 600;
        }

        .input-wrap input:focus {
            border-color: rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.04);
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.06);
            font-weight: 400;
        }

        .input-wrap input[readonly] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-error {
            font-size: 0.7rem;
            color: #f87171;
            min-height: 1.2rem;
            margin-top: 0.1rem;
        }

        /* ----- NOTICE CARD (GLASS) ----- */
        .notice-card {
            background: rgba(59, 130, 246, 0.02);
            border: 1px solid rgba(59, 130, 246, 0.04);
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin: 0.8rem 0 1.2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .notice-card svg {
            width: 18px;
            height: 18px;
            stroke: #60a5fa;
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ----- BUTTON ----- */
        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 24px rgba(37, 99, 235, 0.20);
            margin-top: 0.3rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.30);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== LOADING OVERLAY (GLASS, SHOWS USER NAME) ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 13, 26, 0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.4s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .loading-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(16px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .loading-card .loader-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top-color: #60a5fa;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-card .loader-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .loading-card .loader-email {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 0.6rem;
        }

        .loading-card .loader-amount {
            font-size: 2rem;
            font-weight: 800;
            color: #facc15;
            margin-bottom: 0.4rem;
        }

        .loading-card .loader-amount .currency {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .loading-card .loader-status {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            animation: pulseText 1.5s ease-in-out infinite;
        }

        .loading-card .loader-status .dot {
            display: inline-block;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .loading-card .loader-status .dot:nth-child(2) {
            animation-delay: 0.3s;
        }
        .loading-card .loader-status .dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
        }

        .loading-card .loader-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
            margin: 0.6rem 0;
        }

        .loading-card .loader-note {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 0.4rem;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 22, 40, 0.90);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(52, 211, 153, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .logo-sub {
                font-size: 0.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .glass-card {
                padding: 1.5rem 1.2rem;
                border-radius: 24px;
            }
            .glass-card .card-title {
                font-size: 1.3rem;
            }
            .input-wrap input {
                font-size: 1rem;
                padding: 0.8rem 0.9rem;
            }
            .loading-card {
                padding: 2rem 1.5rem;
            }
            .loading-card .loader-name {
                font-size: 1.2rem;
            }
            .loading-card .loader-amount {
                font-size: 1.6rem;
            }
            .back-btn {
                font-size: 0.65rem;
                padding: 0.3rem 0.8rem;
            }
        }

        @media (max-width: 400px) {
            .glass-card {
                padding: 1.2rem 1rem;
            }
            .input-wrap input {
                font-size: 0.9rem;
                padding: 0.7rem 0.8rem;
            }
            .notice-card {
                font-size: 0.7rem;
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FULL SCREEN BLURRED BACKGROUND ===== -->
    <div class="hero-bg"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo-text">Sajvera<span class="vc">Capital</span></a>
            <span class="logo-sub">powered by <span class="highlight">Pureore Capital</span></span>
        </div>
        <div class="header-right">
            <a href="dashboard.html" class="back-btn">← Back</a>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">
        <div class="glass-card">
            <div class="card-title">💰 <span>Deposit</span> Funds</div>
            <div class="card-sub">Enter the amount you wish to deposit.</div>

            <div class="input-wrap">
                <label for="amountInput">Amount (ZMW)</label>
                <input type="number" id="amountInput" placeholder="0.00" min="0.01" step="0.01" autofocus />
            </div>
            <div class="input-error" id="amountError"></div>

            <div class="notice-card">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Enter any amount you wish to deposit. Please confirm the amount before continuing.</span>
            </div>

            <button class="btn-primary" id="continueBtn" disabled>💳 Continue to Payment</button>
        </div>
    </main>

    <!-- ===== LOADING OVERLAY (SHOWS USER NAME + PAYMENT STATUS) ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="loader-icon"></div>
            <div class="loader-name" id="loaderName">—</div>
            <div class="loader-email" id="loaderEmail">—</div>
            <div class="loader-divider"></div>
            <div class="loader-amount" id="loaderAmount">0.00 <span class="currency">ZMW</span></div>
            <div class="loader-status" id="loaderStatus">
                Processing your payment<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
            <div class="loader-divider"></div>
            <div class="loader-note">⏳ Please do not close this window</div>
        </div>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' } [m]; });
        }

        function showToast(message, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4500);
        }

        // ================================================================
        // DOM REFS
        // ================================================================
        var amountInput = document.getElementById('amountInput');
        var amountError = document.getElementById('amountError');
        var continueBtn = document.getElementById('continueBtn');
        var loadingOverlay = document.getElementById('loadingOverlay');
        var loaderName = document.getElementById('loaderName');
        var loaderEmail = document.getElementById('loaderEmail');
        var loaderAmount = document.getElementById('loaderAmount');
        var loaderStatus = document.getElementById('loaderStatus');

        var currentUser = null;
        var userData = null;

        // ================================================================
        // FIXED: AUTH STATE WITH PROPER INITIALIZATION HANDLING
        // ================================================================
        let authResolved = false;
        let redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                // User is authenticated – clear any pending redirect timeout
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }

                currentUser = user;

                db.collection('users').doc(user.uid).get().then(function(doc) {
                    if (doc.exists) {
                        userData = doc.data();
                        loaderName.textContent = escapeHtml(userData.fullName || 'User');
                        loaderEmail.textContent = escapeHtml(userData.email || user.email);
                    } else {
                        loaderName.textContent = escapeHtml(user.displayName || 'User');
                        loaderEmail.textContent = escapeHtml(user.email || '');
                    }
                }).catch(function(err) {
                    console.warn('Error loading user data:', err);
                    loaderName.textContent = escapeHtml(user.displayName || 'User');
                    loaderEmail.textContent = escapeHtml(user.email || '');
                });

                // Watch for block status
                db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                    if (doc.exists && doc.data().isBlocked === true) {
                        showToast('⚠️ Your account has been blocked.', true);
                        setTimeout(function() {
                            auth.signOut().then(function() { window.location.href = 'login.html'; });
                        }, 2000);
                    }
                }, function(err) { console.warn('Block listener error:', err); });

            } else {
                // user is null
                if (!authResolved) {
                    // First callback: still initializing; set a safety timeout
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            // After 2 seconds, if still no user, redirect to login
                            if (!auth.currentUser) {
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    // User was previously logged in and now signed out (or session lost)
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // VALIDATE AMOUNT
        // ================================================================
        function validateAmount() {
            var val = parseFloat(amountInput.value);
            if (isNaN(val) || val <= 0) {
                amountError.innerText = 'Please enter a valid amount';
                continueBtn.disabled = true;
                return false;
            }
            if (val < 1) {
                amountError.innerText = 'Minimum deposit is 1.00 ZMW';
                continueBtn.disabled = true;
                return false;
            }
            amountError.innerText = '';
            continueBtn.disabled = false;
            return true;
        }

        amountInput.addEventListener('input', validateAmount);

        // ================================================================
        // CONTINUE BUTTON – SHOW LOADING WITH USER NAME
        // ================================================================
        continueBtn.addEventListener('click', function() {
            if (this.disabled) return;

            var amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                validateAmount();
                return;
            }

            // Update loader with amount
            loaderAmount.textContent = amount.toFixed(2) + ' ZMW';

            // Update status message
            var name = loaderName.textContent || 'User';
            loaderStatus.innerHTML = 'Processing payment for <strong>' + escapeHtml(name) + '</strong><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';

            // Show loading overlay
            loadingOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Store amount in localStorage for next step
            localStorage.setItem('depositAmount', amount);

            // Simulate payment processing with status updates
            var statusMessages = [
                '⏳ Initializing payment gateway...',
                '🔐 Securing transaction...',
                '💳 Connecting to payment processor...',
                '✅ Payment successful! Redirecting...'
            ];

            var statusIndex = 0;

            function updateStatus() {
                if (statusIndex < statusMessages.length) {
                    loaderStatus.innerHTML = statusMessages[statusIndex];
                    statusIndex++;
                    setTimeout(updateStatus, 1800);
                } else {
                    // All done - redirect to step 2 or complete
                    setTimeout(function() {
                        window.location.href = 'deposit-step2.html';
                    }, 800);
                }
            }

            // Start status updates after a brief delay
            setTimeout(updateStatus, 600);
        });

        // ================================================================
        // KEYBOARD SHORTCUT
        // ================================================================
        amountInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !continueBtn.disabled) {
                continueBtn.click();
            }
        });

        // ================================================================
        // FOCUS
        // ================================================================
        setTimeout(function() { amountInput.focus(); }, 400);

        // ================================================================
