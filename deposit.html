<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deposit | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 1rem 0;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .amount-btn {
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            border-radius: 40px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .amount-btn:hover, .amount-btn.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-color: #2ecc71;
            transform: scale(1.02);
        }
        .custom-amount input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            background: #1E1E2A;
            color: white;
            text-align: center;
        }
        .network-row {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
            margin: 1rem 0;
        }
        .network-option {
            text-align: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 20px;
            flex: 1;
            background: #111116;
            border: 1px solid #2C2C3A;
        }
        .network-option.active {
            border-color: #2ecc71;
            background: rgba(46,204,113,0.1);
            box-shadow: 0 0 10px rgba(46,204,113,0.3);
        }
        .network-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .phone-prefix {
            display: flex;
            align-items: center;
            background: #1E1E2A;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            padding: 0 0.5rem;
        }
        .phone-prefix span { color: #aaa; padding-left: 0.5rem; }
        .phone-prefix input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 0.9rem 0.5rem;
            color: white;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #239b56);
            padding: 1rem;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
        }
        .btn-pay:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .agent-card {
            background: linear-gradient(135deg, #111116, #0D0D12);
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46,204,113,0.4);
        }
        .agent-header { font-size: 0.8rem; color: #aaa; margin-bottom: 0.5rem; }
        .agent-name { font-size: 1.4rem; font-weight: 700; color: #2ecc71; }
        .agent-number {
            font-size: 1.2rem;
            font-family: monospace;
            background: #1A1A24;
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            margin-top: 0.3rem;
        }
        .copy-number {
            background: #2ecc71;
            border: none;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            margin-left: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            color: #0A0A0C;
        }
        .verify-card {
            background: #0F0F14;
            border-radius: 28px;
            padding: 1.2rem;
            margin-top: 0.5rem;
        }
        .section-title { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #ddd; }
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 24px;
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            color: white;
            font-family: monospace;
            resize: vertical;
        }
        .file-upload {
            background: #1E1E2A;
            border: 1px dashed #2ecc71;
            border-radius: 24px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        .file-upload:hover { background: #2a2a36; }
        .file-upload input { display: none; }
        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #2ecc71;
            font-weight: 500;
        }
        .file-name { font-size: 0.8rem; color: #aaa; margin-top: 0.5rem; }
        .image-preview {
            margin-top: 0.5rem;
            text-align: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            border: 1px solid #2ecc71;
        }
        .datetime-row {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
        }
        .datetime-row input {
            flex: 1;
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            border-radius: 40px;
            padding: 0.7rem;
            color: white;
        }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 0.3rem; }
        .success-msg { color: #2ecc71; text-align: center; font-weight: bold; }
        .loader {
            border: 3px solid #2C2C3A;
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label { color: #2ecc71; }
    </style>
</head>
<body>

    <div class="animated-title">💰 Deposit to grow your balance</div>

    <!-- Step 1 -->

            <div class="file-upload" id="fileUploadTrigger">
                <label class="file-label">📁 Choose screenshot<input type="file" id="screenshotUpload" accept="image/*"></label>

<canvas id="fireworks" class="hidden"></canvas>

<script>
    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    
    // 🔥 DISABLE OFFLINE PERSISTENCE – No cached data
    db.settings({ persistence: false });
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // ✅ Authentication guard
    auth.onAuthStateChanged((user) => {
        if (!user) window.location.href = 'login.html';
    });

    // Fireworks effect (unchanged)
    let fireworksAnimationId = null;
    function showFireworks() {
        const canvas = document.getElementById('fireworks');
        if (!canvas) return;
        if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);
        let particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 1,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let anyAlive = false;
            for (let p of particles) {
                if (p.life <= 0) continue;
                anyAlive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            if (anyAlive) {
                fireworksAnimationId = requestAnimationFrame(animate);
            } else {
                canvas.classList.add('hidden');
                window.removeEventListener('resize', resize);
                fireworksAnimationId = null;
            }
        }
        fireworksAnimationId = requestAnimationFrame(animate);
        setTimeout(() => {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                canvas.classList.add('hidden');
                window.removeEventListener('resize', resize);
            }
        }, 3000);
    }

    // DOM elements
    const step1Card = document.getElementById('step1Card');
    const step2Card = document.getElementById('step2Card');
    const customAmountInput = document.getElementById('customAmount');
    const amountBtns = document.querySelectorAll('.amount-btn');
    const networkOptions = document.querySelectorAll('.network-option');
    const phoneInput = document.getElementById('phoneNumber');
    const readyCheckbox = document.getElementById('readyToPay');
    const payNowBtn = document.getElementById('payNowBtn');
    const amountError = document.getElementById('amountError');
    const phoneError = document.getElementById('phoneError');
    const agentInfoDiv = document.getElementById('agentInfo');
    const smsTextarea = document.getElementById('smsText');
    const screenshotUpload = document.getElementById('screenshotUpload');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyMessage = document.getElementById('verifyMessage');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const imagePreviewDiv = document.getElementById('imagePreview');
    const transactionDateInput = document.getElementById('transactionDate');
    const transactionTimeInput = document.getElementById('transactionTime');

    let selectedAmount = null;
    let selectedNetwork = null;
    let currentAgent = null;

    // Set default date/time
    const now = new Date();
    const defaultDate = now.toISOString().split('T')[0];
    const defaultTime = now.toTimeString().slice(0,5);
    transactionDateInput.value = defaultDate;
    transactionTimeInput.value = defaultTime;

    // Screenshot preview
    screenshotUpload.addEventListener('change', () => {
        const file = screenshotUpload.files[0];
        if (file) {
            fileNameDisplay.textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreviewDiv.innerHTML = `<img src="${e.target.result}" alt="Screenshot preview">`;
                imagePreviewDiv.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        } else {
            fileNameDisplay.textContent = 'No file chosen';
            imagePreviewDiv.classList.add('hidden');
            imagePreviewDiv.innerHTML = '';
        }
    });
    document.getElementById('fileUploadTrigger').addEventListener('click', () => screenshotUpload.click());

    function getFullPhone() {
        const digits = phoneInput.value.trim();
        return digits ? '+260' + digits : '';
    }

    function validatePhone() {
        const digits = phoneInput.value.trim();
        if (!selectedNetwork) return false;
        if (digits.length !== 9 || !/^\d{9}$/.test(digits)) {
            phoneError.innerText = 'Enter exactly 9 digits after +260';
            return false;
        }
        const prefix = digits.substring(0,2);
        let valid = false;
        if (selectedNetwork === 'mtn') valid = (prefix === '96' || prefix === '76');
        else if (selectedNetwork === 'airtel') valid = (prefix === '97' || prefix === '77' || prefix === '57');
        else if (selectedNetwork === 'zamtel') valid = (prefix === '95' || prefix === '75');
        phoneError.innerText = valid ? '' : `Invalid prefix for ${selectedNetwork.toUpperCase()}.`;
        return valid;
    }

    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0,9);
        validatePhone();
        validatePayButton();
    });

    amountBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            selectedAmount = parseInt(btn.dataset.amt);
            customAmountInput.value = selectedAmount;
            amountBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            amountError.innerText = '';
            validatePayButton();
        });
    });

    customAmountInput.addEventListener('input', () => {
        let val = parseFloat(customAmountInput.value);
        if (!isNaN(val) && val >= 70) {
            selectedAmount = val;
            amountBtns.forEach(b => b.classList.remove('active'));
            amountError.innerText = '';
        } else {
            selectedAmount = null;
            if (customAmountInput.value !== '') amountError.innerText = 'Minimum amount is 70 ZMW';
        }
        validatePayButton();
    });

    networkOptions.forEach(opt => {
        opt.addEventListener('click', () => {
            networkOptions.forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            selectedNetwork = opt.dataset.network;
            validatePhone();
            validatePayButton();
        });
    });

    readyCheckbox.addEventListener('change', validatePayButton);

    function validatePayButton() {
        const amountOk = selectedAmount && selectedAmount >= 70;
        const networkOk = selectedNetwork !== null;
        const phoneOk = validatePhone();
        const ready = readyCheckbox.checked;
        payNowBtn.disabled = !(amountOk && networkOk && phoneOk && ready);
    }

    // ----- Hardcoded agents for DISPLAY only (user sees who to pay) -----
    const mtnAgentsDisplay = [
        { number: '0961391022', name: 'John Kabwe' },
        { number: '0960338304', name: 'Getrude Sonpo' }
    ];
    const airtelAgentDisplay = { number: '0775552002', name: 'John Kabwe' };
    const zamtelAgentDisplay = { number: '0951359357', name: 'Jeremiah Ilunga' };

    // ----- Fetch agents from Firestore for validation -----
    async function getAgentsForNetwork(network) {
        try {
            const snapshot = await db.collection('agents').where('network', '==', network).get();
            if (!snapshot.empty) {
                const agents = [];
                snapshot.forEach(doc => agents.push(doc.data()));
                return agents;
            }
        } catch (err) {
            console.warn("Could not fetch agents from Firestore, using fallback:", err);
        }
        // Fallback to hardcoded agents if Firestore collection empty or error
        if (network === 'mtn') return mtnAgentsDisplay;
        if (network === 'airtel') return [airtelAgentDisplay];
        if (network === 'zamtel') return [zamtelAgentDisplay];
        return [];
    }

    // ----- Network detection from SMS (keywords) -----
    function detectNetworkFromSms(sms) {
        const lower = sms.toLowerCase();
        if (lower.includes('reference')) return 'mtn';
        if (lower.includes('transfer') || lower.includes('tid')) return 'airtel';
        if (lower.includes('successfully')) return 'zamtel';
        return null; // unknown
    }

    // ----- Check if agent name exists in SMS (for selected network) -----
    async function isAgentNameValid(sms, network) {
        const agents = await getAgentsForNetwork(network);
        const lowerSms = sms.toLowerCase();
        return agents.some(agent => lowerSms.includes(agent.name.toLowerCase()));
    }

    // Pay Now button – move to step 2 (unchanged)
    payNowBtn.addEventListener('click', async () => {
        if (payNowBtn.disabled) return;
        sessionStorage.setItem('depositAmount', selectedAmount);
        sessionStorage.setItem('depositNetwork', selectedNetwork);
        sessionStorage.setItem('depositPhone', getFullPhone());
        sessionStorage.setItem('depositPhoneDigits', phoneInput.value);

        let agent = null;
        let agentHtml = '';
        if (selectedNetwork === 'mtn') {
            const index = Math.floor(Date.now() / 60000) % 2;
            agent = mtnAgentsDisplay[index];
            currentAgent = agent;
            agentHtml = `<div class="agent-card"><div class="agent-header">📌 AGENT (MTN)</div><div class="agent-name">${agent.name}</div><div><span class="agent-number">${agent.number}</span><button class="copy-number" data-number="${agent.number}">Copy</button></div></div>`;
        } else if (selectedNetwork === 'airtel') {
            agent = airtelAgentDisplay;
            currentAgent = agent;
            agentHtml = `<div class="agent-card"><div class="agent-header">📡 AGENT (Airtel)</div><div class="agent-name">${agent.name}</div><div><span class="agent-number">${agent.number}</span><button class="copy-number" data-number="${agent.number}">Copy</button></div></div>`;
        } else if (selectedNetwork === 'zamtel') {
            agent = zamtelAgentDisplay;
            currentAgent = agent;
            agentHtml = `<div class="agent-card"><div class="agent-header">📶 AGENT (Zamtel)</div><div class="agent-name">${agent.name}</div><div><span class="agent-number">${agent.number}</span><button class="copy-number" data-number="${agent.number}">Copy</button></div></div>`;
        }
        agentInfoDiv.innerHTML = agentHtml;
        document.querySelectorAll('.copy-number').forEach(btn => {
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(btn.dataset.number);
                alert('Agent number copied!');
            });
        });
        step1Card.classList.add('hidden');
        step2Card.classList.remove('hidden');
    });

    // Verify & Complete button
    verifyBtn.addEventListener('click', async () => {
        const sms = smsTextarea.value;
        const screenshotFile = screenshotUpload.files[0];
        const userDate = transactionDateInput.value;
        const userTime = transactionTimeInput.value;

        if (!sms || !screenshotFile) {
            verifyMessage.innerHTML = '<div class="error-msg">Please paste SMS and upload screenshot.</div>';
            return;
        }
        if (!userDate || !userTime) {
            verifyMessage.innerHTML = '<div class="error-msg">Please set the transaction date and time.</div>';
            return;
        }

        const transactionTimestamp = new Date(`${userDate}T${userTime}:00`);
        if (isNaN(transactionTimestamp.getTime())) {
            verifyMessage.innerHTML = '<div class="error-msg">Invalid date/time format.</div>';
            return;
        }

        const nowTime = new Date();
        const hoursDiff = (nowTime - transactionTimestamp) / (1000 * 60 * 60);
        if (hoursDiff > 24) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ This transaction is more than 24 hours old. Please contact support or initiate a new deposit.</div>';
            return;
        }

        verifyMessage.innerHTML = '<div class="loader"></div><div>Verifying...</div>';

        const amount = parseFloat(sessionStorage.getItem('depositAmount'));
        if (!amount) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ Amount missing. Please go back.</div>';
            return;
        }

        // 1. Amount check
        const smsLower = sms.toLowerCase();
        if (!smsLower.includes(amount.toString())) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ SMS amount does not match your deposit amount.</div>';
            return;
        }

        // 2. Network keyword check (mtn/airtel/zamtel)
        let networkKeyword = '';
        if (selectedNetwork === 'mtn') networkKeyword = 'mtn';
        else if (selectedNetwork === 'airtel') networkKeyword = 'airtel';
        else if (selectedNetwork === 'zamtel') networkKeyword = 'zamtel';
        if (!smsLower.includes(networkKeyword)) {
            verifyMessage.innerHTML = `<div class="error-msg">❌ SMS does not contain the network name (${networkKeyword.toUpperCase()}). Please paste the correct SMS.</div>`;
            return;
        }

        // 3. Transaction keyword check (send, sent, received, deposit, paid, transfer, successful, payment)
        const txKeywords = /send|sent|received|deposit|paid|transfer|successful|payment/i;
        if (!txKeywords.test(sms)) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ SMS does not contain a recognised transaction keyword.</div>';
            return;
        }

        // 4. Detect network from SMS and compare with selected network
        const detectedNetwork = detectNetworkFromSms(sms);
        if (detectedNetwork && detectedNetwork !== selectedNetwork) {
            const networkName = { mtn: 'MTN', airtel: 'Airtel', zamtel: 'Zamtel' }[detectedNetwork];
            verifyMessage.innerHTML = `<div class="error-msg">❌ The SMS appears to be from ${networkName}, but you selected ${selectedNetwork.toUpperCase()}. Please select the correct network.</div>`;
            return;
        }

        // 5. Agent name validation (against Firestore or fallback)
        const agentValid = await isAgentNameValid(sms, selectedNetwork);
        if (!agentValid) {
            verifyMessage.innerHTML = `<div class="error-msg">❌ Agent name not found for ${selectedNetwork.toUpperCase()} in the SMS. Please make sure you paid the correct agent.</div>`;
            return;
        }

        // All checks passed – submit deposit
        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const storageRef = storage.ref(`deposits/${user.uid}/${Date.now()}_${screenshotFile.name}`);
            await storageRef.put(screenshotFile);
            const screenshotUrl = await storageRef.getDownloadURL();

            await db.collection('deposits').add({
                userId: user.uid,
                amount: amount,
                paymentMethod: sessionStorage.getItem('depositNetwork'),
                phone: sessionStorage.getItem('depositPhone'),
                screenshotUrl: screenshotUrl,
                status: 'pending',
                userProvidedTimestamp: firebase.firestore.Timestamp.fromDate(transactionTimestamp),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                smsText: sms
            });

            showFireworks();
            verifyMessage.innerHTML = '<div class="success-msg">🎉 Deposit request submitted! Redirecting...</div>';
            setTimeout(() => {
                window.location.href = 'history.html';
            }, 1500);
        } catch (err) {
            console.error(err);
            verifyMessage.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        }
    });

    // Bottom navigation active state
    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'deposit.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
