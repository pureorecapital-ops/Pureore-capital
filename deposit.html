<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deposit | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 1rem 0;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .amount-btn {
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            border-radius: 40px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .amount-btn:hover, .amount-btn.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-color: #2ecc71;
            transform: scale(1.02);
        }
        .custom-amount input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            background: #1E1E2A;
            color: white;
            text-align: center;
        }
        .network-row {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
            margin: 1rem 0;
        }
        .network-option {
            text-align: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 20px;
            flex: 1;
            background: #111116;
            border: 1px solid #2C2C3A;
        }
        .network-option.active {
            border-color: #2ecc71;
            background: rgba(46,204,113,0.1);
            box-shadow: 0 0 10px rgba(46,204,113,0.3);
        }
        .network-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .phone-prefix {
            display: flex;
            align-items: center;
            background: #1E1E2A;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            padding: 0 0.5rem;
        }
        .phone-prefix span { color: #aaa; padding-left: 0.5rem; }
        .phone-prefix input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 0.9rem 0.5rem;
            color: white;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #239b56);
            padding: 1rem;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
        }
        .btn-pay:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .agent-card {
            background: linear-gradient(135deg, #111116, #0D0D12);
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46,204,113,0.4);
        }
        .agent-header { font-size: 0.8rem; color: #aaa; margin-bottom: 0.5rem; }
        .agent-name { font-size: 1.4rem; font-weight: 700; color: #2ecc71; }
        .agent-number {
            font-size: 1.2rem;
            font-family: monospace;
            background: #1A1A24;
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            margin-top: 0.3rem;
        }
        .copy-number {
            background: #2ecc71;
            border: none;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            margin-left: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            color: #0A0A0C;
        }
        .verify-card {
            background: #0F0F14;
            border-radius: 28px;
            padding: 1.2rem;
            margin-top: 0.5rem;
        }
        .section-title { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #ddd; }
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 24px;
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            color: white;
            font-family: monospace;
            resize: vertical;
        }
        .file-upload {
            background: #1E1E2A;
            border: 1px dashed #2ecc71;
            border-radius: 24px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        .file-upload:hover { background: #2a2a36; }
        .file-upload input { display: none; }
        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #2ecc71;
            font-weight: 500;
        }
        .file-name { font-size: 0.8rem; color: #aaa; margin-top: 0.5rem; }
        .datetime-row {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
        }
        .datetime-row input {
            flex: 1;
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            border-radius: 40px;
            padding: 0.7rem;
            color: white;
        }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 0.3rem; }
        .success-msg { color: #2ecc71; text-align: center; font-weight: bold; }
        .loader {
            border: 3px solid #2C2C3A;
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">💰 Deposit to grow your balance</div>

    <!-- Step 1 -->
    <div id="step1Card" class="card">
        <div class="amount-buttons">
            <button class="amount-btn" data-amt="70">70</button>
            <button class="amount-btn" data-amt="250">250</button>
            <button class="amount-btn" data-amt="500">500</button>
            <button class="amount-btn" data-amt="750">750</button>
            <button class="amount-btn" data-amt="910">910</button>
            <button class="amount-btn" data-amt="1000">1000</button>
            <button class="amount-btn" data-amt="1700">1700</button>
            <button class="amount-btn" data-amt="2500">2500</button>
            <button class="amount-btn" data-amt="5000">5000</button>
            <button class="amount-btn" data-amt="10000">10000</button>
            <button class="amount-btn" data-amt="15000">15000</button>
            <button class="amount-btn" data-amt="20000">20000</button>
        </div>
        <div class="custom-amount">
            <input type="number" id="customAmount" placeholder="Or type amount (min 70 ZMW)" min="70">
        </div>
        <div id="amountError" class="error-msg"></div>

        <div class="network-row" id="networkSelect">
            <div class="network-option" data-network="mtn"><img class="network-icon" src="https://i.ibb.co/trWg074/IMG-20260506-091359.jpg" alt="MTN"><div>MTN</div></div>
            <div class="network-option" data-network="airtel"><img class="network-icon" src="https://i.ibb.co/W43DfRZg/IMG-20260506-091347.jpg" alt="Airtel"><div>Airtel</div></div>
            <div class="network-option" data-network="zamtel"><img class="network-icon" src="https://i.ibb.co/b55b6nqX/IMG-20260506-091334.jpg" alt="Zamtel"><div>Zamtel</div></div>
        </div>

        <div class="phone-input">
            <div class="phone-prefix">
                <span>+260</span>
                <input type="tel" id="phoneNumber" placeholder="9 digits (e.g., 963219651)" maxlength="9">
            </div>
        </div>
        <div id="phoneError" class="error-msg"></div>

        <div class="checkbox">
            <input type="checkbox" id="readyToPay">
            <label>✅ I'm ready to pay</label>
        </div>
        <button id="payNowBtn" class="btn-pay" disabled>💸 Pay Now</button>
    </div>

    <!-- Step 2 -->
    <div id="step2Card" class="card hidden">
        <div id="agentInfo"></div>
        <div class="verify-card">
            <div class="section-title">📅 Transaction Date & Time</div>
            <div class="datetime-row">
                <input type="date" id="transactionDate" value="">
                <input type="time" id="transactionTime" value="">
            </div>
            <div class="section-title">📝 Paste your transaction SMS</div>
            <textarea id="smsText" rows="4" placeholder="Paste the SMS from MTN, Airtel or Zamtel here"></textarea>
            <div class="section-title">📸 Upload screenshot of payment</div>
            <div class="file-upload" id="fileUploadTrigger">
                <label class="file-label">📁 Choose screenshot<input type="file" id="screenshotUpload" accept="image/*"></label>
                <div id="fileNameDisplay" class="file-name">No file chosen</div>
            </div>
            <button id="verifyBtn" class="btn-pay" style="margin-top: 1.5rem;">🔍 Verify & Complete</button>
            <div id="verifyMessage"></div>
        </div>
    </div>
</div>
<canvas id="fireworks" class="hidden"></canvas>

<script>
    // ==================== FIREBASE INIT (CORRECTED) ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com", // ✅ fixed
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // Helper: show fireworks
    let fireworksAnimationId = null;
    function showFireworks() {
        const canvas = document.getElementById('fireworks');
        if (!canvas) return;
        if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);
        let particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 1,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let anyAlive = false;
            for (let p of particles) {
                if (p.life <= 0) continue;
                anyAlive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            if (anyAlive) {
                fireworksAnimationId = requestAnimationFrame(animate);
            } else {
                canvas.classList.add('hidden');
                window.removeEventListener('resize', resize);
                fireworksAnimationId = null;
            }
        }
        fireworksAnimationId = requestAnimationFrame(animate);
        setTimeout(() => {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                canvas.classList.add('hidden');
                window.removeEventListener('resize', resize);
            }
        }, 3000);
    }

    // DOM elements
    const step1Card = document.getElementById('step1Card');
    const step2Card = document.getElementById('step2Card');
    const customAmountInput = document.getElementById('customAmount');
    const amountBtns = document.querySelectorAll('.amount-btn');
    const networkOptions = document.querySelectorAll('.network-option');
    const phoneInput = document.getElementById('phoneNumber');
    const readyCheckbox = document.getElementById('readyToPay');
    const payNowBtn = document.getElementById('payNowBtn');
    const amountError = document.getElementById('amountError');
    const phoneError = document.getElementById('phoneError');
    const agentInfoDiv = document.getElementById('agentInfo');
    const smsTextarea = document.getElementById('smsText');
    const screenshotUpload = document.getElementById('screenshotUpload');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyMessage = document.getElementById('verifyMessage');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const transactionDateInput = document.getElementById('transactionDate');
    const transactionTimeInput = document.getElementById('transactionTime');

    let selectedAmount = null;
    let selectedNetwork = null;
    let currentAgent = null;

    // Set default date/time to current moment
    const now = new Date();
    const defaultDate = now.toISOString().split('T')[0];
    const defaultTime = now.toTimeString().slice(0,5);
    transactionDateInput.value = defaultDate;
    transactionTimeInput.value = defaultTime;

    screenshotUpload.addEventListener('change', () => {
        fileNameDisplay.textContent = screenshotUpload.files[0] ? screenshotUpload.files[0].name : 'No file chosen';
    });
    document.getElementById('fileUploadTrigger').addEventListener('click', () => screenshotUpload.click());

    function getFullPhone() {
        const digits = phoneInput.value.trim();
        return digits ? '+260' + digits : '';
    }

    function validatePhone() {
        const digits = phoneInput.value.trim();
        if (!selectedNetwork) return false;
        if (digits.length !== 9 || !/^\d{9}$/.test(digits)) {
            phoneError.innerText = 'Enter exactly 9 digits after +260';
            return false;
        }
        const prefix = digits.substring(0,2);
        let valid = false;
        if (selectedNetwork === 'mtn') valid = (prefix === '96' || prefix === '76');
        else if (selectedNetwork === 'airtel') valid = (prefix === '97' || prefix === '77' || prefix === '57');
        else if (selectedNetwork === 'zamtel') valid = (prefix === '95' || prefix === '75');
        phoneError.innerText = valid ? '' : `Invalid prefix for ${selectedNetwork.toUpperCase()}.`;
        return valid;
    }

    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0,9);
        validatePhone();
        validatePayButton();
    });

    amountBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            selectedAmount = parseInt(btn.dataset.amt);
            customAmountInput.value = selectedAmount;
            amountBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            amountError.innerText = '';
            validatePayButton();
        });
    });

    customAmountInput.addEventListener('input', () => {
        let val = parseFloat(customAmountInput.value);
        if (!isNaN(val) && val >= 70) {
            selectedAmount = val;
            amountBtns.forEach(b => b.classList.remove('active'));
            amountError.innerText = '';
        } else {
            selectedAmount = null;
            if (customAmountInput.value !== '') amountError.innerText = 'Minimum amount is 70 ZMW';
        }
        validatePayButton();
    });

    networkOptions.forEach(opt => {
        opt.addEventListener('click', () => {
            networkOptions.forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            selectedNetwork = opt.dataset.network;
            validatePhone();
            validatePayButton();
        });
    });

    readyCheckbox.addEventListener('change', validatePayButton);

    function validatePayButton() {
        const amountOk = selectedAmount && selectedAmount >= 70;
        const networkOk = selectedNetwork !== null;
        const phoneOk = validatePhone();
        const ready = readyCheckbox.checked;
        payNowBtn.disabled = !(amountOk && networkOk && phoneOk && ready);
    }

    payNowBtn.addEventListener('click', async () => {
        if (payNowBtn.disabled) return;
        sessionStorage.setItem('depositAmount', selectedAmount);
        sessionStorage.setItem('depositNetwork', selectedNetwork);
        sessionStorage.setItem('depositPhone', getFullPhone());
        sessionStorage.setItem('depositPhoneDigits', phoneInput.value);

        let agentHtml = '';
        if (selectedNetwork === 'mtn') {
            const agents = [
                { number: '0961391022', name: 'John Kabwe' },
                { number: '0960338304', name: 'Getrude Sonpo' }
            ];
            const index = Math.floor(Date.now() / 60000) % 2;
            currentAgent = agents[index];
            agentHtml = `<div class="agent-card"><div class="agent-header">📌 AGENT (MTN)</div><div class="agent-name">${currentAgent.name}</div><div><span class="agent-number">${currentAgent.number}</span><button class="copy-number" data-number="${currentAgent.number}">Copy</button></div></div>`;
        } else if (selectedNetwork === 'airtel') {
            currentAgent = { number: '0775552002', name: 'John Kabwe' };
            agentHtml = `<div class="agent-card"><div class="agent-header">📡 AGENT (Airtel)</div><div class="agent-name">${currentAgent.name}</div><div><span class="agent-number">${currentAgent.number}</span><button class="copy-number" data-number="${currentAgent.number}">Copy</button></div></div>`;
        } else if (selectedNetwork === 'zamtel') {
            currentAgent = { number: '0951359357', name: 'Jeremiah Ilunga' };
            agentHtml = `<div class="agent-card"><div class="agent-header">📶 AGENT (Zamtel)</div><div class="agent-name">${currentAgent.name}</div><div><span class="agent-number">${currentAgent.number}</span><button class="copy-number" data-number="${currentAgent.number}">Copy</button></div></div>`;
        }
        agentInfoDiv.innerHTML = agentHtml;
        document.querySelectorAll('.copy-number').forEach(btn => {
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(btn.dataset.number);
                alert('Agent number copied!');
            });
        });
        step1Card.classList.add('hidden');
        step2Card.classList.remove('hidden');
    });

    verifyBtn.addEventListener('click', async () => {
        const sms = smsTextarea.value;
        const screenshotFile = screenshotUpload.files[0];
        const userDate = transactionDateInput.value;
        const userTime = transactionTimeInput.value;
        if (!sms || !screenshotFile) {
            verifyMessage.innerHTML = '<div class="error-msg">Please paste SMS and upload screenshot.</div>';
            return;
        }
        if (!userDate || !userTime) {
            verifyMessage.innerHTML = '<div class="error-msg">Please set the transaction date and time.</div>';
            return;
        }

        const transactionTimestamp = new Date(`${userDate}T${userTime}:00`);
        if (isNaN(transactionTimestamp.getTime())) {
            verifyMessage.innerHTML = '<div class="error-msg">Invalid date/time format.</div>';
            return;
        }

        const nowTime = new Date();
        const hoursDiff = (nowTime - transactionTimestamp) / (1000 * 60 * 60);
        if (hoursDiff > 24) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ This transaction is more than 24 hours old. Please contact support or initiate a new deposit.</div>';
            return;
        }

        verifyMessage.innerHTML = '<div class="loader"></div><div>Verifying...</div>';

        const amount = parseFloat(sessionStorage.getItem('depositAmount'));
        const agent = currentAgent;
        if (!agent) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ Agent data missing. Please go back and select payment method again.</div>';
            return;
        }

        const smsLower = sms.toLowerCase();
        const amountMatch = smsLower.includes(amount.toString());
        const agentMatch = smsLower.includes(agent.name.toLowerCase()) || smsLower.includes(agent.number);
        const hasKeyword = /received|sent|deposit|money|paid|transfer/.test(smsLower);

        if (!amountMatch) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ SMS amount does not match your deposit amount.</div>';
            return;
        }
        if (!agentMatch) {
            verifyMessage.innerHTML = '<div class="error-msg">❌ SMS does not contain the correct agent name or number.</div>';
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        try {
            const storageRef = storage.ref(`deposits/${user.uid}/${Date.now()}_${screenshotFile.name}`);
            await storageRef.put(screenshotFile);
            const screenshotUrl = await storageRef.getDownloadURL();

            await db.collection('deposits').add({
                userId: user.uid,
                amount: amount,
                paymentMethod: sessionStorage.getItem('depositNetwork'),
                phone: sessionStorage.getItem('depositPhone'),
                screenshotUrl: screenshotUrl,
                status: 'pending',
                userProvidedTimestamp: firebase.firestore.Timestamp.fromDate(transactionTimestamp),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            showFireworks();
            verifyMessage.innerHTML = '<div class="success-msg">🎉 Your deposit is successful! Wait for admin approval. Redirecting...</div>';
            setTimeout(() => window.location.href = 'history.html', 3000);
        } catch (err) {
            console.error(err);
            verifyMessage.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        }
    });
</script>
</body>
</html>
