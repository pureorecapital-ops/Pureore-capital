<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>History – Sajvera Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
            background: #000;
        }

        /* ----- FULL SCREEN BLURRED BACKGROUND IMAGE ----- */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMS5Sxbd/file-00000000ec2c820c9d79849d4a3d6b82.png');
            background-size: cover;
            background-position: center;
            filter: blur(14px) brightness(0.25) saturate(0.7);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- HEADER (DARK GLASS) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: #f1f5f9;
            border-radius: 4px;
            transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ----- SLIDE MENU PANEL (GLASS) ----- */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.6);
            padding: 2rem 1.8rem;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            color: #f1f5f9;
            border-left: 1px solid rgba(255, 255, 255, 0.04);
        }

        .menu-panel.open {
            right: 0;
        }

        .menu-panel .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 0.5rem;
            transition: 0.2s;
        }
        .menu-panel .close-btn:hover {
            color: #ffffff;
        }

        .menu-panel .panel-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .menu-panel .panel-header .panel-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .menu-panel .panel-header .panel-email {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.7rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            background: transparent;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            transform: translateX(4px);
        }

        .menu-item .mi-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-item .mi-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-item .mi-label {
            flex: 1;
        }

        .menu-item .mi-arrow {
            color: rgba(255, 255, 255, 0.15);
        }
        .menu-item .mi-arrow svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 0.2rem 0.8rem;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ----- PAGE HEADER ----- */
        .page-header {
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-header h1 span {
            color: #60a5fa;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- TABS (GLASS) ----- */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 0.3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.5rem 0.3rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-align: center;
            min-width: 50px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.04);
        }

        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.4);
        }

        .tab-btn .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            padding: 0 6px;
            font-size: 0.55rem;
            font-weight: 700;
            margin-left: 2px;
            color: rgba(255, 255, 255, 0.15);
        }

        .tab-btn.active .badge {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
        }

        /* ----- TAB CONTENT ----- */
        .tab-content {
            display: none;
            animation: fadeUp 0.3s ease forwards;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- TRANSACTION CARD (GLASS) ----- */
        .tx-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1rem 1.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 0.8rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tx-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .tx-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
        }

        .tx-card .tx-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tx-card .tx-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .tx-card .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tx-card .tx-icon svg {
            width: 20px;
            height: 20px;
            stroke: #60a5fa;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tx-card .tx-amount {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .tx-card .tx-amount.positive {
            color: #4ade80;
        }
        .tx-card .tx-amount.negative {
            color: #f87171;
        }

        .tx-card .tx-status {
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .tx-card .tx-status.pending {
            background: rgba(250, 204, 21, 0.06);
            color: #fbbf24;
            border-color: rgba(250, 204, 21, 0.06);
        }

        .tx-card .tx-status.completed {
            background: rgba(74, 222, 128, 0.06);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.06);
        }

        .tx-card .tx-status.rejected {
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.06);
        }

        .tx-card .tx-status.active {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.06);
        }

        .tx-card .tx-status.paid {
            background: rgba(74, 222, 128, 0.06);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.06);
        }

        .tx-card .tx-status.overdue {
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.06);
        }

        .tx-card .tx-details {
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            line-height: 1.5;
        }

        .tx-card .tx-details span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tx-card .tx-details svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tx-card .tx-details .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        .tx-card .tx-type-badge {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- EMPTY STATE (GLASS) ----- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.8rem;
        }

        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 0.2rem;
        }

        /* ----- BOTTOM NAV (DARK GLASS) ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }

        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        .nav-item:hover .nav-icon {
            stroke: #60a5fa;
        }

        .nav-item.marketplace .nav-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            padding: 4px;
            stroke: #fff;
            margin-bottom: 2px;
        }

        .nav-item.marketplace.active .nav-icon {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .nav-item.marketplace .nav-label {
            color: #60a5fa;
            font-weight: 700;
        }

        /* ----- TOAST (GLASS) ----- */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 500px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .logo-sub {
                font-size: 0.5rem;
            }
            .hamburger span {
                width: 22px;
                height: 2px;
            }
            .menu-panel {
                width: 280px;
                right: -300px;
                padding: 1.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .tx-card .tx-amount {
                font-size: 0.95rem;
            }
            .tx-card .tx-details {
                font-size: 0.7rem;
                gap: 0.4rem;
            }
            .tab-btn {
                font-size: 0.65rem;
                padding: 0.4rem 0.2rem;
                min-width: 40px;
            }
            .tx-card .tx-icon {
                width: 34px;
                height: 34px;
            }
            .tx-card .tx-icon svg {
                width: 17px;
                height: 17px;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item.marketplace .nav-icon {
                width: 30px;
                height: 30px;
            }
        }

        @media (max-width: 400px) {
            .tabs {
                gap: 0.2rem;
                padding: 0.2rem;
            }
            .tab-btn {
                font-size: 0.55rem;
                padding: 0.3rem 0.1rem;
                min-width: 35px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FULL SCREEN BLURRED BACKGROUND ===== -->
    <div class="hero-bg"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo-text">Sajvera<span class="vc">Capital</span></a>
            <span class="logo-sub">powered by <span class="highlight">Pureore Capital</span></span>
        </div>
        <div class="header-right">
            <div class="hamburger" id="hamburger" aria-label="Menu" role="button" tabindex="0">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <!-- ===== SLIDE MENU PANEL (GLASS) ===== -->
    <div class="menu-panel" id="menuPanel">
        <button class="close-btn" id="closeMenu">✕</button>
        <div class="panel-header">
            <div class="panel-name" id="panelName">Loading...</div>
            <div class="panel-email" id="panelEmail">Loading...</div>
        </div>

        <button class="menu-item" onclick="window.location.href='dashboard.html'">
            <span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></span>
            <span class="mi-label">Dashboard</span>
            <span class="mi-arrow"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></span>
        </button>

        <button class="menu-item" onclick="window.location.href='income.html'">
            <span class="mi-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></span>
            <span class="mi-label">Income</span>
            <span class="mi-arrow"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></span>
        </button>

        <button class="menu-item" onclick="window.location.href='chat.html'">
            <span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
            <span class="mi-label">Chat</span>
            <span class="mi-arrow"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></span>
        </button>

        <button class="menu-item" onclick="window.location.href='news.html'">
            <span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg></span>
            <span class="mi-label">News</span>
            <span class="mi-arrow"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></span>
        </button>

        <button class="menu-item" id="changePasswordBtn">

    <!-- ===== BOTTOM NAV (DARK GLASS) ===== -->
    <div class="bottom-nav">

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function formatMoney(amount) {
            return 'K' + parseFloat(amount).toFixed(2);
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString('en-GB', { hour12: false });
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('en-GB');
        }

        function getTxIcon(type) {
            if (type === 'deposit') {
                return `<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`;
            } else if (type === 'withdrawal') {
                return `<svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>`;
            } else if (type === 'loan') {
                return `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`;
            } else if (type === 'bonus') {
                return `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
            }
            return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
        }

        function getStatusClass(status) {
            var s = (status || '').toLowerCase();
            if (s === 'pending') return 'pending';
            if (s === 'completed' || s === 'paid' || s === 'approved') return 'completed';
            if (s === 'rejected' || s === 'failed') return 'rejected';
            if (s === 'active') return 'active';
            if (s === 'overdue') return 'overdue';
            return '';
        }

        function getTypeBadge(type) {
            var map = {
                deposit: 'Deposit',
                withdrawal: 'Withdrawal',
                loan: 'Loan',
                bonus: 'Bonus'
            };
            return map[type] || type;
        }

        function renderTransaction(item, type) {
            var isPositive = (type === 'deposit' || type === 'bonus');
            var amountClass = isPositive ? 'positive' : 'negative';
            var sign = isPositive ? '+' : '-';
            var statusClass = getStatusClass(item.status);
            var iconSvg = getTxIcon(type);

            var detailsHtml = '';
            if (type === 'deposit') {
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> ${item.paymentMethod || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${item.phone || item.cardNumber || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            } else if (type === 'withdrawal') {
                var netAmount = item.netAmount || item.amount;
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M8 2v20"/><path d="M16 2v20"/><path d="M2 8h20"/><path d="M2 16h20"/></svg> ${item.network || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${item.phone || item.cardNumber || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Received: <span class="highlight">${formatMoney(netAmount)}</span></span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            } else if (type === 'loan') {
                var repayTotal = item.repayTotal || item.amount * 1.2;
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> To repay: <span class="highlight">${formatMoney(repayTotal)}</span></span>
                    <span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Due: ${formatDate(item.dueDate)}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            } else if (type === 'bonus') {
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${item.description || 'Bonus'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            }

            return `
                <div class="tx-card">
                    <div class="tx-top">
                        <div class="tx-left">
                            <div class="tx-icon">${iconSvg}</div>
                            <span class="tx-amount ${amountClass}">${sign}${formatMoney(item.amount)}</span>
                            <span class="tx-status ${statusClass}">${(item.status || 'completed').toUpperCase()}</span>
                        </div>
                        <span class="tx-type-badge">${getTypeBadge(type)}</span>
                    </div>
                    <div class="tx-details">
                        ${detailsHtml}
                    </div>
                </div>
            `;
        }

        function renderEmpty(message) {
            return `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <div class="title">${message}</div>
                    <div class="sub">No records found</div>
                </div>
            `;
        }

        // ================================================================
        // STATE
        // ================================================================
        var allData = {
            deposits: [],
            withdrawals: [],
            loans: [],
            bonuses: []
        };

        var unsubs = {
            deposits: null,
            withdrawals: null,
            loans: null,
            bonuses: null
        };

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // RENDER FUNCTIONS
        // ================================================================
        function renderAll() {
            var container = document.getElementById('allList');
            var items = [];
            allData.deposits.forEach(function(d) { items.push({ ...d, _type: 'deposit' }); });
            allData.withdrawals.forEach(function(w) { items.push({ ...w, _type: 'withdrawal' }); });
            allData.loans.forEach(function(l) { items.push({ ...l, _type: 'loan' }); });
            allData.bonuses.forEach(function(b) { items.push({ ...b, _type: 'bonus' }); });
            items.sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });

            if (!items.length) {
                container.innerHTML = renderEmpty('No transactions yet');
                return;
            }

            var html = '';
            for (var i = 0; i < items.length; i++) {
                html += renderTransaction(items[i], items[i]._type);
            }
            container.innerHTML = html;
        }

        function renderDeposits() {
            var container = document.getElementById('depositsList');
            if (!allData.deposits.length) {
                container.innerHTML = renderEmpty('No deposits');
                return;
            }
            var html = '';
            var sorted = allData.deposits.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'deposit');
            }
            container.innerHTML = html;
        }

        function renderWithdrawals() {
            var container = document.getElementById('withdrawalsList');
            if (!allData.withdrawals.length) {
                container.innerHTML = renderEmpty('No withdrawals');
                return;
            }
            var html = '';
            var sorted = allData.withdrawals.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'withdrawal');
            }
            container.innerHTML = html;
        }

        function renderLoans() {
            var container = document.getElementById('loansList');
            if (!allData.loans.length) {
                container.innerHTML = renderEmpty('No loans');
                return;
            }
            var html = '';
            var sorted = allData.loans.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'loan');
            }
            container.innerHTML = html;
        }

        function renderBonuses() {
            var container = document.getElementById('bonusesList');
            if (!allData.bonuses.length) {
                container.innerHTML = renderEmpty('No bonuses');
                return;
            }
            var html = '';
            var sorted = allData.bonuses.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'bonus');
            }
            container.innerHTML = html;
        }

        function updateBadges() {
            var total = allData.deposits.length + allData.withdrawals.length + allData.loans.length + allData.bonuses.length;
            document.getElementById('allBadge').textContent = total;
            document.getElementById('depositsBadge').textContent = allData.deposits.length;
            document.getElementById('withdrawalsBadge').textContent = allData.withdrawals.length;
            document.getElementById('loansBadge').textContent = allData.loans.length;
            document.getElementById('bonusesBadge').textContent = allData.bonuses.length;
        }

        // ================================================================
        // LISTENERS
        // ================================================================
        function listenDeposits(userId) {
            if (unsubs.deposits) unsubs.deposits();
            var q = db.collection('deposits').where('userId', '==', userId);
            unsubs.deposits = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.deposits = docs;
                renderDeposits();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Deposit listener error:', err);
                document.getElementById('depositsList').innerHTML = renderEmpty('Error loading deposits');
            });
        }

        function listenWithdrawals(userId) {
            if (unsubs.withdrawals) unsubs.withdrawals();
            var q = db.collection('withdrawals').where('userId', '==', userId);
            unsubs.withdrawals = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.withdrawals = docs;
                renderWithdrawals();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Withdrawal listener error:', err);
                document.getElementById('withdrawalsList').innerHTML = renderEmpty('Error loading withdrawals');
            });
        }

        function listenLoans(userId) {
            if (unsubs.loans) unsubs.loans();
            var q = db.collection('loans').where('userId', '==', userId);
            unsubs.loans = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.loans = docs;
                renderLoans();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Loan listener error:', err);
                document.getElementById('loansList').innerHTML = renderEmpty('Error loading loans');
            });
        }

        function listenBonuses(userId) {
            if (unsubs.bonuses) unsubs.bonuses();
            var q = db.collection('transactions')
                .where('userId', '==', userId)
                .where('type', '==', 'bonus');
            unsubs.bonuses = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) {
                    var data = doc.data();
                    data.id = doc.id;
                    // Ensure status field exists
                    if (!data.status) data.status = 'completed';
                    docs.push(data);
                });
                allData.bonuses = docs;
                renderBonuses();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Bonus listener error:', err);
                document.getElementById('bonusesList').innerHTML = renderEmpty('Error loading bonuses');
            });
        }

        // ================================================================
        // TABS
        // ================================================================
        var tabBtns = document.querySelectorAll('.tab-btn');
        var tabContents = {
            all: document.getElementById('allTab'),
            deposits: document.getElementById('depositsTab'),
            withdrawals: document.getElementById('withdrawalsTab'),
            loans: document.getElementById('loansTab'),
            bonuses: document.getElementById('bonusesTab')
        };

        tabBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var tabId = this.dataset.tab;
                tabBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.remove('active');
                });
                if (tabContents[tabId]) tabContents[tabId].classList.add('active');
            });
        });

        // ================================================================
        // HAMBURGER MENU
        // ================================================================
        var hamburger = document.getElementById('hamburger');
        var menuPanel = document.getElementById('menuPanel');
        var closeMenu = document.getElementById('closeMenu');

        function toggleMenu() {
            var open = menuPanel.classList.toggle('open');
            hamburger.classList.toggle('active', open);
            document.body.style.overflow = open ? 'hidden' : '';
        }
        hamburger.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menuPanel.classList.contains('open')) toggleMenu();
        });

        // ================================================================
        // FIXED: AUTH STATE WITH PROPER INITIALIZATION HANDLING
        // ================================================================
        let authResolved = false;
        let redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                watchBlockStatus(user.uid);
                listenDeposits(user.uid);
                listenWithdrawals(user.uid);
                listenLoans(user.uid);
                listenBonuses(user.uid);

                // Update panel name
                db.collection('users').doc(user.uid).get().then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        var fullName = data.fullName || 'User';
                        var email = data.email || user.email;
                        document.getElementById('panelName').textContent = fullName;
                        document.getElementById('panelEmail').textContent = email;
                    }
                }).catch(console.warn);
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // LOGOUT
        // ================================================================
        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            }).catch(function(err) {
                console.warn('Logout error:', err);
                window.location.href = 'login.html';
            });
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'history.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✅ history.html · Sajvera Capital · Blue glassmorphism design');
        console.log('📜 All transactions including registration bonuses');
        console.log('📱 Bottom Nav: Home | Market | Team | History | Me');
        console.log('✅ Fixed: auth state now waits 2s before redirecting to login');
    </script>
