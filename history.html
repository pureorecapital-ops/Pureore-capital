<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>History – PC • Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- TABS ----- */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            background: rgba(10, 8, 21, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 0.3rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.5rem 0.3rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-align: center;
            min-width: 60px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            color: #fff;
            box-shadow: 0 4px 20px var(--violet-glow);
        }

        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.6);
        }

        .tab-btn .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 0 6px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: 2px;
            color: rgba(255, 255, 255, 0.4);
        }

        .tab-btn.active .badge {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* ----- TAB CONTENT ----- */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- TRANSACTION CARD (glass) ----- */
        .tx-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-card);
            margin-bottom: 0.8rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .tx-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .tx-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .tx-card .tx-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tx-card .tx-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .tx-card .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tx-card .tx-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--cyan);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tx-card .tx-amount {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .tx-card .tx-amount.positive {
            color: var(--green);
        }
        .tx-card .tx-amount.negative {
            color: var(--red);
        }

        .tx-card .tx-status {
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .tx-card .tx-status.pending {
            background: rgba(246, 201, 110, 0.08);
            color: var(--gold);
            border-color: rgba(246, 201, 110, 0.15);
        }

        .tx-card .tx-status.completed {
            background: rgba(74, 222, 128, 0.08);
            color: var(--green);
            border-color: rgba(74, 222, 128, 0.15);
        }

        .tx-card .tx-status.rejected {
            background: rgba(239, 68, 68, 0.08);
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .tx-card .tx-status.active {
            background: rgba(93, 217, 242, 0.08);
            color: var(--cyan);
            border-color: rgba(93, 217, 242, 0.15);
        }

        .tx-card .tx-status.paid {
            background: rgba(74, 222, 128, 0.08);
            color: var(--green);
            border-color: rgba(74, 222, 128, 0.15);
        }

        .tx-card .tx-status.overdue {
            background: rgba(239, 68, 68, 0.08);
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .tx-card .tx-details {
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            line-height: 1.5;
        }

        .tx-card .tx-details span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tx-card .tx-details svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tx-card .tx-details .highlight {
            color: var(--gold);
            font-weight: 600;
        }

        .tx-card .tx-type-badge {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.8rem;
        }

        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 0.2rem;
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .tx-card .tx-amount {
                font-size: 0.95rem;
            }
            .tx-card .tx-details {
                font-size: 0.7rem;
                gap: 0.4rem;
            }
            .tab-btn {
                font-size: 0.65rem;
                padding: 0.4rem 0.2rem;
                min-width: 50px;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .tx-card .tx-icon {
                width: 34px;
                height: 34px;
            }
            .tx-card .tx-icon svg {
                width: 17px;
                height: 17px;
            }
        }

        @media (max-width: 400px) {
            .tabs {
                gap: 0.2rem;
                padding: 0.2rem;
            }
            .tab-btn {
                font-size: 0.55rem;
                padding: 0.3rem 0.1rem;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",

            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function formatMoney(amount) {
            return 'K' + parseFloat(amount).toFixed(2);
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString('en-GB', { hour12: false });
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('en-GB');
        }

        function getTxIcon(type) {
            if (type === 'deposit') {
                return `<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`;
            } else if (type === 'withdrawal') {
                return `<svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>`;
            } else if (type === 'loan') {
                return `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`;
            }
            return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
        }

        function getStatusClass(status) {
            var s = (status || '').toLowerCase();
            if (s === 'pending') return 'pending';
            if (s === 'completed' || s === 'paid' || s === 'approved') return 'completed';
            if (s === 'rejected' || s === 'failed') return 'rejected';
            if (s === 'active') return 'active';
            if (s === 'overdue') return 'overdue';
            return '';
        }

        function getTypeBadge(type) {
            var map = {
                deposit: 'Deposit',
                withdrawal: 'Withdrawal',
                loan: 'Loan'
            };
            return map[type] || type;
        }

        function renderTransaction(item, type) {
            var isPositive = (type === 'deposit');
            var amountClass = isPositive ? 'positive' : 'negative';
            var sign = isPositive ? '+' : '-';
            var statusClass = getStatusClass(item.status);
            var iconSvg = getTxIcon(type);

            var detailsHtml = '';
            if (type === 'deposit') {
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> ${item.paymentMethod || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${item.phone || item.cardNumber || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            } else if (type === 'withdrawal') {
                var netAmount = item.netAmount || item.amount;
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M8 2v20"/><path d="M16 2v20"/><path d="M2 8h20"/><path d="M2 16h20"/></svg> ${item.network || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${item.phone || item.cardNumber || 'N/A'}</span>
                    <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Received: <span class="highlight">${formatMoney(netAmount)}</span></span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            } else if (type === 'loan') {
                var repayTotal = item.repayTotal || item.amount * 1.2;
                detailsHtml = `
                    <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> To repay: <span class="highlight">${formatMoney(repayTotal)}</span></span>
                    <span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Due: ${formatDate(item.dueDate)}</span>
                    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDateTime(item.createdAt)}</span>
                `;
            }

            return `
                <div class="tx-card">
                    <div class="tx-top">
                        <div class="tx-left">
                            <div class="tx-icon">${iconSvg}</div>
                            <span class="tx-amount ${amountClass}">${sign}${formatMoney(item.amount)}</span>
                            <span class="tx-status ${statusClass}">${(item.status || 'pending').toUpperCase()}</span>
                        </div>
                        <span class="tx-type-badge">${getTypeBadge(type)}</span>
                    </div>
                    <div class="tx-details">
                        ${detailsHtml}
                    </div>
                </div>
            `;
        }

        function renderEmpty(message) {
            return `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <div class="title">${message}</div>
                    <div class="sub">No records found</div>
                </div>
            `;
        }

        // ================================================================
        // STATE
        // ================================================================
        var allData = {
            deposits: [],
            withdrawals: [],
            loans: []
        };

        var unsubs = {
            deposits: null,
            withdrawals: null,
            loans: null
        };

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // RENDER FUNCTIONS
        // ================================================================
        function renderAll() {
            var container = document.getElementById('allList');
            var items = [];
            allData.deposits.forEach(function(d) { items.push({ ...d, _type: 'deposit' }); });
            allData.withdrawals.forEach(function(w) { items.push({ ...w, _type: 'withdrawal' }); });
            allData.loans.forEach(function(l) { items.push({ ...l, _type: 'loan' }); });
            items.sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });

            if (!items.length) {
                container.innerHTML = renderEmpty('No transactions yet');
                return;
            }

            var html = '';
            for (var i = 0; i < items.length; i++) {
                html += renderTransaction(items[i], items[i]._type);
            }
            container.innerHTML = html;
        }

        function renderDeposits() {
            var container = document.getElementById('depositsList');
            if (!allData.deposits.length) {
                container.innerHTML = renderEmpty('No deposits');
                return;
            }
            var html = '';
            var sorted = allData.deposits.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'deposit');
            }
            container.innerHTML = html;
        }

        function renderWithdrawals() {
            var container = document.getElementById('withdrawalsList');
            if (!allData.withdrawals.length) {
                container.innerHTML = renderEmpty('No withdrawals');
                return;
            }
            var html = '';
            var sorted = allData.withdrawals.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'withdrawal');
            }
            container.innerHTML = html;
        }

        function renderLoans() {
            var container = document.getElementById('loansList');
            if (!allData.loans.length) {
                container.innerHTML = renderEmpty('No loans');
                return;
            }
            var html = '';
            var sorted = allData.loans.slice().sort(function(a, b) {
                return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
            });
            for (var i = 0; i < sorted.length; i++) {
                html += renderTransaction(sorted[i], 'loan');
            }
            container.innerHTML = html;
        }

        function updateBadges() {
            document.getElementById('allBadge').textContent = allData.deposits.length + allData.withdrawals.length + allData
            .loans.length;
            document.getElementById('depositsBadge').textContent = allData.deposits.length;
            document.getElementById('withdrawalsBadge').textContent = allData.withdrawals.length;
            document.getElementById('loansBadge').textContent = allData.loans.length;
        }

        // ================================================================
        // LISTENERS
        // ================================================================
        function listenDeposits(userId) {
            if (unsubs.deposits) unsubs.deposits();
            var q = db.collection('deposits').where('userId', '==', userId);
            unsubs.deposits = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.deposits = docs;
                renderDeposits();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Deposit listener error:', err);
                document.getElementById('depositsList').innerHTML = renderEmpty('Error loading deposits');
            });
        }

        function listenWithdrawals(userId) {
            if (unsubs.withdrawals) unsubs.withdrawals();
            var q = db.collection('withdrawals').where('userId', '==', userId);
            unsubs.withdrawals = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.withdrawals = docs;
                renderWithdrawals();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Withdrawal listener error:', err);
                document.getElementById('withdrawalsList').innerHTML = renderEmpty('Error loading withdrawals');
            });
        }

        function listenLoans(userId) {
            if (unsubs.loans) unsubs.loans();
            var q = db.collection('loans').where('userId', '==', userId);
            unsubs.loans = q.onSnapshot(function(snapshot) {
                var docs = [];
                snapshot.forEach(function(doc) { docs.push({ id: doc.id, ...doc.data() }); });
                allData.loans = docs;
                renderLoans();
                renderAll();
                updateBadges();
            }, function(err) {
                console.error('Loan listener error:', err);
                document.getElementById('loansList').innerHTML = renderEmpty('Error loading loans');
            });
        }

        // ================================================================
        // TABS
        // ================================================================
        var tabBtns = document.querySelectorAll('.tab-btn');
        var tabContents = {
            all: document.getElementById('allTab'),
            deposits: document.getElementById('depositsTab'),
            withdrawals: document.getElementById('withdrawalsTab'),
            loans: document.getElementById('loansTab')
        };

        tabBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var tabId = this.dataset.tab;
                tabBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.remove('active');
                });
                if (tabContents[tabId]) tabContents[tabId].classList.add('active');
            });
        });

        // ================================================================
        // AUTH
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);
            listenDeposits(user.uid);
            listenWithdrawals(user.uid);
            listenLoans(user.uid);
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'history.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · History (unique design)');
        console.log('📜 All transactions in one place');
        console.log('🔐 Firebase config untouched');
    </script>

    <!-- ===== TOAST STYLES (inline) ===== -->
    <style>
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
    </style>

</body>
</html>
