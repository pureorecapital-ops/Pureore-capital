    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .total-hourly {
            background: rgba(18,18,24,0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(241,196,15,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .total-hourly span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f1c40f;
        }
        .claim-all-btn {
            background: linear-gradient(135deg, #2ecc71, #239b56);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .claim-all-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
        }
        .claim-all-btn:hover:not(:disabled) {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
        .warning-block {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            border-radius: 20px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
            color: #ef4444;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            background: #111116;
            border-radius: 60px;
            padding: 0.3rem;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.6rem;
            border-radius: 50px;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .plan-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
            transition: 0.2s;
        }
        .plan-card:hover {
            border-color: #f1c40f;
            transform: translateY(-2px);
        }
        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .plan-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1c40f;
        }
        .plan-amount {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2ecc71;
        }
        .plan-details {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            color: #ccc;
            flex-wrap: wrap;
        }
        .claim-info {
            margin: 0.8rem 0;
        }
        .progress-bar {
            background: #2C2C3A;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #f1c40f);
            width: 0%;
            height: 100%;
            border-radius: 20px;
        }
        .progress-text {
            font-size: 0.75rem;
            color: #aaa;
            text-align: right;
        }
        .pending-amount {
            font-size: 0.9rem;
            font-weight: bold;
            color: #2ecc71;
            margin-top: 0.3rem;
        }
        .claim-btn {
            background: #ef4444;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .claim-btn.active {
            background: linear-gradient(135deg, #2ecc71, #239b56);
            cursor: pointer;
        }
        .claim-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .weekend-warning {
            font-size: 0.7rem;
            color: #f1c40f;
            margin-top: 0.3rem;
            text-align: center;
        }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover {
            transform: translateY(-3px);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label {
            color: #2ecc71;
        }
        @media (max-width: 600px) {
            .animated-title { font-size: 1.5rem; }
            .plan-name { font-size: 1rem; }
            .total-hourly span { font-size: 1.4rem; }
            .total-hourly { flex-direction: column; align-items: stretch; }
            .claim-all-btn { width: 100%; }
        }
    </style>
</head>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    db.settings({ persistence: false });
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    function formatMoney(amount) {
        return 'K' + parseFloat(amount).toFixed(2);
    }

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '90px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = isError ? '#ef4444' : '#2ecc71';
        toast.style.color = 'white';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '40px';
        toast.style.zIndex = '9999';
        toast.style.fontWeight = 'bold';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
    }

    function addWeekdays(startDate, days) {
        let result = new Date(startDate);
        let added = 0;
        while (added < days) {
            result.setDate(result.getDate() + 1);
            if (!isWeekend(result)) added++;
        }
        return result;
    }

    // ========== FIXED: Pause elapsed days when blocked ==========
    function businessDaysElapsed(inv, now) {
        // If the investment has a blockedStart timestamp, cap elapsed days at that moment
        let endDate = now;
        if (inv.blockedStart) {
            // Use the blockedStart timestamp as the cutoff
            const blockedDate = inv.blockedStart.toDate ? inv.blockedStart.toDate() : new Date(inv.blockedStart);
            // If blockedStart is in the future (should not happen), treat it as now
            if (blockedDate < now) {
                endDate = blockedDate;
            }
        }
        let count = 0;
        let current = new Date(inv.startDate);
        current.setDate(current.getDate() + 1); // start from the day after startDate
        while (current <= endDate) {
            if (!isWeekend(current)) count++;
            current.setDate(current.getDate() + 1);
        }
        return count;
    }

    function getClaimStatus(inv, now) {
        const lastClaim = inv.lastClaimed ? inv.lastClaimed.toDate() : inv.startDate.toDate();
        const hoursSince = (now - lastClaim) / (1000 * 60 * 60);
        const dailyAmount = inv.dailyAmount;
        const hourlyRate = dailyAmount / 24;
        const earnedSoFar = Math.min(dailyAmount, hourlyRate * hoursSince);
        const available = (!isWeekend(now) && hoursSince >= 24);
        const hoursRemaining = Math.max(0, 24 - hoursSince);
        return { available, hoursSince, dailyAmount, earnedSoFar, hoursRemaining };
    }

    let currentUserId = null;
    let refreshInterval = null;
    let currentInvestments = [];
    let claimingBlocked = false;
    let userBlockListener = null; // listener for block status

    window.addEventListener('beforeunload', () => {
        if (refreshInterval) clearInterval(refreshInterval);
        if (userBlockListener) userBlockListener();
    });

    // ========== REAL‑TIME BLOCK CHECK ==========
    function watchBlockStatus(userId) {
        if (userBlockListener) userBlockListener();
        userBlockListener = db.collection('users').doc(userId)
            .onSnapshot((doc) => {
                if (doc.exists && doc.data().isBlocked === true) {
                    // User is blocked – log them out and redirect
                    showToast('⚠️ Your account has been blocked. You will be redirected to login.', true);
                    setTimeout(async () => {
                        await auth.signOut();
                        window.location.href = 'login.html';
                    }, 2000);
                }
            }, (err) => {
                console.warn('Block listener error:', err);
            });
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUserId = user.uid;
        // Start watching for block status
        watchBlockStatus(currentUserId);
        await loadInvestments();
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            const normalTab = document.getElementById('normalTab');
            if (normalTab && normalTab.classList.contains('active')) {
                loadInvestments();
            }
        }, 60000);
    });

    // ========== Block check ==========
    function isClaimingBlocked(activeInvestments) {
        if (activeInvestments.length >= 2) return false;
        if (activeInvestments.length === 0) return false;
        const now = new Date();
        for (const inv of activeInvestments) {
            // Use the paused-aware elapsed days function
            const elapsedDays = businessDaysElapsed(inv, now);
            const totalDays = inv.businessDays;
            const daysLeft = Math.max(0, totalDays - elapsedDays);
            if (daysLeft <= 2) return true;
        }
        return false;
    }

    // ========== Update blockedStart timestamps in Firestore ==========
    async function updateBlockedState(activeInvestments, blocked, now) {
        if (!currentUserId) return;
        const batch = db.batch();
        let anyChange = false;

        for (const inv of activeInvestments) {
            const ref = db.collection('investments').doc(inv.id);
            if (blocked) {
                // If blocking and no blockedStart yet, set it
                if (!inv.blockedStart) {
                    batch.update(ref, { blockedStart: firebase.firestore.Timestamp.fromDate(now) });
                    anyChange = true;
                }
            } else {
                // If not blocked and blockedStart exists, remove it
                if (inv.blockedStart) {
                    batch.update(ref, { blockedStart: firebase.firestore.FieldValue.delete() });
                    anyChange = true;
                }
            }
        }
        if (anyChange) {
            try {
                await batch.commit();
                console.log('Blocked state updated in Firestore');
            } catch (err) {
                console.warn('Error updating blocked state:', err);
            }
        }
    }

    async function loadInvestments() {
        if (!currentUserId) return;
        try {
            const snapshot = await db.collection('investments')
                .where('userId', '==', currentUserId)
                .get();

            const investments = [];
            snapshot.forEach(doc => {
                investments.push({ id: doc.id, ...doc.data() });
            });
            investments.sort((a, b) => (b.startDate?.toMillis() || 0) - (a.startDate?.toMillis() || 0));

            const active = [];
            const expired = [];
            const now = new Date();

            for (const inv of investments) {
                const startDate = inv.startDate.toDate();
                const businessDays = inv.businessDays || inv.days;
                const endDate = inv.businessEndDate ? inv.businessEndDate.toDate() : addWeekdays(startDate, businessDays);
                const dailyAmount = inv.dailyReturn;
                const today = new Date();
                today.setHours(0,0,0,0);
                const isExpired = inv.status !== 'active' || today > endDate;

                const investment = {
                    id: inv.id,
                    ...inv,
                    startDate,
                    businessDays,
                    endDate,
                    dailyAmount,
                    status: inv.status,
                    lastClaimed: inv.lastClaimed,
                    blockedStart: inv.blockedStart
                };
                if (!isExpired) {
                    active.push(investment);
                } else {
                    expired.push(investment);
                }
            }

            // Determine if claiming should be blocked
            const blocked = isClaimingBlocked(active);
            claimingBlocked = blocked;

            // Update blockedStart timestamps in Firestore (pause/resume)
            await updateBlockedState(active, blocked, now);

            // Re‑fetch active investments after potential changes? Not needed, but we could reload.
            // However, since we may have updated blockedStart, we need to refresh the list.
            // We can simply re-run the loop to get fresh data, but to avoid infinite loop, we'll reload once.
            // Actually, the state update is asynchronous and the next refresh will pick it up.
            // For immediate consistency, we can update the local investment objects with the new blockedStart.
            // I'll just reload the page's data after a short delay, or let the next interval handle it.
            // For simplicity, I'll re-query the investments to reflect the new blockedStart values.
            // But that could cause a loop. Better: we set the local inv.blockedStart after batch commit.
            // Since we already have the active investments, we can update them in memory.
            // We'll just proceed with the current data.

            // Now render with the updated data
            currentInvestments = active;
            renderActive(active);
            renderExpired(expired);
            updateTotalPendingAndClaimAll(active);
            // Show/hide warning banner
            const warningDiv = document.getElementById('claimBlockWarning');
            if (warningDiv) {
                warningDiv.style.display = claimingBlocked ? 'block' : 'none';
            }
        } catch (err) {
            console.error("Error loading investments:", err);
            const container = document.getElementById('activeInvestments');
            if (container) container.innerHTML = '<div class="empty-msg">Error loading investments. Please refresh.</div>';
        }
    }

    function renderActive(investments) {
        const container = document.getElementById('activeInvestments');
        if (!container) return;
        if (!investments.length) {
            container.innerHTML = '<div class="empty-msg">📭 No active investment plans.</div>';
            return;
        }
        const now = new Date();
        let html = '';
        for (const inv of investments) {
            // Use paused-aware elapsed days
            const elapsedDays = businessDaysElapsed(inv, now);
            const totalDays = inv.businessDays;
            const daysLeft = Math.max(0, totalDays - elapsedDays);

            const claimStatus = getClaimStatus(inv, now);
            let canClaim = claimStatus.available;
            if (claimingBlocked) canClaim = false;
            const hoursRemaining = claimStatus.hoursRemaining;
            const earnedSoFar = claimStatus.earnedSoFar;
            const dailyAmount = claimStatus.dailyAmount;
            const progressPercent = claimStatus.hoursSince >= 24 ? 100 : (claimStatus.hoursSince / 24) * 100;

            html += `
                <div class="plan-card" data-id="${inv.id}">
                    <div class="plan-header">
                        <span class="plan-name">${escapeHtml(inv.planName)}</span>
                        <span class="plan-amount">${formatMoney(inv.investAmount)}</span>
                    </div>
                    <div class="plan-details">
                        <span>📅 Started: ${inv.startDate.toLocaleDateString()}</span>
                        <span>💰 Daily: ${formatMoney(dailyAmount)}</span>
                        <span>⏱️ Days left: ${daysLeft}</span>
                    </div>
                    <div class="claim-info">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercent}%;"></div>
                        </div>
                        <div class="progress-text">
                            ${canClaim ? '✓ Ready to claim' : (claimingBlocked ? '⛔ Claiming paused – buy another plan' : `⏱️ Next claim in ${Math.floor(hoursRemaining)}h ${Math.floor((hoursRemaining % 1) * 60)}m`)}
                        </div>
                        <div class="pending-amount">
                            💰 Earned so far: ${formatMoney(earnedSoFar)} / ${formatMoney(dailyAmount)}
                        </div>
                    </div>
                    <button class="claim-btn ${canClaim ? 'active' : ''}" ${canClaim ? '' : 'disabled'} data-id="${inv.id}" data-daily="${dailyAmount}">
                        ${canClaim ? '💰 Claim Daily Income' : (claimingBlocked ? '⛔ Paused' : '⏳ Wait for next claim')}
                    </button>
                    ${isWeekend(now) ? '<div class="weekend-warning">⛔ Claiming only available Monday–Friday. Come back on a weekday.</div>' : ''}
                </div>
            `;
        }
        container.innerHTML = html;

        document.querySelectorAll('.claim-btn.active').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const invId = btn.dataset.id;
                const dailyAmount = parseFloat(btn.dataset.daily);
                await claimDailyIncome(invId, dailyAmount, true);
            });
        });
    }

    async function claimDailyIncome(investmentId, dailyAmount, refreshAfter = true) {
        const user = auth.currentUser;
        if (!user) return false;
        const now = new Date();
        if (isWeekend(now)) {
            showToast('❌ Daily income can only be claimed on weekdays (Monday–Friday).', true);
            return false;
        }
        if (claimingBlocked) {
            showToast('❌ Claiming is paused because you have only one active plan and it ends in 2 days or less. Please purchase another plan first.', true);
            return false;
        }
        try {
            await db.runTransaction(async (transaction) => {
                const invRef = db.collection('investments').doc(investmentId);
                const invSnap = await transaction.get(invRef);
                if (!invSnap.exists) throw new Error('Investment not found');
                const invData = invSnap.data();
                const lastClaim = invData.lastClaimed ? invData.lastClaimed.toDate() : invData.startDate.toDate();
                const hoursSince = (now - lastClaim) / (1000 * 60 * 60);
                if (hoursSince < 24) throw new Error('Not yet 24 hours since last claim');

                const userRef = db.collection('users').doc(user.uid);
                const userSnap = await transaction.get(userRef);
                const newBalance = (userSnap.data().balance || 0) + dailyAmount;
                transaction.update(userRef, { balance: newBalance });
                transaction.update(invRef, { lastClaimed: firebase.firestore.FieldValue.serverTimestamp() });

                const txRef = db.collection('transactions').doc();
                transaction.set(txRef, {
                    userId: user.uid,
                    type: 'daily_income',
                    amount: dailyAmount,
                    description: `Daily income from ${invData.planName}`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            showToast(`✅ ${formatMoney(dailyAmount)} claimed!`, false);
            if (refreshAfter) await loadInvestments();
            return true;
        } catch (err) {
            showToast(err.message || 'Claim failed', true);
            return false;
        }
    }

    async function claimAllAvailable() {
        const user = auth.currentUser;
        if (!user) return;
        const now = new Date();
        if (isWeekend(now)) {
            showToast('❌ Daily income can only be claimed on weekdays (Monday–Friday).', true);
            return;
        }
        if (claimingBlocked) {
            showToast('❌ Claiming is paused because you have only one active plan and it ends in 2 days or less. Please purchase another plan first.', true);
            return;
        }

        const claimable = [];
        for (const inv of currentInvestments) {
            const status = getClaimStatus(inv, now);
            if (status.available) {
                claimable.push({ id: inv.id, dailyAmount: status.dailyAmount });
            }
        }

        if (claimable.length === 0) {
            showToast('No pending earnings to claim.', true);
            return;
        }

        const claimBtn = document.getElementById('claimAllBtn');
        claimBtn.disabled = true;
        claimBtn.innerText = 'Claiming...';

        let totalClaimed = 0;
        let successCount = 0;
        for (const item of claimable) {
            const success = await claimDailyIncome(item.id, item.dailyAmount, false);
            if (success) {
                totalClaimed += item.dailyAmount;
                successCount++;
            }
        }

        await loadInvestments();
        if (successCount > 0) {
            showToast(`✅ Claimed ${formatMoney(totalClaimed)} from ${successCount} investment(s)!`, false);
        } else {
            showToast('No claims were successful. Please try again.', true);
        }
        claimBtn.disabled = false;
        claimBtn.innerText = '💰 Claim All Available';
    }

    function updateTotalPendingAndClaimAll(investments) {
        const now = new Date();
        let total = 0;
        let hasClaimable = false;
        for (const inv of investments) {
            const claimStatus = getClaimStatus(inv, now);
            if (claimStatus.available && !claimingBlocked) {
                total += claimStatus.dailyAmount;
                hasClaimable = true;
            }
        }
        const totalSpan = document.getElementById('totalPending');
        if (totalSpan) totalSpan.innerText = total.toFixed(2);
        
        const claimAllBtn = document.getElementById('claimAllBtn');
        if (claimAllBtn) {
            claimAllBtn.disabled = isWeekend(now) || !hasClaimable || claimingBlocked;
        }
    }

    function renderExpired(investments) {
        const container = document.getElementById('expiredInvestments');
        if (!container) return;
        if (!investments.length) {
            container.innerHTML = '<div class="empty-msg">📭 No expired or completed plans.</div>';
            return;
        }
        let html = '';
        for (const inv of investments) {
            const statusText = inv.status === 'completed' ? 'Completed' : 'Expired';
            html += `
                <div class="plan-card">
                    <div class="plan-header">
                        <span class="plan-name">${escapeHtml(inv.planName)}</span>
                        <span class="plan-amount">${formatMoney(inv.investAmount)}</span>
                    </div>
                    <div class="plan-details">
                        <span>📅 Started: ${inv.startDate.toLocaleDateString()}</span>
                        <span>💰 Daily: ${formatMoney(inv.dailyReturn)}</span>
                        <span>⏱️ Status: ${statusText}</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabs = {
        normal: document.getElementById('normalTab'),
        expired: document.getElementById('expiredTab')
    };
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Object.values(tabs).forEach(tab => tab.classList.remove('active'));
            if (tabs[tabId]) tabs[tabId].classList.add('active');
            if (tabId === 'normal') loadInvestments();
        });
    });

    document.getElementById('claimAllBtn')?.addEventListener('click', claimAllAvailable);

    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'income.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
