<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Income | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .total-hourly {
            background: rgba(18,18,24,0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(241,196,15,0.4);
        }
        .total-hourly span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f1c40f;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            background: #111116;
            border-radius: 60px;
            padding: 0.3rem;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.6rem;
            border-radius: 50px;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .plan-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
            transition: 0.2s;
        }
        .plan-card:hover {
            border-color: #f1c40f;
            transform: translateY(-2px);
        }
        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .plan-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1c40f;
        }
        .plan-amount {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2ecc71;
        }
        .plan-details {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            color: #ccc;
            flex-wrap: wrap;
        }
        .claim-info {
            margin: 0.8rem 0;
        }
        .progress-bar {
            background: #2C2C3A;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #f1c40f);
            width: 0%;
            height: 100%;
            border-radius: 20px;
        }
        .progress-text {
            font-size: 0.75rem;
            color: #aaa;
            text-align: right;
        }
        .pending-amount {
            font-size: 0.9rem;
            font-weight: bold;
            color: #2ecc71;
            margin-top: 0.3rem;
        }
        .claim-btn {
            background: #ef4444;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .claim-btn.active {
            background: linear-gradient(135deg, #2ecc71, #239b56);
            cursor: pointer;
        }
        .claim-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .weekend-warning {
            font-size: 0.7rem;
            color: #f1c40f;
            margin-top: 0.3rem;
            text-align: center;
        }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover {
            transform: translateY(-3px);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label {
            color: #2ecc71;
        }
        @media (max-width: 600px) {
            .animated-title { font-size: 1.5rem; }
            .plan-name { font-size: 1rem; }
            .total-hourly span { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">💰 INCOME</div>

    <!-- Total pending (daily earnings ready to claim) -->
    <div class="total-hourly" id="totalHourlyBox">
        📈 Total pending daily earnings: <span id="totalPending">0.00</span> ZMW
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="normal">📈 Active</button>
        <button class="tab-btn" data-tab="expired">⏰ Expired</button>
    </div>

    <div id="normalTab" class="tab-content active">
        <div id="activeInvestments"></div>
    </div>
    <div id="expiredTab" class="tab-content">
        <div id="expiredInvestments"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item" data-page="dashboard.html">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="mkvip.html">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" data-page="jproduct.html">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" data-page="income.html">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" data-page="team.html">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" data-page="me.html">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<script>
    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // 🔥 DISABLE OFFLINE PERSISTENCE – No cached data
    db.settings({ persistence: false });
    
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // Helper functions
    function formatMoney(amount) {
        return 'K' + parseFloat(amount).toFixed(2);
    }

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '90px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = isError ? '#ef4444' : '#2ecc71';
        toast.style.color = 'white';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '40px';
        toast.style.zIndex = '9999';
        toast.style.fontWeight = 'bold';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
    }

    function addWeekdays(startDate, days) {
        let result = new Date(startDate);
        let added = 0;
        while (added < days) {
            result.setDate(result.getDate() + 1);
            if (!isWeekend(result)) added++;
        }
        return result;
    }

    function businessDaysElapsed(startDate, endDate) {
        let count = 0;
        let current = new Date(startDate);
        while (current <= endDate) {
            if (!isWeekend(current)) count++;
            current.setDate(current.getDate() + 1);
        }
        return count;
    }

    function getClaimStatus(inv, now) {
        const lastClaim = inv.lastClaimed ? inv.lastClaimed.toDate() : inv.startDate.toDate();
        const hoursSince = (now - lastClaim) / (1000 * 60 * 60);
        const available = (!isWeekend(now) && hoursSince >= 24);
        const nextClaimDate = new Date(lastClaim.getTime() + 24 * 60 * 60 * 1000);
        return { available, hoursSince, dailyAmount: inv.dailyAmount, nextClaimDate };
    }

    let currentUserId = null;
    let refreshInterval = null;

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
        if (refreshInterval) clearInterval(refreshInterval);
    });

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUserId = user.uid;
        await loadInvestments();
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            const normalTab = document.getElementById('normalTab');
            if (normalTab && normalTab.classList.contains('active')) {
                loadInvestments();
            }
        }, 60000);
    });

    async function loadInvestments() {
        if (!currentUserId) return;
        const snapshot = await db.collection('investments')
            .where('userId', '==', currentUserId)
            .orderBy('startDate', 'desc')
            .get();

        const active = [];
        const expired = [];
        const now = new Date();

        for (const doc of snapshot.docs) {
            const inv = doc.data();
            const startDate = inv.startDate.toDate();
            const businessDays = inv.businessDays || inv.days;
            const endDate = inv.businessEndDate ? inv.businessEndDate.toDate() : addWeekdays(startDate, businessDays);
            const dailyAmount = inv.investAmount * (inv.dailyReturn / 100);
            const today = new Date();
            today.setHours(0,0,0,0);
            const isExpired = inv.status !== 'active' || today > endDate;

            const investment = {
                id: doc.id,
                ...inv,
                startDate,
                businessDays,
                endDate,
                dailyAmount,
                status: inv.status,
                lastClaimed: inv.lastClaimed
            };
            if (!isExpired) {
                active.push(investment);
            } else {
                expired.push(investment);
            }
        }

        renderActive(active);
        renderExpired(expired);
        updateTotalPending(active);
    }

    function renderActive(investments) {
        const container = document.getElementById('activeInvestments');
        if (!container) return;
        if (!investments.length) {
            container.innerHTML = '<div class="empty-msg">📭 No active investment plans.</div>';
            return;
        }
        const now = new Date();
        let html = '';
        for (const inv of investments) {
            const elapsedDays = businessDaysElapsed(inv.startDate, now);
            const totalDays = inv.businessDays;
            const daysLeft = Math.max(0, totalDays - elapsedDays);

            const claimStatus = getClaimStatus(inv, now);
            const canClaim = claimStatus.available;
            const hoursSince = claimStatus.hoursSince;
            const hoursToNext = Math.max(0, 24 - hoursSince);

            html += `
                <div class="plan-card" data-id="${inv.id}">
                    <div class="plan-header">
                        <span class="plan-name">${escapeHtml(inv.planName)}</span>
                        <span class="plan-amount">${formatMoney(inv.investAmount)}</span>
                    </div>
                    <div class="plan-details">
                        <span>📅 Started: ${inv.startDate.toLocaleDateString()}</span>
                        <span>💰 Daily: ${inv.dailyReturn}% (${formatMoney(inv.dailyAmount)})</span>
                        <span>⏱️ Days left: ${daysLeft}</span>
                    </div>
                    <div class="claim-info">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(hoursSince / 24) * 100}%;"></div>
                        </div>
                        <div class="progress-text">⏱️ Next claim in ${Math.floor(hoursToNext)}h ${Math.floor((hoursToNext % 1) * 60)}m</div>
                        ${!canClaim && !isWeekend(now) ? `<div class="pending-amount">⏳ Ready in ${Math.floor(hoursToNext)} hours</div>` : ''}
                        ${canClaim ? `<div class="pending-amount">💰 Ready to claim: ${formatMoney(inv.dailyAmount)}</div>` : ''}
                    </div>
                    <button class="claim-btn ${canClaim ? 'active' : ''}" ${canClaim ? '' : 'disabled'} data-id="${inv.id}" data-daily="${inv.dailyAmount}">
                        ${canClaim ? '💰 Claim Daily Income' : '⏳ Wait for next claim'}
                    </button>
                    ${isWeekend(now) ? '<div class="weekend-warning">⛔ Claiming only available Monday–Friday. Come back on a weekday.</div>' : ''}
                </div>
            `;
        }
        container.innerHTML = html;

        document.querySelectorAll('.claim-btn.active').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const invId = btn.dataset.id;
                const dailyAmount = parseFloat(btn.dataset.daily);
                await claimDailyIncome(invId, dailyAmount);
            });
        });
    }

    async function claimDailyIncome(investmentId, dailyAmount) {
        const user = auth.currentUser;
        if (!user) return;
        const now = new Date();
        if (isWeekend(now)) {
            showToast('❌ Daily income can only be claimed on weekdays (Monday–Friday).', true);
            return;
        }
        try {
            await db.runTransaction(async (transaction) => {
                const invRef = db.collection('investments').doc(investmentId);
                const invSnap = await transaction.get(invRef);
                if (!invSnap.exists) throw new Error('Investment not found');
                const invData = invSnap.data();
                const lastClaim = invData.lastClaimed ? invData.lastClaimed.toDate() : invData.startDate.toDate();
                const hoursSince = (now - lastClaim) / (1000 * 60 * 60);
                if (hoursSince < 24) throw new Error('Not yet 24 hours since last claim');

                const userRef = db.collection('users').doc(user.uid);
                const userSnap = await transaction.get(userRef);
                const newBalance = (userSnap.data().balance || 0) + dailyAmount;
                transaction.update(userRef, { balance: newBalance });
                transaction.update(invRef, { lastClaimed: firebase.firestore.FieldValue.serverTimestamp() });

                const txRef = db.collection('transactions').doc();
                transaction.set(txRef, {
                    userId: user.uid,
                    type: 'daily_income',
                    amount: dailyAmount,
                    description: `Daily income from ${invData.planName}`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            showToast(`✅ ${formatMoney(dailyAmount)} claimed!`, false);
            await loadInvestments();
        } catch (err) {
            showToast(err.message || 'Claim failed', true);
        }
    }

    function updateTotalPending(investments) {
        const now = new Date();
        let total = 0;
        for (const inv of investments) {
            const claimStatus = getClaimStatus(inv, now);
            if (claimStatus.available) {
                total += claimStatus.dailyAmount;
            }
        }
        const totalSpan = document.getElementById('totalPending');
        if (totalSpan) totalSpan.innerText = total.toFixed(2);
    }

    function renderExpired(investments) {
        const container = document.getElementById('expiredInvestments');
        if (!container) return;
        if (!investments.length) {
            container.innerHTML = '<div class="empty-msg">📭 No expired or completed plans.</div>';
            return;
        }
        let html = '';
        for (const inv of investments) {
            const statusText = inv.status === 'completed' ? 'Completed' : 'Expired';
            html += `
                <div class="plan-card">
                    <div class="plan-header">
                        <span class="plan-name">${escapeHtml(inv.planName)}</span>
                        <span class="plan-amount">${formatMoney(inv.investAmount)}</span>
                    </div>
                    <div class="plan-details">
                        <span>📅 Started: ${inv.startDate.toLocaleDateString()}</span>
                        <span>💰 Daily: ${inv.dailyReturn}% (${formatMoney(inv.dailyAmount)})</span>
                        <span>⏱️ Status: ${statusText}</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Tab switching
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabs = {
        normal: document.getElementById('normalTab'),
        expired: document.getElementById('expiredTab')
    };
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Object.values(tabs).forEach(tab => tab.classList.remove('active'));
            if (tabs[tabId]) tabs[tabId].classList.add('active');
            if (tabId === 'normal') loadInvestments();
        });
    });

    // Bottom navigation active state and redirection
    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'income.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) {
            item.classList.add('active');
        }
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
