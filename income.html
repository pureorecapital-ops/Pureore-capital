<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Income – Sajvera Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
            background: #000;
        }

        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMS5Sxbd/file-00000000ec2c820c9d79849d4a3d6b82.png');
            background-size: cover;
            background-position: center;
            filter: blur(14px) brightness(0.25) saturate(0.7);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- HEADER (DARK GLASS) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: #f1f5f9;
            border-radius: 4px;
            transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ----- SLIDE MENU PANEL (GLASS) ----- */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.6);
            padding: 2rem 1.8rem;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            color: #f1f5f9;
            border-left: 1px solid rgba(255, 255, 255, 0.04);
        }

        .menu-panel.open {
            right: 0;
        }

        .menu-panel .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 0.5rem;
            transition: 0.2s;
        }
        .menu-panel .close-btn:hover {
            color: #ffffff;
        }

        .menu-panel .panel-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .menu-panel .panel-header .panel-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .menu-panel .panel-header .panel-email {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.7rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            background: transparent;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            transform: translateX(4px);
        }

        .menu-item .mi-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-item .mi-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-item .mi-label {
            flex: 1;
        }

        .menu-item .mi-arrow {
            color: rgba(255, 255, 255, 0.15);
        }
        .menu-item .mi-arrow svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 0.2rem 0.8rem;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ----- PAGE HEADER ----- */
        .page-header {
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-header h1 span {
            color: #60a5fa;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- TOTAL EARNINGS BAR (GLASS) ----- */
        .total-bar {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .total-bar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .total-left {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            position: relative;
            z-index: 1;
        }

        .total-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: #facc15;
        }

        .claim-all-btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: inherit;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(37, 99, 235, 0.15);
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        .claim-all-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
            transform: none !important;
        }

        .claim-all-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.25);
        }

        /* ----- TABS (GLASS) ----- */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 0.3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.5rem 0.5rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-align: center;
        }

        .tab-btn.active {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.04);
        }

        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ----- PLAN CARD (GLASS) ----- */
        .plan-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 1.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        .plan-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .plan-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
        }

        .plan-card .plan-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.25);
            display: block;
        }

        .plan-card .plan-body {
            padding: 1rem 1.2rem 1.2rem;
            position: relative;
            z-index: 1;
        }

        .plan-card .plan-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .plan-card .plan-meta {
            display: flex;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .plan-card .plan-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .plan-card .plan-meta svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .plan-card .claim-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            margin: 0.4rem 0 0.6rem 0;
            padding: 0.4rem 0.6rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .plan-card .claim-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .plan-card .claim-stats .stat-item .num {
            font-weight: 700;
            color: #ffffff;
        }

        .plan-card .claim-stats .stat-item .num.gold {
            color: #facc15;
        }
        .plan-card .claim-stats .stat-item .num.blue {
            color: #60a5fa;
        }
        .plan-card .claim-stats .stat-item .num.green {
            color: #4ade80;
        }

        .plan-card .weekend-purchase-note {
            font-size: 0.65rem;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.04);
            border: 1px solid rgba(96, 165, 250, 0.06);
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            display: inline-block;
            margin: 0.2rem 0 0.4rem 0;
        }

        .plan-card .weekend-purchase-note svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            vertical-align: middle;
            margin-right: 4px;
        }

        .plan-card .claim-progress {
            margin: 0.6rem 0 0.8rem 0;
        }

        .plan-card .claim-progress .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.3rem;
        }

        .plan-card .claim-progress .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            width: 0%;
            transition: width 0.5s ease;
        }

        .plan-card .claim-progress .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .plan-card .claim-progress .progress-label .earned {
            color: #60a5fa;
            font-weight: 600;
        }

        .plan-card .claim-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .plan-card .claim-status {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .plan-card .claim-status .countdown {
            color: #fbbf24;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .plan-card .claim-status .ready-text {
            color: #4ade80;
            font-weight: 600;
        }

        .plan-card .claim-btn {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.15);
        }

        .plan-card .claim-btn.active {
            background: linear-gradient(135deg, #facc15, #f5a623);
            color: #0a0815;
            box-shadow: 0 4px 24px rgba(250, 204, 21, 0.15);
        }

        .plan-card .claim-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(250, 204, 21, 0.25);
        }

        .plan-card .claim-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .plan-card .weekend-note {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.06);
            margin-top: 0.3rem;
            text-align: right;
        }

        .plan-card .buy-plan-details {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 0.6rem 0.8rem;
            margin: 0.3rem 0 0.6rem 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .plan-card .buy-plan-details .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 0.15rem 0;
            color: rgba(255, 255, 255, 0.15);
        }

        .plan-card .buy-plan-details .detail-row .label {
            color: rgba(255, 255, 255, 0.3);
        }
        .plan-card .buy-plan-details .detail-row .value {
            font-weight: 600;
        }
        .plan-card .buy-plan-details .detail-row .value.gold {
            color: #facc15;
        }

        .plan-card .buy-plan-details .detail-row .value.green {
            color: #4ade80;
        }

        .plan-card .claim-btn.buy-claim {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 24px rgba(16, 185, 129, 0.2);
        }

        .plan-card .claim-btn.buy-claim:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
        }

        .plan-card .claim-btn.buy-claim:disabled {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .plan-card .claim-btn.buy-claim.ready {
            background: linear-gradient(135deg, #facc15, #f5a623);
            color: #0a0815;
        }

        .plan-card .claim-btn.buy-claim.ready:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(250, 204, 21, 0.3);
        }

        /* ----- EMPTY STATE (GLASS) ----- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 0.8rem;
        }

        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 0.2rem;
        }

        /* ----- BOTTOM NAV (DARK GLASS) – FIXED ORDER: HOME → INCOME → MARKET → TEAM → ME ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }

        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        .nav-item:hover .nav-icon {
            stroke: #60a5fa;
        }

        .nav-item.marketplace .nav-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            padding: 4px;
            stroke: #fff;
            margin-bottom: 2px;
        }

        .nav-item.marketplace.active .nav-icon {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .nav-item.marketplace .nav-label {
            color: #60a5fa;
            font-weight: 700;
        }

        /* ----- TOAST (GLASS) ----- */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;

        // ================================================================
        // HELPERS
        // ================================================================
        function formatMoney(amount) {
            return 'K' + parseFloat(amount).toFixed(2);
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        function isWeekend(date) {
            var day = date.getDay();
            return day === 0 || day === 6;
        }

        function addBusinessDays(startDate, numDays) {
            var result = new Date(startDate);
            var added = 0;
            while (added < numDays) {
                result.setDate(result.getDate() + 1);
                if (!isWeekend(result)) added++;
            }
            return result;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatDateWithTime(date) {
            var options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('en-US', options);
        }

        // ================================================================
        // IMAGE HELPER
        // ================================================================
        function getSafeImageUrl(url) {
            if (!url || typeof url !== 'string' || url.trim() === '') {
                return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            }
            var safeUrl = url.trim();
            if (safeUrl.includes('ibb.co/') && !safeUrl.includes('i.ibb.co')) {
                var match = safeUrl.match(/ibb\.co\/([a-zA-Z0-9]+)(\/[^ ]*)?/);
                if (match && match[1]) {
                    var code = match[1];
                    var filename = match[2] || '';
                    var ext = 'jpg';
                    if (filename) {
                        var extMatch = filename.match(/\.([a-zA-Z0-9]+)$/);
                        if (extMatch && extMatch[1]) ext = extMatch[1];
                    }
                    safeUrl = 'https://i.ibb.co/' + code + '/image.' + ext;
                    if (filename) {
                        safeUrl = 'https://i.ibb.co/' + code + filename;
                    }
                }
            }
            if (safeUrl.includes('imgur.com/') && !safeUrl.includes('i.imgur.com')) {
                var match2 = safeUrl.match(/imgur\.com\/([a-zA-Z0-9]+)/);
                if (match2 && match2[1]) {
                    safeUrl = 'https://i.imgur.com/' + match2[1] + '.jpg';
                }
            }
            if (safeUrl.startsWith('http://')) {
                safeUrl = safeUrl.replace('http://', 'https://');
            }
            if (safeUrl.startsWith('//')) {
                safeUrl = 'https:' + safeUrl;
            }
            if (!safeUrl.startsWith('https://')) {
                return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            }
            return safeUrl;
        }

        // ================================================================
        // STATE
        // ================================================================
        var currentUserId = null;
        var refreshInterval = null;
        var timerInterval = null;
        var userBlockListener = null;
        var planImageCache = {};
        var allActivePlans = []; // combined array of invest and buy plans

        window.addEventListener('beforeunload', function() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (timerInterval) clearInterval(timerInterval);
            if (userBlockListener) userBlockListener();
        });

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        function watchBlockStatus(userId) {
            if (userBlockListener) userBlockListener();
            userBlockListener = db.collection('users').doc(userId)
                .onSnapshot(function(doc) {
                    if (doc.exists && doc.data().isBlocked === true) {
                        showToast('⚠️ Your account has been blocked. Redirecting...', true);
                        setTimeout(function() {
                            auth.signOut().then(function() { window.location.href = 'login.html'; });
                        }, 2000);
                    }
                }, function(err) { console.warn('Block listener error:', err); });
        }

        // ================================================================
        // AUTH STATE
        // ================================================================
        let authResolved = false;
        let redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                currentUserId = user.uid;
                watchBlockStatus(currentUserId);
                loadAllPlans();
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(function() {
                    var activeTab = document.getElementById('activeTab');
                    if (activeTab && activeTab.style.display !== 'none') {
                        loadAllPlans();
                    }
                }, 60000);
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateTimers, 1000);

                db.collection('users').doc(user.uid).get().then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        document.getElementById('panelName').textContent = data.fullName || 'User';
                        document.getElementById('panelEmail').textContent = data.email || user.email;
                    }
                }).catch(console.warn);
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // FETCH PLAN IMAGE
        // ================================================================
        async function fetchPlanImage(planName) {
            if (planImageCache[planName]) return planImageCache[planName];
            try {
                var snapshot = await db.collection('marketplacePlans')
                    .where('planName', '==', planName)
                    .limit(1)
                    .get();
                if (!snapshot.empty) {
                    var data = snapshot.docs[0].data();
                    var img = getSafeImageUrl(data.imageUrl || data.image);
                    planImageCache[planName] = img;
                    return img;
                }
                var defaultImg = 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
                planImageCache[planName] = defaultImg;
                return defaultImg;
            } catch (err) {
                console.warn('Error fetching image for plan:', planName, err);
                return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            }
        }

        // ================================================================
        // GET CLAIM STATUS (Invest Plans)
        // ================================================================
        function getClaimStatus(inv, now) {
            var start = inv.startDate;
            var claimsCount = inv.claimsCount || 0;
            var dailyAmount = inv.dailyAmount;
            var totalBusinessDays = inv.businessDays;

            var index = claimsCount;
            while (index < totalBusinessDays) {
                var dueDate = index === 0 ? start : addBusinessDays(start, index);
                var claimStart = new Date(dueDate);
                claimStart.setHours(start.getHours(), start.getMinutes(), start.getSeconds(), 0);
                var windowEnd = new Date(claimStart.getTime() + 24 * 60 * 60 * 1000);

                if (now >= windowEnd) {
                    index++;
                    continue;
                }

                if (now >= claimStart && now < windowEnd) {
                    var available = !isWeekend(now);
                    var hoursSince = Math.max(0, (now - claimStart) / (1000 * 60 * 60));
                    var earnedSoFar = Math.min(dailyAmount, dailyAmount * (hoursSince / 24));
                    var progress = Math.min(100, (hoursSince / 24) * 100);
                    return {
                        available: available,
                        nextClaimTime: claimStart,
                        windowEnd: windowEnd,
                        dailyAmount: dailyAmount,
                        earnedSoFar: earnedSoFar,
                        hoursSince: hoursSince,
                        progress: progress,
                        index: index,
                        status: available ? 'ready' : 'waiting'
                    };
                }

                if (now < claimStart) {
                    var hoursRemaining = (claimStart - now) / (1000 * 60 * 60);
                    return {
                        available: false,
                        nextClaimTime: claimStart,
                        windowEnd: windowEnd,
                        dailyAmount: dailyAmount,
                        earnedSoFar: 0,
                        hoursSince: 0,
                        progress: 0,
                        index: index,
                        status: 'waiting',
                        hoursRemaining: hoursRemaining
                    };
                }
            }

            return {
                available: false,
                nextClaimTime: null,
                windowEnd: null,
                dailyAmount: dailyAmount,
                earnedSoFar: 0,
                hoursSince: 0,
                progress: 0,
                index: -1,
                status: 'done'
            };
        }

        // ================================================================
        // LOAD ALL PLANS (Invest + Buy)
        // ================================================================
        async function loadAllPlans() {
            if (!currentUserId) return;
            try {
                // 1. Load Invest plans from "investments"
                var invSnapshot = await db.collection('investments')
                    .where('userId', '==', currentUserId)
                    .get();

                var investPlans = [];
                invSnapshot.forEach(function(doc) {
                    investPlans.push({ id: doc.id, ...doc.data(), planType: 'invest' });
                });

                // 2. Load Buy plans from "marketplacePurchases"
                var buySnapshot = await db.collection('marketplacePurchases')
                    .where('userId', '==', currentUserId)
                    .where('type', '==', 'buy')
                    .get();

                var buyPlans = [];
                buySnapshot.forEach(function(doc) {
                    buyPlans.push({ id: doc.id, ...doc.data(), planType: 'buy' });
                });

                // Combine all plans
                var allPlans = [...investPlans, ...buyPlans];
                allPlans.sort(function(a, b) {
                    var aTime = (a.startDate || a.purchasedAt)?.toMillis ? (a.startDate || a.purchasedAt).toMillis() :
                        0;
                    var bTime = (b.startDate || b.purchasedAt)?.toMillis ? (b.startDate || b.purchasedAt).toMillis() :
                        0;
                    return bTime - aTime;
                });

                // Separate active and expired
                var now = new Date();
                var active = [];
                var expired = [];

                for (var i = 0; i < allPlans.length; i++) {
                    var plan = allPlans[i];
                    if (plan.planType === 'invest') {
                        var startDate = plan.startDate.toDate();
                        var businessDays = plan.businessDays || plan.days;
                        var endDate = plan.businessEndDate ? plan.businessEndDate.toDate() : addBusinessDays(startDate,
                            businessDays);
                        var today = new Date();
                        today.setHours(0, 0, 0, 0);
                        var isExpired = plan.status !== 'active' || today > endDate;

                        var investment = {
                            id: plan.id,
                            ...plan,
                            startDate: startDate,
                            businessDays: businessDays,
                            endDate: endDate,
                            dailyAmount: plan.dailyReturn,
                            claimsCount: plan.claimsCount || 0,
                            lastClaimed: plan.lastClaimed,
                            purchasedOnWeekend: plan.purchasedOnWeekend || false,
                            planType: 'invest',
                            claimable: true // Invest plans have daily claims
                        };
                        if (!isExpired) {
                            active.push(investment);
                        } else {
                            expired.push(investment);
                        }
                    } else { // buy plan
                        var expiryDate = plan.expiresAt ? plan.expiresAt.toDate() : null;
                        var isExpiredBuy = plan.status === 'claimed' || plan.status === 'expired' || (expiryDate && now >
                            expiryDate);
                        var buyPlan = {
                            id: plan.id,
                            ...plan,
                            planType: 'buy',
                            expiryDate: expiryDate,
                            amount: plan.amount || plan.purchaseAmount || 0,
                            totalIncome: plan.totalIncome || 0,
                            finalAmount: (plan.amount || plan.purchaseAmount || 0) + (plan.totalIncome || 0),
                            status: plan.status || 'active',
                            claimedAt: plan.claimedAt || null,
                            claimAmount: plan.claimAmount || null,
                            claimable: false // Buy plans are not daily claimable
                        };
                        if (!isExpiredBuy) {
                            active.push(buyPlan);
                        } else {
                            expired.push(buyPlan);
                        }
                    }
                }

                allActivePlans = active;
                await renderActive(active);
                renderExpired(expired);
                updateTotalPendingAndClaimAll(active);
            } catch (err) {
                console.error("Error loading plans:", err);
                var container = document.getElementById('activePlansContainer');
                if (container) container.innerHTML =
                    '<div class="empty-state"><div class="title">Error loading plans</div><div class="sub">Please refresh the page</div></div>';
            }
        }

        // ================================================================
        // RENDER ACTIVE
        // ================================================================
        async function renderActive(plans) {
            var container = document.getElementById('activePlansContainer');
            if (!container) return;
            if (!plans.length) {
                container.innerHTML =
                    '<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div class="title">No active plans</div><div class="sub">Purchase an investment or Buy plan to start earning</div></div>';
                return;
            }

            // Prepare images
            var imagePromises = plans.map(function(p) {
                return fetchPlanImage(p.planName).catch(function() { return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg'; });
            });
            var images = await Promise.all(imagePromises);

            var now = new Date();
            var html = '';
            for (var i = 0; i < plans.length; i++) {
                var plan = plans[i];
                var img = images[i] || 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
                if (plan.planType === 'invest') {
                    // Render Invest Plan (existing)
                    var status = getClaimStatus(plan, now);
                    var canClaim = status.available && !isWeekend(now);
                    var daysLeft = plan.businessDays - (plan.claimsCount || 0);
                    var totalClaimed = (plan.claimsCount || 0) * plan.dailyAmount;
                    var claimsCount = plan.claimsCount || 0;

                    var statusText = '';
                    var countdownText = '';
                    if (canClaim) {
                        statusText = '✅ Ready to claim';
                    } else if (status.status === 'waiting' && status.hoursRemaining !== undefined) {

        // ================================================================
        // UPDATE TIMERS
        // ================================================================
        function updateTimers() {
            var now = new Date();
            var cards = document.querySelectorAll('.plan-card[data-next-claim]');
            cards.forEach(function(card) {
                var nextClaim = card.dataset.nextClaim;
                if (!nextClaim) return;
                var targetTime = parseInt(nextClaim);
                if (isNaN(targetTime)) return;
                var diff = (targetTime - now.getTime()) / 1000;
                var countdownEl = card.querySelector('.countdown');
                if (!countdownEl) return;

                if (diff <= 0) {
                    countdownEl.textContent = '0h 0m';
                    return;
                }

                var hrs = Math.floor(diff / 3600);
                var mins = Math.floor((diff % 3600) / 60);
                countdownEl.textContent = hrs + 'h ' + mins + 'm';
            });
        }

        // ================================================================
        // UPDATE TOTALS & CLAIM ALL (only for Invest plans)
        // ================================================================
        function updateTotalPendingAndClaimAll(plans) {
            var now = new Date();
            var total = 0;
            var hasClaimable = false;
            for (var i = 0; i < plans.length; i++) {
                var plan = plans[i];
                if (plan.planType === 'invest') {
                    var status = getClaimStatus(plan, now);
                    if (status.available && !isWeekend(now)) {
                        total += status.dailyAmount;

                    }

            }
            var totalSpan = document.getElementById('totalPending');
            if (totalSpan) totalSpan.innerText = total.toFixed(2) + ' ZMW';

            var claimAllBtn = document.getElementById('claimAllBtn');
            if (claimAllBtn) {
                claimAllBtn.disabled = isWeekend(now) || !hasClaimable;
            }
        }

        // ================================================================
        // CLAIM DAILY INCOME (Invest)
        // ================================================================
        async function claimDailyIncome(investmentId, dailyAmount, refreshAfter, btnElement) {
            var user = auth.currentUser;
            if (!user) return false;
            var now = new Date();
            if (isWeekend(now)) {
                showToast('❌ Daily income can only be claimed on weekdays (Monday–Friday).', true);
                if (btnElement) btnElement.disabled = false;
                return false;
            }

            try {
                await db.runTransaction(async function(transaction) {
                    var invRef = db.collection('investments').doc(investmentId);
                    var invSnap = await transaction.get(invRef);
                    if (!invSnap.exists) throw new Error('Investment not found');
                    var invData = invSnap.data();
                    var start = invData.startDate.toDate();
                    var claimsCount = invData.claimsCount || 0;
                    var totalBusinessDays = invData.businessDays || invData.days;

                    var status = getClaimStatus({
                        startDate: start,
                        claimsCount: claimsCount,
                        dailyAmount: dailyAmount,
                        businessDays: totalBusinessDays,
                    }, now);

                    if (!status.available) {
                        throw new Error('Claim not available at this time');
                    }

                    var userRef = db.collection('users').doc(user.uid);

                    transaction.update(userRef, {
                        walletBalance: firebase.firestore.FieldValue.increment(dailyAmount),
                        balance: firebase.firestore.FieldValue.increment(dailyAmount)
                    });

                    transaction.update(invRef, {
                        claimsCount: firebase.firestore.FieldValue.increment(1),
                        lastClaimed: firebase.firestore.Timestamp.fromDate(now)
                    });

                    var txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        userId: user.uid,
                        type: 'daily_income',
                        amount: dailyAmount,
                        description: 'Daily income from ' + invData.planName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                showToast('✅ ' + formatMoney(dailyAmount) + ' claimed!', false);
                if (refreshAfter) {
                    await loadAllPlans();
                }
                return true;
            } catch (err) {
                showToast(err.message || 'Claim failed', true);
                if (btnElement) btnElement.disabled = false;
                return false;
            }
        }

        // ================================================================
        // CLAIM BUY PLAN (Full Amount) – WITH DEBUG LOGGING
        // ================================================================
        async function claimBuyPlan(planId, finalAmount, btnElement) {
            console.log("=== CLAIM BUY PLAN START ===");
            console.log("Plan ID:", planId);
            console.log("Final Amount:", finalAmount);
            console.log("Authenticated UID:", firebase.auth().currentUser?.uid);

            var user = auth.currentUser;
            if (!user) {
                showToast('Please log in.', true);
                if (btnElement) btnElement.disabled = false;
                console.log("Claim aborted: No user");
                return;
            }

            try {
                // 1. Initial read (outside transaction)
                console.log("DEBUG: Reading marketplacePurchases doc", planId);
                var docSnap = await db.collection('marketplacePurchases').doc(planId).get();
                if (!docSnap.exists) {
                    showToast('Plan not found.', true);
                    if (btnElement) btnElement.disabled = false;
                    console.log("Claim aborted: Document not found");
                    return;
                }
                var data = docSnap.data();
                console.log("DEBUG: Purchase data from initial read:", data);
                console.log("DEBUG: Purchase userId:", data.userId);
                console.log("DEBUG: Current user UID:", user.uid);
                console.log("DEBUG: Ownership match?", data.userId === user.uid);

                if (data.status === 'claimed') {
                    showToast('This plan has already been claimed.', true);
                    if (btnElement) btnElement.disabled = false;
                    console.log("Claim aborted: Already claimed");
                    return;
                }

                var now = new Date();
                var expiryDate = data.expiresAt ? data.expiresAt.toDate() : null;
                console.log("DEBUG: Now:", now);
                console.log("DEBUG: Expiry date:", expiryDate);
                if (!expiryDate || now < expiryDate) {
                    showToast('Plan is not yet ready for claim.', true);
                    if (btnElement) btnElement.disabled = false;
                    console.log("Claim aborted: Not ready (expiry:", expiryDate, "now:", now, ")");
                    return;
                }
                console.log("DEBUG: Claim ready – expiry passed");

                // ---- Begin Transaction ----
                console.log("DEBUG: Starting Firestore transaction...");
                await db.runTransaction(async function(transaction) {
                    // 2. Read purchase inside transaction
                    console.log("DEBUG (tx): Reading purchaseRef", planId);
                    var purchaseRef = db.collection('marketplacePurchases').doc(planId);
                    var purchaseSnap = await transaction.get(purchaseRef);
                    if (!purchaseSnap.exists) throw new Error('Plan not found');
                    var purchaseData = purchaseSnap.data();
                    console.log("DEBUG (tx): Purchase data inside tx:", purchaseData);
                    if (purchaseData.status === 'claimed') throw new Error('Already claimed');

                    // 3. Read user inside transaction
                    console.log("DEBUG (tx): Reading userRef", user.uid);
                    var userRef = db.collection('users').doc(user.uid);
                    var userSnap = await transaction.get(userRef);
                    if (!userSnap.exists) throw new Error('User not found');
                    console.log("DEBUG (tx): User data exists");

                    // 4. Update user
                    console.log("DEBUG (tx): Updating userRef", user.uid, "with walletBalance +=", finalAmount, "and balance +=", finalAmount);
                    transaction.update(userRef, {
                        walletBalance: firebase.firestore.FieldValue.increment(finalAmount),
                        balance: firebase.firestore.FieldValue.increment(finalAmount)
                    });

                    // 5. Update purchase
                    console.log("DEBUG (tx): Updating purchaseRef", planId, "with status='claimed', claimedAt=now, claimAmount=", finalAmount);
                    transaction.update(purchaseRef, {
                        status: 'claimed',
                        claimedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        claimAmount: finalAmount
                    });

                    // 6. Create transaction record
                    console.log("DEBUG (tx): Creating transaction doc for user", user.uid, "amount", finalAmount);
                    var txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        userId: user.uid,
                        type: 'buy_plan_claim',
                        amount: finalAmount,
                        description: 'Buy plan claim: ' + purchaseData.planName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    console.log("DEBUG (tx): All operations added to transaction – committing...");
                });

                console.log("DEBUG: Transaction committed successfully.");
                showToast('✅ ' + formatMoney(finalAmount) + ' claimed successfully!', false);
                if (btnElement) btnElement.disabled = true;
                await loadAllPlans();
            } catch (err) {
                console.error("=== CLAIM FAILED ===");
                console.error("Code:", err.code);
                console.error("Message:", err.message);
                console.error("Stack:", err.stack);
                console.error("Full error:", err);
                showToast(err.message || 'Claim failed', true);
                if (btnElement) btnElement.disabled = false;
            }
            console.log("=== CLAIM BUY PLAN END ===");
        }
