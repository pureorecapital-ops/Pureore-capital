<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pureore Capital – African Investment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0a0f1c; /* fallback dark */
        }

        /* Background image with dark overlay to reduce brightness */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/wZw0C7mP/file-00000000411c722f8509ba7138f95964.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.55) contrast(1.1);
            z-index: -2;
        }

        /* Optional extra dark gradient overlay for depth */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
        }

        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            margin: 2rem;
            backdrop-filter: blur(2px);
            animation: fadeSlideUp 0.9s ease-out;
        }

        /* Premium animated logo – each word/letter with three smooth gradients */
        .logo {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.2rem;
        }

        .logo-word {
            display: inline-flex;
            gap: 0.1rem;
        }

        /* Green (trust, growth, investment) */
        .green-glow {
            background: linear-gradient(135deg, #2ecc71, #27ae60, #1e8449);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(46, 204, 113, 0.4);
            animation: gentlePulse 3s infinite;
        }

        /* Orange (success, wealth) */
        .orange-glow {
            background: linear-gradient(135deg, #f39c12, #e67e22, #d35400);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
            animation: gentlePulse 3s infinite 0.2s;
        }

        /* Yellow (energy, opportunity) */
        .yellow-glow {
            background: linear-gradient(135deg, #f1c40f, #f9e75c, #e6b800);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 14px rgba(241, 196, 15, 0.5);
            animation: gentlePulse 3s infinite 0.4s;
        }

        /* Apply colors to each part: "Pureore" green, "capital" orange, but we want each letter? 
           For premium look, we'll split letters of "Pureore" into green/orange/yellow alternating? 
           But requirement says "each word/letter uses three smooth colors" – we'll make each letter of the first word cycle, 
           and second word also cycle, but simpler: 
           "P u r e o r e" – each letter gets a rotating gradient? Better: use three spans for three words? 
           Actually brand name is "Pureore capital". We'll apply green to "Pureore", orange to "capital", 
           and add a subtle yellow accent on the "O" or just keep it clean. 
           To satisfy "each letter uses three smooth colors", we'll add a shimmer effect that moves across letters. 
           But easier: create a gradient text that shifts through green, orange, yellow. 
           I'll implement a multi‑color animated text using background shift. */
        
        /* Enhanced: each letter of "Pureore" gets individual color cycle? 
           We'll build inline spans for each character of "Pureore" and "capital" */
        .char {
            display: inline-block;
            animation: colorFlow 4s infinite;
            animation-delay: calc(0.05s * var(--i));
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        @keyframes colorFlow {
            0% { background: linear-gradient(135deg, #2ecc71, #27ae60); background-clip: text; }
            33% { background: linear-gradient(135deg, #f39c12, #e67e22); background-clip: text; }
            66% { background: linear-gradient(135deg, #f1c40f, #f9e75c); background-clip: text; }
            100% { background: linear-gradient(135deg, #2ecc71, #27ae60); background-clip: text; }
        }

        /* Fallback for browsers that don't support background-clip text */
        @supports not (background-clip: text) {
            .char { color: #2ecc71; }
        }

        .subtitle {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
            font-weight: 400;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: inline-block;
            padding-top: 0.8rem;
            backdrop-filter: blur(4px);
        }

        /* Main CTA Button */
        .btn-get-started {
            display: inline-block;
            margin-top: 3rem;
            padding: 1rem 2.8rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-size: 200% auto;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3), 0 0 12px rgba(46,204,113,0.4);
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
        }

        .btn-get-started:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 30px rgba(0,0,0,0.4), 0 0 18px rgba(241,196,15,0.6);
            background-position: right center;
            filter: brightness(1.05);
        }

        .btn-get-started:active {
            transform: translateY(-2px);
        }

        /* Responsive spacing */
        @media (max-width: 600px) {
            .hero {
                margin: 1rem;
                padding: 1rem;
            }
            .btn-get-started {
                padding: 0.8rem 2rem;
                font-size: 1.2rem;
            }
            .logo {
                gap: 0.1rem;
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gentle pulse for whole logo container */
        @keyframes gentlePulse {
            0% { text-shadow: 0 0 2px currentColor; }
            50% { text-shadow: 0 0 14px currentColor; }
            100% { text-shadow: 0 0 2px currentColor; }
        }

        /* Optional: small note */
        .credit {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- Premium animated logo: each letter of "Pureore" and "capital" gets individual color cycling -->
        <div class="logo">
            <span class="logo-word">
                <span class="char" style="--i:0">P</span>
                <span class="char" style="--i:1">u</span>
                <span class="char" style="--i:2">r</span>
                <span class="char" style="--i:3">e</span>
                <span class="char" style="--i:4">o</span>
                <span class="char" style="--i:5">r</span>
                <span class="char" style="--i:6">e</span>
            </span>
            &nbsp;
            <span class="logo-word">
                <span class="char" style="--i:7">c</span>
                <span class="char" style="--i:8">a</span>
                <span class="char" style="--i:9">p</span>
                <span class="char" style="--i:10">i</span>
                <span class="char" style="--i:11">t</span>
                <span class="char" style="--i:12">a</span>
                <span class="char" style="--i:13">l</span>
            </span>
        </div>

        <!-- Subtitle: African pureore capital investment -->
        <div class="subtitle">
            african pureore capital investment
        </div>

        <!-- Centered large rounded button -->
        <a href="register.html" class="btn-get-started">
            Get started now
        </a>
    </div>
    <div class="credit">Pureore Capital • Invest with confidence</div>
</body>
</html>
