<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Invest | PureOre Nexus</title>
    <meta name="description" content="Explore automotive investment opportunities on PureOre Nexus." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"
            }
        }
    </script>

    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.25);
            --gold-subtle: rgba(201, 168, 76, 0.08);
            --charcoal: #1a1a1a;
            --dark: #0b0b0b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.5);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ============================================================
           LOADING SCREEN
        ============================================================ */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .load-logo-symbol {
            width: 64px;
            height: 64px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: rgba(201, 168, 76, 0.04);
            box-shadow: 0 0 40px rgba(201, 168, 76, 0.06);
            position: relative;
        }
        .load-logo-symbol::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--gold);
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .load-logo-symbol svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .load-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .load-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .load-progress-wrap {
            width: 200px;
            max-width: 60vw;
            margin-top: 1.8rem;
        }
        .load-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .load-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--gold-glow);
            transition: width 0.15s linear;
        }
        .load-msg {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.7rem;
            text-align: center;
            min-height: 1.2em;
            font-weight: 300;
        }

        /* ============================================================
           MAIN INVESTMENTS
        ============================================================ */
        #main-investments {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.9s ease, transform 1s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background: var(--dark);
        }
        #main-investments.visible {
            opacity: 1;
            transform: scale(1);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://i.ibb.co/cXxZh1w3/20260824-014737.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.2;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.5) 0%, rgba(11, 11, 11, 0.92) 80%, #0b0b0b 100%);
            pointer-events: none;
        }

        .investments-scroll {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: 0 16px 100px 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(11, 11, 11, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin: 0 -16px;
            padding: 14px 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-white);
        }
        .header-brand svg {
            width: 28px;
            height: 28px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .header-brand span {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .header-brand span em {
            color: var(--gold);
            font-style: normal;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        .header-btn:hover {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.04);
        }
        .header-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           PAGE HEADER
        ============================================================ */
        .page-header {
            padding: 18px 0 10px;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .page-header .sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-top: 2px;
        }

        /* ============================================================
           INVESTMENT GRID
        ============================================================ */
        .investment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
            padding-bottom: 12px;
        }

        /* ===== PLAN CARD ===== */
        .plan-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .plan-card:hover {
            border-color: rgba(201, 168, 76, 0.15);
            transform: translateY(-2px);
        }

        .plan-image {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: var(--charcoal);
        }
        .plan-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .plan-image .invest-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: var(--gold);
            color: #0b0b0b;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.25s ease;
            cursor: default;
            border: none;
            font-family: inherit;
        }
        .plan-image .invest-badge svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .plan-content {
            padding: 12px 12px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .plan-name {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            color: var(--text-white);
            line-height: 1.2;
        }

        .plan-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .plan-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .plan-detail svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .plan-detail .label {
            color: var(--text-muted);
        }
        .plan-detail .value {
            color: var(--text-white);
            font-weight: 500;
        }
        .plan-detail .value.gold {
            color: var(--gold);
        }

        .plan-total {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--gold);
            margin: 2px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .plan-total svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .plan-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .plan-status {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.15);
        }
        .plan-status.coming-soon {
            background: rgba(241, 196, 15, 0.08);
            color: #f1c40f;
            border-color: rgba(241, 196, 15, 0.12);
        }
        .plan-status.closed {
            background: rgba(231, 76, 60, 0.06);
            color: #e74c3c;
            border-color: rgba(231, 76, 60, 0.1);
        }

        .plan-view-link {
            font-size: 0.6rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.25s ease;
            cursor: pointer;
        }
        .plan-view-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .plan-view-link:hover {
            color: #dbb95c;
            text-decoration: underline;
        }

        /* ============================================================
           EMPTY STATE
        ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3;
            margin-bottom: 12px;
            display: inline-block;
        }
        .empty-state p {
            font-size: 0.85rem;
            font-weight: 300;
        }

        /* ============================================================
           BRANDING FOOTER
        ============================================================ */
        .branding-footer {
            text-align: center;
            padding: 16px 0 8px;
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            opacity: 0.5;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 16px;
        }
        .branding-footer span {
            color: var(--gold);
            opacity: 0.7;
        }

        /* ============================================================
           BOTTOM NAVIGATION
        ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: rgba(11, 11, 11, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 env(safe-area-inset-bottom, 8px) 0;
            height: 68px;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.04em;
            transition: color 0.25s ease;
            padding: 4px 12px;
            position: relative;
            min-width: 48px;
        }
        .bottom-nav a svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease;
        }
        .bottom-nav a.active {
            color: var(--gold);
        }
        .bottom-nav a.active svg {
            stroke: var(--gold);
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .investment-grid {
                gap: 10px;
            }
            .plan-content {
                padding: 10px 10px 12px;
            }
            .plan-name {
                font-size: 0.75rem;
            }
            .plan-detail {
                font-size: 0.6rem;
                gap: 4px;
            }
            .plan-detail svg {
                width: 12px;
                height: 12px;
            }
            .plan-total {
                font-size: 0.65rem;
            }
            .plan-total svg {
                width: 14px;
                height: 14px;
            }
            .plan-footer {
                flex-wrap: wrap;
                gap: 4px;
            }
            .plan-status {
                font-size: 0.5rem;
                padding: 1px 8px;
            }
            .plan-view-link {
                font-size: 0.55rem;
            }
            .plan-view-link svg {
                width: 12px;
                height: 12px;
            }
            .invest-badge {
                font-size: 0.5rem;
                padding: 3px 8px;
            }
            .invest-badge svg {
                width: 10px;
                height: 10px;
            }
            .page-header h1 {
                font-size: 1.2rem;
            }
            .page-header .sub {
                font-size: 0.75rem;
            }
            .header-brand span {
                font-size: 0.7rem;
                letter-spacing: 0.15em;
            }
            .investments-scroll {
                padding: 0 12px 80px 12px;
            }
            .header {
                padding: 10px 12px;
                margin: 0 -12px;
            }
            .bottom-nav {
                height: 62px;
                padding: 4px 0 env(safe-area-inset-bottom, 6px) 0;
            }
            .bottom-nav a {
                font-size: 0.45rem;
                padding: 2px 8px;
                min-width: 40px;
            }
            .bottom-nav a svg {
                width: 20px;
                height: 20px;
            }
            .branding-footer {
                font-size: 0.5rem;
                padding: 12px 0 6px;
            }
        }

        @media (max-width: 380px) {
            .investment-grid {
                gap: 6px;
            }
            .plan-content {
                padding: 8px 6px 10px;
            }
            .plan-name {
                font-size: 0.7rem;
            }
            .plan-detail {
                font-size: 0.55rem;
            }
            .plan-total {
                font-size: 0.6rem;
            }
            .plan-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .plan-view-link {
                justify-content: flex-end;
            }
            .branding-footer {
                font-size: 0.45rem;
            }
        }

        @media (min-width: 768px) {
            .investments-scroll {
                padding: 0 32px 40px 32px;
            }
            .header {
                padding: 16px 32px;
                margin: 0 -32px;
            }
            .investment-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
            }
            .bottom-nav {
                display: none;
            }
            .investments-scroll {
                padding-bottom: 40px;
            }
        }

        @media (min-width: 1024px) {
            .investment-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        /* ============================================================
           SCROLLBAR
        ============================================================ */
        #main-investments::-webkit-scrollbar {
            width: 3px;
        }
        #main-investments::-webkit-scrollbar-track {
            background: transparent;
        }
        #main-investments::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 76, 0.2);
            border-radius: 10px;
        }

        /* ============================================================
           UTILITY
        ============================================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOADING SCREEN
    ============================================================ -->
    <div id="loading-screen" role="status" aria-label="Loading">
        <div class="load-logo">
            <div class="load-logo-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="load-title">PureOre Nexus</div>
            <div class="load-sub">Investment Plans</div>
        </div>
        <div class="load-progress-wrap">
            <div class="load-progress-track">
                <div class="load-progress-bar" id="load-bar" style="width:0%;"></div>
            </div>
            <div class="load-msg" id="load-msg">Loading investment plans...</div>
        </div>
    </div>

    <!-- ============================================================
    MAIN INVESTMENTS
    ============================================================ -->
    <div id="main-investments">
        <div class="bg-wrap" aria-hidden="true"></div>
        <div class="bg-overlay" aria-hidden="true"></div>

        <div class="investments-scroll">

            <!-- ===== HEADER ===== -->
            <header class="header" role="banner">
                <a href="#" class="header-brand" aria-label="PureOre Nexus">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Pure<em>Ore</em> Nexus</span>
                </a>

                <div class="header-actions">
                    <button class="header-btn" id="notif-btn" aria-label="Notifications">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button class="header-btn" id="profile-btn" aria-label="Profile">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- ===== PAGE HEADER ===== -->
            <div class="page-header">
                <h1>Investment Plans</h1>

    <!-- ============================================================
    FIREBASE + APPLICATION LOGIC
    ============================================================ -->
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, getDocs, query, orderBy } from 'firebase/firestore';

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2nHDM2ebNv9pUUoIhsfJUCSLlffWYW1w",
            authDomain: "pureore-nexus.firebaseapp.com",
            projectId: "pureore-nexus",
            storageBucket: "pureore-nexus.firebasestorage.app",
            messagingSenderId: "555338198187",
            appId: "1:555338198187:web:0c510ca507fa4c835a5bee",
            measurementId: "G-L2B5FEMH2C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // DOM REFS
        // ============================================================
        const loadScreen = document.getElementById('loading-screen');
        const loadBar = document.getElementById('load-bar');
        const loadMsg = document.getElementById('load-msg');
        const mainInvest = document.getElementById('main-investments');
        const grid = document.getElementById('investment-grid');

        // ============================================================
        // LOADING SCREEN
        // ============================================================
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += 2.5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                loadBar.style.width = '100%';
                loadMsg.textContent = 'Ready';
                return;
            }
            loadBar.style.width = loadProgress + '%';
            if (loadProgress > 70) loadMsg.textContent = 'Preparing opportunities...';
            else if (loadProgress > 40) loadMsg.textContent = 'Loading investment plans...';
        }, 35);

        // ============================================================
        // FORMAT CURRENCY
        // ============================================================
        function formatCurrency(amount) {
            if (amount === undefined || amount === null) return '0.00';
            return Number(amount).toFixed(2);
        }

        // ============================================================
        // RENDER PLANS
        // ============================================================
        function renderPlans(plans) {
            if (!plans || plans.length === 0) {
                grid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <p>No investment plans are currently available.<br />Please check again later.</p>
                        </div>
                    `;
                return;
            }

            // Sort: active first, then coming soon, then closed
            const statusOrder = { active: 0, 'coming soon': 1, closed: 2 };
            const sorted = [...plans].sort((a, b) => {
                const aStatus = (a.status || 'closed').toLowerCase();
                const bStatus = (b.status || 'closed').toLowerCase();
                return (statusOrder[aStatus] ?? 3) - (statusOrder[bStatus] ?? 3);
            });

            grid.innerHTML = sorted.map(plan => {
                const planId = plan.id;
                const name = plan.planName || 'Unnamed Plan';
                const image = plan.imageUrl || 'https://placehold.co/600x400/1a1a1a/888?text=Automotive';
                const investAmount = plan.investmentAmount || 0;
                const dailyReturn = plan.dailyReturn || 0;
                const duration = plan.durationDays || plan.duration || 0;
                const total = dailyReturn * duration;
                const status = (plan.status || 'closed').toLowerCase();
                const statusClass = status === 'active' ? '' :
                                    status === 'coming soon' ? 'coming-soon' :
                                    status === 'closed' ? 'closed' : '';

                return `
                        <div class="plan-card">
                            <div class="plan-image">
                                <img src="${image}" alt="${name}" loading="lazy" />
                                <span class="invest-badge">
                                    <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
                                    Invest
                                </span>
                            </div>
                            <div class="plan-content">
                                <div class="plan-name">${name}</div>
                                <div class="plan-details">
                                    <div class="plan-detail">
                                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        <span class="label">Invest</span>
                                        <span class="value gold">K${formatCurrency(investAmount)}</span>
                                    </div>
                                    <div class="plan-detail">
                                        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        <span class="label">Daily Return</span>
                                        <span class="value">K${formatCurrency(dailyReturn)}</span>
                                    </div>
                                    <div class="plan-detail">
                                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        <span class="label">Duration</span>
                                        <span class="value">${duration} Days</span>
                                    </div>
                                </div>
                                <div class="plan-total">
                                    <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    Total: <strong>K${formatCurrency(total)}</strong>
                                </div>
                                <div class="plan-footer">
                                    <span class="plan-status ${statusClass}">${status.toUpperCase()}</span>
                                    <a href="investment-details.html?id=${planId}" class="plan-view-link">
                                        View Plan
                                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        // ============================================================
        // LOAD PLANS
        // ============================================================
        async function loadPlans() {
            try {
                const plansRef = collection(db, 'investmentPlans');
                const q = query(plansRef, orderBy('createdAt', 'desc'));
                const snapshot = await getDocs(q);
                const plans = [];
                snapshot.forEach(doc => {
                    plans.push({ id: doc.id, ...doc.data() });
                });
                renderPlans(plans);
            } catch (error) {
                console.error('Error loading plans:', error);
                grid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <p>Unable to load investment plans.</p>
                            <button onclick="location.reload()" style="display:inline-block;margin-top:12px;color:var(--gold);background:none;border:1px solid var(--gold);padding:8px 24px;border-radius:20px;font-family:inherit;font-size:0.75rem;cursor:pointer;">Try Again</button>
                        </div>
                    `;
            }
        }

        // ============================================================
        // AUTHENTICATION CHECK
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            // Hide loading after a short delay
            setTimeout(() => {
                loadScreen.classList.add('hidden');
                mainInvest.classList.add('visible');
                document.body.style.overflow = 'auto';
            }, 400);

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            loadPlans();
        });

        // ============================================================
        // HEADER BUTTONS
        // ============================================================
        document.getElementById('notif-btn').addEventListener('click', () => {
            window.location.href = 'notifications.html';
        });
        document.getElementById('profile-btn').addEventListener('click', () => {
            window.location.href = 'profile.html';
        });

        console.log('PureOre Nexus — Investment page ready.');
    </script>

</body>
