<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Jobs – Sajvera Capital</title>

    <!-- ============================================================
         FIREBASE SDKs – Load these in the <head>
         ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #020617;
            color: #FFFFFF;
            min-height: 100vh;
            padding: 20px 16px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── FULL SCREEN INTRO OVERLAY ── */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background-image: url('https://i.ibb.co/YB6NQzHd/file-00000000cba0820aafbd1b2a1745d89a.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            opacity: 0;
            visibility: hidden;
            padding: 30px;
        }
        #introOverlay.active {
            opacity: 1;
            visibility: visible;
        }
        #introOverlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .intro-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 420px;
            animation: introFade 1.2s ease forwards;
        }
        @keyframes introFade {
            0% { opacity: 0; transform: scale(0.96) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .intro-content h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 2px;
        }
        .intro-content h1 span { color: #60A5FA; }
        .intro-content .sub {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255,255,255,0.60);
            margin-bottom: 24px;
        }
        .intro-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .intro-loader .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255,255,255,0.08);
            border-top-color: #60A5FA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .intro-loader .text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.30);
            letter-spacing: 0.3px;
        }

        /* ── MAIN CONTENT ── */
        .container {
            max-width: 480px;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.30);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 0;
            margin-bottom: 4px;
            transition: color 0.2s;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
        }
        .back-link:hover { color: #FFFFFF; }
        .back-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.3px;
        }
        .page-header h2 span { color: #60A5FA; }
        .page-header p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.30);
            margin-top: 2px;
            line-height: 1.5;
        }
        .page-header .desc {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.18);
            margin-top: 6px;
            line-height: 1.6;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .job-card {
            background: rgba(15, 23, 42, 0.70);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 22px 20px 20px;
            margin-bottom: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .job-card:hover {
            transform: translateY(-3px);
            border-color: rgba(96,165,250,0.20);
        }
        .job-card .job-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.2px;
            margin-bottom: 4px;
        }
        .job-card .job-sub {
            font-size: 0.7rem;
            font-weight: 600;
            color: #60A5FA;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .job-card .job-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .job-card .job-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(96,165,250,0.06);
            border-radius: 10px;
            border: 1px solid rgba(96,165,250,0.06);
            margin-bottom: 8px;
        }
        .job-card .job-icon svg {
            width: 20px;
            height: 20px;
            stroke: #60A5FA;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-view {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563EB, #60A5FA);
            border: none;
            border-radius: 14px;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            text-align: center;
            text-decoration: none;
        }
        .btn-view:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.06);
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        @media (max-width: 480px) {
            body { padding: 16px 14px 24px; }
            .intro-content h1 { font-size: 1.8rem; }
            .page-header h2 { font-size: 1.4rem; }
            .job-card { padding: 18px 16px 16px; }
            .job-card .job-title { font-size: 1.05rem; }
        }
        @media (max-width: 360px) {
            .intro-content h1 { font-size: 1.5rem; }
            .intro-content .sub { font-size: 0.95rem; }
            .job-card .job-desc { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- ── FULL SCREEN INTRO ── -->
    <div id="introOverlay" class="active">
        <div class="intro-content">
            <h1>SAJVERA <span>CAPITAL</span></h1>
            <div class="sub">OPPORTUNITIES</div>
            <div style="font-size:0.9rem; color:rgba(255,255,255,0.25); margin-bottom:14px;">Grow with us. Build with us.</div>
            <div class="intro-loader">
                <div class="spinner"></div>
                <span class="text">Preparing opportunities...</span>
            </div>
        </div>
    </div>

    <!-- ── MAIN CONTENT ── -->
    <div class="container" id="mainContent" style="display:none;">

        <button class="back-link" onclick="window.location.href='dashboard.html'">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </button>

        <div class="page-header">
            <h2>SAJVERA CAPITAL <span>OPPORTUNITIES</span></h2>
            <p>Grow with us. Build with us.</p>
            <div class="desc">Explore available opportunities and submit an application for a position that matches your skills and experience.</div>
        </div>

        <div id="jobList"></div>

        <div class="footer-note">© Sajvera Capital</div>
    </div>

    <!-- ════════════════════════════════════════════════
    JAVASCRIPT – FIREBASE CONFIG & AUTH
    ════════════════════════════════════════════════ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG – Your project credentials
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };

        // ================================================================
        // INITIALIZE FIREBASE (only once)
        // ================================================================
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // AUTH STATE CHECK – Redirect if not logged in
        // ================================================================
        var authResolved = false;
        var redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                console.log('✅ User logged in:', user.uid, user.email);
                // (Optional) Firestore user data fetch can be added here.
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                console.log('❌ No user found. Redirecting to login...');
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // HELPER FUNCTIONS
        // ================================================================
        function getCurrentUser() {
            return auth.currentUser;
        }

        function logoutUser() {
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            }).catch(function(err) {
                console.warn('Logout error:', err);
            });
        }
    </script>

    <!-- ════════════════════════════════════════════════
    JOBS DATA & RENDER LOGIC
    ════════════════════════════════════════════════ -->
    <script>
        var jobs = [
            {
                id: 'platform-assistant',
                title: 'Platform Assistant',
                sub: 'Customer Support / Platform Guidance',
                desc: 'Help users understand Sajvera Capital, explain platform features, guide new members and assist users with general platform questions.',
                icon: `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`
            },
            {
                id: 'promoter',
                title: 'Promoter',
                sub: 'Marketing / Promotion',
                desc: 'Help promote Sajvera Capital using approved information and introduce the platform to potential users.',
                icon: `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`
            },
            {
                id: 'mobile-money-agent',
                title: 'Mobile Money Agent',
                sub: 'Payment Support',
                desc: 'Become an approved payment agent for supported mobile-money networks (MTN, Airtel, Zamtel).',
                icon: `<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M6 10h4"/><path d="M14 10h4"/></svg>`
            },
            {
                id: 'community-manager',
                title: 'Community Manager',
                sub: 'Community / Member Support',
                desc: 'Operate a WhatsApp community, help new members understand the platform, provide approved educational information and maintain a respectful environment.',
                icon: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`
            }
        ];

        var container = document.getElementById('jobList');
        jobs.forEach(function(job) {
            var card = document.createElement('div');
            card.className = 'job-card';
            card.innerHTML = `
                <div class="job-icon">${job.icon}</div>
                <div class="job-title">${job.title}</div>
                <div class="job-sub">${job.sub}</div>
                <div class="job-desc">${job.desc}</div>
                <a href="apply.html?job=${job.id}" class="btn-view">VIEW OPPORTUNITY</a>
            `;
            container.appendChild(card);
        });

        // ── Intro overlay fade and reveal main content ──
        var overlay = document.getElementById('introOverlay');
        var main = document.getElementById('mainContent');
        setTimeout(function() {
            overlay.classList.remove('active');
            overlay.style.display = 'none';
            main.style.display = 'block';
        }, 3200);
    </script>
</body>
</html>
