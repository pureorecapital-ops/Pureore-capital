<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>J Product | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 40%, rgba(46, 204, 113, 0.03) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .loader {
            border: 3px solid #2C2C3A;
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .plans-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 1rem 0 2rem;
        }
        .plan-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(46, 204, 113, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeSlideUp 0.5s ease;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            border-color: #f1c40f;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        .plan-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(46,204,113,0.2);
        }
        .plan-content {
            padding: 1.2rem;
        }
        .plan-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #f1c40f;
        }
        .plan-lock {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 1rem;
            font-style: italic;
        }
        .plan-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: #111116;
            padding: 0.8rem;
            border-radius: 24px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .detail-label {
            color: #aaa;
        }
        .detail-value {
            font-weight: 600;
            color: #2ecc71;
        }
        .total-income {
            background: rgba(46,204,113,0.1);
            border-radius: 24px;
            padding: 0.6rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: bold;
            font-size: 1.1rem;
            color: #f1c40f;
        }
        .plan-description {
            font-size: 0.8rem;
            color: #ccc;
            text-align: center;
            margin-bottom: 1rem;
        }
        .invest-btn {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #239b56);
            border: none;
            padding: 0.7rem;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .invest-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
        .invest-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover {
            transform: translateY(-3px);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
            transition: 0.2s;
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label {
            color: #2ecc71;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #0A0A0C;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1001;
            animation: fadeUpOut 2s ease forwards;
        }
        .toast.error {
            background: #ef4444;
            color: white;
        }
        @keyframes fadeUpOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
        }
        @media (max-width: 600px) {
            .plan-image { height: 120px; }
            .plan-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">📦 J Product Plans</div>
    <div id="loadingIndicator" class="loader"></div>
    <div class="plans-grid" id="plansGrid"></div>
</div>

<!-- Bottom Navigation (6 icons) -->
<div class="bottom-nav">
    <div class="nav-item" data-page="dashboard.html">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="mkvip.html">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" data-page="jproduct.html">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" data-page="income.html">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" data-page="team.html">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" data-page="me.html">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<canvas id="fireworksCanvas" class="fireworks-canvas"></canvas>

<script>
    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // Helper functions
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showToast(message, isError = false) {
        const oldToast = document.querySelector('.toast');
        if (oldToast) oldToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            if (toast.parentNode) toast.remove();
        }, 2500);
    }

    let fireworksAnimationId = null;
    function showFireworks() {
        const canvas = document.getElementById('fireworksCanvas');
        if (!canvas) return;
        if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        let particles = [];
        for (let i = 0; i < 120; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 1,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let anyAlive = false;
            for (let p of particles) {
                if (p.life <= 0) continue;
                anyAlive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            if (anyAlive) {
                fireworksAnimationId = requestAnimationFrame(animate);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fireworksAnimationId = null;
            }
        }
        fireworksAnimationId = requestAnimationFrame(animate);
        setTimeout(() => {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }, 2500);
    }

    function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
    }

    function addWeekdays(startDate, days) {
        let result = new Date(startDate);
        let added = 0;
        while (added < days) {
            result.setDate(result.getDate() + 1);
            if (!isWeekend(result)) added++;
        }
        return result;
    }

    // Load plans from Firestore (jproductPlans collection)
    async function loadPlans() {
        const loadingDiv = document.getElementById('loadingIndicator');
        const grid = document.getElementById('plansGrid');
        try {
            loadingDiv.style.display = 'block';
            grid.innerHTML = '';
            const snapshot = await db.collection('jproductPlans').orderBy('createdAt', 'desc').get();
            loadingDiv.style.display = 'none';
            if (snapshot.empty) {
                grid.innerHTML = '<div class="empty-msg">No investment plans available. Please check back later.</div>';
                return;
            }
            const plans = [];
            snapshot.forEach(doc => {
                plans.push({ id: doc.id, ...doc.data() });
            });
            renderPlans(plans);
        } catch (err) {
            console.error(err);
            loadingDiv.style.display = 'none';
            grid.innerHTML = '<div class="empty-msg">Failed to load plans. Please refresh.</div>';
        }
    }

    function renderPlans(plans) {
        const grid = document.getElementById('plansGrid');
        grid.innerHTML = '';
        plans.forEach(plan => {
            // Compute total income as daily * days
            const totalIncome = (plan.dailyReturn ? (plan.investAmount * plan.dailyReturn / 100 * plan.days) : plan.totalIncome) || (plan.daily * plan.days);
            const dailyAmount = plan.dailyReturn ? (plan.investAmount * plan.dailyReturn / 100) : plan.daily;
            const card = document.createElement('div');
            card.className = 'plan-card';
            card.innerHTML = `
                <img class="plan-image" src="${plan.image || 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg'}" alt="${escapeHtml(plan.name)}">
                <div class="plan-content">
                    <div class="plan-title">${escapeHtml(plan.name)}</div>
                    <div class="plan-lock">${escapeHtml(plan.lock || 'Purchased 1 time and locked')}</div>
                    <div class="plan-details">
                        <div class="detail-item"><span class="detail-label">Invest:</span><span class="detail-value">${plan.investAmount || plan.invest} ZMW</span></div>
                        <div class="detail-item"><span class="detail-label">Days:</span><span class="detail-value">${plan.days} Days</span></div>
                        <div class="detail-item"><span class="detail-label">Daily:</span><span class="detail-value">${dailyAmount} ZMW</span></div>
                        <div class="detail-item"><span class="detail-label">Expiry:</span><span class="detail-value">${plan.expiry || 'Auto'}</span></div>
                    </div>
                    <div class="total-income">💰 TOTAL INCOME: ${totalIncome} ZMW</div>
                    <div class="plan-description">${escapeHtml(plan.description || '')}</div>
                    <button class="invest-btn" data-plan='${JSON.stringify({
                        name: plan.name,
                        invest: plan.investAmount || plan.invest,
                        days: plan.days,
                        daily: dailyAmount,
                        dailyReturnPercent: plan.dailyReturn,
                        image: plan.image,
                        lock: plan.lock,
                        expiry: plan.expiry,
                        totalIncome: totalIncome,
                        description: plan.description
                    })}'>💎 INVEST NOW</button>
                </div>
            `;
            grid.appendChild(card);
        });
        // Attach invest handlers
        document.querySelectorAll('.invest-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const plan = JSON.parse(btn.dataset.plan);
                await investInPlan(plan);
            });
        });
    }

    async function investInPlan(plan) {
        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        const userId = user.uid;
        const investAmount = plan.invest;
        const userDoc = await db.collection('users').doc(userId).get();
        if (!userDoc.exists) {
            showToast('User data not found.', true);
            return;
        }
        const currentBalance = userDoc.data().balance || 0;
        if (currentBalance < investAmount) {
            showToast(`Insufficient balance! You need ${investAmount} ZMW.`, true);
            return;
        }
        const btns = document.querySelectorAll('.invest-btn');
        btns.forEach(btn => btn.disabled = true);
        try {
            let startDate = new Date();
            if (isWeekend(startDate)) {
                startDate.setDate(startDate.getDate() + (8 - startDate.getDay()));
                startDate.setHours(0, 0, 0, 0);
            }
            const businessDays = plan.days;
            const businessEndDate = addWeekdays(startDate, businessDays);
            const dailyReturnPercent = (plan.daily / plan.invest) * 100;
            await db.runTransaction(async (transaction) => {
                const userRef = db.collection('users').doc(userId);
                const userSnap = await transaction.get(userRef);
                const newBalance = userSnap.data().balance - investAmount;
                if (newBalance < 0) throw new Error('Insufficient balance');
                transaction.update(userRef, { balance: newBalance });
                const investmentRef = db.collection('investments').doc();
                transaction.set(investmentRef, {
                    userId: userId,
                    planName: plan.name,
                    investAmount: investAmount,
                    dailyReturn: dailyReturnPercent,
                    days: plan.days,
                    businessDays: businessDays,
                    startDate: firebase.firestore.Timestamp.fromDate(startDate),
                    businessEndDate: firebase.firestore.Timestamp.fromDate(businessEndDate),
                    status: 'active',
                    totalReturn: 0
                });
            });
            await db.collection('transactions').add({
                userId: userId,
                type: 'investment',
                amount: investAmount,
                description: `Purchased ${plan.name}`,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showFireworks();
            showToast(`✅ Success! Invested ${investAmount} ZMW in ${plan.name}. Redirecting...`);
            setTimeout(() => {
                window.location.href = 'history.html';
            }, 2000);
        } catch (err) {
            showToast(err.message, true);
            btns.forEach(btn => btn.disabled = false);
        }
    }

    // Auth check and load plans
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadPlans();
    });

    // Bottom navigation active state
    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'jproduct.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
