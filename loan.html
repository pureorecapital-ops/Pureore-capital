<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Loans – PC • Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --orange: #f97316;
            --orange-glow: rgba(249, 115, 22, 0.20);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- COUNTRY SCROLLING (FLAGS) ----- */
        .flags-container {
            border-radius: 60px;
            padding: 0.3rem 0;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(10, 8, 21, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .flags-marquee {
            display: flex;
            animation: scrollFlags 28s linear infinite;
            width: fit-content;
            align-items: center;
        }

        .flag-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            margin: 0 1rem;
        }

        .flag-item .flag-emoji {
            font-size: 1.6rem;
            line-height: 1;
        }

        .flag-item .flag-name {
            font-size: 0.55rem;
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @keyframes scrollFlags {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.5rem 1.8rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .glass-card .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .glass-card .card-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- ELIGIBILITY CARD ----- */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        @media (max-width: 450px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
        }

        .status-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-item .label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0.1rem 0;
        }

        .status-item .value.pass {
            color: var(--green);
        }
        .status-item .value.fail {
            color: var(--red);
        }

        .status-item .sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .eligibility-message {
            font-size: 0.85rem;
            text-align: center;
            padding: 0.4rem;
            border-radius: var(--radius-sm);
            margin-top: 0.4rem;
        }

        .eligibility-message.pass {
            color: var(--green);
            background: rgba(74, 222, 128, 0.04);
            border: 1px solid rgba(74, 222, 128, 0.06);
        }

        .eligibility-message.fail {
            color: var(--red);
            background: rgba(239, 68, 68, 0.04);
            border: 1px solid rgba(239, 68, 68, 0.06);
        }

        /* ----- AMOUNT BUTTONS ----- */
        .amount-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .amount-btn:hover {
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
        }

        .amount-btn.active {
            background: rgba(246, 201, 110, 0.06);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(246, 201, 110, 0.02);
        }

        /* ----- INPUTS ----- */
        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0.2rem;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(93, 217, 242, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }

        /* ----- CALCULATOR RESULT ----- */
        .repay-result {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 0.4rem;
            background: rgba(246, 201, 110, 0.02);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(246, 201, 110, 0.04);
            color: var(--gold);
            margin-top: 0.4rem;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ----- BUTTONS ----- */
        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0a0815;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 30px var(--gold-glow);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            margin-top: 0.3rem;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-primary:hover::after {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--gold-glow);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-primary.repay {
            background: linear-gradient(135deg, var(--green), #22c55e);
            box-shadow: 0 4px 30px var(--green-glow);
            color: #0a0815;
        }

        .btn-primary.repay:hover {
            box-shadow: 0 8px 40px var(--green-glow);
        }

        /* ----- MESSAGE BOX ----- */
        .msg-box {
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 500;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
            border: 1px solid transparent;
        }

        .msg-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.06);
            border-color: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
        }

        .msg-box.success {
            display: block;
            background: rgba(74, 222, 128, 0.06);
            border-color: rgba(74, 222, 128, 0.12);
            color: #6ee7b7;
        }

        /* ----- LOAN ITEM ----- */
        .loan-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.7rem 0.8rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .loan-item:hover {
            border-color: rgba(255, 255, 255, 0.06);
        }

        .loan-item .loan-info {
            font-size: 0.85rem;
        }

        .loan-item .loan-info .loan-amount {
            font-weight: 700;
            color: var(--gold);
        }

        .loan-item .loan-info .loan-detail {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }

        .loan-item .loan-action .btn-small {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--green), #22c55e);
            color: #0a0815;
            box-shadow: 0 4px 20px var(--green-glow);
        }

        .loan-item .loan-action .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--green-glow);
        }

        .loan-item .loan-action .btn-small:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ----- OVERDUE NOTICE ----- */
        .overdue-notice {
            background: rgba(239, 68, 68, 0.04);
            border: 1px solid rgba(239, 68, 68, 0.06);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #fca5a5;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .overdue-notice svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 0.8rem 0;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.85rem;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .glass-card {
                padding: 1.2rem 1rem 1.4rem;
            }
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
            .amount-btn {
                font-size: 0.65rem;
                padding: 0.2rem 0.6rem;
            }
            .loan-item {
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
            }
            .loan-item .loan-action {
                align-self: flex-end;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item .nav-label {
                font-size: 0.45rem;
            }
            .flags-container {
                padding: 0.2rem 0;
            }
            .flag-item {
                min-width: 50px;
                margin: 0 0.6rem;
            }
            .flag-item .flag-emoji {
                font-size: 1.2rem;
            }
            .flag-item .flag-name {
                font-size: 0.5rem;
            }
        }

        @media (max-width: 400px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            .repay-result {
                font-size: 1rem;
            }
            .amount-grid {
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="6 6 18 6 6 18 18 18" />
                    </svg>
                </div>
                <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                <span class="brand-badge">Loan</span>
            </div>
        </div>

        <!-- ===== BACK ROW ===== -->
        <div class="back-row">
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
                Back
            </button>
        </div>

        <!-- ===== PAGE TITLE ===== -->
        <div class="page-title">🏦 Loan Center</div>
        <div class="page-sub">Borrow funds to grow your investments</div>

        <!-- ===== FLAGS MARQUEE ===== -->
        <div class="flags-container">
            <div class="flags-marquee" id="flagsMarquee"></div>
        </div>

        <!-- ===== ELIGIBILITY CARD ===== -->
        <div class="glass-card" id="eligibilityCard">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Eligibility Status
            </div>
            <div class="status-grid" id="eligibilityGrid"></div>
            <div id="eligibilityMessage" class="eligibility-message"></div>
        </div>

        <!-- ===== REQUEST LOAN ===== -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Request New Loan
            </div>

            <div class="form-group">
                <label>Select Amount (multiples of 6,000 ZMW)</label>
                <div class="amount-grid" id="loanAmountBtns"></div>
            </div>

            <div class="form-group">
                <label>Or enter custom amount</label>
                <input type="number" id="loanAmountInput" placeholder="e.g., 6000" min="6000" step="6000" />
            </div>

            <div class="form-group">
                <label>💸 Payback Calculator (15% interest, 15 days)</label>
                <input type="number" id="paybackInput" placeholder="Enter amount to calculate" />
                <div id="paybackResult" class="repay-result">Enter an amount</div>
            </div>

            <button class="btn-primary" id="requestLoanBtn">Request Loan</button>
            <div id="loanMessage" class="msg-box"></div>
        </div>

        <!-- ===== REPAY LOAN ===== -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                Active Loans
            </div>
            <div id="activeLoansList">
                <div class="empty-state">Loading your active loans...</div>
            </div>
            <div id="repayMessage" class="msg-box"></div>
            <div class="overdue-notice">
                <svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Overdue loans: If not repaid within 15 days, your account may be blocked and legal action may be taken.
            </div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <img class="nav-icon" src="https://i.ibb.co/qM4qxgGj/file-00000000248871f4bb1e73df45bacb92.png" alt="Home" />
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="mkvip.html">
            <img class="nav-icon" src="https://i.ibb.co/5WSyHGRZ/IMG-20260622-183230.jpg" alt="Mkvip" />
            <span class="nav-label">Mkvip</span>
        </button>
        <button class="nav-item" data-page="jproduct.html">
            <img class="nav-icon" src="https://i.ibb.co/1fzvRd58/IMG-20260622-183217.jpg" alt="Jproduct" />
            <span class="nav-label">Jproduct</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <img class="nav-icon" src="https://i.ibb.co/60hq0ds8/IMG-20260622-183154.jpg" alt="Income" />
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item active" data-page="loan.html">
            <img class="nav-icon" src="https://i.ibb.co/QRRSRzC/IMG-20260622-183120.jpg" alt="Loan" />
            <span class="nav-label">Loan</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <img class="nav-icon" src="https://i.ibb.co/JwY3HLVx/IMG-20260622-WA5359.jpg" alt="Me" />
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // DOM REFS
        // ================================================================
        var loanAmountBtnsContainer = document.getElementById('loanAmountBtns');
        var loanAmountInput = document.getElementById('loanAmountInput');
        var paybackInput = document.getElementById('paybackInput');
        var paybackResult = document.getElementById('paybackResult');
        var requestBtn = document.getElementById('requestLoanBtn');
        var loanMessage = document.getElementById('loanMessage');
        var activeLoansList = document.getElementById('activeLoansList');
        var repayMessage = document.getElementById('repayMessage');
        var eligibilityGrid = document.getElementById('eligibilityGrid');
        var eligibilityMessage = document.getElementById('eligibilityMessage');

        var currentUserId = null;

        // ================================================================
        // GENERATE AMOUNT BUTTONS
        // ================================================================
        function generateLoanButtons() {
            var container = loanAmountBtnsContainer;
            if (!container) return;
            container.innerHTML = '';
            for (var i = 6000; i <= 100000; i += 6000) {
                var btn = document.createElement('button');
                btn.className = 'amount-btn';
                btn.textContent = i.toLocaleString() + ' ZMW';
                btn.dataset.amount = i;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.amount-btn').forEach(function(b) { b.classList.remove(
                        'active'); });
                    this.classList.add('active');
                    loanAmountInput.value = this.dataset.amount;
                    calculatePayback(parseFloat(this.dataset.amount));
                });
                container.appendChild(btn);
            }
        }

        // ================================================================
        // CALCULATE PAYBACK
        // ================================================================
        function calculatePayback(amount) {
            if (!amount || amount < 6000) {
                paybackResult.textContent = 'Enter an amount (min 6,000 ZMW)';
                return;
            }
            var total = amount * 1.15;
            paybackResult.textContent = '💰 You will repay: ' + total.toFixed(2) + ' ZMW after 15 days';
        }

        // ================================================================
        // ELIGIBILITY CHECKS
        // ================================================================
        async function hasExistingActiveOrPendingLoan(userId) {
            var snap = await db.collection('loans')
                .where('userId', '==', userId)
                .where('status', 'in', ['pending', 'active'])
                .limit(1)
                .get();
            return !snap.empty;
        }

        async function getTotalInvested(userId) {
            var snap = await db.collection('investments').where('userId', '==', userId).get();
            var total = 0;
            snap.forEach(function(doc) { total += doc.data().investAmount || 0; });
            return total;
        }

        async function checkEligibility(userId) {
            var userDoc = await db.collection('users').doc(userId).get();
            if (!userDoc.exists) return { eligible: false, reason: 'User not found.' };
            var userData = userDoc.data();
            var balance = userData.balance || 0;
            if (balance < 10000) {
                return { eligible: false, reason: '❌ Balance must be ≥ 10,000 ZMW. You have ' + balance.toFixed(2) +
                        ' ZMW.' };
            }

            var investmentsAny = await db.collection('investments').where('userId', '==', userId).limit(1).get();
            if (investmentsAny.empty) {
                return { eligible: false, reason: '❌ You must purchase at least one investment plan before applying for a loan.' };
            }

            var totalInvested = await getTotalInvested(userId);
            if (totalInvested < 15000) {
                return { eligible: false, reason: '❌ Total invested must be ≥ 15,000 ZMW. Current: ' + totalInvested
                        .toFixed(2) + ' ZMW.' };
            }

            var referralCode = userData.referralCode;
            if (!referralCode) {
                return { eligible: false, reason: '❌ Referral code missing. Contact support.' };
            }

            var referredUsers = await db.collection('users').where('referredBy', '==', referralCode).get();
            var qualifiedReferred = 0;
            for (var doc of referredUsers.docs) {
                var refId = doc.id;
                var deposits = await db.collection('deposits').where('userId', '==', refId).where('status', '==',
                    'completed').limit(1).get();
                var hasDeposit = !deposits.empty;
                var inv = await db.collection('investments').where('userId', '==', refId).limit(1).get();
                var hasInvestment = !inv.empty;
                if (hasDeposit && hasInvestment) qualifiedReferred++;
            }
            if (qualifiedReferred < 15) {
                return { eligible: false, reason: '❌ Need at least 15 team members with deposit+investment. Current: ' +
                        qualifiedReferred + '/15.' };
            }

            if (userData.canRequestLoan === false) {
                return { eligible: false, reason: '❌ You are not allowed to request a new loan. Please contact admin after repaying previous loan.' };
            }

            return { eligible: true, balance: balance, qualifiedReferred: qualifiedReferred, totalInvested: totalInvested };
        }

        // ================================================================
        // UPDATE ELIGIBILITY UI
        // ================================================================
        async function updateEligibilityUI(userId) {
            var userDoc = await db.collection('users').doc(userId).get();
            if (!userDoc.exists) return;
            var userData = userDoc.data();
            var balance = userData.balance || 0;
            var totalInvested = await getTotalInvested(userId);
            var referralCode = userData.referralCode;
            var qualifiedReferred = 0;
            if (referralCode) {
                var referredUsers = await db.collection('users').where('referredBy', '==', referralCode).get();
                for (var doc of referredUsers.docs) {
                    var refId = doc.id;
                    var deposits = await db.collection('deposits').where('userId', '==', refId).where('status', '==',
                        'completed').limit(1).get();
                    var hasDeposit = !deposits.empty;
                    var inv = await db.collection('investments').where('userId', '==', refId).limit(1).get();
                    var hasInvestment = !inv.empty;
                    if (hasDeposit && hasInvestment) qualifiedReferred++;
                }
            }
            var eligibility = await checkEligibility(userId);

            eligibilityGrid.innerHTML = `
                <div class="status-item">
                    <div class="label">💰 Balance</div>
                    <div class="value ${balance >= 10000 ? 'pass' : 'fail'}">${balance.toFixed(2)} ZMW</div>
                    <div class="sub">≥ 10,000 required</div>
                </div>
                <div class="status-item">
                    <div class="label">📈 Total Invested</div>
                    <div class="value ${totalInvested >= 15000 ? 'pass' : 'fail'}">${totalInvested.toFixed(2)} ZMW</div>
                    <div class="sub">≥ 15,000 required</div>
                </div>
                <div class="status-item">
                    <div class="label">👥 Qualified Team</div>
                    <div class="value ${qualifiedReferred >= 15 ? 'pass' : 'fail'}">${qualifiedReferred}/15</div>
                    <div class="sub">with deposit+investment</div>
                </div>
                <div class="status-item">
                    <div class="label">🔑 Referral Code</div>
                    <div class="value ${referralCode ? 'pass' : 'fail'}">${referralCode || 'Missing'}</div>
                    <div class="sub">Must exist</div>
                </div>
            `;

            if (eligibility.eligible) {
                eligibilityMessage.className = 'eligibility-message pass';
                eligibilityMessage.textContent = '✅ You are eligible to request a loan!';
            } else {
                eligibilityMessage.className = 'eligibility-message fail';
                eligibilityMessage.textContent = eligibility.reason;
            }
        }

        // ================================================================
        // LOAD ACTIVE LOANS
        // ================================================================
        async function loadActiveLoans(userId) {
            var snap = await db.collection('loans')
                .where('userId', '==', userId)
                .where('status', '==', 'active')
                .orderBy('dueDate', 'asc')
                .get();

            if (snap.empty) {
                activeLoansList.innerHTML = '<div class="empty-state">No active loans to repay.</div>';
                return;
            }

            var html = '';
            snap.forEach(function(doc) {
                var loan = doc.data();
                var dueDate = loan.dueDate ? loan.dueDate.toDate().toLocaleDateString() : 'N/A';
                html += `
                    <div class="loan-item">
                        <div class="loan-info">
                            <div class="loan-amount">${loan.amount.toFixed(2)} ZMW</div>
                            <div class="loan-detail">To Repay: ${loan.repayTotal.toFixed(2)} ZMW • Due: ${dueDate}</div>
                        </div>
                        <div class="loan-action">
                            <button class="btn-small repay-btn" data-id="${doc.id}" data-amount="${loan.repayTotal}">Repay ${loan.repayTotal.toFixed(2)} ZMW</button>
                        </div>
                    </div>
                `;
            });
            activeLoansList.innerHTML = html;

            document.querySelectorAll('.repay-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var loanId = this.dataset.id;
                    var repayAmount = parseFloat(this.dataset.amount);
                    repayLoan(loanId, repayAmount);
                });
            });
        }

        // ================================================================
        // REPAY LOAN
        // ================================================================
        async function repayLoan(loanId, repayAmount) {
            var user = auth.currentUser;
            if (!user) { window.location.href = 'login.html'; return; }
            try {
                await db.runTransaction(async function(transaction) {
                    var userRef = db.collection('users').doc(user.uid);
                    var userSnap = await transaction.get(userRef);
                    var currentBalance = userSnap.data().balance || 0;
                    if (currentBalance < repayAmount) {
                        throw new Error('Insufficient balance. You need ' + repayAmount.toFixed(2) + ' ZMW.');
                    }
                    var newBalance = currentBalance - repayAmount;
                    transaction.update(userRef, { balance: newBalance, canRequestLoan: false });
                    var loanRef = db.collection('loans').doc(loanId);
                    transaction.update(loanRef, { status: 'paid', repaidAt: firebase.firestore.FieldValue
                            .serverTimestamp() });
                    var txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        userId: user.uid,
                        type: 'loan_repayment',
                        amount: repayAmount,
                        description: 'Loan repayment of K' + repayAmount.toFixed(2),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                showToast('✅ Loan repaid successfully! K' + repayAmount.toFixed(2) + ' deducted.', false);
                repayMessage.className = 'msg-box success';
                repayMessage.textContent = '✅ Loan repaid successfully! K' + repayAmount.toFixed(2) + ' deducted. New loan requests require admin approval.';
                repayMessage.style.display = 'block';
                await loadActiveLoans(user.uid);
                await updateEligibilityUI(user.uid);
            } catch (err) {
                showToast(err.message, true);
                repayMessage.className = 'msg-box error';
                repayMessage.textContent = err.message;
                repayMessage.style.display = 'block';
            }
        }

        // ================================================================
        // SHOW MESSAGE HELPER
        // ================================================================
        function showLoanMessage(msg, isError) {
            loanMessage.className = 'msg-box ' + (isError ? 'error' : 'success');
            loanMessage.textContent = msg;
            loanMessage.style.display = 'block';
            setTimeout(function() {
                loanMessage.style.display = 'none';
            }, 5000);
        }

        // ================================================================
        // AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            watchBlockStatus(currentUserId);

            generateLoanButtons();
            await updateEligibilityUI(currentUserId);
            await loadActiveLoans(currentUserId);

            // Listen to loan amount input
            loanAmountInput.addEventListener('input', function() {
                var val = parseFloat(this.value);
                if (!isNaN(val) && val >= 6000) {
                    calculatePayback(val);
                } else {
                    paybackResult.textContent = 'Enter an amount (min 6,000 ZMW)';
                }
            });

            // Listen to payback input
            paybackInput.addEventListener('input', function() {
                var val = parseFloat(this.value);
                if (!isNaN(val) && val >= 6000) {
                    calculatePayback(val);
                } else {
                    paybackResult.textContent = 'Enter an amount (min 6,000 ZMW)';
                }
            });

            // Request loan
            requestBtn.addEventListener('click', async function() {
                var loanAmount = parseFloat(loanAmountInput.value);
                if (isNaN(loanAmount) || loanAmount < 6000 || loanAmount > 100000 || loanAmount % 6000 !== 0) {
                    showLoanMessage('Enter a loan amount between 6,000 and 100,000 ZMW (in multiples of 6,000).',
                        true);
                    return;
                }
                var hasLoan = await hasExistingActiveOrPendingLoan(currentUserId);
                if (hasLoan) {
                    showLoanMessage('❌ You already have a pending or active loan. Wait for approval or repay first.',
                        true);
                    return;
                }
                var eligibility = await checkEligibility(currentUserId);
                if (!eligibility.eligible) {
                    showLoanMessage(eligibility.reason, true);
                    return;
                }
                var repayTotal = loanAmount * 1.15;
                var dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + 15);
                try {
                    await db.collection('loans').add({
                        userId: currentUserId,
                        amount: loanAmount,
                        repayTotal: repayTotal,
                        status: 'pending',
                        dueDate: firebase.firestore.Timestamp.fromDate(dueDate),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showLoanMessage('✅ Loan request submitted for ' + loanAmount.toFixed(2) +
                        ' ZMW. Admin will review.', false);
                    loanAmountInput.value = '';
                    paybackResult.textContent = 'Enter an amount';
                    document.querySelectorAll('.amount-btn').forEach(function(b) { b.classList.remove('active'); });
                } catch (err) {
                    showLoanMessage('Error: ' + err.message, true);
                }
            });
        });

        // ================================================================
        // FLAGS MARQUEE
        // ================================================================
        var countries = [
            { name: "UK", emoji: "🇬🇧" },
            { name: "Congo", emoji: "🇨🇬" },
            { name: "Tanzania", emoji: "🇹🇿" },
            { name: "Ghana", emoji: "🇬🇭" },
            { name: "Zimbabwe", emoji: "🇿🇼" },
            { name: "Zambia", emoji: "🇿🇲" }
        ];
        var marquee = document.getElementById('flagsMarquee');
        var flagHtml = '';
        for (var r = 0; r < 2; r++) {
            for (var c = 0; c < countries.length; c++) {
                flagHtml += '<div class="flag-item"><div class="flag-emoji">' + countries[c].emoji +
                    '</div><div class="flag-name">' + countries[c].name + '</div></div>';
            }
        }
        marquee.innerHTML = flagHtml;

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'loan.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · Loan (redesigned)');
        console.log('🏦 Glass-morphism with SVG icons');
        console.log('🔐 Firebase config untouched');
    </script>

</body>
</html>
