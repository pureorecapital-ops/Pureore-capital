<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Loans | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .loan-amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .loan-amount-btn {
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .loan-amount-btn:hover, .loan-amount-btn.active {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            border-color: #e67e22;
        }
        .calculator {
            background: #111116;
            border-radius: 24px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
        }
        .repay-total {
            font-size: 1.4rem;
            font-weight: 800;
            color: #f1c40f;
        }
        input, select {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            background: #1E1E2A;
            color: white;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #e67e22, #d35400);
            padding: 1rem;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-repay {
            background: linear-gradient(135deg, #2ecc71, #239b56);
        }
        .alert-card {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            text-align: center;
            border-radius: 28px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .warning-img {
            width: 80px;
            margin: 0 auto;
        }
        .eligibility-fail {
            color: #ef4444;
            text-align: center;
            margin-top: 1rem;
        }
        .overdue-note {
            font-size: 0.75rem;
            color: #aaa;
            text-align: center;
            margin-top: 0.5rem;
        }
        .loan-item {
            background: #111116;
            border-radius: 24px;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .loan-details {
            font-size: 0.85rem;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label { color: #2ecc71; }
        @media (max-width: 600px) {
            .loan-amount-btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">🏦 Loan Center</div>

    <div id="alertContainer"></div>

    <!-- Request Loan Section -->
    <div id="loanContent" class="card">
        <h3>📌 Request New Loan</h3>
        <div class="loan-amount-buttons" id="loanAmountBtns"></div>
        <div class="calculator">
            <label>💰 Enter amount to borrow (ZMW)</label>
            <input type="number" id="loanAmountInput" placeholder="e.g., 6000" min="6000" step="6000">
        </div>
        <div class="calculator">
            <label>💸 Pay back calculator (15% interest, 15 days)</label>
            <input type="number" id="paybackInput" placeholder="Enter amount to calculate">
            <div id="paybackResult" class="repay-total" style="margin-top: 0.5rem;"></div>
        </div>
        <button id="requestLoanBtn" class="btn-primary">Request Loan</button>
        <div id="loanMessage" class="eligibility-fail"></div>
    </div>

    <!-- Repay Loan Section -->
    <div id="repaySection" class="card">
        <h3>💰 Repay Active Loan</h3>
        <div id="activeLoansList"></div>
        <div id="repayMessage" class="eligibility-fail"></div>
        <div class="overdue-note">
            ⚠️ Overdue loans: If not repaid within 15 days, your account may be blocked and legal action may be taken.
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item" data-page="dashboard.html">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="mkvip.html">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" data-page="jproduct.html">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" data-page="income.html">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" data-page="team.html">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" data-page="me.html">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script>
    // Helper functions
    function showMessage(elementId, msg, isError = true) {
        const el = document.getElementById(elementId);
        if (el) {
            el.innerHTML = `<div class="${isError ? 'eligibility-fail' : 'success'}" style="margin-top:0.5rem;">${msg}</div>`;
            setTimeout(() => { if (el.innerHTML.includes(msg)) el.innerHTML = ''; }, 5000);
        }
    }

    // Generate loan amount buttons from 6000 to 100000 step 6000
    function generateLoanButtons() {
        const container = document.getElementById('loanAmountBtns');
        const amounts = [];
        for (let i = 6000; i <= 100000; i += 6000) amounts.push(i);
        amounts.forEach(amt => {
            const btn = document.createElement('button');
            btn.className = 'loan-amount-btn';
            btn.innerText = amt.toLocaleString() + ' ZMW';
            btn.dataset.amount = amt;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.loan-amount-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('loanAmountInput').value = amt;
                calculatePayback(amt);
            });
            container.appendChild(btn);
        });
    }

    // Calculate payback amount (15% interest)
    function calculatePayback(amount) {
        if (!amount || amount < 6000) return;
        const interest = amount * 0.15;
        const total = amount + interest;
        document.getElementById('paybackResult').innerHTML = `You need to pay back: ${total.toFixed(2)} ZMW after 15 days`;
    }

    // Eligibility checks for new loan
    async function checkEligibility(userId) {
        // 1. Balance > 10000
        const userDoc = await db.collection('users').doc(userId).get();
        const balance = userDoc.exists ? userDoc.data().balance || 0 : 0;
        if (balance < 10000) return { eligible: false, reason: '❌ Balance must be at least 10,000 ZMW to request a loan.' };

        // 2. Has at least one investment (any status)
        const investments = await db.collection('investments').where('userId', '==', userId).limit(1).get();
        if (investments.empty) return { eligible: false, reason: '❌ You must purchase at least one investment plan before applying for a loan.' };

        // 3. Referred at least 15 members who have deposited & invested
        const userData = userDoc.data();
        const referralCode = userData.referralCode;
        const referredUsers = await db.collection('users').where('referredBy', '==', referralCode).get();
        let qualifiedReferred = 0;
        for (const doc of referredUsers.docs) {
            const refId = doc.id;
            const deposits = await db.collection('deposits').where('userId', '==', refId).where('status', '==', 'completed').limit(1).get();
            const hasDeposit = !deposits.empty;
            const inv = await db.collection('investments').where('userId', '==', refId).limit(1).get();
            const hasInvestment = !inv.empty;
            if (hasDeposit && hasInvestment) qualifiedReferred++;
        }
        if (qualifiedReferred < 15) return { eligible: false, reason: `❌ You need at least 15 team members who have both deposited and invested. Current: ${qualifiedReferred}/15` };

        return { eligible: true, balance, qualifiedReferred };
    }

    // Check if account is restricted (admin toggled red)
    async function isAccountRestricted(userId) {
        const userDoc = await db.collection('users').doc(userId).get();
        return userDoc.exists && userDoc.data().restricted === true;
    }

    // Show restriction alert
    async function showRestrictionAlert(userId) {
        const restricted = await isAccountRestricted(userId);
        const alertContainer = document.getElementById('alertContainer');
        const loanContent = document.getElementById('loanContent');
        const repaySection = document.getElementById('repaySection');
        if (restricted) {
            alertContainer.innerHTML = `
                <div class="alert-card">
                    <img src="https://i.ibb.co/jP1hv722/file-000000005c4071fd8f0804a576ae6ac1.png" class="warning-img" alt="Alert">
                    <h3>⚠️ Account Restricted</h3>
                    <p>Your account has been flagged due to suspicious activity or large withdrawals. Please contact admin to resolve.</p>
                    <button id="talkToAdminBtn" class="btn-primary" style="background:#ef4444; margin-top:0.5rem;">Talk to Admin</button>
                </div>
            `;
            loanContent.style.display = 'none';
            repaySection.style.display = 'none';
            document.getElementById('talkToAdminBtn')?.addEventListener('click', () => {
                window.open('https://wa.me/260951359357', '_blank');
            });
        } else {
            alertContainer.innerHTML = '';
            loanContent.style.display = 'block';
            repaySection.style.display = 'block';
        }
    }

    // Load active loans for repayment
    async function loadActiveLoans(userId) {
        const snapshot = await db.collection('loans')
            .where('userId', '==', userId)
            .where('status', '==', 'active')
            .orderBy('dueDate', 'asc')
            .get();
        const container = document.getElementById('activeLoansList');
        if (snapshot.empty) {
            container.innerHTML = '<p>No active loans to repay.</p>';
            return;
        }
        let html = '';
        snapshot.forEach(doc => {
            const loan = doc.data();
            const dueDate = loan.dueDate.toDate().toLocaleDateString();
            html += `
                <div class="loan-item">
                    <div class="loan-details">
                        <strong>Amount: K${loan.amount}</strong><br>
                        To Repay: K${loan.repayTotal}<br>
                        Due: ${dueDate}
                    </div>
                    <button class="btn-primary btn-repay repay-btn" data-id="${doc.id}" data-amount="${loan.repayTotal}">Repay K${loan.repayTotal}</button>
                </div>
            `;
        });
        container.innerHTML = html;

        // Attach repay handlers
        document.querySelectorAll('.repay-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const loanId = btn.dataset.id;
                const repayAmount = parseFloat(btn.dataset.amount);
                await repayLoan(loanId, repayAmount);
            });
        });
    }

    // Repay loan function
    async function repayLoan(loanId, repayAmount) {
        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        try {
            await db.runTransaction(async (transaction) => {
                const userRef = db.collection('users').doc(user.uid);
                const userSnap = await transaction.get(userRef);
                const currentBalance = userSnap.data().balance || 0;
                if (currentBalance < repayAmount) {
                    throw new Error('Insufficient balance to repay this loan.');
                }
                const newBalance = currentBalance - repayAmount;
                transaction.update(userRef, { balance: newBalance });

                const loanRef = db.collection('loans').doc(loanId);
                transaction.update(loanRef, { status: 'paid' });

                // Record transaction
                const txRef = db.collection('transactions').doc();
                transaction.set(txRef, {
                    userId: user.uid,
                    type: 'loan_repayment',
                    amount: repayAmount,
                    description: `Loan repayment of K${repayAmount}`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            showMessage('repayMessage', '✅ Loan repaid successfully!', false);
            // Refresh active loans list
            loadActiveLoans(user.uid);
            // Also refresh any other UI if needed
        } catch (err) {
            showMessage('repayMessage', err.message, true);
        }
    }

    // Main logic
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        const userId = user.uid;
        generateLoanButtons();
        await showRestrictionAlert(userId);
        await loadActiveLoans(userId);

        const loanAmountInput = document.getElementById('loanAmountInput');
        const paybackInput = document.getElementById('paybackInput');
        const requestBtn = document.getElementById('requestLoanBtn');

        loanAmountInput.addEventListener('input', () => {
            let val = parseFloat(loanAmountInput.value);
            if (!isNaN(val) && val >= 6000) {
                calculatePayback(val);
            } else {
                document.getElementById('paybackResult').innerHTML = '';
            }
        });

        paybackInput.addEventListener('input', () => {
            let val = parseFloat(paybackInput.value);
            if (!isNaN(val) && val >= 6000) {
                const interest = val * 0.15;
                const total = val + interest;
                document.getElementById('paybackResult').innerHTML = `You need to pay back: ${total.toFixed(2)} ZMW after 15 days`;
            } else {
                document.getElementById('paybackResult').innerHTML = '';
            }
        });

        requestBtn.addEventListener('click', async () => {
            const loanAmount = parseFloat(loanAmountInput.value);
            if (isNaN(loanAmount) || loanAmount < 6000 || loanAmount > 100000) {
                showMessage('loanMessage', 'Enter a loan amount between 6,000 and 100,000 ZMW (in multiples of 6,000).');
                return;
            }
            const eligibility = await checkEligibility(userId);
            if (!eligibility.eligible) {
                showMessage('loanMessage', eligibility.reason);
                return;
            }
            const restricted = await isAccountRestricted(userId);
            if (restricted) {
                showMessage('loanMessage', 'Your account is restricted. Contact admin first.');
                return;
            }
            const repayTotal = loanAmount * 1.15;
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 15);
            try {
                await db.collection('loans').add({
                    userId: userId,
                    amount: loanAmount,
                    repayTotal: repayTotal,
                    status: 'pending', // admin will approve
                    dueDate: firebase.firestore.Timestamp.fromDate(dueDate),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showMessage('loanMessage', `✅ Loan request submitted for ${loanAmount} ZMW. Admin will review.`, false);
                loanAmountInput.value = '';
                document.getElementById('paybackResult').innerHTML = '';
                // Reset active button highlight
                document.querySelectorAll('.loan-amount-btn').forEach(b => b.classList.remove('active'));
            } catch (err) {
                showMessage('loanMessage', 'Error: ' + err.message);
            }
        });
    });

    // Bottom navigation active state and redirection
    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'loan.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
