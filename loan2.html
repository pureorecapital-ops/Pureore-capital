<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Admin Loans – VisionCore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 90px;
            color: #ffffff;
            position: relative;
            background: #000;
        }

        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMS5Sxbd/file-00000000ec2c820c9d79849d4a3d6b82.png');
            background-size: cover;
            background-position: center;
            filter: blur(14px) brightness(0.25) saturate(0.7);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        .page-header {
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }
        .page-header h1 span {
            color: #60a5fa;
        }
        .page-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .glass-card .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .glass-card .card-title svg {
            width: 18px;
            height: 18px;
            stroke: #60a5fa;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .loan-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.7rem 0.8rem;
            margin-bottom: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .loan-item:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .loan-item .loan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .loan-item .loan-user {
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .loan-item .loan-user .loan-email {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
        }

        .loan-item .loan-amount {
            font-weight: 700;
            color: #facc15;
            font-size: 1rem;
        }

        .loan-item .loan-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .loan-item .loan-details span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loan-item .loan-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }

        .btn-approve {
            padding: 0.3rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }

        .btn-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
        }

        .btn-reject {
            padding: 0.3rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.08);
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, 0.12);
        }

        .btn-approve:disabled,
        .btn-reject:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 1.5rem 0;
            font-size: 0.85rem;
        }

        .badge-pending {
            background: rgba(250, 204, 21, 0.06);
            color: #facc15;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }

        .badge-active {
            background: rgba(74, 222, 128, 0.06);
            color: #4ade80;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            border: 1px solid rgba(74, 222, 128, 0.06);
        }

        .badge-paid {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            border: 1px solid rgba(96, 165, 250, 0.06);
        }

        .badge-rejected {
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.06);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }
        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }
        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        @media (max-width: 500px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .logo-sub {
                font-size: 0.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .glass-card {
                padding: 1.2rem 1rem;
                border-radius: 24px;
            }
            .loan-item .loan-header {
                flex-direction: column;
                align-items: stretch;
            }
            .loan-item .loan-actions {
                justify-content: flex-end;
            }
            .back-btn {
                font-size: 0.65rem;
                padding: 0.3rem 0.8rem;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-bg"></div>

    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo-text">Vision<span class="vc">Core</span></a>
            <span class="logo-sub">powered by <span class="highlight">Pureore Capital</span></span>
        </div>
        <div class="header-right">
            <a href="loan.html" class="back-btn">← Back</a>
        </div>
    </header>

    <main class="container">

        <div class="page-header">
            <h1>⚖️ <span>Admin Loans</span></h1>
            <p>Review and manage loan requests</p>
        </div>

        <!-- Pending Loans -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Pending Requests
            </div>
            <div id="pendingLoansList">
                <div class="empty-state">Loading pending loans...</div>
            </div>
        </div>

        <!-- Active Loans Overview -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                Active Loans Overview
            </div>
            <div id="activeLoansOverview">
                <div class="empty-state">Loading active loans...</div>
            </div>
        </div>

    </main>

    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item marketplace" data-page="marketplace.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="nav-label">Market</span>
        </button>
        <button class="nav-item active" data-page="loan.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="6 6 18 6 6 18 18 18"/></svg>
            <span class="nav-label">Loan</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' } [m]; });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            // Check admin role
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists || userDoc.data().role !== 'admin') {
                showToast('Access denied. Admin only.', true);
                setTimeout(function() { window.location.href = 'dashboard.html'; }, 1500);
                return;
            }
            loadPendingLoans();
            loadActiveLoansOverview();
        });

        async function loadPendingLoans() {
            var container = document.getElementById('pendingLoansList');
            var snap = await db.collection('loans')
                .where('status', '==', 'pending')
                .orderBy('createdAt', 'desc')
                .get();

            if (snap.empty) {
                container.innerHTML = '<div class="empty-state">No pending loan requests.</div>';
                return;
            }

            var html = '';
            for (var doc of snap.docs) {
                var loan = doc.data();
                var userDoc = await db.collection('users').doc(loan.userId).get();
                var userName = userDoc.exists ? userDoc.data().fullName : 'Unknown User';
                var userEmail = userDoc.exists ? userDoc.data().email : 'No email';
                var dueDate = loan.dueDate ? loan.dueDate.toDate().toLocaleDateString() : 'N/A';
                var requestedAt = loan.createdAt ? loan.createdAt.toDate().toLocaleString() : 'N/A';

                html += `
                    <div class="loan-item">
                        <div class="loan-header">
                            <div>
                                <div class="loan-user">${escapeHtml(userName)}</div>
                                <div class="loan-user" style="font-size:0.7rem; color:rgba(255,255,255,0.15);">${escapeHtml(userEmail)}</div>
                            </div>
                            <div class="loan-amount">${loan.amount.toFixed(2)} ZMW</div>
                        </div>
                        <div class="loan-details">
                            <span>📅 ${requestedAt}</span>
                            <span>💸 Repay: ${loan.repayTotal.toFixed(2)} ZMW</span>
                            <span>📆 Due: ${dueDate}</span>
                            <span><span class="badge-pending">Pending</span></span>
                        </div>
                        <div class="loan-actions">
                            <button class="btn-approve" data-id="${doc.id}" data-userid="${loan.userId}" data-amount="${loan.amount}" data-repay="${loan.repayTotal}">✅ Approve</button>
                            <button class="btn-reject" data-id="${doc.id}">❌ Reject</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

            document.querySelectorAll('.btn-approve').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var loanId = this.dataset.id;
                    var userId = this.dataset.userid;
                    var amount = parseFloat(this.dataset.amount);
                    var repayTotal = parseFloat(this.dataset.repay);
                    approveLoan(loanId, userId, amount, repayTotal, this);
                });
            });

            document.querySelectorAll('.btn-reject').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var loanId = this.dataset.id;
                    rejectLoan(loanId, this);
                });
            });
        }

        async function approveLoan(loanId, userId, amount, repayTotal, btn) {
            if (!confirm('Approve this loan for ' + amount.toFixed(2) + ' ZMW?')) return;
            btn.disabled = true;
            btn.textContent = '⏳...';

            try {
                await db.runTransaction(async function(transaction) {
                    var userRef = db.collection('users').doc(userId);
                    var userSnap = await transaction.get(userRef);
                    var currentBalance = userSnap.data().balance || 0;
                    var newBalance = currentBalance + amount;
                    transaction.update(userRef, {
                        balance: newBalance,
                        canRequestLoan: false
                    });
                    var loanRef = db.collection('loans').doc(loanId);
                    transaction.update(loanRef, {
                        status: 'active',
                        approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        approvedBy: auth.currentUser.uid
                    });
                    var txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        userId: userId,
                        type: 'loan_approved',
                        amount: amount,
                        description: 'Loan approved: +' + amount.toFixed(2) + ' ZMW',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                showToast('✅ Loan approved! K' + amount.toFixed(2) + ' added to user balance.', false);
                loadPendingLoans();
                loadActiveLoansOverview();
            } catch (err) {
                showToast('❌ Error: ' + err.message, true);
                btn.disabled = false;
                btn.textContent = '✅ Approve';
            }
        }

        async function rejectLoan(loanId, btn) {
            if (!confirm('Reject this loan request?')) return;
            btn.disabled = true;
            btn.textContent = '⏳...';

            try {
                await db.collection('loans').doc(loanId).update({
                    status: 'rejected',
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: auth.currentUser.uid
                });
                showToast('❌ Loan rejected.', false);
                loadPendingLoans();
            } catch (err) {
                showToast('❌ Error: ' + err.message, true);
                btn.disabled = false;
                btn.textContent = '❌ Reject';
            }
        }

        async function loadActiveLoansOverview() {
            var container = document.getElementById('activeLoansOverview');
            var snap = await db.collection('loans')
                .where('status', '==', 'active')
                .orderBy('dueDate', 'asc')
                .get();

            if (snap.empty) {
                container.innerHTML = '<div class="empty-state">No active loans.</div>';
                return;
            }

            var html = '';
            var totalOutstanding = 0;
            for (var doc of snap.docs) {
                var loan = doc.data();
                totalOutstanding += loan.repayTotal || 0;
                var userDoc = await db.collection('users').doc(loan.userId).get();
                var userName = userDoc.exists ? userDoc.data().fullName : 'Unknown';
                var dueDate = loan.dueDate ? loan.dueDate.toDate().toLocaleDateString() : 'N/A';

                html += `
                    <div class="loan-item">
                        <div class="loan-header">
                            <div>
                                <div class="loan-user">${escapeHtml(userName)}</div>
                            </div>
                            <div class="loan-amount">${loan.amount.toFixed(2)} ZMW</div>
                        </div>
                        <div class="loan-details">
                            <span>💸 Repay: ${loan.repayTotal.toFixed(2)} ZMW</span>
                            <span>📆 Due: ${dueDate}</span>
                            <span><span class="badge-active">Active</span></span>
                        </div>
                    </div>
                `;
            }
            var summary = `<div style="background:rgba(250,204,21,0.04); border-radius:12px; padding:0.6rem; margin-bottom:0.8rem; border:1px solid rgba(250,204,21,0.04); text-align:center; color:#facc15; font-weight:700;">Total Outstanding: ${totalOutstanding.toFixed(2)} ZMW</div>`;
            container.innerHTML = summary + html;
        }

        document.querySelectorAll('.nav-item').forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (window.location.pathname.includes('loan2.html') && targetPage === 'loan.html') {
                item.classList.add('active');
            }
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('🔐 Admin Loan Panel · Approve/reject loans');
    </script>
</body>
</html>
