<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Sajvera Capital – Loan Application</title>

    <!-- ============================================================
         FIREBASE SDKs – Load these in the <head>
         ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ──────────────────────────────────────────────
           RESET & BASE
        ────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1120;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 30px;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ================================================================
           FULL SCREEN LOADING OVERLAY
        ================================================================ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: #facc15;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .loading-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            max-width: 320px;
        }

        /* ================================================================
           BACK BUTTON
        ================================================================ */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 0;
            margin-bottom: 4px;
            transition: color 0.2s;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            align-self: flex-start;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ================================================================
           PAGE HEADER
        ================================================================ */
        .page-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .page-header .branch-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            margin-bottom: 4px;
        }

        .badge-flex {
            background: rgba(250, 204, 21, 0.06);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }
        .badge-support {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.06);
        }
        .badge-goldmine {
            background: rgba(245, 158, 11, 0.06);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.06);
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .page-header h1 span {
            color: #facc15;
        }

        .page-header .provider {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
        }

        /* ================================================================
           ERROR CARD
        ================================================================ */
        .error-card {
            background: rgba(248, 113, 113, 0.04);
            border: 1px solid rgba(248, 113, 113, 0.06);
            border-radius: 20px;
            padding: 20px 18px;
            text-align: center;
            margin-top: 10px;
        }

        .error-card .error-icon {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .error-card .error-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f87171;
            margin-bottom: 4px;
        }

        .error-card .error-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .error-card .btn-retry {
            padding: 0.6rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .error-card .btn-retry:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
        }

        /* ================================================================
           SUMMARY CARD
        ================================================================ */
        .summary-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px 18px 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary-card .summary-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 2px;
        }

        .summary-card .summary-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: #facc15;
            margin: 2px 0 2px;
        }

        .summary-card .summary-amount .currency {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            margin-right: 2px;
        }

        .summary-card .summary-level {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        .summary-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 10px 0 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .summary-row .label {
            color: rgba(255, 255, 255, 0.3);
        }

        .summary-row .value {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        .summary-row .value.gold {
            color: #facc15;
        }
        .summary-row .value.blue {
            color: #60a5fa;
        }
        .summary-row .value.green {
            color: #4ade80;
        }

        /* Repayment breakdown (PureOre Support) */
        .repayment-breakdown {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 14px;
            margin: 8px 0 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .repayment-breakdown .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.8rem;
        }

        .repayment-breakdown .breakdown-row .label {
            color: rgba(255, 255, 255, 0.2);
        }

        .repayment-breakdown .breakdown-row .value {
            font-weight: 600;
        }

        .repayment-breakdown .breakdown-total {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
            padding-top: 4px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .repayment-breakdown .breakdown-note {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 4px;
            text-align: center;
        }

        /* ================================================================
           TERMS CONFIRMATION
        ================================================================ */
        .terms-section {
            margin: 14px 0 10px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .terms-section .terms-title {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 6px;
        }

        .terms-section .term-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 3px 0;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            line-height: 1.4;
        }

        .terms-section .term-item .check {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.6rem;
            margin-top: 1px;
        }

        .terms-section .term-item .check.done {
            color: #4ade80;
        }

        .terms-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.2s;
        }

        .terms-checkbox:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .terms-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #facc15;
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms-checkbox label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-weight: 500;
        }

        /* ================================================================
           CONTINUE BUTTON
        ================================================================ */
        .btn-continue {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0b1120;
            margin-top: 4px;
        }

        .btn-continue:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(250, 204, 21, 0.15);
            transform: translateY(-2px);
        }

        .btn-continue:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ================================================================
           RESPONSIVE
        ================================================================ */
        @media (max-width: 480px) {
            body {
                padding: 14px 12px 20px;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .summary-card .summary-amount {
                font-size: 2.2rem;
            }
            .repayment-breakdown .breakdown-row {
                font-size: 0.75rem;
            }
            .terms-section .term-item {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
    FULL SCREEN LOADING OVERLAY
    ================================================================ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-title" id="loadingTitle">Preparing your loan application...</div>
        <div class="loading-sub" id="loadingSub">Please wait while we verify your loan information.</div>
    </div>

    <!-- ================================================================
    MAIN CONTENT
    ================================================================ -->
    <div class="container" id="mainContent" style="display:none;">

        <!-- Back button -->
        <button class="back-link" id="backBtn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </button>

        <!-- Page header (dynamic) -->
        <div class="page-header" id="pageHeader">
            <div class="branch-badge" id="branchBadge">Sajvera Flex</div>
            <h1>Loan <span>Application</span></h1>
            <div class="provider" id="providerText">Sajvera Capital</div>
        </div>

        <!-- Content area -->
        <div id="contentArea">
            <!-- Will be populated by JS -->
        </div>

    </div>

    <!-- ================================================================
    JAVASCRIPT – FIREBASE INTEGRATION
    ================================================================ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG – Your project credentials
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };

        // ================================================================
        // INITIALIZE FIREBASE (only once)
        // ================================================================
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // AUTH STATE CHECK – Redirect if not logged in
        // ================================================================
        var authResolved = false;
        var redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                console.log('✅ User logged in:', user.uid, user.email);
                if (!window._initialized) {
                    window._initialized = true;
                    init();
                }
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                console.log('❌ No user found. Redirecting to login...');
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // HELPER FUNCTIONS
        // ================================================================
        function getCurrentUser() {
            return auth.currentUser;
        }

        function logoutUser() {
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            }).catch(function(err) {
                console.warn('Logout error:', err);
            });
        }

        // ================================================================
        // BRANCH DEFINITIONS (same as loan.html)
        // ================================================================
        var BRANCHES = {
            sajvera_flex: {
                id: 'sajvera_flex',
                name: 'Sajvera Flex',
                provider: 'Sajvera Capital',
                firstAmount: 200,
                progression: 200,
                repaymentDays: 15,
                tag: 'Flexible',
                badgeClass: 'badge-flex',
                fee: null,
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var actBal = data.activityBalance || 0;
                    result.requirements.push({
                        label: 'Activity Balance',
                        current: actBal,
                        required: 3000,
                        pass: actBal >= 3000
                    });
                    var invited = data.invitedMembers || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 30,
                        pass: invited >= 30
                    });
                    var investments = data.activeInvestments || [];
                    var qualifying = investments.filter(function(inv) {
                        return inv.amount >= 350 && inv.amount <= 600;
                    });
                    result.requirements.push({
                        label: 'Qualifying plans (K350-K600 each)',
                        current: qualifying.length,
                        required: 2,
                        pass: qualifying.length >= 2
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'sajvera_flex' && h.status === 'completed';
                    });
                    return 200 + (completed.length * 200);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'sajvera_flex' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            },
            pureore_support: {
                id: 'pureore_support',
                name: 'PureOre Support',
                provider: 'PureOre Capital',
                firstAmount: 600,
                progression: 300,
                repaymentDays: 20,
                tag: 'Short-term',
                badgeClass: 'badge-support',
                fee: { type: 'percentage', rate: 20 },
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var invited = data.invitedMembers || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 50,
                        pass: invited >= 50
                    });
                    var investments = data.supportInvestments || [];
                    var qualifying = investments.filter(function(inv) {
                        return inv.amount >= 900 && inv.amount <= 1600;
                    });
                    result.requirements.push({
                        label: 'Qualifying plans (K900-K1600 each)',
                        current: qualifying.length,
                        required: 1,
                        pass: qualifying.length >= 1
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'pureore_support' && h.status === 'completed';
                    });
                    return 600 + (completed.length * 300);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'pureore_support' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            },
            goldmine_advance: {
                id: 'goldmine_advance',
                name: 'GoldMine Advance',
                provider: 'Gold Mining',
                firstAmount: 3000,
                progression: 500,
                repaymentDays: 25,
                tag: 'Premium',
                badgeClass: 'badge-goldmine',
                fee: null,
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var inv = data.goldmineInvestment || {};
                    var invAmount = inv.amount || 0;
                    result.requirements.push({
                        label: 'Investment amount',
                        current: invAmount,
                        required: 'K2,500 – K5,000',
                        pass: invAmount >= 2500 && invAmount <= 5000
                    });
                    var invited = data.goldmineInvited || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 100,
                        pass: invited >= 100
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'goldmine_advance' && h.status === 'completed';
                    });
                    return 3000 + (completed.length * 500);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'goldmine_advance' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            }
        };

        // ================================================================
        // DOM REFS
        // ================================================================
        var loadingOverlay = document.getElementById('loadingOverlay');
        var loadingTitle = document.getElementById('loadingTitle');
        var loadingSub = document.getElementById('loadingSub');
        var mainContent = document.getElementById('mainContent');
        var contentArea = document.getElementById('contentArea');
        var branchBadge = document.getElementById('branchBadge');
        var providerText = document.getElementById('providerText');
        var backBtn = document.getElementById('backBtn');

        // ================================================================
        // STATE
        // ================================================================
        var currentUser = null;
        var userData = null;
        var selectedBranchId = null;
        var branch = null;
        var amount = 0;
        var level = 0;
        var eligibilityResult = null;
        var isAgreed = false;

        // ================================================================
        // GET URL PARAMETERS
        // ================================================================
        function getUrlParams() {
            var params = new URLSearchParams(window.location.search);
            return {
                branch: params.get('branch'),
                amount: params.get('amount'),
                days: params.get('days')
            };
        }

        // ================================================================
        // FETCH USER DATA FROM FIRESTORE – FIXED: using 'loans' collection
        // ================================================================
        async function fetchUserData(uid) {
            // Fetch user document
            var userDoc = await db.collection('users').doc(uid).get();
            if (!userDoc.exists) {
                throw new Error('User data not found.');
            }
            var data = userDoc.data();

            // ------------------------------------------------------------
            // LOAN HISTORY – now from the 'loans' collection
            // ------------------------------------------------------------
            var loanHistorySnapshot = await db.collection('loans')
                .where('userId', '==', uid)
                .get();

            var loanHistory = [];
            var activeLoan = null;
            var pendingLoan = null;
            var completedLoans = [];

            loanHistorySnapshot.forEach(function(doc) {
                var loan = doc.data();
                loan.id = doc.id;
                loanHistory.push(loan);
                if (loan.status === 'active' || loan.status === 'approved') {
                    activeLoan = loan;
                }
                if (loan.status === 'pending') {
                    pendingLoan = loan;
                }
                if (loan.status === 'completed') {
                    completedLoans.push(loan);
                }
            });

            // We only need completed loans for progression
            var result = {
                id: uid,
                fullName: data.fullName || '',
                email: data.email || '',
                activityBalance: data.activityBalance || 0,
                invitedMembers: data.invitedMembers || 0,
                activeInvestments: data.activeInvestments || [],
                supportInvestments: data.supportInvestments || [],
                goldmineInvestment: data.goldmineInvestment || { amount: 0 },
                goldmineInvited: data.goldmineInvited || 0,
                loanHistory: completedLoans,
                activeLoan: activeLoan,
                pendingLoan: pendingLoan
            };

            return result;
        }

        // ================================================================
        // PERFORM VERIFICATION (using real data)
        // ================================================================
        async function performVerification() {
            var user = getCurrentUser();
            if (!user) {
                throw new Error('You must be logged in.');
            }

            var params = getUrlParams();
            var branchId = params.branch;

            // Validate branch
            if (!branchId || !BRANCHES[branchId]) {
                throw new Error('Invalid loan branch.');
            }

            // Fetch user data
            var data = await fetchUserData(user.uid);

            // Check for active or pending loan
            if (data.activeLoan) {
                throw new Error('You already have an active loan.');
            }
            if (data.pendingLoan) {
                throw new Error('You already have a pending loan application.');
            }

            // Check branch eligibility
            var branchObj = BRANCHES[branchId];
            var result = branchObj.check(data);
            if (!result.eligible) {
                throw new Error('Your eligibility has changed. Please return to the loan page and check again.');
            }

            // Calculate amount and level
            var amount = branchObj.getAmount(data);
            var level = branchObj.getLevel(data);

            return {
                branchId: branchId,
                branch: branchObj,
                userData: data,
                amount: amount,
                level: level,
                eligibility: result
            };
        }

        // ================================================================
        // RENDER CONTENT
        // ================================================================
        function renderContent(result) {
            var branchObj = result.branch;
            var amount = result.amount;
            var level = result.level;
            var data = result.userData;
            var isFlex = branchObj.id === 'sajvera_flex';
            var isSupport = branchObj.id === 'pureore_support';
            var isGoldmine = branchObj.id === 'goldmine_advance';

            // Update header
            branchBadge.textContent = branchObj.name;
            branchBadge.className = 'branch-badge ' + branchObj.badgeClass;
            providerText.textContent = branchObj.provider;

            // Build content
            var html = '';

            // Summary Card
            html += '<div class="summary-card">';
            html += '<div class="summary-title">Eligible Loan Amount</div>';
            html += '<div class="summary-amount"><span class="currency">K</span>' + amount + '</div>';
            html += '<div class="summary-level">Level ' + level + ' · ' + branchObj.tag + '</div>';

            html += '<div class="summary-divider"></div>';

            // Repayment period
            html += '<div class="summary-row">';
            html += '<span class="label">Repayment Period</span>';
            html += '<span class="value blue">' + branchObj.repaymentDays + ' Days</span>';
            html += '</div>';

            // For PureOre Support: show fee breakdown
            if (isSupport && branchObj.fee) {
                var feeAmount = amount * (branchObj.fee.rate / 100);
                var totalRepayment = amount + feeAmount;
                html += '<div class="summary-divider"></div>';
                html += '<div class="repayment-breakdown">';
                html += '<div class="breakdown-row"><span class="label">Loan Amount</span><span class="value gold">K' +
                    amount + '</span></div>';
                html +=
                    '<div class="breakdown-row"><span class="label">Loan Charge (' + branchObj.fee.rate + '%)</span><span class="value" style="color:#f87171;">K' +
                    feeAmount + '</span></div>';
                html +=
                    '<div class="breakdown-row breakdown-total"><span class="label">Total Repayment</span><span class="value gold">K' +
                    totalRepayment + '</span></div>';
                html +=
                    '<div class="breakdown-note">The ' + branchObj.fee.rate +
                    '% charge is calculated once on the loan amount. It is not a daily charge.</div>';
                html += '</div>';
            }

            // For Sajvera Flex: no fee yet
            if (isFlex) {
                html += '<div class="summary-divider"></div>';
                html +=
                    '<div style="font-size:0.7rem;color:rgba(255,255,255,0.1);text-align:center;padding:4px 0;">No additional charges apply.</div>';
            }

            // For GoldMine: no fee configured
            if (isGoldmine) {
                html += '<div class="summary-divider"></div>';
                html +=
                    '<div style="font-size:0.7rem;color:rgba(255,255,255,0.1);text-align:center;padding:4px 0;">Repayment charge: <span style="color:#f59e0b;">To be confirmed</span></div>';
            }

            html += '</div>'; // end summary-card

            // Terms section
            html += '<div class="terms-section">';
            html += '<div class="terms-title">Before continuing</div>';
            html +=
                '<div class="term-item"><span class="check done">✓</span> I understand my eligible loan amount.</div>';
            html +=
                '<div class="term-item"><span class="check done">✓</span> I understand the repayment period.</div>';
            if (isSupport) {
                html +=
                    '<div class="term-item"><span class="check done">✓</span> I understand the applicable repayment charge.</div>';
            }
            html +=
                '<div class="term-item"><span class="check done">✓</span> I understand that the next loan level is unlocked only after full repayment.</div>';
            html +=
                '<div class="term-item"><span class="check done">✓</span> I understand that the loan is subject to final approval.</div>';
            html += '</div>';

            // Agreement checkbox
            html += '<div class="terms-checkbox" id="termsCheckboxWrap">';
            html += '<input type="checkbox" id="termsCheckbox" />';
            html += '<label for="termsCheckbox">I agree to the loan terms.</label>';
            html += '</div>';

            // Continue button (disabled initially)
            html += '<button class="btn-continue" id="continueBtn" disabled>Continue to Confirmation</button>';

            contentArea.innerHTML = html;

            // Bind events
            var checkbox = document.getElementById('termsCheckbox');
            var continueBtn = document.getElementById('continueBtn');

            // Click on the whole checkbox area to toggle
            var wrap = document.getElementById('termsCheckboxWrap');
            wrap.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT') return;
                checkbox.checked = !checkbox.checked;
                continueBtn.disabled = !checkbox.checked;
            });

            checkbox.addEventListener('change', function() {
                continueBtn.disabled = !this.checked;
            });

            continueBtn.addEventListener('click', function() {
                if (this.disabled) return;
                // Proceed to loan3.html
                showLoading('Preparing secure confirmation...', 'Please wait');
                setTimeout(function() {
                    var params = new URLSearchParams();
                    params.set('branch', branchObj.id);
                    params.set('amount', amount);
                    params.set('days', branchObj.repaymentDays);
                    window.location.href = 'loan3.html?' + params.toString();
                }, 1000);
            });

            // Store selected branch for back button
            selectedBranchId = branchObj.id;
        }

        // ================================================================
        // SHOW ERROR
        // ================================================================
        function showError(title, message, showRetry) {
            var html = '<div class="error-card">';
            html += '<div class="error-icon">⚠️</div>';
            html += '<div class="error-title">' + title + '</div>';
            html += '<div class="error-desc">' + message + '</div>';
            if (showRetry) {
                html += '<button class="btn-retry" id="retryBtn">Try Again</button>';
            } else {
                html +=
                    '<button class="btn-retry" id="backToLoansBtn" style="border-color:rgba(255,255,255,0.06);">← Back to Loans</button>';
            }
            html += '</div>';
            contentArea.innerHTML = html;

            if (showRetry) {
                document.getElementById('retryBtn').addEventListener('click', function() {
                    window.location.reload();
                });
            } else {
                var btn = document.getElementById('backToLoansBtn');
                if (btn) {
                    btn.addEventListener('click', function() {
                        window.location.href = 'loan.html';
                    });
                }
            }
        }

        // ================================================================
        // SHOW / HIDE LOADING
        // ================================================================
        function showLoading(title, sub) {
            if (title) loadingTitle.textContent = title;
            if (sub) loadingSub.textContent = sub;
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        // ================================================================
        // INITIALIZATION (called after auth is confirmed)
        // ================================================================
        function init() {
            // Show loading overlay
            showLoading('Preparing your loan application...', 'Please wait while we verify your loan information.');

            performVerification().then(function(result) {
                // Store for later use
                branch = result.branch;
                amount = result.amount;
                level = result.level;
                userData = result.userData;
                eligibilityResult = result.eligibility;
                selectedBranchId = result.branchId;

                hideLoading();
                mainContent.style.display = 'block';
                renderContent(result);
            }).catch(function(err) {
                hideLoading();
                mainContent.style.display = 'block';
                var msg = err.message || 'An error occurred.';
                if (msg.includes('Invalid loan branch')) {
                    showError('Invalid Loan Branch', 'The selected branch is not valid. Please return to the loan page.',
                        false);
                } else if (msg.includes('active loan') || msg.includes('pending loan')) {
                    showError('Loan Application Unavailable', 'You already have a pending or unpaid loan.', false);
                } else if (msg.includes('eligibility has changed')) {
                    showError('Eligibility Changed',
                        'Your eligibility has changed. Please return to the loan page and check again.', false);
                } else {
                    showError('Unable to verify your loan information.', msg + ' Please try again.', true);
                }
            });
        }

        // ================================================================
        // BACK BUTTON
        // ================================================================
        backBtn.addEventListener('click', function() {
            window.location.href = 'loan.html';
        });

        // ================================================================
        // START – we wait for auth to be ready (handled by onAuthStateChanged)
        // ================================================================
        console.log('✅ loan2.html loaded with Firebase integration (fixed collection)');
        console.log('ℹ️ User data is fetched from Firestore using `loans` collection.');
        console.log('ℹ️ Eligibility and amount are calculated from real data.');
        console.log('ℹ️ Continues to loan3.html after terms acceptance.');
    </script>
</body>
</html>
