<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Sajvera Capital – Loan Confirmation</title>

    <!-- ============================================================
         FIREBASE SDKs – Load these in the <head>
         ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ──────────────────────────────────────────────
           RESET & BASE
        ────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1120;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 30px;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ================================================================
           FULL SCREEN LOADING OVERLAY
        ================================================================ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: #facc15;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .loading-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            max-width: 320px;
        }

        /* ================================================================
           BACK BUTTON
        ================================================================ */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 0;
            margin-bottom: 4px;
            transition: color 0.2s;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            align-self: flex-start;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ================================================================
           PAGE HEADER
        ================================================================ */
        .page-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .page-header .branch-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            margin-bottom: 4px;
        }

        .badge-flex {
            background: rgba(250, 204, 21, 0.06);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }
        .badge-support {
            background: rgba(96, 165, 250, 0.06);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.06);
        }
        .badge-goldmine {
            background: rgba(245, 158, 11, 0.06);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.06);
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .page-header h1 span {
            color: #facc15;
        }

        .page-header .provider {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
        }

        /* ================================================================
           CONFIRMATION CARD
        ================================================================ */
        .confirm-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px 18px 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confirm-card .summary-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 2px;
        }

        .confirm-card .summary-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: #facc15;
            margin: 2px 0 2px;
        }

        .confirm-card .summary-amount .currency {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            margin-right: 2px;
        }

        .confirm-card .summary-level {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        .confirm-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 10px 0 12px;
        }

        .confirm-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .confirm-row .label {
            color: rgba(255, 255, 255, 0.3);
        }

        .confirm-row .value {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        .confirm-row .value.gold {
            color: #facc15;
        }
        .confirm-row .value.blue {
            color: #60a5fa;
        }
        .confirm-row .value.green {
            color: #4ade80;
        }

        /* Repayment breakdown */
        .repayment-breakdown {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 14px;
            margin: 8px 0 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .repayment-breakdown .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.8rem;
        }

        .repayment-breakdown .breakdown-row .label {
            color: rgba(255, 255, 255, 0.2);
        }

        .repayment-breakdown .breakdown-row .value {
            font-weight: 600;
        }

        .repayment-breakdown .breakdown-total {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
            padding-top: 4px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .repayment-breakdown .breakdown-note {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 4px;
            text-align: center;
        }

        /* ================================================================
           SECURITY SECTION
        ================================================================ */
        .security-section {
            margin-top: 16px;
            padding: 16px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .security-section .security-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 10px;
            text-align: center;
        }

        .security-section .security-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(250, 204, 21, 0.20);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.04);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .form-group .error-msg {
            font-size: 0.7rem;
            color: #f87171;
            margin-top: 4px;
            display: none;
        }

        .form-group .error-msg.show {
            display: block;
        }

        /* ================================================================
           SUBMIT BUTTON
        ================================================================ */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0b1120;
            margin-top: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(250, 204, 21, 0.15);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ================================================================
           SUCCESS OVERLAY (full screen)
        ================================================================ */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .success-overlay .success-icon {
            font-size: 3.6rem;
            margin-bottom: 12px;
        }

        .success-overlay h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .success-overlay .success-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            max-width: 320px;
            margin-bottom: 12px;
        }

        .success-overlay .success-details {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 16px;
            min-width: 200px;
        }

        .success-overlay .success-details .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.8rem;
        }

        .success-overlay .success-details .detail-row .label {
            color: rgba(255, 255, 255, 0.2);
        }

        .success-overlay .success-details .detail-row .value {
            font-weight: 600;
        }

        .success-overlay .status-badge {
            display: inline-block;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: rgba(250, 204, 21, 0.06);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }

        .success-overlay .btn-done {
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0b1120;
        }

        .success-overlay .btn-done:hover {
            box-shadow: 0 8px 28px rgba(250, 204, 21, 0.15);
            transform: translateY(-2px);
        }

        /* ================================================================
           RESPONSIVE
        ================================================================ */
        @media (max-width: 480px) {
            body {
                padding: 14px 12px 20px;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .confirm-card .summary-amount {
                font-size: 2.2rem;
            }
            .repayment-breakdown .breakdown-row {
                font-size: 0.75rem;
            }
            .success-overlay h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
    FULL SCREEN LOADING OVERLAY
    ================================================================ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-title" id="loadingTitle">Preparing secure confirmation...</div>
        <div class="loading-sub" id="loadingSub">Please wait while we securely verify your loan request.</div>
    </div>

    <!-- ================================================================
    SUCCESS OVERLAY (hidden until submission)
    ================================================================ -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">✅</div>
        <h2>Loan Application Submitted</h2>
        <div class="success-sub">Your loan request has been sent to the administration team for review.</div>
        <div class="success-details" id="successDetails">
            <div class="detail-row"><span class="label">Branch</span><span class="value" id="successBranch">—</span></div>
            <div class="detail-row"><span class="label">Amount</span><span class="value" id="successAmount">—</span></div>
            <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status-badge">Pending</span></span></div>
        </div>
        <button class="btn-done" id="goToHistoryBtn">View History</button>
    </div>

    <!-- ================================================================
    MAIN CONTENT
    ================================================================ -->
    <div class="container" id="mainContent" style="display:none;">

        <!-- Back button -->
        <button class="back-link" id="backBtn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </button>

        <!-- Page header -->
        <div class="page-header" id="pageHeader">
            <div class="branch-badge" id="branchBadge">Sajvera Flex</div>
            <h1>Confirm <span>Loan</span></h1>
            <div class="provider" id="providerText">Sajvera Capital</div>
        </div>

        <!-- Confirmation content -->
        <div id="contentArea">
            <!-- Will be populated by JS -->
        </div>

    </div>

    <!-- ================================================================
    JAVASCRIPT – FIREBASE INTEGRATION
    ================================================================ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG – Your project credentials
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };

        // ================================================================
        // INITIALIZE FIREBASE (only once)
        // ================================================================
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // AUTH STATE CHECK – Redirect if not logged in
        // ================================================================
        var authResolved = false;
        var redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                console.log('✅ User logged in:', user.uid, user.email);
                if (!window._initialized) {
                    window._initialized = true;
                    init();
                }
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                console.log('❌ No user found. Redirecting to login...');
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // HELPER FUNCTIONS
        // ================================================================
        function getCurrentUser() {
            return auth.currentUser;
        }

        function logoutUser() {
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            }).catch(function(err) {
                console.warn('Logout error:', err);
            });
        }

        // ================================================================
        // BRANCH DEFINITIONS (same as loan2.html)
        // ================================================================
        var BRANCHES = {
            sajvera_flex: {
                id: 'sajvera_flex',
                name: 'Sajvera Flex',
                provider: 'Sajvera Capital',
                firstAmount: 200,
                progression: 200,
                repaymentDays: 15,
                tag: 'Flexible',
                badgeClass: 'badge-flex',
                fee: null,
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var actBal = data.activityBalance || 0;
                    result.requirements.push({
                        label: 'Activity Balance',
                        current: actBal,
                        required: 3000,
                        pass: actBal >= 3000
                    });
                    var invited = data.invitedMembers || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 30,
                        pass: invited >= 30
                    });
                    var investments = data.activeInvestments || [];
                    var qualifying = investments.filter(function(inv) {
                        return inv.amount >= 350 && inv.amount <= 600;
                    });
                    result.requirements.push({
                        label: 'Qualifying plans (K350-K600 each)',
                        current: qualifying.length,
                        required: 2,
                        pass: qualifying.length >= 2
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'sajvera_flex' && h.status === 'completed';
                    });
                    return 200 + (completed.length * 200);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'sajvera_flex' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            },
            pureore_support: {
                id: 'pureore_support',
                name: 'PureOre Support',
                provider: 'PureOre Capital',
                firstAmount: 600,
                progression: 300,
                repaymentDays: 20,
                tag: 'Short-term',
                badgeClass: 'badge-support',
                fee: { type: 'percentage', rate: 20 },
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var invited = data.invitedMembers || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 50,
                        pass: invited >= 50
                    });
                    var investments = data.supportInvestments || [];
                    var qualifying = investments.filter(function(inv) {
                        return inv.amount >= 900 && inv.amount <= 1600;
                    });
                    result.requirements.push({
                        label: 'Qualifying plans (K900-K1600 each)',
                        current: qualifying.length,
                        required: 1,
                        pass: qualifying.length >= 1
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'pureore_support' && h.status === 'completed';
                    });
                    return 600 + (completed.length * 300);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'pureore_support' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            },
            goldmine_advance: {
                id: 'goldmine_advance',
                name: 'GoldMine Advance',
                provider: 'Gold Mining',
                firstAmount: 3000,
                progression: 500,
                repaymentDays: 25,
                tag: 'Premium',
                badgeClass: 'badge-goldmine',
                fee: null,
                check: function(data) {
                    var result = { eligible: true, requirements: [] };
                    var inv = data.goldmineInvestment || {};
                    var invAmount = inv.amount || 0;
                    result.requirements.push({
                        label: 'Investment amount',
                        current: invAmount,
                        required: 'K2,500 – K5,000',
                        pass: invAmount >= 2500 && invAmount <= 5000
                    });
                    var invited = data.goldmineInvited || 0;
                    result.requirements.push({
                        label: 'Invited Members',
                        current: invited,
                        required: 100,
                        pass: invited >= 100
                    });
                    var hasActiveLoan = data.activeLoan !== null;
                    result.requirements.push({
                        label: 'No outstanding loan',
                        current: hasActiveLoan ? 'Has active loan' : 'None',
                        required: 'No active loan',
                        pass: !hasActiveLoan
                    });
                    result.eligible = result.requirements.every(function(r) { return r.pass; });
                    return result;
                },
                getAmount: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'goldmine_advance' && h.status === 'completed';
                    });
                    return 3000 + (completed.length * 500);
                },
                getLevel: function(data) {
                    var history = data.loanHistory || [];
                    var completed = history.filter(function(h) {
                        return h.branch === 'goldmine_advance' && h.status === 'completed';
                    });
                    return completed.length + 1;
                }
            }
        };

        // ================================================================
        // DOM REFS
        // ================================================================
        var loadingOverlay = document.getElementById('loadingOverlay');
        var loadingTitle = document.getElementById('loadingTitle');
        var loadingSub = document.getElementById('loadingSub');
        var mainContent = document.getElementById('mainContent');
        var contentArea = document.getElementById('contentArea');
        var branchBadge = document.getElementById('branchBadge');
        var providerText = document.getElementById('providerText');
        var backBtn = document.getElementById('backBtn');
        var successOverlay = document.getElementById('successOverlay');
        var goToHistoryBtn = document.getElementById('goToHistoryBtn');

        // ================================================================
        // STATE
        // ================================================================
        var currentUser = null;
        var userData = null;
        var selectedBranchId = null;
        var branch = null;
        var amount = 0;
        var level = 0;
        var days = 0;
        var feeAmount = 0;
        var totalRepayment = 0;
        var eligibilityResult = null;
        var isSubmitting = false;

        // ================================================================
        // GET URL PARAMETERS
        // ================================================================
        function getUrlParams() {
            var params = new URLSearchParams(window.location.search);
            return {
                branch: params.get('branch'),
                amount: params.get('amount'),
                days: params.get('days')
            };
        }

        // ================================================================
        // FETCH USER DATA FROM FIRESTORE – FIXED: using 'loans' collection
        // ================================================================
        async function fetchUserData(uid) {
            // Fetch user document
            var userDoc = await db.collection('users').doc(uid).get();
            if (!userDoc.exists) {
                throw new Error('User data not found.');
            }
            var data = userDoc.data();

            // ------------------------------------------------------------
            // LOAN HISTORY – now from the 'loans' collection
            // ------------------------------------------------------------
            var loanHistorySnapshot = await db.collection('loans')
                .where('userId', '==', uid)
                .get();

            var loanHistory = [];
            var activeLoan = null;
            var pendingLoan = null;
            var completedLoans = [];

            loanHistorySnapshot.forEach(function(doc) {
                var loan = doc.data();
                loan.id = doc.id;
                loanHistory.push(loan);
                if (loan.status === 'active' || loan.status === 'approved') {
                    activeLoan = loan;
                }
                if (loan.status === 'pending') {
                    pendingLoan = loan;
                }
                if (loan.status === 'completed') {
                    completedLoans.push(loan);
                }
            });

            // We only need completed loans for progression
            var result = {
                id: uid,
                fullName: data.fullName || '',
                email: data.email || '',
                phone: data.phone || '',
                activityBalance: data.activityBalance || 0,
                invitedMembers: data.invitedMembers || 0,
                activeInvestments: data.activeInvestments || [],
                supportInvestments: data.supportInvestments || [],
                goldmineInvestment: data.goldmineInvestment || { amount: 0 },
                goldmineInvited: data.goldmineInvited || 0,
                loanHistory: completedLoans,
                activeLoan: activeLoan,
                pendingLoan: pendingLoan
            };

            return result;
        }

        // ================================================================
        // PERFORM FINAL VERIFICATION (using real data)
        // ================================================================
        async function performFinalVerification() {
            var user = getCurrentUser();
            if (!user) {
                throw new Error('You must be logged in.');
            }

            var params = getUrlParams();
            var branchId = params.branch;

            if (!branchId || !BRANCHES[branchId]) {
                throw new Error('Invalid loan branch.');
            }

            var data = await fetchUserData(user.uid);

            if (data.activeLoan) {
                throw new Error('You already have an active loan.');
            }
            if (data.pendingLoan) {
                throw new Error('You already have a pending loan application.');
            }

            var branchObj = BRANCHES[branchId];
            var result = branchObj.check(data);
            if (!result.eligible) {
                throw new Error('Your eligibility has changed. Please return to the loan page and check again.');
            }

            var amount = branchObj.getAmount(data);
            var level = branchObj.getLevel(data);
            var days = branchObj.repaymentDays;
            var feeAmt = 0;
            var totalRepay = amount;
            if (branchObj.fee) {
                feeAmt = amount * (branchObj.fee.rate / 100);
                totalRepay = amount + feeAmt;
            }

            return {
                branchId: branchId,
                branch: branchObj,
                userData: data,
                amount: amount,
                level: level,
                days: days,
                feeAmount: feeAmt,
                totalRepayment: totalRepay,
                eligibility: result
            };
        }

        // ================================================================
        // RENDER CONFIRMATION FORM
        // ================================================================
        function renderConfirmation(result) {
            var branchObj = result.branch;
            var amount = result.amount;
            var level = result.level;
            var days = result.days;
            var feeAmt = result.feeAmount;
            var totalRepay = result.totalRepayment;
            var isSupport = branchObj.id === 'pureore_support';
            var isFlex = branchObj.id === 'sajvera_flex';
            var isGoldmine = branchObj.id === 'goldmine_advance';

            branchBadge.textContent = branchObj.name;
            branchBadge.className = 'branch-badge ' + branchObj.badgeClass;
            providerText.textContent = branchObj.provider;

            var html = '';

            html += '<div class="confirm-card">';
            html += '<div class="summary-title">Loan Summary</div>';
            html += '<div class="summary-amount"><span class="currency">K</span>' + amount + '</div>';
            html += '<div class="summary-level">Level ' + level + ' · ' + branchObj.tag + '</div>';
            html += '<div class="confirm-divider"></div>';
            html += '<div class="confirm-row"><span class="label">Repayment Period</span><span class="value blue">' +
                days + ' Days</span></div>';

            if (isSupport && branchObj.fee) {
                html += '<div class="confirm-divider"></div>';
                html += '<div class="repayment-breakdown">';
                html += '<div class="breakdown-row"><span class="label">Loan Amount</span><span class="value gold">K' +
                    amount + '</span></div>';
                html +=
                    '<div class="breakdown-row"><span class="label">Loan Charge (' + branchObj.fee.rate + '%)</span><span class="value" style="color:#f87171;">K' +
                    feeAmt + '</span></div>';
                html +=
                    '<div class="breakdown-row breakdown-total"><span class="label">Total Repayment</span><span class="value gold">K' +
                    totalRepay + '</span></div>';
                html +=
                    '<div class="breakdown-note">The ' + branchObj.fee.rate +
                    '% charge is calculated once on the loan amount. It is not a daily charge.</div>';
                html += '</div>';
            }

            if (isFlex) {
                html += '<div class="confirm-divider"></div>';
                html +=
                    '<div style="font-size:0.7rem;color:rgba(255,255,255,0.1);text-align:center;padding:4px 0;">No additional charges apply.</div>';
            }

            if (isGoldmine) {
                html += '<div class="confirm-divider"></div>';
                html +=
                    '<div style="font-size:0.7rem;color:rgba(255,255,255,0.1);text-align:center;padding:4px 0;">Repayment charge: <span style="color:#f59e0b;">To be confirmed</span></div>';
            }

            html += '</div>';

            html += '<div class="security-section">';
            html += '<div class="security-title">🔒 Confirm Your Loan Request</div>';
            html +=
                '<div class="security-note">Enter your account password/PIN to confirm this loan request. Your information is secure.</div>';
            html += '<div class="form-group">';
            html += '<label>Password / PIN</label>';
            html += '<input type="password" id="securityInput" placeholder="Enter your password or PIN" />';
            html += '<div class="error-msg" id="securityError">Incorrect password. Please try again.</div>';
            html += '</div>';
            html += '<button class="btn-submit" id="submitBtn">Confirm Loan Request</button>';
            html += '</div>';

            contentArea.innerHTML = html;

            // Attach events
            var submitBtn = document.getElementById('submitBtn');
            var securityInput = document.getElementById('securityInput');
            var securityError = document.getElementById('securityError');

            submitBtn.addEventListener('click', function() {
                if (isSubmitting) return;
                var val = securityInput.value.trim();
                if (!val) {
                    securityError.textContent = 'Please enter your password or PIN.';
                    securityError.classList.add('show');
                    return;
                }
                securityError.classList.remove('show');
                submitLoanRequest();
            });

            securityInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
                securityError.classList.remove('show');
            });

            // Store data for submission
            selectedBranchId = branchObj.id;
            branch = branchObj;
            amount = result.amount;
            level = result.level;
            days = result.days;
            feeAmount = result.feeAmount;
            totalRepayment = result.totalRepayment;
            userData = result.userData;
            eligibilityResult = result.eligibility;
        }

        // ================================================================
        // SUBMIT LOAN REQUEST (to Firestore) – FIXED: writes to 'loans'
        // ================================================================
        async function submitLoanRequest() {
            if (isSubmitting) return;
            isSubmitting = true;
            var submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                // Re‑verify eligibility and check for duplicate loans (prevent race conditions)
                var user = getCurrentUser();
                if (!user) throw new Error('Not logged in.');

                // Fetch user data again
                var data = await fetchUserData(user.uid);
                if (data.activeLoan) throw new Error('You already have an active loan.');
                if (data.pendingLoan) throw new Error('You already have a pending loan application.');

                // Re-check branch
                var branchObj = BRANCHES[selectedBranchId];
                if (!branchObj) throw new Error('Branch not found.');
                var checkResult = branchObj.check(data);
                if (!checkResult.eligible) throw new Error('Eligibility changed. Please return to loan page.');

                // Calculate again (could be same, but safe)
                var finalAmount = branchObj.getAmount(data);
                var finalLevel = branchObj.getLevel(data);
                var finalDays = branchObj.repaymentDays;
                var finalFee = 0;
                var finalTotal = finalAmount;
                if (branchObj.fee) {
                    finalFee = finalAmount * (branchObj.fee.rate / 100);
                    finalTotal = finalAmount + finalFee;
                }

                // Create loan document – uses 'loans' collection
                var loanData = {
                    userId: user.uid,
                    branch: selectedBranchId,        // matches the field used in branch definitions
                    branchName: branchObj.name,
                    amount: finalAmount,
                    level: finalLevel,
                    repaymentDays: finalDays,
                    feeAmount: finalFee,
                    feeRate: branchObj.fee ? branchObj.fee.rate : 0,
                    totalRepayment: finalTotal,
                    status: 'pending',
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    // Optional user info
                    userFullName: data.fullName || '',
                    userPhone: data.phone || '',
                    // Snapshot of eligibility requirements (optional)
                    eligibilitySnapshot: checkResult.requirements
                };

                // Write to Firestore 'loans' collection
                var docRef = await db.collection('loans').add(loanData);

                // Success – show overlay
                document.getElementById('successBranch').textContent = branchObj.name;
                document.getElementById('successAmount').textContent = 'K' + finalAmount;
                successOverlay.classList.add('active');

                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirmed ✓';
                isSubmitting = false;

            } catch (error) {
                console.error('Submission error:', error);
                var securityError = document.getElementById('securityError');
                securityError.textContent = error.message || 'Submission failed. Please try again.';
                securityError.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirm Loan Request';
                isSubmitting = false;
            }
        }

        // ================================================================
        // BACK BUTTON
        // ================================================================
        backBtn.addEventListener('click', function() {
            window.location.href = 'loan.html';
        });

        // ================================================================
        // GO TO HISTORY
        // ================================================================
        goToHistoryBtn.addEventListener('click', function() {
            window.location.href = 'history.html?branch=' + selectedBranchId;
        });

        // ================================================================
        // INITIALIZATION (called after auth is confirmed)
        // ================================================================
        function init() {
            showLoading('Preparing secure confirmation...', 'Please wait while we securely verify your loan request.');

            performFinalVerification().then(function(result) {
                hideLoading();
                mainContent.style.display = 'block';
                renderConfirmation(result);
            }).catch(function(err) {
                hideLoading();
                mainContent.style.display = 'block';
                var msg = err.message || 'An error occurred.';
                if (msg.includes('Invalid loan branch')) {
                    showError('Invalid Loan Branch', 'The selected branch is not valid. Please return to the loan page.');
                } else if (msg.includes('active loan') || msg.includes('pending loan')) {
                    showError('Loan Unavailable', 'You already have an active or pending loan.');
                } else if (msg.includes('eligibility has changed')) {
                    showError('Eligibility Changed', 'Your eligibility has changed. Please return to the loan page and check again.');
                } else {
                    showError('Unable to verify your loan information.', msg + ' Please try again.');
                }
            });
        }

        // ================================================================
        // SHOW / HIDE LOADING
        // ================================================================
        function showLoading(title, sub) {
            if (title) loadingTitle.textContent = title;
            if (sub) loadingSub.textContent = sub;
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        // ================================================================
        // SHOW ERROR (inline, not overlay)
        // ================================================================
        function showError(title, message) {
            var html = '<div class="error-card" style="background:rgba(248,113,113,0.04);border:1px solid rgba(248,113,113,0.06);border-radius:20px;padding:20px 18px;text-align:center;margin-top:10px;">';
            html += '<div style="font-size:2.4rem;margin-bottom:8px;">⚠️</div>';
            html += '<div style="font-size:1.1rem;font-weight:700;color:#f87171;margin-bottom:4px;">' + title + '</div>';
            html += '<div style="font-size:0.85rem;color:rgba(255,255,255,0.3);line-height:1.5;margin-bottom:12px;">' +
                message + '</div>';
            html +=
                '<button class="btn-retry" onclick="window.location.href=\'loan.html\'" style="padding:0.6rem 2rem;border:1px solid rgba(255,255,255,0.06);border-radius:30px;background:transparent;color:rgba(255,255,255,0.3);font-family:inherit;font-weight:600;font-size:0.85rem;cursor:pointer;">← Back to Loans</button>';
            html += '</div>';
            contentArea.innerHTML = html;
        }

        // ================================================================
        // START – wait for auth
        // ================================================================
        console.log('✅ loan3.html loaded with Firebase integration (fixed collection)');
        console.log('ℹ️ User data fetched from Firestore using `loans` collection.');
        console.log('ℹ️ Loan submission writes to `loans` collection.');
    </script>
</body>
</html>
