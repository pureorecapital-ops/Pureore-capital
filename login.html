<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login – Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0A0A0C;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND (Bright & Vibrant) ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/h1VhncPQ/file-00000000aa24724689b8a29a4dd17046.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.85) contrast(1.05);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
            z-index: -1;
        }

        /* ===== FLOATING 4-COLOR ORBS (Lighter, slower) ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(35px);      /* was 80px */
            opacity: 0.35;           /* was 0.6 */
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite alternate; /* slower */
            pointer-events: none;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: #00E676;
            top: 10%; left: -5%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: #00E5FF;
            bottom: 10%; right: -5%;
            animation-delay: 1.5s;
        }
        .orb-3 {
            width: 280px; height: 280px;
            background: #FFD700;
            top: 50%; left: 80%;
            animation-delay: 3s;
        }
        .orb-4 {
            width: 220px; height: 220px;
            background: #2979FF;
            bottom: 20%; left: 10%;
            animation-delay: 4.5s;
        }

        /* Slower, shorter movement */
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15px, -10px) scale(1.05); }
        }

        /* ===== AUTH CONTAINER ===== */
        .auth-container { 
            width: 100%; 
            max-width: 480px; 
            margin: 1rem; 
            animation: fadeSlideUp 0.6s ease; 
            position: relative;
            z-index: 10;
        }

        /* ===== CARD WITH 4-COLOR ANIMATED BORDER (slower) ===== */
        .auth-card {
            position: relative;
            background: rgba(20, 22, 36, 0.75);
            backdrop-filter: blur(6px);   /* was 16px */
            -webkit-backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: conic-gradient(from var(--angle, 0deg), 
                #00E676, #00E5FF, #FFD700, #2979FF, #00E676);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateBorder 8s linear infinite; /* was 4s */
            z-index: -1;
        }
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes rotateBorder {
            to { --angle: 360deg; }
        }

        /* ===== HEADER (4-Color Animated Gradient, slower) ===== */
        h2 { 
            text-align: center; 
            margin-bottom: 1.5rem; 
            font-size: 2rem; 
            background: linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-size: 300% 300%;
            animation: gradientShift 6s ease-in-out infinite alternate; /* was 4s */
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== INPUTS (Animated border, slower) ===== */
        input {
            width: 100%; 
            padding: 0.9rem; 
            margin: 0.6rem 0;
            border-radius: 40px; 
            border: 2px solid transparent;
            background: rgba(255,255,255,0.06);
            color: white; 
            font-size: 1rem;
            transition: 0.3s ease;
            position: relative;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(20,22,36,0.8), rgba(20,22,36,0.8)), 
                              conic-gradient(from var(--angle-input, 0deg), 
                              #00E676, #00E5FF, #FFD700, #2979FF, #00E676);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            animation: rotateInputBorder 8s linear infinite; /* was 4s */
        }
        @property --angle-input {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes rotateInputBorder {
            to { --angle-input: 360deg; }
        }

        input:focus { 
            outline: none; 
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3), 
                        0 0 25px rgba(0, 229, 255, 0.2),
                        0 0 25px rgba(255, 215, 0, 0.2),
                        0 0 25px rgba(41, 121, 255, 0.2);
            transform: scale(1.01);
        }
        input::placeholder {
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* ===== BUTTON (Cycling 4-Color Gradient, slower) ===== */
        .btn {
            width: 100%; 
            background: linear-gradient(135deg, #00E676, #00E5FF, #2979FF);
            background-size: 200% 200%;
            animation: btnShift 6s ease-in-out infinite alternate; /* was 3s */
            padding: 0.9rem; 
            border: none; 
            border-radius: 40px;
            font-weight: bold; 
            font-size: 1rem; 
            color: #0A0A0C; 
            cursor: pointer;
            transition: 0.3s; 
            margin-top: 0.5rem;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
        }
        @keyframes btnShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.01); 
            filter: brightness(1.1);
            box-shadow: 0 8px 30px rgba(0, 229, 255, 0.4);
        }
        .btn:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

        /* ===== AVATAR WRAPPER (Lighter float) ===== */
        #avatar-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            padding: 5px 5px 5px 0;
            animation: fadeSlideIn 0.8s ease-out;
        }
        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            animation: floatAvatar 4s ease-in-out infinite; /* slower */
        }
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); } /* was -6px */
        }
        .avatar-svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 4px 15px rgba(0, 229, 255, 0.4));
        }

        .speech-bubble {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(3px);   /* was 8px */
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px 16px 16px 4px;
            padding: 10px 18px;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid rgba(255, 255, 255, 0.07);
        }
        #greeting-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }
        #greeting-text::after {
            content: '';
            display: inline-block;
            animation: waveHand 1.5s ease-in-out infinite;
            margin-left: 6px;
        }
        @keyframes waveHand {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-10deg); }
        }

        /* ===== OTHER ELEMENTS ===== */
        .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 0.6rem; border-radius: 20px; text-align: center; margin-top: 1rem; }
        .admin-toggle {
            text-align: center;
            margin-top: 1.5rem;
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.2s;
            display: inline-block;
            width: 100%;
            color: #FFD700;
        }
        .admin-toggle:hover { transform: scale(1.1) rotate(10deg); }
        a { color: #00E5FF; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; color: #FFD700; }
        p { color: rgba(255,255,255,0.7); }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ===== 4 ANIMATED COLOR ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- ===== LIVE AVATAR (Above Welcome Back) ===== -->
            <div id="avatar-wrapper">
                <div class="avatar-container">
                    <svg class="avatar-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="url(#avatarGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                        <polyline points="25,65 40,45 55,55 75,35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <circle cx="35" cy="40" r="4.5" fill="#ffffff"/>
                        <circle cx="65" cy="40" r="4.5" fill="#ffffff"/>
                        <path d="M40 55 Q50 66 60 55" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <defs>
                            <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00E676"/>
                                <stop offset="33%" stop-color="#00E5FF"/>
                                <stop offset="66%" stop-color="#FFD700"/>
                                <stop offset="100%" stop-color="#2979FF"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="speech-bubble">
                    <span id="greeting-text">Welcome back!</span>
                </div>
            </div>

            <h2>Welcome Back</h2>

            <form id="loginForm">
                <input type="text" id="loginEmail" placeholder="Email or Phone" required autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn" id="loginBtn">Login</button>
            </form>
            <div id="message"></div>
            <p style="text-align: center; margin-top: 1rem;">
                Don't have an account? <a href="register.html">Register</a>
            </p>
            <div class="admin-toggle" id="adminToggle" aria-label="Admin access"></div>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG (UNTOUCHED) =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        (async function cleanupStaleSession() {
            try {
                await auth.signOut();
                await new Promise(resolve => setTimeout(resolve, 300));
            } catch (e) {
                console.log("Pre-login cleanup (non-critical):", e);
            }
        })();

        function phoneToAgentEmail(phone) {
            const cleaned = phone.replace(/\D/g, '');
            return `agent_${cleaned}@agent.pureore.com`;
        }

        function isPhoneNumber(input) {
            const digits = input.replace(/\D/g, '');
            return digits.length === 12 && digits.startsWith('260');
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';
                messageDiv.innerHTML = '';
                
                let identifier = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                
                if (!identifier || !password) {
                    messageDiv.innerHTML = '<div class="error">Please enter both identifier and password.</div>';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }
                
                let email = identifier;
                if (isPhoneNumber(identifier)) {
                    email = phoneToAgentEmail(identifier);
                }
                
                try {
                    const userCred = await auth.signInWithEmailAndPassword(email, password);
                    const user = userCred.user;
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        await auth.signOut();
                        messageDiv.innerHTML = '<div class="error">Account data missing. Please contact support.</div>';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                        return;
                    }
                    
                    const userData = userDoc.data();
                    
                    if (userData.isBlocked === true) {
                        await auth.signOut();
                        messageDiv.innerHTML = '<div class="error">Your account has been blocked. Contact support.</div>';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                        return;
                    }
                    
                    const role = userData.role || 'user';
                    if (role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (role === 'agent') {
                        window.location.href = 'agent-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                    
                } catch (error) {
                    console.error("Login error:", error);
                    let errorMsg = error.message;
                    if (error.code === 'auth/user-not-found') errorMsg = 'No account found with this identifier.';
                    if (error.code === 'auth/wrong-password') errorMsg = 'Incorrect password.';
                    if (error.code === 'auth/invalid-email') errorMsg = 'Invalid email or phone number format.';
                    if (error.code === 'auth/too-many-requests') errorMsg = 'Too many failed attempts. Try again later.';
                    if (error.code === 'auth/network-request-failed') {
                        errorMsg = 'Network error. Please refresh the page and try again.';
                    }
                    messageDiv.innerHTML = `<div class="error">${errorMsg}</div>`;
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            });
        }

        const adminToggle = document.getElementById('adminToggle');
        if (adminToggle) {
            adminToggle.addEventListener('click', () => {
                const password = prompt(" Enter admin password (admin access only):");
                if (password === "JACKSAJERE") {
                    window.location.href = "admin-login.html";
                } else if (password !== null) {
                    alert("Incorrect password. Access denied.");
                }
            });
        }

        // ===== LIVE AVATAR GREETING LOGIC =====
        (function() {
            const greetEl = document.getElementById('greeting-text');
            if (!greetEl) return;

            const greetings = [
                "Hey there, Investor!",
                "Ready to grow your capital?",
                "Welcome back, Champion!",
                "Let's make today profitable!",
                "Pureore Capital awaits you."
            ];

            let index = 0;
            function rotateGreeting() {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                greetEl.textContent = greetings[index % greetings.length] + ' ';
                index++;
            }

            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    if (this.type === 'password') {
                        greetEl.textContent = 'Secure your future ';
                    } else {
                        greetEl.textContent = 'Let\'s build wealth ';
                    }
                });
                input.addEventListener('blur', function() {
                    greetEl.textContent = 'Welcome back, champ! ';
                    setTimeout(() => {
                        if (document.activeElement?.tagName !== 'INPUT') {
                            greetEl.textContent = greetings[0] + ' ';
                        }
                    }, 2000);
                });
                input.addEventListener('input', function() {
                    if (this.value.length > 3 && this.type !== 'password') {
                        greetEl.textContent = 'Looking sharp! ';
                    }
                });
            });

            setInterval(rotateGreeting, 5000);
            
            setTimeout(() => {
                greetEl.textContent = greetings[Math.floor(Math.random() * greetings.length)] + ' ';
            }, 300);
        })();
    </script>
</body>
</html>
