<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login | PureOre Nexus</title>
    <meta name="description" content="Sign in to your PureOre Nexus automotive investment account." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js",
                "firebase/functions": "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js"
            }
        }
    </script>

    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.3);
            --gold-subtle: rgba(201, 168, 76, 0.08);
            --charcoal: #1a1a1a;
            --dark: #0b0b0b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ============================================================
           LOADING SCREEN
        ============================================================ */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .load-logo-symbol {
            width: 64px;
            height: 64px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: rgba(201, 168, 76, 0.04);
            box-shadow: 0 0 40px rgba(201, 168, 76, 0.06);
            position: relative;
        }
        .load-logo-symbol::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--gold);
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .load-logo-symbol svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .load-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .load-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .load-progress-wrap {
            width: 180px;
            max-width: 60vw;
            margin-top: 1.8rem;
        }
        .load-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .load-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--gold-glow);
            transition: width 0.15s linear;
        }
        .load-msg {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.7rem;
            text-align: center;
            min-height: 1.2em;
            font-weight: 300;
        }

        /* ============================================================
           MAIN CONTAINER
        ============================================================ */
        #main-login {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.9s ease, transform 1s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        #main-login.visible {
            opacity: 1;
            transform: scale(1);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://i.ibb.co/cXxZh1w3/20260824-014737.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.3) 0%, rgba(11, 11, 11, 0.88) 80%, #0b0b0b 100%);
            pointer-events: none;
        }

        .login-scroll {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           LOGIN CARD
        ============================================================ */
        .login-card {
            width: 100%;
            background: rgba(11, 11, 11, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 28px 22px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 60px rgba(201, 168, 76, 0.02);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header .brand-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            text-decoration: none;
        }
        .login-header .brand-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
        }
        .login-header .brand-icon span {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .login-header .brand-icon span em {
            color: var(--gold);
            font-style: normal;
        }
        .login-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: -0.01em;
        }
        .login-header .sub-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 300;
        }

        /* ============================================================
           STEP INDICATOR
        ============================================================ */
        .step-indicators {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 22px;
            position: relative;
        }
        .step-indicators .step-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 400;
            transition: color 0.4s ease;
            position: relative;
        }
        .step-indicators .step-dot .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: transparent;
            transition: all 0.4s ease;
        }
        .step-indicators .step-dot.active .dot {
            border-color: var(--gold);
            background: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .step-indicators .step-dot.done .dot {
            border-color: var(--gold);
            background: var(--gold);
            opacity: 0.5;
        }
        .step-indicators .step-dot.active {
            color: var(--gold);
        }
        .step-indicators .step-dot.done {
            color: var(--text-muted);
        }
        .step-indicators .step-line {
            position: absolute;
            top: 5px;
            left: 15%;
            right: 15%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.06);
            z-index: 0;
        }
        .step-indicators .step-dot {
            z-index: 1;
            background: rgba(11, 11, 11, 0.6);
            padding: 0 4px;
        }

        /* ============================================================
           FORM ELEMENTS
        ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.18);
            font-weight: 300;
        }
        .form-control.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.08);
        }
        .form-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-error {
            font-size: 0.7rem;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 1.2em;
        }

        /* ===== COUNTRY SELECTOR ===== */
        .country-selector-wrap {
            position: relative;
        }
        .country-selector-wrap .form-control {
            cursor: pointer;
            padding-right: 40px;
        }
        .country-selector-wrap .form-control .flag {
            font-size: 1.1rem;
            margin-right: 8px;
        }
        .country-selector-wrap .form-control .code {
            color: var(--text-muted);
            font-weight: 300;
        }
        .country-selector-wrap .chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.6rem;
        }

        .country-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            max-height: 240px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            padding: 6px 0;
        }
        .country-dropdown.open {
            display: block;
        }
        .country-dropdown .search-input {
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-white);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            position: sticky;
            top: 0;
            background: rgba(20, 20, 20, 0.98);
        }
        .country-dropdown .search-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .country-dropdown .country-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.85rem;
        }
        .country-dropdown .country-item:hover,
        .country-dropdown .country-item.highlighted {
            background: rgba(201, 168, 76, 0.08);
        }
        .country-dropdown .country-item .flag {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .country-dropdown .country-item .cname {
            flex: 1;
        }
        .country-dropdown .country-item .ccode {
            color: var(--text-muted);
            font-weight: 300;
        }
        .country-dropdown .no-results {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ===== OTP / PIN BOXES ===== */
        .otp-container,
        .pin-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 6px 0 4px;
        }
        .otp-container .otp-box,
        .pin-container .pin-box {
            width: 44px;
            height: 54px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .otp-container .otp-box:focus,
        .pin-container .pin-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
        }
        .otp-container .otp-box.error,
        .pin-container .pin-box.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.08);
        }
        .pin-container .pin-box {
            font-size: 1.6rem;
            letter-spacing: 0.1em;
        }
        .pin-container .pin-box.hidden-pin {
            -webkit-text-security: disc;
            text-security: disc;
        }

        .pin-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            margin-top: 6px;
            justify-content: center;
        }
        .pin-toggle:hover {
            color: var(--text-white);
        }
        .pin-toggle input[type="checkbox"] {
            accent-color: var(--gold);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* ===== OTP ACTIONS ===== */
        .otp-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        .otp-actions .action-link {
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            transition: color 0.25s ease;
            padding: 4px 0;
            text-decoration: none;
        }
        .otp-actions .action-link:hover:not(:disabled) {
            color: var(--gold);
        }
        .otp-actions .action-link:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .otp-actions .countdown {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.35s ease;
            font-family: inherit;
            position: relative;
            min-height: 54px;
            background: var(--gold);
            color: #0b0b0b;
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.1);
        }
        .btn:hover:not(:disabled) {
            background: #dbb95c;
            box-shadow: 0 0 50px rgba(201, 168, 76, 0.18);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(11, 11, 11, 0.15);
            border-top-color: #0b0b0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        .btn.loading .spinner {
            display: inline-block;
        }
        .btn.loading .btn-text {
            opacity: 0.7;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-white);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.04);
        }

        .btn-outline-gold {
            background: transparent;
            color: var(--gold);
            border: 1.5px solid var(--gold);
            box-shadow: none;
        }
        .btn-outline-gold:hover:not(:disabled) {
            background: rgba(201, 168, 76, 0.06);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.06);
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
            box-shadow: 0 0 30px rgba(192, 57, 43, 0.1);
        }
        .btn-danger:hover:not(:disabled) {
            background: #e74c3c;
            box-shadow: 0 0 40px rgba(192, 57, 43, 0.15);
        }

        /* ============================================================
           STEP CONTAINERS
        ============================================================ */
        .step {
            display: none;
            animation: fadeSlide 0.4s ease forwards;
        }
        .step.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mt-20 {
            margin-top: 20px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }

        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-gold {
            color: var(--gold);
        }
        .text-sm {
            font-size: 0.75rem;
        }
        .text-xs {
            font-size: 0.65rem;
        }
        .fw-300 {
            font-weight: 300;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            margin: 16px 0;
        }

        /* ===== BOTTOM LINKS ===== */
        .bottom-links {
            text-align: center;
            margin-top: 18px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .bottom-links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        .bottom-links a:hover {
            text-decoration: underline;
            color: #dbb95c;
        }
        .bottom-links .link-divider {
            color: rgba(255, 255, 255, 0.08);
            margin: 0 8px;
        }
        .bottom-links .help-link {
            color: var(--text-muted);
            font-weight: 300;
        }
        .bottom-links .help-link:hover {
            color: var(--text-white);
            text-decoration: none;
        }

        /* ============================================================
           MODAL LOADING OVERLAY
        ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(11, 11, 11, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            padding: 32px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay .modal-spinner {
            width: 44px;
            height: 44px;
            border: 2.5px solid rgba(201, 168, 76, 0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .modal-overlay .modal-msg {
            font-size: 0.9rem;
            color: var(--text-white);
            letter-spacing: 0.05em;
            text-align: center;
            font-weight: 300;
        }
        .modal-overlay .modal-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 420px) {
            .login-card {
                padding: 20px 14px 24px;
                border-radius: 14px;
            }
            .login-header h2 {
                font-size: 1.05rem;
            }
            .otp-container .otp-box,
            .pin-container .pin-box {
                width: 38px;
                height: 46px;
                font-size: 1.1rem;
            }
            .pin-container .pin-box {
                font-size: 1.4rem;
            }
            .btn {
                font-size: 0.7rem;
                min-height: 48px;
                padding: 12px 16px;
            }
            .form-control {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .country-dropdown .country-item {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .step-indicators {
                gap: 18px;
            }
            .step-indicators .step-dot {
                font-size: 0.5rem;
            }
            .step-indicators .step-dot .dot {
                width: 8px;
                height: 8px;
            }
            .step-indicators .step-line {
                top: 4px;
                left: 12%;
                right: 12%;
            }
        }

    <!-- ============================================================

        const firebaseConfig = {

        };

        const app = initializeApp(firebaseConfig);

        // ============================================================

        // ============================================================

            { name: 'Italy', code: '+39', iso: 'IT', flag: '🇮🇹' },

            { name: 'Rwanda', code: '+250', iso: 'RW', flag: '🇷🇼' },

        ];
        countries.sort((a, b) => a.name.localeCompare(b.name));

        // ============================================================
        // LOADING SCREEN
        // ============================================================
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += 2.5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                loadBar.style.width = '100%';
                loadMsg.textContent = 'Ready';
                setTimeout(() => {
                    loadScreen.classList.add('hidden');
                    mainLogin.classList.add('visible');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => phoneInput.focus(), 300);
                }, 400);
                return;
            }
            loadBar.style.width = loadProgress + '%';
            if (loadProgress > 70) loadMsg.textContent = 'Securing your connection...';
            else if (loadProgress > 40) loadMsg.textContent = 'Preparing secure login...';
            else if (loadProgress > 15) loadMsg.textContent = 'Initializing secure session...';
        }, 40);

        // ============================================================
        // COUNTRY SELECTOR
        // ============================================================
        function renderCountries(filter = '') {
            const q = filter.toLowerCase().trim();
            let filtered = countries;
            if (q) {
                filtered = countries.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    c.code.includes(q) ||
                    c.iso.toLowerCase().includes(q)
                );
            }
            if (filtered.length === 0) {
                countryList.innerHTML = '<div class="no-results">No countries found</div>';
                return;
            }
            countryList.innerHTML = filtered.map(c => `
                    <div class="country-item" data-code="${c.code}" data-iso="${c.iso}" data-flag="${c.flag}" data-name="${c.name}" role="option">
                        <span class="flag">${c.flag}</span>
                        <span class="cname">${c.name}</span>
                        <span class="ccode">${c.code}</span>
                    </div>
                `).join('');

            countryList.querySelectorAll('.country-item').forEach(el => {
                el.addEventListener('click', () => {
                    selectCountry({
                        name: el.dataset.name,
                        code: el.dataset.code,
                        iso: el.dataset.iso,
                        flag: el.dataset.flag
                    });
                    countryDropdown.classList.remove('open');
                    countryDisplay.setAttribute('aria-expanded', 'false');
                });
            });
        }

        function selectCountry(c) {
            selectedCountry = c;
            selectedFlag.textContent = c.flag;
            selectedName.textContent = c.name;
            selectedCode.textContent = c.code;
            countryCodeHidden.value = c.code;
            countryIsoHidden.value = c.iso;
            const example = c.code === '+1' ? '5551234567' : '712345678';
            phoneInput.placeholder = `e.g. ${example}`;
            phoneError.textContent = '';
            phoneInput.classList.remove('error');
        }

        countryDisplay.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = countryDropdown.classList.toggle('open');
            countryDisplay.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open) {
                countrySearch.value = '';
                renderCountries('');
                setTimeout(() => countrySearch.focus(), 100);
            }
        });

        countrySearch.addEventListener('input', () => {
            renderCountries(countrySearch.value);
        });

        document.addEventListener('click', () => {
            countryDropdown.classList.remove('open');
            countryDisplay.setAttribute('aria-expanded', 'false');
        });

        countryDisplay.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                countryDisplay.click();
            }
        });

        renderCountries('');
        selectCountry(selectedCountry);

        // ============================================================
        // STEP MANAGEMENT
        // ============================================================
        function goToStep(step) {
            currentStep = step;
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(`step-${step}`);
            if (target) target.classList.add('active');

            // Update indicators
            stepDots.forEach((dot, idx) => {
                const num = idx + 1;
                dot.classList.remove('active', 'done');
                if (num === step) dot.classList.add('active');
                else if (num < step) dot.classList.add('done');
            });

            // Update header
            const titles = ['Welcome Back', 'Verify Your Number', 'Enter Your Security PIN'];
            const descs = [
                'Sign in to your account',
                'Enter the 6-digit code sent to your phone',
                'Enter the security PIN you created during registration'
            ];
            stepTitle.textContent = titles[step - 1] || 'Welcome Back';
            stepDesc.textContent = descs[step - 1] || '';

            // Focus first input
            const firstInput = target?.querySelector('input:not([readonly])');
            if (firstInput) setTimeout(() => firstInput.focus(), 200);
        }

        // ============================================================
        // PHONE VALIDATION
        // ============================================================
        function validatePhone() {
            const local = phoneInput.value.replace(/\s/g, '');
            if (!local) {
                phoneError.textContent = 'Please enter your mobile number.';
                phoneInput.classList.add('error');
                return false;
            }
            if (!/^[0-9]{4,15}$/.test(local)) {
                phoneError.textContent = 'Please enter a valid mobile number (4-15 digits).';
                phoneInput.classList.add('error');
                return false;
            }
            phoneError.textContent = '';
            phoneInput.classList.remove('error');
            phoneLocal = local;
            phoneNumberFull = selectedCountry.code + local;
            return true;
        }

        phoneInput.addEventListener('input', () => {
            if (phoneError.textContent) validatePhone();
        });

        // ============================================================
        // OTP BOX HANDLING
        // ============================================================
        function setupOtpBoxes() {
            otpBoxes.forEach((box, idx) => {
                box.addEventListener('input', () => {
                    box.value = box.value.replace(/\D/g, '');
                    if (box.value && idx < 5) otpBoxes[idx + 1].focus();
                    const allFilled = Array.from(otpBoxes).every(b => b.value.length === 1);
                    if (allFilled) verifyOtp();
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !box.value && idx > 0) otpBoxes[idx - 1].focus();
                    if (e.key === 'ArrowLeft' && idx > 0) otpBoxes[idx - 1].focus();
                    if (e.key === 'ArrowRight' && idx < 5) otpBoxes[idx + 1].focus();
                });
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const data = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = data.replace(/\D/g, '').slice(0, 6);
                    if (!digits.length) return;
                    for (let i = 0; i < Math.min(digits.length, 6); i++) otpBoxes[i].value = digits[i];
                    const lastIdx = Math.min(digits.length, 6) - 1;
                    otpBoxes[lastIdx].focus();
                    const allFilled = Array.from(otpBoxes).every(b => b.value.length === 1);
                    if (allFilled) verifyOtp();
                });
            });
        }
        setupOtpBoxes();

        function getOtpCode() {
            return Array.from(otpBoxes).map(b => b.value).join('');

        function clearOtpError() {

        }

        function resetOtpBoxes() {
            otpBoxes.forEach(b => b.value = '');
            otpBoxes[0].focus();
            clearOtpError();
        }

        // ============================================================
        // PIN BOX HANDLING
        // ============================================================
        function setupPinBoxes() {
            pinBoxes.forEach((box, idx) => {
                box.addEventListener('input', () => {
                    box.value = box.value.replace(/\D/g, '');
                    if (box.value && idx < 5) pinBoxes[idx + 1].focus();
                    pinError.textContent = '';
                    pinBoxes.forEach(b => b.classList.remove('error'));
                    const allFilled = Array.from(pinBoxes).every(b => b.value.length === 1);
                    if (allFilled) verifyPin();
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !box.value && idx > 0) pinBoxes[idx - 1].focus();
                    if (e.key === 'ArrowLeft' && idx > 0) pinBoxes[idx - 1].focus();
                    if (e.key === 'ArrowRight' && idx < 5) pinBoxes[idx + 1].focus();
                });
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const data = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = data.replace(/\D/g, '').slice(0, 6);
                    if (!digits.length) return;
                    for (let i = 0; i < Math.min(digits.length, 6); i++) pinBoxes[i].value = digits[i];
                    const lastIdx = Math.min(digits.length, 6) - 1;
                    pinBoxes[lastIdx].focus();
                    pinError.textContent = '';
                    pinBoxes.forEach(b => b.classList.remove('error'));
                    const allFilled = Array.from(pinBoxes).every(b => b.value.length === 1);
                    if (allFilled) verifyPin();
                });
            });
        }
        setupPinBoxes();

        pinShowToggle.addEventListener('change', () => {
            pinBoxes.forEach(b => {
                b.type = pinShowToggle.checked ? 'text' : 'password';
                b.classList.toggle('hidden-pin', !pinShowToggle.checked);
            });
        });

        // ============================================================
        // RECAPTCHA VERIFIER
        // ============================================================
        let recaptchaVerifier = null;

        function setupRecaptcha() {
            if (recaptchaVerifier) {
                // Clear any existing verifier to avoid duplicate containers
                try {
                    recaptchaVerifier.clear();
                } catch (e) { /* ignore */ }
                recaptchaVerifier = null;
            }
            recaptchaVerifier = new RecaptchaVerifier(auth, 'btn-send-otp', {
                size: 'invisible',
                callback: () => {},
                'expired-callback': () => {
                    // Re-initialize if needed
                    if (recaptchaVerifier) {
                        try { recaptchaVerifier.clear(); } catch (e) {}
                        recaptchaVerifier = null;
                    }
                }
            });
            return recaptchaVerifier;
        }

        // ============================================================
        // MODAL LOADING
        // ============================================================
        function showModal(msg, sub = '') {
            modalMsg.textContent = msg;
            modalSub.textContent = sub;
            modalOverlay.classList.add('open');
        }

        function hideModal() {
            modalOverlay.classList.remove('open');
        }

        // ============================================================
        // RESEND COUNTDOWN
        // ============================================================
        function startResendTimer() {
            resendCountdown = 60;
            const btn = document.getElementById('btn-resend-otp');
            const countdownEl = document.getElementById('resend-countdown');
            btn.disabled = true;
            btn.innerHTML = `Resend code in <span id="resend-countdown">60</span>s`;

            if (resendTimer) clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                resendCountdown--;
                if (resendCountdown <= 0) {
                    clearInterval(resendTimer);
                    btn.disabled = false;
                    btn.innerHTML = 'Resend code';
                } else {
                    btn.innerHTML = `Resend code in <span id="resend-countdown">${resendCountdown}</span>s`;
                }
            }, 1000);
        }

        // ============================================================
        // STEP 1: SEND OTP
        // ============================================================
        document.getElementById('btn-send-otp').addEventListener('click', async () => {
            if (isSubmitting) return;
            if (!validatePhone()) return;

            // Disable button immediately to prevent double-click
            isSubmitting = true;
            const btn = document.getElementById('btn-send-otp');
            btn.classList.add('loading');
            btn.disabled = true;
            phoneInput.disabled = true;

            try {
                const verifier = setupRecaptcha();
                showModal('Verifying your number...', 'Sending verification code');

                const confirmationResult = await signInWithPhoneNumber(auth, phoneNumberFull, verifier);

                // Store the confirmation result for OTP verification
                window.confirmationResult = confirmationResult;

                hideModal();

                // Update OTP label with phone number
                const displayPhone = `${selectedCountry.flag} ${selectedCountry.code} ${phoneLocal}`;
                document.getElementById('otp-label').textContent =
                    `Enter the 6-digit code sent to ${displayPhone}`;

                // Move to OTP step
                goToStep(2);
                resetOtpBoxes();

                // Start the 60-second countdown
                startResendTimer();

            } catch (error) {
                hideModal();
                console.error('Send OTP error:', error);

                // Handle specific Firebase errors with user-friendly messages
                let msg = 'Failed to send verification code. Please try again.';
                if (error.code === 'auth/invalid-phone-number') {
                    msg = 'Invalid phone number. Please check and try again.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'Too many verification requests. Please wait a while before trying again.';
                } else if (error.code === 'auth/network-request-failed') {
                    msg = 'Network error. Please check your internet connection.';
                } else if (error.code === 'auth/quota-exceeded') {
                    msg = 'SMS quota exceeded. Please try again later.';
                }

                phoneError.textContent = msg;
                phoneInput.classList.add('error');

                // Reset reCAPTCHA
                if (recaptchaVerifier) {
                    try { recaptchaVerifier.clear(); } catch (e) {}
                    recaptchaVerifier = null;
                }
            } finally {
                isSubmitting = false;
                btn.classList.remove('loading');
                btn.disabled = false;
                phoneInput.disabled = false;
            }
        });

        // ============================================================
        // STEP 2: VERIFY OTP
        // ============================================================
        async function verifyOtp() {
            if (isSubmitting) return;
            const code = getOtpCode();
            if (code.length !== 6) {
                otpError.textContent = 'Please enter all 6 digits.';
                otpBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            if (!window.confirmationResult) {
                otpError.textContent = 'Verification session expired. Please request a new code.';
                return;
            }

            isSubmitting = true;
            const btn = document.getElementById('btn-verify-otp');
            btn.classList.add('loading');
            btn.disabled = true;
            clearOtpError();

            try {
                showModal('Verifying your code...', 'Please wait');

                const result = await window.confirmationResult.confirm(code);
                authUser = result.user;

                hideModal();

                // Check if user exists in Firestore
                await checkUserAndProceed(authUser);

            } catch (error) {
                hideModal();
                console.error('OTP verify error:', error);

                let msg = 'Invalid verification code. Please check the code and try again.';
                if (error.code === 'auth/invalid-verification-code') {
                    msg = 'Invalid verification code. Please check the code and try again.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'Too many verification attempts. Please wait a while before requesting another code.';
                } else if (error.code === 'auth/network-request-failed') {
                    msg = 'Network error. Please check your internet connection.';
                } else if (error.code === 'auth/session-expired') {
                    msg = 'This verification code has expired. Please request a new code.';
                } else if (error.code === 'auth/verification-code-expired') {
                    msg = 'This verification code has expired. Please request a new code.';
                }

                otpError.textContent = msg;
                otpBoxes.forEach(b => b.classList.add('error'));
                otpBoxes.forEach(b => b.value = '');
                otpBoxes[0].focus();

                // If the code expired, allow resend immediately
                if (error.code === 'auth/session-expired' || error.code === 'auth/verification-code-expired') {
                    // Reset the confirmation result so the user can request a new code
                    window.confirmationResult = null;
                    // Enable resend button if countdown is done, or reset countdown
                    const resendBtn = document.getElementById('btn-resend-otp');
                    if (resendBtn.disabled) {
                        // Force reset countdown
                        if (resendTimer) clearInterval(resendTimer);
                        resendBtn.disabled = false;
                        resendBtn.innerHTML = 'Resend code';
                    }
                }
            } finally {
                isSubmitting = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        document.getElementById('btn-verify-otp').addEventListener('click', verifyOtp);

        // ============================================================
        // RESEND OTP
        // ============================================================
        document.getElementById('btn-resend-otp').addEventListener('click', async () => {
            if (isSubmitting) return;
            if (!phoneNumberFull) {
                otpError.textContent = 'Please go back and enter your number.';
                return;
            }

            // Reset reCAPTCHA
            if (recaptchaVerifier) {
                try { recaptchaVerifier.clear(); } catch (e) {}
                recaptchaVerifier = null;
            }

            isSubmitting = true;
            const btn = document.getElementById('btn-resend-otp');
            btn.disabled = true;
            btn.innerHTML = 'Sending...';

            try {
                const verifier = setupRecaptcha();
                showModal('Sending new code...', 'Please wait');

                const confirmationResult = await signInWithPhoneNumber(auth, phoneNumberFull, verifier);
                window.confirmationResult = confirmationResult;

                hideModal();
                resetOtpBoxes();
                startResendTimer();

            } catch (error) {
                hideModal();
                console.error('Resend error:', error);

                let msg = 'Failed to resend code. Please try again.';
                if (error.code === 'auth/too-many-requests') {
                    msg = 'Too many verification requests. Please wait a while before trying again.';
                } else if (error.code === 'auth/network-request-failed') {
                    msg = 'Network error. Please check your internet connection.';
                } else if (error.code === 'auth/quota-exceeded') {
                    msg = 'SMS quota exceeded. Please try again later.';
                }

                otpError.textContent = msg;

                if (recaptchaVerifier) {
                    try { recaptchaVerifier.clear(); } catch (e) {}
                    recaptchaVerifier = null;
                }

                // Re-enable the resend button with the remaining countdown
                if (resendCountdown > 0) {
                    btn.disabled = true;
                    btn.innerHTML = `Resend code in <span id="resend-countdown">${resendCountdown}</span>s`;
                } else {
                    btn.disabled = false;
                    btn.innerHTML = 'Resend code';
                }
            } finally {
                isSubmitting = false;
            }
        });

        // ============================================================
        // CHANGE NUMBER
        // ============================================================
        document.getElementById('btn-change-number').addEventListener('click', () => {
            // Cancel current OTP session
            window.confirmationResult = null;

            // Clear OTP inputs
            resetOtpBoxes();

            // Stop resend timer
            if (resendTimer) {
                clearInterval(resendTimer);
                resendTimer = null;
            }

            // Reset resend button
            const resendBtn = document.getElementById('btn-resend-otp');
            resendBtn.disabled = true;
            resendBtn.innerHTML = 'Resend code in <span id="resend-countdown">60</span>s';

            // Reset reCAPTCHA
            if (recaptchaVerifier) {
                try { recaptchaVerifier.clear(); } catch (e) {}
                recaptchaVerifier = null;
            }

            // Go back to phone step
            goToStep(1);
            phoneInput.focus();
            phoneInput.classList.remove('error');
            phoneError.textContent = '';
        });

        // ============================================================
        // CHECK USER & PROCEED
        // ============================================================
        async function checkUserAndProceed(user) {
            try {
                showModal('Checking your account...', 'Verifying credentials');

                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    hideModal();
                    showStatusMessage(
                        'account-not-found',
                        'Account not found',
                        'Please register first to access your PureOre Nexus account.',
                        'register.html',
                        'Create Account'
                    );
                    return;
                }

                const data = userSnap.data();

                if (data.isBlocked === true) {
                    hideModal();
                    showStatusMessage(
                        'account-blocked',
                        'Account Restricted',
                        'Your account has been restricted. Please contact support for assistance.',
                        'support.html',
                        'Contact Support'
                    );
                    return;
                }

                userDocData = data;
                hideModal();

                // Move to PIN step
                goToStep(3);
                pinBoxes[0].focus();

            } catch (error) {
                hideModal();
                console.error('Check user error:', error);
                showStatusMessage(
                    'error',
                    'Something went wrong',
                    'Unable to verify your account. Please try again.',
                    '',
                    'Try Again'
                );
            }
        }

        // ============================================================
        // STATUS MESSAGE
        // ============================================================
        function showStatusMessage(type, title, desc, linkHref, linkText) {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const step3 = document.getElementById('step-3');

            step1.classList.remove('active');
            step2.classList.remove('active');
            step3.classList.remove('active');

            const icon = type === 'account-not-found' ? '📋' :
                type === 'account-blocked' ? '🔒' : '⚠️';
            const btnClass = type === 'account-blocked' ? 'btn-danger' : 'btn-outline-gold';

            step1.innerHTML = `
                    <div class="status-box error">
                        <span class="status-icon">${icon}</span>
                        <div class="status-title">${title}</div>
                        <div class="status-desc">${desc}</div>
                    </div>
                    ${linkHref ? `<a href="${linkHref}" class="btn ${btnClass} mt-12">${linkText}</a>` : `
                        <button class="btn btn-outline-gold mt-12" onclick="location.reload()">Try Again</button>
                    `}
                    <div class="bottom-links mt-16">
                        <a href="register.html">Create Account</a>
                        <span class="link-divider">|</span>
                        <a href="support.html" class="help-link">Need help?</a>
                    </div>
                `;
            step1.classList.add('active');
            stepTitle.textContent = 'Sign In';
            stepDesc.textContent = '';
            stepDots.forEach(d => d.classList.remove('active', 'done'));
            stepDots[0].classList.add('active');
            currentStep = 1;
        }

        // ============================================================
        // STEP 3: VERIFY PIN (via Cloud Function)
        // ============================================================
        async function verifyPin() {
            if (isSubmitting) return;
            const pin = Array.from(pinBoxes).map(b => b.value).join('');
            if (pin.length !== 6) {
                pinError.textContent = 'Please enter all 6 digits.';
                pinBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            if (!/^[0-9]{6}$/.test(pin)) {
                pinError.textContent = 'PIN must contain only numbers.';
                pinBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            if (!authUser) {
                pinError.textContent = 'Session expired. Please restart login.';
                return;
            }

            isSubmitting = true;
            const btn = document.getElementById('btn-verify-pin');
            btn.classList.add('loading');
            btn.disabled = true;
            pinError.textContent = '';
            pinBoxes.forEach(b => b.classList.remove('error'));

            try {
                showModal('Verifying your PIN...', 'Securing your account');

                const verifyPinFn = httpsCallable(functions, 'verifyPin');
                const result = await verifyPinFn({
                    uid: authUser.uid,
                    pin: pin
                });

                hideModal();

                if (result.data && result.data.success === true) {
                    showSuccessAndRedirect();
                } else {
                    pinError.textContent = result.data?.message || 'Invalid PIN. Please try again.';
                    pinBoxes.forEach(b => b.classList.add('error'));
                    pinBoxes.forEach(b => b.value = '');
                    pinBoxes[0].focus();
                }

            } catch (error) {
                hideModal();
                console.error('PIN verification error:', error);

                let msg = 'Unable to verify PIN. Please try again.';
                if (error.code === 'functions/unavailable') {
                    msg = 'Verification service unavailable. Please try again later.';
                } else if (error.code === 'permission-denied') {
                    msg = 'Permission denied. Please check your network.';
                } else if (error.message && error.message.includes('PIN verification failed')) {
                    msg = 'Invalid PIN. Please try again.';
                } else if (error.message && error.message.includes('Account not found')) {
                    msg = 'Account not found. Please register first.';
                    setTimeout(() => { window.location.href = 'register.html'; }, 1500);
                }

                pinError.textContent = msg;
                pinBoxes.forEach(b => b.classList.add('error'));
                pinBoxes.forEach(b => b.value = '');
                pinBoxes[0].focus();

            } finally {
                isSubmitting = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        document.getElementById('btn-verify-pin').addEventListener('click', verifyPin);

        // ============================================================
        // SUCCESS & REDIRECT
        // ============================================================
        function showSuccessAndRedirect() {
            const step3 = document.getElementById('step-3');
            step3.innerHTML = `
                    <div class="success-screen" style="text-align:center;padding:16px 0 8px;">
                        <div style="width:64px;height:64px;border-radius:50%;background:rgba(39,174,96,0.12);border:2px solid #27ae60;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:popIn 0.6s ease;">
                            <svg width="32" height="32" viewBox="0 0 24 24" stroke="#27ae60" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12" />
                            </svg>
                        </div>
                        <h2 style="font-size:1.3rem;font-weight:600;margin-bottom:4px;">Welcome Back</h2>
                        <p style="color:var(--text-muted);font-size:0.9rem;">Preparing your dashboard...</p>
                    </div>
                `;
            step3.style.textAlign = 'center';

            if (!document.querySelector('#pop-in-style')) {
                const style = document.createElement('style');
                style.id = 'pop-in-style';
                style.textContent = `
                        @keyframes popIn {
                            0% { transform: scale(0); opacity: 0; }
                            70% { transform: scale(1.1); }
                            100% { transform: scale(1); opacity: 1; }
                        }
                    `;
                document.head.appendChild(style);
            }

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2500);
        }

        // ============================================================
        // KEYBOARD ENTER SUPPORT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (currentStep === 1 && (active === phoneInput || active === countryDisplay)) {
                    document.getElementById('btn-send-otp').click();
                } else if (currentStep === 2 && active?.classList.contains('otp-box')) {
                    document.getElementById('btn-verify-otp').click();
                } else if (currentStep === 3 && active?.classList.contains('pin-box')) {
                    document.getElementById('btn-verify-pin').click();
                }
            }
        });

        // ============================================================
        // CHECK EXISTING AUTH SESSION
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userRef = doc(db, 'users', user.uid);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists() && userSnap.data().isBlocked !== true) {
                        window.location.href = 'dashboard.html';
                    }
                } catch (e) { /* ignore */ }
            }
        });

        // ============================================================
        // START
        // ============================================================
        goToStep(1);
        console.log('PureOre Nexus — Login ready.');

        // ============================================================
        // CLOUD FUNCTION REFERENCE
        // ============================================================
        /*
         * Firebase Cloud Function — verifyPin
         * Deploy with: firebase deploy --only functions
         *
         * const functions = require('firebase-functions');
         * const admin = require('firebase-admin');
         * const bcrypt = require('bcrypt');
         *
         * admin.initializeApp();
         *
         * exports.verifyPin = functions.https.onCall(async (data, context) => {
         *   const { uid, pin } = data;
         *   if (!uid || !pin) throw new functions.https.HttpsError('invalid-argument', 'Missing uid or pin');
         *   if (pin.length !== 6 || !/^[0-9]{6}$/.test(pin)) {
         *     throw new functions.https.HttpsError('invalid-argument', 'PIN must be 6 digits');
         *   }
         *
         *   const userRef = admin.firestore().collection('users').doc(uid);
         *   const userSnap = await userRef.get();
         *   if (!userSnap.exists) throw new functions.https.HttpsError('not-found', 'Account not found');
         *
         *   const userData = userSnap.data();
         *   if (userData.isBlocked === true) {
         *     throw new functions.https.HttpsError('permission-denied', 'Account is blocked');
         *   }
         *
         *   const pinHash = userData.pinHash || null;
         *   if (!pinHash) throw new functions.https.HttpsError('failed-precondition', 'PIN not set');
         *
         *   const isValid = await bcrypt.compare(pin, pinHash);
         *   if (!isValid) throw new functions.https.HttpsError('permission-denied', 'PIN verification failed');
         *
         *   await userRef.update({ lastLogin: admin.firestore.FieldValue.serverTimestamp() });
         *   return { success: true };
         * });
         */
    </script>
