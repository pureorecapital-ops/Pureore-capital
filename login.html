<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login – Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0A0A0C;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/wZw0C7mP/file-00000000411c722f8509ba7138f95964.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.55) contrast(1.1);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
        }
        .auth-container { width: 100%; max-width: 480px; margin: 1rem; animation: fadeSlideUp 0.6s ease; }
        .auth-card {
            background: rgba(30,30,42,0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(108,71,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h2 { text-align: center; margin-bottom: 1.5rem; font-size: 2rem; background: linear-gradient(135deg,#2ecc71,#f1c40f,#e67e22); background-clip: text; -webkit-background-clip: text; color: transparent; }
        input {
            width: 100%; padding: 0.9rem; margin: 0.6rem 0;
            border-radius: 40px; border: 1px solid #2C2C3A; background: #1E1E2A;
            color: white; font-size: 1rem;
            transition: 0.2s;
        }
        input:focus { outline: none; border-color: #2ecc71; box-shadow: 0 0 0 2px rgba(46,204,113,0.2); }
        .btn {
            width: 100%; background: linear-gradient(135deg,#6C47FF,#8a6aff);
            padding: 0.9rem; border: none; border-radius: 40px;
            font-weight: bold; font-size: 1rem; color: white; cursor: pointer;
            transition: 0.2s; margin-top: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
        .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 0.6rem; border-radius: 20px; text-align: center; margin-top: 1rem; }
        .admin-toggle {
            text-align: center;
            margin-top: 1.5rem;
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.2s;
            display: inline-block;
            width: 100%;
            color: #f1c40f;
        }
        .admin-toggle:hover { transform: scale(1.1); }
        a { color: #6C47FF; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>
        <div id="message"></div>
        <p style="text-align: center; margin-top: 1rem;">
            Don't have an account? <a href="register.html">Register</a>
        </p>
        <div class="admin-toggle" id="adminToggle" aria-label="Admin access"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.settings({ persistence: false });
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    // Clean up stale session
    (async function cleanupStaleSession() {
        try {
            await auth.signOut();
            await new Promise(resolve => setTimeout(resolve, 300));
        } catch (e) {
            console.log("Pre-login cleanup (non-critical):", e);
        }
    })();

    // Helper: convert phone number to agent email format (internal, no visible hint)
    function phoneToAgentEmail(phone) {
        const cleaned = phone.replace(/\D/g, '');
        return `agent_${cleaned}@agent.pureore.com`;
    }

    // Detect if input looks like a Zambian phone number (12 digits starting with 260)
    function isPhoneNumber(input) {
        const digits = input.replace(/\D/g, '');
        return digits.length === 12 && digits.startsWith('260');
    }

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('message');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            messageDiv.innerHTML = '';
            
            let identifier = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!identifier || !password) {
                messageDiv.innerHTML = '<div class="error">Please enter both email and password.</div>';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
                return;
            }
            
            // Convert phone number to agent email if needed (silent)
            let email = identifier;
            if (isPhoneNumber(identifier)) {
                email = phoneToAgentEmail(identifier);
            }
            
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const user = userCred.user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    await auth.signOut();
                    messageDiv.innerHTML = '<div class="error">Account data missing. Please contact support.</div>';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }
                
                const userData = userDoc.data();
                
                if (userData.isBlocked === true) {
                    await auth.signOut();
                    messageDiv.innerHTML = '<div class="error">Your account has been blocked. Contact support.</div>';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }
                
                const role = userData.role || 'user';
                if (role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (role === 'agent') {
                    window.location.href = 'agent-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
                
            } catch (error) {
                console.error("Login error:", error);
                let errorMsg = error.message;
                if (error.code === 'auth/user-not-found') errorMsg = 'No account found with this email.';
                if (error.code === 'auth/wrong-password') errorMsg = 'Incorrect password.';
                if (error.code === 'auth/invalid-email') errorMsg = 'Invalid email format.';
                if (error.code === 'auth/too-many-requests') errorMsg = 'Too many failed attempts. Try again later.';
                if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Network error. Please refresh the page and try again.';
                }
                messageDiv.innerHTML = `<div class="error">${errorMsg}</div>`;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    }

    const adminToggle = document.getElementById('adminToggle');
    if (adminToggle) {
        adminToggle.addEventListener('click', () => {
            const password = prompt(" Enter admin password (admin access only):");
            if (password === "JACKSAJERE") {
                window.location.href = "admin-login.html";
            } else if (password !== null) {
                alert("Incorrect password. Access denied.");
            }
        });
    }
</script>
</body>
</html>
