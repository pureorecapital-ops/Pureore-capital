<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0A0A0C;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/wZw0C7mP/file-00000000411c722f8509ba7138f95964.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.55) contrast(1.1);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
        }
        .auth-container { width: 100%; max-width: 480px; margin: 1rem; animation: fadeSlideUp 0.6s ease; }
        .auth-card {
            background: rgba(30,30,42,0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(108,71,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h2 { text-align: center; margin-bottom: 1.5rem; font-size: 2rem; background: linear-gradient(135deg,#2ecc71,#f1c40f,#e67e22); background-clip: text; -webkit-background-clip: text; color: transparent; }
        input {
            width: 100%; padding: 0.9rem; margin: 0.6rem 0;
            border-radius: 40px; border: 1px solid #2C2C3A; background: #1E1E2A;
            color: white; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #2ecc71; }
        .btn {
            width: 100%; background: linear-gradient(135deg,#6C47FF,#8a6aff);
            padding: 0.9rem; border: none; border-radius: 40px;
            font-weight: bold; font-size: 1rem; color: white; cursor: pointer;
            transition: 0.2s; margin-top: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 0.6rem; border-radius: 20px; text-align: center; margin-top: 1rem; }
        .admin-toggle {
            text-align: center;
            margin-top: 1.5rem;
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.2s;
            display: inline-block;
            width: 100%;
        }
        .admin-toggle:hover { transform: scale(1.1); }
        a { color: #6C47FF; text-decoration: none; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <div id="message"></div>
        <p style="text-align: center; margin-top: 1rem;">
            Don't have an account? <a href="register.html">Register</a>
        </p>
        <div class="admin-toggle" id="adminToggle">😂</div>
    </div>
</div>

<script>
    // ===== SELF-CONTAINED FIREBASE CONFIGURATION =====
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.firebasestorage.app",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Login handler
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // After login, redirect based on role
                const user = auth.currentUser;
                const userDoc = await db.collection('users').doc(user.uid).get();
                const role = userDoc.exists ? userDoc.data().role : 'user';
                if (role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                let errorMsg = error.message;
                if (error.code === 'auth/user-not-found') errorMsg = 'No account found with this email.';
                if (error.code === 'auth/wrong-password') errorMsg = 'Incorrect password.';
                if (error.code === 'auth/invalid-email') errorMsg = 'Invalid email format.';
                messageDiv.innerHTML = `<div class="error">${errorMsg}</div>`;
            }
        });
    }

    // Admin emoji toggle – works independently of Firebase
    const adminToggle = document.getElementById('adminToggle');
    if (adminToggle) {
        adminToggle.addEventListener('click', () => {
            const password = prompt("🔐 Enter admin password:");
            if (password === "SAJERE") {
                window.location.href = "admin-login.html";
            } else if (password !== null) {
                alert("Incorrect password. Access denied.");
            }
        });
    }
</script>
</body>
</html>
