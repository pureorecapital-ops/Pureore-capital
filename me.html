<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Profile – PC • Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* ----- FIXED BODY – prevents layout shift on keyboard open ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0815;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ----- SCROLLABLE WRAPPER (handles all scrolling) ----- */
        .app-wrapper {
            position: relative;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 90px 0;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        .app-wrapper::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        .app-wrapper::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- PROFILE CARD (glass) ----- */
        .profile-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 1.8rem 1.2rem 1.5rem;
            box-shadow: var(--shadow-card);
            text-align: center;
            margin-bottom: 1.5rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .profile-card .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin: 0 auto 0.8rem;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 30px var(--gold-glow);
            position: relative;
            z-index: 1;
        }

        .profile-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-card .name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .profile-card .email {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 0.1rem;
            position: relative;
            z-index: 1;
        }

        .profile-card .status-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
        }

        .profile-card .status-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-card .status-toggle .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green-glow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card .status-toggle .dot.offline {
            background: var(--red);
            box-shadow: 0 0 12px var(--red-glow);
        }

        /* ----- MENU CARDS ----- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(10, 8, 21, 0.45);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            padding: 0.8rem 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .menu-item:hover {
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(10, 8, 21, 0.6);
        }

        .menu-item .icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease;
        }

        .menu-item:hover .icon {
            background: rgba(124, 109, 240, 0.06);
        }

        .menu-item .icon svg {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .menu-item:hover .icon svg {
            stroke: var(--cyan);
        }

        .menu-item .label {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.3s ease;
        }

        .menu-item:hover .label {
            color: rgba(255, 255, 255, 0.85);
        }

        .menu-item .arrow {
            color: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .menu-item:hover .arrow {
            color: var(--gold);
            transform: translateX(3px);
        }

        .menu-item .arrow svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- MODAL (glass) ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: rgba(10, 8, 21, 0.90);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .modal-card .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
        }

        .modal-card .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-card .form-group {
            margin-bottom: 0.8rem;
        }

        .modal-card .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-card .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: var(--radius-sm);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .modal-card .form-group input:focus {
            border-color: rgba(93, 217, 242, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(93, 217, 242, 0.02);
        }

        .modal-card .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .modal-card .form-group input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal-card .btn-primary {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0a0815;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px var(--gold-glow);
            margin-top: 0.3rem;
        }

        .modal-card .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--gold-glow);
        }

        .modal-card .btn-primary:active {
            transform: scale(0.97);
        }

        .modal-card .btn-secondary {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.4);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .modal-card .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-card .forgot-link {
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: var(--cyan);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-card .forgot-link:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        .modal-card .msg {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
        }

        .modal-card .msg.error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        .modal-card .msg.success {
            color: #6ee7b7;
            background: rgba(74, 222, 128, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.1);
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .profile-card .avatar {
                width: 70px;
                height: 70px;
            }
            .profile-card .name {
                font-size: 1.1rem;
            }
            .menu-item {
                padding: 0.7rem 1rem;
            }
            .menu-item .icon {
                width: 34px;
                height: 34px;
            }
            .menu-item .icon svg {
                width: 18px;
                height: 18px;
            }
            .menu-item .label {
                font-size: 0.85rem;
            }
            .modal-card {
                padding: 1.5rem 1.2rem 1.2rem;
            }
            .modal-card h3 {
                font-size: 1.2rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 400px) {
            .profile-card .avatar {
                width: 60px;
                height: 60px;
            }
            .menu-item .icon {
                width: 30px;
                height: 30px;
            }
            .menu-item .icon svg {
                width: 16px;
                height: 16px;
            }
            .menu-item .label {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SCROLLABLE WRAPPER ===== -->
    <div class="app-wrapper">

        <!-- ===== ORBS ===== -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <!-- ===== MAIN CONTAINER ===== -->
        <div class="container">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24">
                            <polyline points="6 6 18 6 6 18 18 18" />
                        </svg>
                    </div>
                    <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                    <span class="brand-badge">Profile</span>
                </div>
            </div>

            <!-- ===== BACK ROW ===== -->
            <div class="back-row">

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // USER PROFILE
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        document.getElementById('userName').textContent = escapeHtml(data.fullName || 'User');
                        document.getElementById('userEmail').textContent = escapeHtml(data.email || user.email);
                    } else {
                        document.getElementById('userName').textContent = escapeHtml(user.displayName || 'Investor');
                        document.getElementById('userEmail').textContent = escapeHtml(user.email);
                    }
                    document.getElementById('modalEmail').value = user.email;
                })
                .catch(function(err) {
                    console.error(err);
                    document.getElementById('userName').textContent = 'User';
                    document.getElementById('userEmail').textContent = escapeHtml(user.email);
                    document.getElementById('modalEmail').value = user.email;
                });
        });

        // ================================================================
        // ONLINE / OFFLINE TOGGLE
        // ================================================================
        var isOnline = true;
        var statusDot = document.getElementById('statusDot');
        var statusText = document.getElementById('statusText');

        function updateOnlineStatus() {
            if (isOnline) {
                statusDot.classList.remove('offline');
                statusText.textContent = 'Online';
            } else {
                statusDot.classList.add('offline');
                statusText.textContent = 'Offline';
            }
            localStorage.setItem('userOnline', isOnline);
        }

        var saved = localStorage.getItem('userOnline');
        if (saved !== null) isOnline = saved === 'true';
        updateOnlineStatus();

        document.getElementById('onlineToggle').addEventListener('click', function() {
            isOnline = !isOnline;
            updateOnlineStatus();
        });

        // ================================================================
        // PASSWORD MODAL
        // ================================================================
        var modal = document.getElementById('passwordModal');
        var changePwdBtn = document.getElementById('changePasswordBtn');
        var closeModalBtn = document.getElementById('closeModalBtn');
        var cancelModalBtn = document.getElementById('cancelModalBtn');
        var forgotLink = document.getElementById('forgotPasswordLink');
        var modalMessage = document.getElementById('modalMessage');

        function openModal() {
            modal.classList.add('active');
            modalMessage.innerHTML = '';
            modalMessage.className = 'msg';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        changePwdBtn.addEventListener('click', openModal);

        function closeModal() {
            modal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        forgotLink.addEventListener('click', function() {
            modalMessage.className = 'msg';
            modalMessage.innerHTML = '📞 Contact admin: +260 95 135 9357 (Manager) for account recovery.';
        });

        document.getElementById('submitPasswordChange').addEventListener('click', async function() {
            var email = document.getElementById('modalEmail').value;
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            var user = auth.currentUser;

            if (!user || user.email !== email) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'Email does not match logged-in account.';
                return;
            }
            if (newPwd.length < 6) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'New password must be at least 6 characters.';
                return;
            }
            if (newPwd !== confirmPwd) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'New passwords do not match.';
                return;
            }

            var credential = firebase.auth.EmailAuthProvider.credential(email, oldPwd);
            try {
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPwd);
                modalMessage.className = 'msg success';
                modalMessage.innerHTML = '✅ Password changed successfully! You will be logged out.';
                setTimeout(async function() {
                    await auth.signOut();
                    await new Promise(r => setTimeout(r, 300));
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                var msg = err.message;
                if (err.code === 'auth/wrong-password') msg = 'Old password is incorrect.';
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = escapeHtml(msg);
            }
        });

        // ================================================================
        // LOGOUT
        // ================================================================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await auth.signOut();
                await new Promise(function(resolve) { setTimeout(resolve, 300); });
            } catch (err) {
                console.warn('Sign out error:', err);
            }
            window.location.href = 'login.html';
        });

        // ================================================================
        // APK DOWNLOAD – UPDATED: use local file PureOreCapital.apk
        // ================================================================
        document.getElementById('downloadApkBtn').addEventListener('click', function() {
            var apkUrl = 'PureOreCapital.apk'; // ✅ fixed: downloads from the same folder
            var link = document.createElement('a');
            link.href = apkUrl;
            link.download = 'PureOreCapital.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function() {
                showToast('📱 Downloading PureOreCapital.apk...', false);
            }, 100);
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'me.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · Profile (fixed scrolling + APK download)');
        console.log('🖼️ Pureore Capital image as profile picture for all members');
        console.log('📱 APK download: PureOreCapital.apk from the same folder');
        console.log('🔐 Firebase config untouched');
    </script>
