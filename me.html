<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Profile | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* (keep all existing styles, no changes needed) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; position: relative; }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 10;
        }
        .back-arrow:hover { background: #2ecc71; color: #0A0A0C; transform: translateX(-3px); }
        .profile-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(46, 204, 113, 0.3);
            margin-bottom: 1.5rem;
            margin-top: 2rem;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            border: 3px solid #2ecc71;
            object-fit: cover;
        }
        .profile-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; }
        .profile-email { font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; }
        .online-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1E1E2A;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .online-status:hover { background: #2a2a36; }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 5px #2ecc71;
            transition: 0.2s;
        }
        .status-dot.offline { background: #ef4444; box-shadow: 0 0 5px #ef4444; }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1rem 0 2rem;
        }
        .menu-card {
            background: #111116;
            border-radius: 28px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2C2C3A;
        }
        .menu-card:hover { transform: translateX(5px); border-color: #2ecc71; background: #1a1a24; }
        .menu-icon { font-size: 1.8rem; min-width: 45px; text-align: center; }
        .menu-text { flex: 1; font-weight: 500; }
        .menu-arrow { color: #2ecc71; font-size: 1.2rem; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: #14161F;
            border-radius: 32px;
            width: 90%;
            max-width: 400px;
            padding: 1.5rem;
            border: 1px solid #2ecc71;
        }
        .modal-card h3 { margin-bottom: 1rem; text-align: center; }
        .modal-card input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border-radius: 40px;
            background: #1E1E2A;
            border: 1px solid #2C2C3A;
            color: white;
        }
        .modal-card button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #2ecc71, #239b56);
            border: none;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .close-modal { background: #3a3a4a; margin-top: 0.5rem; }
        .forgot-link { text-align: center; margin-top: 0.8rem; font-size: 0.8rem; color: #f1c40f; cursor: pointer; }
        .msg { font-size: 0.8rem; text-align: center; margin-top: 0.5rem; }
        .error { color: #ef4444; }
        .success { color: #2ecc71; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
            transition: 0.2s;
        }
        .nav-label { font-size: 0.7rem; color: #aaa; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'"> Back</div>
    <div class="profile-card">
        <img class="profile-img" src="https://i.ibb.co/jP1hv722/file-000000005c4071fd8f0804a576ae6ac1.png" alt="Profile">
        <div class="profile-name" id="userName">—</div>
        <div class="profile-email" id="userEmail">—</div>
        <div class="online-status" id="onlineToggle">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Online</span>
        </div>
    </div>

    <div class="menu-grid">
        <div class="menu-card" onclick="location.href='news.html'"><div class="menu-icon"></div><div class="menu-text">News</div><div class="menu-arrow"></div></div>
        <div class="menu-card" onclick="location.href='chat.html'"><div class="menu-icon"></div><div class="menu-text">Chat</div><div class="menu-arrow"></div></div>
        <!-- Download APK – now triggers actual download -->
        <div class="menu-card" id="downloadApkBtn"><div class="menu-icon"></div><div class="menu-text">Download APK</div><div class="menu-arrow"></div></div>
        <div class="menu-card" id="changePasswordBtn"><div class="menu-icon"></div><div class="menu-text">Change Password</div><div class="menu-arrow"></div></div>
        <!-- Customer Service now points to support.html -->
        <div class="menu-card" onclick="location.href='support.html'"><div class="menu-icon"></div><div class="menu-text">Customer Service</div><div class="menu-arrow"></div></div>
        <div class="menu-card" id="logoutBtn"><div class="menu-icon"></div><div class="menu-text">Logout</div><div class="menu-arrow"></div></div>
    </div>
</div>

<!-- Password Change Modal (unchanged) -->
<div id="passwordModal" class="modal-overlay">
    <div class="modal-card">
        <h3>Change Password</h3>
        <input type="email" id="modalEmail" placeholder="Email">
        <input type="password" id="oldPassword" placeholder="Old Password">
        <input type="password" id="newPassword" placeholder="New Password (min 6)">
        <input type="password" id="confirmPassword" placeholder="Confirm New Password">
        <button id="submitPasswordChange">Update Password</button>
        <div class="forgot-link" id="forgotPasswordLink">Forgot password?</div>
        <button class="close-modal" id="closeModalBtn">Cancel</button>
        <div id="modalMessage" class="msg"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='dashboard.html'">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" onclick="window.location.href='mkvip.html'">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" onclick="window.location.href='jproduct.html'">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" onclick="window.location.href='income.html'">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" onclick="window.location.href='team.html'">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" onclick="window.location.href='me.html'">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script>
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        try {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                document.getElementById('userName').innerText = data.fullName || 'User';
                document.getElementById('userEmail').innerText = data.email || user.email;
            } else {
                document.getElementById('userName').innerText = user.displayName || 'Investor';
                document.getElementById('userEmail').innerText = user.email;
            }
            document.getElementById('modalEmail').value = user.email;
        } catch (err) {
            document.getElementById('userName').innerText = 'User';
            document.getElementById('userEmail').innerText = user.email;
        }
    });

    // Online/Offline toggle
    let isOnline = true;
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const onlineToggle = document.getElementById('onlineToggle');
    function updateOnlineStatus() {
        if (isOnline) {
            statusDot.classList.remove('offline');
            statusText.innerText = 'Online';
        } else {
            statusDot.classList.add('offline');
            statusText.innerText = 'Offline';
        }
        localStorage.setItem('userOnline', isOnline);
    }
    const saved = localStorage.getItem('userOnline');
    if (saved !== null) isOnline = saved === 'true';
    updateOnlineStatus();
    onlineToggle.addEventListener('click', () => { isOnline = !isOnline; updateOnlineStatus(); });

    // Change password modal (unchanged)
    const modal = document.getElementById('passwordModal');
    const changePwdBtn = document.getElementById('changePasswordBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const forgotLink = document.getElementById('forgotPasswordLink');
    const modalMessage = document.getElementById('modalMessage');

    changePwdBtn.addEventListener('click', () => {
        modal.classList.add('active');
        modalMessage.innerHTML = '';
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    });
    closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    forgotLink.addEventListener('click', () => {
        modalMessage.innerHTML = '<div class="msg"> Contact admin: 0951359357 (Manager) for account recovery.</div>';
    });

    document.getElementById('submitPasswordChange').addEventListener('click', async () => {
        const email = document.getElementById('modalEmail').value;
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        const user = auth.currentUser;
        if (!user || user.email !== email) {
            modalMessage.innerHTML = '<div class="msg error">Email does not match loggedin account.</div>';
            return;
        }
        if (newPwd.length < 6) {
            modalMessage.innerHTML = '<div class="msg error">New password must be at least 6 characters.</div>';
            return;
        }
        if (newPwd !== confirmPwd) {
            modalMessage.innerHTML = '<div class="msg error">New passwords do not match.</div>';
            return;
        }
        const credential = firebase.auth.EmailAuthProvider.credential(email, oldPwd);
        try {
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newPwd);
            modalMessage.innerHTML = '<div class="msg success">Password changed successfully! You will be logged out.</div>';
            setTimeout(async () => { await auth.signOut(); window.location.href = 'register.html'; }, 2000);
        } catch (err) {
            let msg = err.message;
            if (err.code === 'auth/wrong-password') msg = 'Old password is incorrect.';
            modalMessage.innerHTML = `<div class="msg error">${msg}</div>`;
        }
    });

    // Logout button – redirect to register.html
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = 'register.html';
    });

    // APK download – trigger download of actual APK file
    document.getElementById('downloadApkBtn').addEventListener('click', () => {
        // Replace this URL with your actual APK file URL when ready
        const apkUrl = 'https://your-server.com/pureore-capital.apk'; // CHANGE THIS
        // Force download
        const link = document.createElement('a');
        link.href = apkUrl;
        link.download = 'pureore-capital.apk';
        link.click();
        // If the URL is not accessible, show fallback message
        setTimeout(() => {
            alert('If download does not start automatically, please contact support.');
        }, 1000);
    });
</script>
</body>
</html>
