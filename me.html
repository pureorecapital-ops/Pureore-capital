<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Profile | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #050505;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== STATIC BACKGROUND (no animation) ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #050505 0%, #0a0a0a 30%, #111111 60%, #0a0a0a 100%);
            z-index: -3;
            will-change: auto;
        }

        /* ===== STATIC ORBS (reduced blur, no animation) ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.12;
            z-index: -2;
            pointer-events: none;
            will-change: auto;
        }
        .orb-1 { width: 300px; height: 300px; background: #FFD700; top: -10%; left: -10%; }
        .orb-2 { width: 280px; height: 280px; background: #00E5FF; bottom: -10%; right: -10%; }
        .orb-3 { width: 250px; height: 250px; background: #FFD700; top: 50%; left: 75%; }
        .orb-4 { width: 220px; height: 220px; background: #00C853; bottom: 30%; left: -5%; }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #FFD700;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,215,0,0.1);
            text-decoration: none;
            margin-bottom: 0.3rem;
        }
        .back-arrow:hover {
            background: #FFD700;
            color: #050505;
            transform: translateX(-3px);
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        .back-arrow svg { width: 16px; height: 16px; fill: currentColor; }

        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-title .icon { font-size: 1.6rem; }

        /* ===== PROFILE AVATAR ===== */
        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,215,0,0.15);
            border: 2px solid rgba(255,215,0,0.1);
            flex-shrink: 0;
        }
        .profile-avatar svg {
            width: 26px;
            height: 26px;
            fill: #050505;
        }

        /* ===== PROFILE CARD ===== */
        .profile-card {
            background: rgba(17, 17, 17, 0.9);
            border-radius: 28px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.1);
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease;
        }
        .profile-card:hover {
            transform: translateY(-2px);
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 0.8rem;
            border: 2px solid #FFD700;
            object-fit: cover;
        }
        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFD700;
        }
        .profile-email {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 0.8rem;
        }
        .online-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.03);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .online-status:hover {
            background: rgba(255,255,255,0.05);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00C853;
            box-shadow: 0 0 6px rgba(0,200,83,0.3);
            transition: 0.2s;
        }
        .status-dot.offline {
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239,68,68,0.3);
        }

        /* ===== MENU CARDS ===== */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin: 1rem 0 2rem;
        }
        .menu-card {
            background: rgba(17, 17, 17, 0.85);
            border-radius: 22px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .menu-card:hover {
            transform: translateX(4px);
            border-color: rgba(255,215,0,0.1);
            background: rgba(255,215,0,0.02);
        }
        .menu-icon {
            min-width: 40px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.7);
            transition: 0.2s;
        }
        .menu-card:hover .menu-img {
            filter: brightness(1.1);
        }
        .menu-text {
            flex: 1;
            font-weight: 500;
            color: #ddd;
            font-size: 0.9rem;
        }
        .menu-arrow {
            color: #FFD700;
            font-size: 1.1rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #111111;
            border-radius: 28px;
            width: 90%;
            max-width: 400px;
            padding: 1.5rem;
            border: 1px solid rgba(255,215,0,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .modal-card h3 {
            color: #FFD700;
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 1.3rem;
        }
        .modal-card input {
            width: 100%;
            padding: 0.7rem 1rem;
            margin: 0.4rem 0;
            border-radius: 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: white;
            transition: 0.2s;
        }
        .modal-card input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .modal-card button {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.4rem;
            background: linear-gradient(135deg, #00C853, #009624);
            border: none;
            border-radius: 40px;
            font-weight: 700;
            color: #050505;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-card button:hover {
            transform: scale(1.02);
        }
        .close-modal {
            background: rgba(255,255,255,0.06) !important;
            color: #aaa !important;
            margin-top: 0.4rem;
        }
        .close-modal:hover {
            background: rgba(255,255,255,0.1) !important;
        }
        .forgot-link {
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            color: #FFD700;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .msg {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.6rem;
        }
        .error { color: #ef4444; }
        .success { color: #00C853; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 14, 0.98);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-top: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(10, 10, 14, 0.98), rgba(10, 10, 14, 0.98)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 6px 18px;
            z-index: 30;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.6) grayscale(0.4);
            transition: 0.2s;
            border-radius: 6px;
            padding: 1px;
        }
        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 6px rgba(255, 215, 0, 0.4));
            transform: scale(1.03);
        }
        .nav-item.glow .nav-icon {
            filter: brightness(1) drop-shadow(0 0 8px rgba(0, 229, 255, 0.4));
            transform: scale(1.05);
        }
        .nav-item.glow-gold .nav-icon {
            filter: brightness(1) drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
            transform: scale(1.05);
        }
        .nav-item.glow-purple .nav-icon {
            filter: brightness(1) drop-shadow(0 0 8px rgba(41, 121, 255, 0.4));
            transform: scale(1.05);
        }
        .nav-label {
            font-size: 0.6rem;
            color: #888;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nav-item.active .nav-label { color: #FFD700; }

        @media (max-width: 600px) {
            .page-title { font-size: 1.3rem; }
            .profile-name { font-size: 1.2rem; }
            .profile-img { width: 75px; height: 75px; }
            .profile-avatar { width: 40px; height: 40px; }
            .profile-avatar svg { width: 22px; height: 22px; }
            .menu-text { font-size: 0.85rem; }
            .nav-icon { width: 24px; height: 24px; }
            .nav-label { font-size: 0.5rem; }
            .modal-card { padding: 1rem; }
        }
    </style>
</head>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ===== HELPERS =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '90px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = isError ? '#ef4444' : '#00C853';
            toast.style.color = '#050505';
            toast.style.padding = '8px 20px';
            toast.style.borderRadius = '40px';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.style.boxShadow = '0 4px 20px rgba(0,200,83,0.15)';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ===== BLOCK LISTENER =====
        let userBlockListener = null;

        function watchBlockStatus(userId) {
            if (userBlockListener) userBlockListener();
            userBlockListener = db.collection('users').doc(userId)
                .onSnapshot((doc) => {
                    if (doc.exists && doc.data().isBlocked === true) {
                        showToast('⚠️ Your account has been blocked. Redirecting to login...', true);
                        setTimeout(async () => {
                            await auth.signOut();
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                }, (err) => console.warn('Block listener error:', err));
        }

        window.addEventListener('beforeunload', () => {
            if (userBlockListener) userBlockListener();
        });

        // ===== USER PROFILE =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);

            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    document.getElementById('userName').innerText = escapeHtml(data.fullName || 'User');
                    document.getElementById('userEmail').innerText = escapeHtml(data.email || user.email);
                } else {
                    document.getElementById('userName').innerText = escapeHtml(user.displayName || 'Investor');
                    document.getElementById('userEmail').innerText = escapeHtml(user.email);
                }
                document.getElementById('modalEmail').value = user.email;
            } catch (err) {
                console.error(err);
                document.getElementById('userName').innerText = 'User';
                document.getElementById('userEmail').innerText = escapeHtml(user.email);
                document.getElementById('modalEmail').value = user.email;
            }
        });

        // ===== ONLINE/OFFLINE TOGGLE =====
        let isOnline = true;
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const onlineToggle = document.getElementById('onlineToggle');

        function updateOnlineStatus() {
            if (isOnline) {
                statusDot.classList.remove('offline');
                statusText.innerText = 'Online';
            } else {
                statusDot.classList.add('offline');
                statusText.innerText = 'Offline';
            }
            localStorage.setItem('userOnline', isOnline);
        }
        const saved = localStorage.getItem('userOnline');
        if (saved !== null) isOnline = saved === 'true';
        updateOnlineStatus();
        onlineToggle.addEventListener('click', () => { isOnline = !isOnline; updateOnlineStatus(); });

        // ===== PASSWORD MODAL =====
        const modal = document.getElementById('passwordModal');
        const changePwdBtn = document.getElementById('changePasswordBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const modalMessage = document.getElementById('modalMessage');

        changePwdBtn.addEventListener('click', () => {
            modal.classList.add('active');
            modalMessage.innerHTML = '';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        });
        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        forgotLink.addEventListener('click', () => {
            modalMessage.innerHTML = '<div class="msg">📞 Contact admin: +260 95 135 9357 (Manager) for account recovery.</div>';
        });

        document.getElementById('submitPasswordChange').addEventListener('click', async () => {
            const email = document.getElementById('modalEmail').value;
            const oldPwd = document.getElementById('oldPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const user = auth.currentUser;
            if (!user || user.email !== email) {
                modalMessage.innerHTML = '<div class="msg error">Email does not match logged-in account.</div>';
                return;
            }
            if (newPwd.length < 6) {
                modalMessage.innerHTML = '<div class="msg error">New password must be at least 6 characters.</div>';
                return;
            }
            if (newPwd !== confirmPwd) {
                modalMessage.innerHTML = '<div class="msg error">New passwords do not match.</div>';
                return;
            }
            const credential = firebase.auth.EmailAuthProvider.credential(email, oldPwd);
            try {
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPwd);
                modalMessage.innerHTML = '<div class="msg success">✅ Password changed successfully! You will be logged out.</div>';
                setTimeout(async () => {
                    await auth.signOut();
                    await new Promise(r => setTimeout(r, 300));
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                let msg = err.message;
                if (err.code === 'auth/wrong-password') msg = 'Old password is incorrect.';
                modalMessage.innerHTML = `<div class="msg error">${escapeHtml(msg)}</div>`;
            }
        });

        // ===== LOGOUT =====
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await auth.signOut();
                await new Promise(resolve => setTimeout(resolve, 300));
            } catch (err) {
                console.warn("Sign out error:", err);
            }
            window.location.href = 'login.html';
        });

        // ===== APK DOWNLOAD =====
        document.getElementById('downloadApkBtn').addEventListener('click', () => {
            const apkUrl = 'https://your-server.com/pureore-capital.apk'; // CHANGE THIS
            const link = document.createElement('a');
            link.href = apkUrl;
            link.download = 'pureore-capital.apk';
            link.click();
            setTimeout(() => {
                alert('If download does not start automatically, please contact support.');
            }, 1000);
        });

        // ===== BOTTOM NAVIGATION =====
        const navItems = document.querySelectorAll('.nav-item');
        const currentPage = window.location.pathname.split('/').pop() || 'me.html';

        navItems.forEach(item => {
            const targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', () => {
                if (targetPage && !window.location.pathname.includes(targetPage)) {
                    window.location.href = targetPage;
                }
            });
        });

        // ===== AUTO-GLOW NAVIGATION (lightweight) =====
        const glowColors = ['glow', 'glow-gold', 'glow-purple', ''];
        let glowIndex = 0;

        function cycleGlow() {
            navItems.forEach(item => {
                item.classList.remove('glow', 'glow-gold', 'glow-purple');
            });
            if (glowColors[glowIndex]) {
                const targetIndex = glowIndex % navItems.length;
                navItems[targetIndex].classList.add(glowColors[glowIndex]);
            }
            glowIndex = (glowIndex + 1) % (navItems.length + 1);
        }
        setInterval(cycleGlow, 3000);
    </script>
</body>
</html>
