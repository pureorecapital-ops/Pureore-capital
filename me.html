<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Profile – Sajvera Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #060d1a;
            min-height: 100vh;
            padding-top: 70px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
        }

        /* ----- FULL SCREEN BLURRED BACKGROUND IMAGE (YOUR IMAGE) ----- */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/hJKq9tHT/file-0000000016a4820cade58b3dbac7151c.png');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.3) saturate(0.8);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 22, 40, 0.40) 0%, rgba(6, 13, 26, 0.85) 100%);
        }

        /* ----- HEADER (TRANSLUCENT) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(10, 22, 40, 0.60);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: #f1f5f9;
            border-radius: 4px;
            transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ----- SLIDE MENU PANEL (GLASS) ----- */
        .menu-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            height: 100%;
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.6);
            padding: 2rem 1.8rem;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            color: #f1f5f9;
            border-left: 1px solid rgba(255, 255, 255, 0.04);
        }

        .menu-panel.open {
            right: 0;
        }

        .menu-panel .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 0.5rem;
            transition: 0.2s;
        }
        .menu-panel .close-btn:hover {
            color: #ffffff;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.7rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            background: transparent;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            transform: translateX(4px);
        }

        .menu-item .mi-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-item .mi-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-item .mi-label {
            flex: 1;
        }

        .menu-item .mi-arrow {
            color: rgba(255, 255, 255, 0.15);
        }
        .menu-item .mi-arrow svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 0.2rem 0.8rem;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ===== PROFILE CARD (GLASSMORPHISM) ===== */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.6s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card .avatar-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .profile-card .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .profile-card .avatar .avatar-letter {
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
        }

        .profile-card .name {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .profile-card .email {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 0.1rem;
        }

        .profile-card .status-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.6rem auto 0;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            width: fit-content;
        }

        .profile-card .status-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .profile-card .status-toggle .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            transition: background 0.3s ease;
        }

        .profile-card .status-toggle .dot.offline {
            background: #dc2626;
        }

        /* ===== 3 BALANCES (GLASS CARDS) ===== */
        .balances-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.6rem;
        }

        @media (max-width: 420px) {
            .balances-row {
                gap: 0.5rem;
            }
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1rem 0.4rem;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .balance-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.15);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }

        .balance-card .bal-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
        }

        .balance-card .bal-value {
            font-size: 1.6rem;
            font-weight: 800;
            margin-top: 2px;
            line-height: 1.2;
            letter-spacing: -0.3px;
            color: #ffffff;
            animation: pulseValue 2.5s ease-in-out infinite;
        }

        .balance-card .bal-sub {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
        }

        .balance-card.deposit .bal-value {
            color: #60a5fa;
        }
        .balance-card.wallet .bal-value {
            color: #93bbfc;
        }
        .balance-card.total .bal-value {
            color: #ffffff;
        }

        @keyframes pulseValue {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.03);
                opacity: 0.85;
            }
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .action-btn {
            padding: 0.85rem;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-btn.deposit {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.20), rgba(37, 99, 235, 0.05));
            border-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
        }

        .action-btn.deposit:hover {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(37, 99, 235, 0.10));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
        }

        .action-btn.withdraw {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(59, 130, 246, 0.03));
            border-color: rgba(59, 130, 246, 0.10);
            color: #93bbfc;
        }

        .action-btn.withdraw:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.30), rgba(59, 130, 246, 0.08));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            color: rgba(255, 255, 255, 0.6);
        }

        .action-row-secondary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }

        /* ===== MODAL (GLASS) ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 2rem 1.8rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-card .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-card .modal-close:hover {
            color: #ffffff;
        }

        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .modal-card .form-group {
            margin-bottom: 0.8rem;
        }

        .modal-card .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-card .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }

        .modal-card .form-group input:focus {
            border-color: rgba(59, 130, 246, 0.20);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.04);
        }

        .modal-card .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.10);
        }

        .modal-card .form-group input[readonly] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-card .btn-primary {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.3rem;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
        }

        .modal-card .btn-primary:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        .modal-card .btn-primary:active {
            transform: scale(0.98);
        }

        .modal-card .btn-secondary {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .modal-card .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.10);
            color: #ffffff;
        }

        .modal-card .forgot-link {
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: #60a5fa;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-card .forgot-link:hover {
            color: #93bbfc;
            text-decoration: underline;
        }

        .modal-card .msg {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            padding: 0.5rem;
            border-radius: 12px;
        }

        .modal-card .msg.error {
            color: #f87171;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.10);
        }

        .modal-card .msg.success {
            color: #6ee7b7;
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.10);
        }

        /* ===== BOTTOM NAV (5 ICONS: Home, Income, Market, Team, Me) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 22, 40, 0.70);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }

        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        .nav-item:hover .nav-icon {
            stroke: #60a5fa;
        }

        .nav-item.marketplace .nav-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            padding: 4px;
            stroke: #fff;
            margin-bottom: 2px;
        }

        .nav-item.marketplace.active .nav-icon {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .nav-item.marketplace .nav-label {
            color: #60a5fa;
            font-weight: 700;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 22, 40, 0.90);
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(52, 211, 153, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .menu-panel {
                width: 280px;
                right: -300px;
                padding: 1.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .profile-card {
                padding: 1.5rem 1.2rem;
            }
            .profile-card .avatar {
                width: 80px;
                height: 80px;
            }

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // HAMBURGER MENU
        // ================================================================
        var hamburger = document.getElementById('hamburger');
        var menuPanel = document.getElementById('menuPanel');
        var closeMenu = document.getElementById('closeMenu');

        function toggleMenu() {
            var open = menuPanel.classList.toggle('open');
            hamburger.classList.toggle('active', open);
            document.body.style.overflow = open ? 'hidden' : '';
        }
        hamburger.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menuPanel.classList.contains('open')) toggleMenu();
        });

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // FIXED: AUTH STATE WITH PROPER INITIALIZATION HANDLING
        // ================================================================
        let authResolved = false;
        let redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                watchBlockStatus(user.uid);

                db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();

                        var fullName = data.fullName || 'User';
                        var email = data.email || user.email;

                        // Main profile
                        document.getElementById('userName').textContent = escapeHtml(fullName);
                        document.getElementById('userEmail').textContent = escapeHtml(email);
                        document.getElementById('modalEmail').value = email;

                        // Avatar letter
                        var firstLetter = fullName.charAt(0).toUpperCase();
                        document.getElementById('avatarLetter').textContent = firstLetter;

                        // Balances
                        var deposit = data.depositBalance || 0;
                        var wallet = data.walletBalance || 0;
                        var total = deposit + wallet;

                        document.getElementById('depositBalance').textContent = deposit.toFixed(2);
                        document.getElementById('walletBalance').textContent = wallet.toFixed(2);
                        document.getElementById('totalBalance').textContent = total.toFixed(2);
                    }
                }, function(err) {
                    console.warn('Profile listener error:', err);
                });
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // ONLINE / OFFLINE TOGGLE
        // ================================================================
        var isOnline = true;
        var statusDot = document.getElementById('statusDot');
        var statusText = document.getElementById('statusText');

        function updateStatus() {
            if (isOnline) {
                statusDot.className = 'dot';
                statusText.textContent = 'Online';
            } else {
                statusDot.className = 'dot offline';
                statusText.textContent = 'Offline';
            }
            localStorage.setItem('userOnline', isOnline);
        }

        var saved = localStorage.getItem('userOnline');
        if (saved !== null) isOnline = saved === 'true';
        updateStatus();

        document.getElementById('onlineToggle').addEventListener('click', function() {
            isOnline = !isOnline;
            updateStatus();
        });

        // ================================================================
        // PASSWORD MODAL
        // ================================================================
        var modal = document.getElementById('passwordModal');
        var changePwdBtn = document.getElementById('changePasswordBtn');
        var closeModalBtn = document.getElementById('closeModalBtn');
        var cancelModalBtn = document.getElementById('cancelModalBtn');
        var forgotLink = document.getElementById('forgotPasswordLink');
        var modalMessage = document.getElementById('modalMessage');

        function openModal() {
            modal.classList.add('active');
            modalMessage.innerHTML = '';
            modalMessage.className = 'msg';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        changePwdBtn.addEventListener('click', openModal);

        function closeModal() {
            modal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        forgotLink.addEventListener('click', function() {
            modalMessage.className = 'msg';
            modalMessage.innerHTML = '📞 Contact admin: +260 95 135 9357 (Manager) for account recovery.';
        });

        document.getElementById('submitPasswordChange').addEventListener('click', async function() {
            var email = document.getElementById('modalEmail').value;
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            var user = auth.currentUser;

            if (!user || user.email !== email) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'Email does not match logged-in account.';
                return;
            }
            if (newPwd.length < 6) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'New password must be at least 6 characters.';
                return;
            }
            if (newPwd !== confirmPwd) {
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = 'New passwords do not match.';
                return;
            }

            var credential = firebase.auth.EmailAuthProvider.credential(email, oldPwd);
            try {
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPwd);
                modalMessage.className = 'msg success';
                modalMessage.innerHTML = '✅ Password changed successfully! You will be logged out.';
                setTimeout(async function() {
                    await auth.signOut();
                    await new Promise(r => setTimeout(r, 300));
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                var msg = err.message;
                if (err.code === 'auth/wrong-password') msg = 'Old password is incorrect.';
                modalMessage.className = 'msg error';
                modalMessage.innerHTML = escapeHtml(msg);
            }
        });

        // ================================================================
        // LOGOUT
        // ================================================================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await auth.signOut();
                await new Promise(function(resolve) { setTimeout(resolve, 300); });
            } catch (err) {
                console.warn('Sign out error:', err);
            }
            window.location.href = 'login.html';
        });

        // ================================================================
        // APK DOWNLOAD
        // ================================================================
        document.getElementById('downloadApkBtn').addEventListener('click', function() {
            var apkUrl = 'PureOreCapital.apk';
            var link = document.createElement('a');
            link.href = apkUrl;
            link.download = 'PureOreCapital.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function() {
                showToast('📱 Downloading PureOreCapital.apk...', false);
            }, 100);
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'me.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✅ Profile page · Sajvera Capital · Premium glassmorphism with 5 bottom nav icons');
        console.log('🖼️ Full screen blurred background image');
        console.log('🔵 Blue theme with translucent glass cards');
        console.log('📱 Bottom nav: Home, Income, Market, Team, Me');
        console.log('✅ Fixed: auth state now waits 2s before redirecting to login');
    </script>
