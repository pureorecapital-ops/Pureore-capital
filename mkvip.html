    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 40%, rgba(46, 204, 113, 0.03) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .loader {
            border: 3px solid #2C2C3A;
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .plans-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0 2rem;
        }
        .plan-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(46, 204, 113, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            border-color: #f1c40f;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .plan-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #1a1a2a;
            border-bottom: 1px solid rgba(46,204,113,0.2);
        }
        .plan-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .plan-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #f1c40f;
        }
        .plan-lock {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.5rem;
            font-style: italic;
        }
        .plan-limit {
            font-size: 0.75rem;
            color: #f1c40f;
            background: rgba(241,196,15,0.2);
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            margin-bottom: 0.5rem;
        }
        .plan-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 0.8rem 0;
            background: #111116;
            padding: 0.8rem;
            border-radius: 24px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .detail-label {
            color: #aaa;
        }
        .detail-value {
            font-weight: 600;
            color: #2ecc71;
        }
        .total-income {
            background: rgba(46,204,113,0.1);
            border-radius: 24px;
            padding: 0.6rem;
            text-align: center;
            margin: 0.8rem 0;
            font-weight: bold;
            font-size: 1.2rem;
            color: #f1c40f;
        }
        .invest-btn {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #239b56);
            border: none;
            padding: 0.7rem;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            height: 48px;
            margin-top: auto;
        }
        .invest-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
        .invest-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
            transform: none;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover {
            transform: translateY(-3px);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label {
            color: #2ecc71;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #0A0A0C;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1001;
            animation: fadeUpOut 5s ease forwards;
        }
        .toast.error {
            background: #ef4444;
            color: white;
        }
        @keyframes fadeUpOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        .fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
        }
        @media (min-width: 601px) and (max-width: 900px) {
            .plan-card { max-width: 380px; }
            .plan-image { height: 180px; }
            .plan-content { padding: 24px; }
        }
        @media (min-width: 901px) {
            .plan-card { max-width: 440px; }
            .plan-image { height: 200px; }
            .plan-content { padding: 28px 32px; }
            .invest-btn { height: 52px; font-size: 1.1rem; }
            .plan-title { font-size: 1.6rem; }
        }
        @media (max-width: 600px) {
            .plan-title { font-size: 1.2rem; }
        }
    </style>
</head>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    function showToast(message, isError = false) {
        const oldToast = document.querySelector('.toast');
        if (oldToast) oldToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            if (toast.parentNode) toast.remove();
        }, 5000);
    }

    let fireworksAnimationId = null;
    function showFireworks() {
        const canvas = document.getElementById('fireworksCanvas');
        if (!canvas) return;
        if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        let particles = [];
        for (let i = 0; i < 120; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 1,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let anyAlive = false;
            for (let p of particles) {
                if (p.life <= 0) continue;
                anyAlive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            if (anyAlive) {
                fireworksAnimationId = requestAnimationFrame(animate);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fireworksAnimationId = null;
            }
        }
        fireworksAnimationId = requestAnimationFrame(animate);
        setTimeout(() => {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }, 2500);
    }

    function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
    }

    function addWeekdays(startDate, days) {
        let result = new Date(startDate);
        let added = 0;
        while (added < days) {
            result.setDate(result.getDate() + 1);
            if (!isWeekend(result)) added++;
        }
        return result;
    }

    let userPurchaseCounts = {};

    function getSafeImageUrl(url) {
        if (!url || url === '') return 'https://i.ibb.co/7t9YKLX7/IMG-20260525-113152.jpg';
        let safeUrl = url.trim();
        if (safeUrl.startsWith('http://')) {
            safeUrl = safeUrl.replace('http://', 'https://');
        }
        if (safeUrl.startsWith('//')) {
            safeUrl = 'https:' + safeUrl;
        }
        if (safeUrl.includes('ibb.co/') && !safeUrl.includes('i.ibb.co')) {
            const match = safeUrl.match(/ibb\.co\/([a-zA-Z0-9]+)/);
            if (match && match[1]) {
                safeUrl = `https://i.ibb.co/${match[1]}/image.jpg`;
            }
        }
        if (safeUrl.includes('imgur.com/') && !safeUrl.includes('i.imgur.com')) {
            const match = safeUrl.match(/imgur\.com\/([a-zA-Z0-9]+)/);
            if (match && match[1]) {
                safeUrl = `https://i.imgur.com/${match[1]}.jpg`;
            }
        }
        return safeUrl;
    }

    async function loadPlans() {
        const loadingDiv = document.getElementById('loadingIndicator');
        const grid = document.getElementById('plansGrid');
        const emptyMsg = document.getElementById('emptyMessage');
        try {
            loadingDiv.style.display = 'block';
            grid.innerHTML = '';
            emptyMsg.style.display = 'none';
            const snapshot = await db.collection('mkvipPlans').orderBy('createdAt', 'desc').limit(6).get();
            if (snapshot.empty) {
                loadingDiv.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }
            const plans = [];
            snapshot.forEach(doc => plans.push({ id: doc.id, ...doc.data() }));

            const user = auth.currentUser;
            if (user) {
                const investmentsSnapshot = await db.collection('investments')
                    .where('userId', '==', user.uid)
                    .get();
                userPurchaseCounts = {};
                investmentsSnapshot.forEach(doc => {
                    const planName = doc.data().planName;
                    userPurchaseCounts[planName] = (userPurchaseCounts[planName] || 0) + 1;
                });
            }
            renderPlans(plans);
            loadingDiv.style.display = 'none';
        } catch (err) {
            console.error(err);
            loadingDiv.style.display = 'none';
            emptyMsg.style.display = 'block';
            emptyMsg.innerText = 'Failed to load plans. Please refresh.';
        }
    }

    function renderPlans(plans) {
        const grid = document.getElementById('plansGrid');
        grid.innerHTML = '';
        plans.forEach(plan => {
            const minAmount = plan.minAmount || 0;
            const days = plan.days || 0;
            const dailyAmount = plan.dailyReturn || 0;
            const totalIncome = dailyAmount * days;
            const lockText = plan.lock || 'Purchased 1 time and locked';
            const purchaseLimit = plan.purchaseLimit;
            const userPurchased = userPurchaseCounts[plan.name] || 0;
            const limitReached = (purchaseLimit && purchaseLimit > 0 && userPurchased >= purchaseLimit);
            let limitText = '';
            if (purchaseLimit && purchaseLimit > 0) {
                limitText = `<div class="plan-limit">🔒 Limit: ${purchaseLimit} per user (you have ${userPurchased})</div>`;
                if (limitReached) {
                    limitText = `<div class="plan-limit" style="background:#ef444420; color:#ef4444;">❌ Limit reached (${purchaseLimit}/${purchaseLimit})</div>`;
                }
            } else if (purchaseLimit === 0) {
                limitText = `<div class="plan-limit">♾️ Unlimited</div>`;
            }
            
            const imageUrl = plan.image || '';
            const safeImageUrl = getSafeImageUrl(imageUrl);
            
            const card = document.createElement('div');
            card.className = 'plan-card';
            const disabledAttr = limitReached ? 'disabled' : '';
            card.innerHTML = `
                <img class="plan-image" src="${safeImageUrl}" alt="${escapeHtml(plan.name)}" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://i.ibb.co/7t9YKLX7/IMG-20260525-113152.jpg'">
                <div class="plan-content">
                    <div class="plan-title">${escapeHtml(plan.name)}</div>
                    ${limitText}
                    <div class="plan-lock">${escapeHtml(lockText)}</div>
                    <div class="plan-details">
                        <div class="detail-item"><span class="detail-label">Invest:</span><span class="detail-value">${minAmount} ZMW</span></div>
                        <div class="detail-item"><span class="detail-label">Days:</span><span class="detail-value">${days}</span></div>
                        <div class="detail-item"><span class="detail-label">Daily:</span><span class="detail-value">${dailyAmount} ZMW</span></div>
                        <div class="detail-item"><span class="detail-label">Expiry:</span><span class="detail-value">${escapeHtml(plan.expiry || 'Auto')}</span></div>
                    </div>
                    <div class="total-income">💰 TOTAL INCOME: ${totalIncome.toFixed(2)} ZMW</div>
                    <button class="invest-btn" data-plan='${JSON.stringify({
                        name: plan.name,
                        investAmount: minAmount,
                        dailyAmount: dailyAmount,
                        days: days,
                        purchaseLimit: purchaseLimit
                    })}' ${disabledAttr}>💎 INVEST NOW</button>
                </div>
            `;
            grid.appendChild(card);
        });
        attachInvestHandlers();
    }

    async function investInPlan(plan) {
        console.log("investInPlan called with plan:", plan);
        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        const userId = user.uid;
        const investAmount = plan.investAmount;
        const dailyAmount = plan.dailyAmount;
        const days = plan.days;
        const purchaseLimit = plan.purchaseLimit;

        if (!investAmount || investAmount <= 0) {
            showToast('Invalid investment amount for this plan.', true);
            return;
        }
        if (!dailyAmount || dailyAmount <= 0) {
            showToast('Invalid daily profit amount for this plan.', true);
            return;
        }

        // Check purchase limit
        if (purchaseLimit && purchaseLimit > 0) {
            try {
                const existingCountQuery = await db.collection('investments')
                    .where('userId', '==', userId)
                    .where('planName', '==', plan.name)
                    .get();
                const activeCount = existingCountQuery.size;
                if (activeCount >= purchaseLimit) {
                    showToast(`❌ You have already reached the limit (${purchaseLimit}) for this plan.`, true);
                    const btns = document.querySelectorAll('.invest-btn');
                    btns.forEach(btn => {
                        const btnPlan = JSON.parse(btn.dataset.plan);
                        if (btnPlan.name === plan.name) {
                            btn.disabled = true;
                            const parentCard = btn.closest('.plan-card');
                            if (parentCard) {
                                const limitDiv = parentCard.querySelector('.plan-limit');
                                if (limitDiv) limitDiv.innerHTML = '❌ Limit reached';
                            }
                        }
                    });
                    return;
                }
            } catch (err) {
                console.error("Limit check error:", err);
                showToast("Error checking purchase limit. Please try again.", true);
                return;
            }
        }

        // Fetch user balance
        let userDoc, currentBalance;
        try {
            userDoc = await db.collection('users').doc(userId).get();
            if (!userDoc.exists) {
                showToast('User data not found.', true);
                return;
            }
            currentBalance = userDoc.data().balance || 0;
            console.log("Current balance:", currentBalance, "Invest amount:", investAmount);
        } catch (err) {
            console.error("Balance fetch error:", err);
            showToast("Error fetching balance. Please try again.", true);
            return;
        }

        // Check balance with tolerance
        if (currentBalance + 0.001 < investAmount) {
            showToast(`Insufficient balance! You need ${investAmount} ZMW. Your balance: ${currentBalance.toFixed(2)} ZMW.`, true);
            return;
        }

        // Check first investment and referral bonus
        let existingInvestments, isFirstInvestment;
        try {
            existingInvestments = await db.collection('investments')
                .where('userId', '==', userId)
                .limit(1)
                .get();
            isFirstInvestment = existingInvestments.empty;
        } catch (err) {
            console.error("First investment check error:", err);
            isFirstInvestment = false;
        }

        const userData = userDoc.data();
        const referredBy = userData.referredBy;
        const bonusAlreadyGiven = userData.referralBonusGiven === true;
        const canGiveBonus = referredBy && !bonusAlreadyGiven && isFirstInvestment;

        let referrerId = null;
        let firstDepositAmount = 0;
        if (canGiveBonus) {
            try {
                const referrerQuery = await db.collection('users')
                    .where('referralCode', '==', referredBy)
                    .limit(1)
                    .get();
                if (!referrerQuery.empty) {
                    referrerId = referrerQuery.docs[0].id;
                    const depositsSnapshot = await db.collection('deposits')
                        .where('userId', '==', userId)
                        .where('status', '==', 'completed')
                        .orderBy('createdAt', 'asc')
                        .limit(1)
                        .get();
                    if (!depositsSnapshot.empty) {
                        firstDepositAmount = depositsSnapshot.docs[0].data().amount;
                    }
                }
            } catch (err) {
                console.warn("Could not fetch referrer data, bonus will be skipped:", err);
                // continue without bonus
            }
        }

        const allBtns = document.querySelectorAll('.invest-btn');
        allBtns.forEach(btn => btn.disabled = true);

        // Start the purchase process (without transaction to avoid silent failures)
        try {
            // 1. Update user balance
            const newBalance = currentBalance - investAmount;
            await db.collection('users').doc(userId).update({ balance: newBalance });
            console.log("User balance updated to", newBalance);

            // 2. Create investment document
            let startDate = new Date();
            if (isWeekend(startDate)) {
                startDate.setDate(startDate.getDate() + (8 - startDate.getDay()));
                startDate.setHours(0, 0, 0, 0);
            }
            const businessDays = days;
            const businessEndDate = addWeekdays(startDate, businessDays);

            const investmentRef = db.collection('investments').doc();
            await investmentRef.set({
                userId: userId,
                planName: plan.name,
                investAmount: investAmount,
                dailyReturn: dailyAmount,
                days: days,
                businessDays: businessDays,
                startDate: firebase.firestore.Timestamp.fromDate(startDate),
                businessEndDate: firebase.firestore.Timestamp.fromDate(businessEndDate),
                lastClaimed: firebase.firestore.Timestamp.fromDate(startDate),
                status: 'active',
                totalReturn: 0
            });
            console.log("Investment created:", investmentRef.id);

            // 3. Record transaction (investment)
            await db.collection('transactions').add({
                userId: userId,
                type: 'investment',
                amount: investAmount,
                description: `Purchased ${plan.name} (MK VIP)`,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("Investment transaction recorded");

            // 4. Handle referral bonus if applicable
            let bonusSuccess = false;
            if (canGiveBonus && referrerId) {
                try {
                    const bonusAmount = investAmount * 0.05;
                    // Update referrer balance
                    const referrerRef = db.collection('users').doc(referrerId);
                    const referrerSnap = await referrerRef.get();
                    const newReferrerBalance = (referrerSnap.data().balance || 0) + bonusAmount;
                    await referrerRef.update({ balance: newReferrerBalance });
                    
                    // Mark this user as having received the bonus
                    await db.collection('users').doc(userId).update({ referralBonusGiven: true });
                    
                    // Record referral earnings
                    await db.collection('referralEarnings').add({
                        referrerId: referrerId,
                        referredUserId: userId,
                        amount: bonusAmount,
                        depositAmount: firstDepositAmount,
                        planAmount: investAmount,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Record transaction for referrer
                    await db.collection('transactions').add({
                        userId: referrerId,
                        type: 'referral_bonus',
                        amount: bonusAmount,
                        description: `Referral bonus from ${userData.fullName || user.email} (5% of K${investAmount} plan)`,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    bonusSuccess = true;
                    console.log("Referral bonus of", bonusAmount, "given to", referrerId);
                } catch (bonusErr) {
                    console.warn("Bonus failed but investment succeeded:", bonusErr);
                    // Do not revert the investment; just log and continue
                }
            }

            showFireworks();
            if (bonusSuccess) {
                const bonusAmount = investAmount * 0.05;
                showToast(`✅ Success! Invested ${investAmount} ZMW. Your referrer earned ${bonusAmount.toFixed(2)} ZMW bonus! Redirecting...`, false);
            } else {
                showToast(`✅ Success! Invested ${investAmount} ZMW in ${plan.name}. Redirecting to Income page...`, false);
            }
            setTimeout(() => {
                window.location.href = 'income.html';
            }, 2000);
        } catch (err) {
            console.error("Investment error (full object):", err);
            let errorMsg = err.message || err.code || "Unknown error";
            showToast("Investment failed: " + errorMsg, true);
            // Re-enable buttons
            allBtns.forEach(btn => btn.disabled = false);
        }
    }

    function attachInvestHandlers() {
        document.querySelectorAll('.invest-btn').forEach(btn => {
            btn.removeEventListener('click', investHandler);
            if (!btn.disabled) {
                btn.addEventListener('click', investHandler);
            }
        });
    }

    function investHandler(e) {
        const btn = e.currentTarget;
        try {
            const plan = JSON.parse(btn.dataset.plan);
            investInPlan(plan);
        } catch (err) {
            console.error("Failed to parse plan data:", err);
            showToast("Error processing plan. Please refresh.", true);
        }
    }

    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadPlans();
    });

    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'mkvip.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
