<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="referrer" content="no-referrer">
    <title>News | Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #050505;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #050505 0%, #0a0a0a 25%, #111111 50%, #0a0a0a 75%, #050505 100%);
            background-size: 400% 400%;
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: -3;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 4 FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            z-index: -2;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #FFD700; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #00E5FF; bottom: -10%; right: -10%; animation-delay: 3s; }
        .orb-3 { width: 300px; height: 300px; background: #FFD700; top: 40%; left: 75%; animation-delay: 6s; }
        .orb-4 { width: 280px; height: 280px; background: #00C853; bottom: 30%; left: -5%; animation-delay: 9s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFD700;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,215,0,0.15);
            text-decoration: none;
            margin-bottom: 0.3rem;
        }
        .back-arrow:hover {
            background: #FFD700;
            color: #050505;
            transform: translateX(-4px);
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        .back-arrow svg { width: 18px; height: 18px; fill: currentColor; }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title .icon { font-size: 1.8rem; }

        /* ===== NEWS AVATAR ===== */
        .news-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #F59E0B, #00C853);
            background-size: 200% 200%;
            animation: avatarFlow 4s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255,215,0,0.2);
            flex-shrink: 0;
        }
        @keyframes avatarFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .news-avatar svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* ===== FLAGS MARQUEE ===== */
        .flags-container {
            background: rgba(18, 18, 24, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.5rem 0;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,215,0,0.06);
            overflow: hidden;
        }
        .flags-marquee {
            display: flex;
            animation: scrollFlags 20s linear infinite;
            width: fit-content;
        }
        .flag-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            margin: 0 0.8rem;
        }
        .flag-icon { font-size: 1.8rem; }
        .flag-name {
            font-size: 0.65rem;
            margin-top: 0.1rem;
            color: #888;
        }
        @keyframes scrollFlags {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(17, 17, 17, 0.95), rgba(17, 17, 17, 0.95)),
                              linear-gradient(135deg, #FFD700, #00C853, #FFD700);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        /* Post Header */
        .post-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .post-author {
            font-weight: 700;
            color: #FFD700;
        }
        .post-time {
            font-size: 0.7rem;
            color: #666;
        }
        .post-badge {
            background: rgba(0,200,83,0.1);
            border: 1px solid rgba(0,200,83,0.15);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #00C853;
        }

        /* Post Content */
        .post-title {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.8rem 1.2rem 0.3rem;
            color: #fff;
        }
        .post-body {
            padding: 0 1.2rem 0.8rem;
            color: #ccc;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            background: #1a1a2a;
        }

        /* Post Actions */
        .post-actions {
            display: flex;
            gap: 1rem;
            padding: 0.6rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.03);
            color: #fff;
        }
        .action-btn.liked {
            color: #FF4757;
        }
        .action-btn.liked .heart-icon {
            transform: scale(1.1);
        }
        .action-btn .heart-icon {
            transition: 0.3s;
            font-size: 1.2rem;
        }

        /* Comment Section */
        .comment-section {
            padding: 0.8rem 1.2rem 1rem;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        .comment-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 60px;
            padding: 0.2rem 0.5rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .comment-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.5rem 0.2rem;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .comment-input-wrapper input::placeholder {
            color: #555;
        }
        .emoji-picker {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .emoji-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.1rem 0.2rem;
            transition: 0.2s;
            border-radius: 4px;
        }
        .emoji-btn:hover {
            transform: scale(1.2);
            background: rgba(255,255,255,0.03);
        }
        .comment-submit {
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #050505;
            cursor: pointer;
            transition: 0.3s;
        }
        .comment-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(255,215,0,0.2);
        }
        .comment-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Comments List */
        .comments-list {
            margin-top: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .comment-item {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.5rem 0.8rem;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00C853, #009624);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: #050505;
            flex-shrink: 0;
        }
        .comment-body {
            flex: 1;
        }
        .comment-author {
            font-weight: 600;
            font-size: 0.8rem;
            color: #FFD700;
        }
        .comment-text {
            font-size: 0.85rem;
            color: #ddd;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .comment-empty {
            text-align: center;
            color: #555;
            font-size: 0.8rem;
            padding: 0.3rem;
        }

        /* ===== LOADER ===== */
        .loader {
            border: 3px solid #1a1a2a;
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-msg {
            text-align: center;
            color: #666;
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #00C853;
            color: #050505;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            z-index: 1001;
            animation: fadeUpOut 5s ease forwards;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0,200,83,0.2);
        }
        .toast.error {
            background: #ef4444;
            color: white;
        }
        @keyframes fadeUpOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 14, 0.97);
            backdrop-filter: blur(16px);
            border-top: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(10, 10, 14, 0.97), rgba(10, 10, 14, 0.97)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 6px 18px;
            z-index: 30;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
        }
        .nav-item:hover { transform: translateY(-4px); }
        .nav-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: brightness(0.5) grayscale(0.5);
            transition: 0.4s;
            border-radius: 8px;
            padding: 2px;
        }
        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(255, 215, 0, 0.7));
            transform: scale(1.05);
        }
        .nav-item.glow .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(0, 229, 255, 0.8));
            transform: scale(1.08);
        }
        .nav-item.glow-gold .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
            transform: scale(1.08);
        }
        .nav-item.glow-purple .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(41, 121, 255, 0.8));
            transform: scale(1.08);
        }
        .nav-label {
            font-size: 0.65rem;
            color: #888;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nav-item.active .nav-label { color: #FFD700; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .page-title { font-size: 1.3rem; }
            .news-avatar { width: 45px; height: 45px; }
            .news-avatar svg { width: 24px; height: 24px; }
            .post-title { font-size: 1rem; padding: 0.5rem 1rem 0.2rem; }
            .post-body { padding: 0 1rem 0.6rem; font-size: 0.85rem; }
            .post-header { padding: 0.6rem 1rem; }
            .post-actions { padding: 0.4rem 1rem; }
            .comment-section { padding: 0.6rem 1rem 0.8rem; }
            .flag-item { min-width: 60px; }
            .flag-icon { font-size: 1.4rem; }
            .nav-icon { width: 28px; height: 28px; }
            .nav-label { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 4 FLOATING ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <a href="dashboard.html" class="back-arrow">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>

                </a>
                <div class="page-title">

            <!-- News Avatar -->
            <div class="news-avatar" title="News">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
                </svg>
            </div>
        </div>

        <!-- ===== FLAGS MARQUEE ===== -->
        <div class="flags-container">
            <div class="flags-marquee" id="flagsMarquee"></div>
        </div>

        <!-- ===== NEWS FEED ===== -->
        <div id="newsContainer">
            <div class="loader"></div>
        </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <div class="nav-item" data-page="dashboard.html">
            <img class="nav-icon" src="https://i.ibb.co/qM4qxgGj/file-00000000248871f4bb1e73df45bacb92.png" alt="Home"><span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-page="mkvip.html">
            <img class="nav-icon" src="https://i.ibb.co/5WSyHGRZ/IMG-20260622-183230.jpg" alt="Mk vip"><span class="nav-label">Mkvip</span>
        </div>
        <div class="nav-item" data-page="jproduct.html">
            <img class="nav-icon" src="https://i.ibb.co/1fzvRd58/IMG-20260622-183217.jpg" alt="J product"><span class="nav-label">Jproduct</span>
        </div>
        <div class="nav-item" data-page="income.html">
            <img class="nav-icon" src="https://i.ibb.co/60hq0ds8/IMG-20260622-183154.jpg" alt="Income"><span class="nav-label">Income</span>

        <div class="nav-item" data-page="me.html">

        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ===== HELPERS =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        function showToast(msg, isError = false) {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 4000);
        }

        const DEFAULT_NEWS_IMAGE = 'https://i.ibb.co/4ZYPDdBG/file-000000003320720ab44c069051ca1c2b.png';
        const FALLBACK_IMAGE = 'https://placehold.co/800x400/1a1a2a/FFD700?text=News+Image';

        function getSafeImageUrl(url) {
            if (!url || url === '') return DEFAULT_NEWS_IMAGE;
            let safeUrl = url.trim();
            if (safeUrl.startsWith('http://')) {
                safeUrl = safeUrl.replace('http://', 'https://');
            }
            if (safeUrl.startsWith('//')) {
                safeUrl = 'https:' + safeUrl;
            }
            if (safeUrl.includes('ibb.co/') && !safeUrl.includes('i.ibb.co')) {
                const match = safeUrl.match(/ibb\.co\/([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    safeUrl = `https://i.ibb.co/${match[1]}/image.jpg`;
                }
            }
            if (safeUrl.includes('imgur.com/') && !safeUrl.includes('i.imgur.com')) {
                const match = safeUrl.match(/imgur\.com\/([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    safeUrl = `https://i.imgur.com/${match[1]}.jpg`;
                }
            }
            if (safeUrl === 'https://i.ibb.co/4ZYPDdBG/file-000000003320720ab44c069051ca1c2b.png') {
                return DEFAULT_NEWS_IMAGE;
            }
            return safeUrl;
        }

        let currentUserId = null;
        let currentUserDoc = null;

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            const userDoc = await db.collection('users').doc(currentUserId).get();
            if (userDoc.exists) {
                currentUserDoc = userDoc.data();
            }
            loadNews();
        });

        // ===== LOAD NEWS =====
        async function loadNews() {
            const container = document.getElementById('newsContainer');
            try {
                const snapshot = await db.collection('news').orderBy('createdAt', 'desc').get();
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-msg">📭 No news posts available at the moment.</div>';
                    return;
                }
                let html = '';
                for (const doc of snapshot.docs) {
                    const news = doc.data();
                    const postId = doc.id;
                    const safeImageUrl = getSafeImageUrl(news.imageUrl || '');
                    const likes = news.likes || [];
                    const liked = currentUserId && likes.includes(currentUserId);
                    const commentCount = news.commentCount || 0;

                    // Get comments for this post
                    const commentsSnap = await db.collection('news')
                        .doc(postId)
                        .collection('comments')
                        .orderBy('timestamp', 'asc')
                        .limit(10)
                        .get();

                    let commentsHtml = '';
                    const comments = [];
                    commentsSnap.forEach(c => {
                        const cData = c.data();
                        comments.push({ id: c.id, ...cData });
                    });

                    if (comments.length > 0) {
                        comments.forEach(c => {
                            const initial = c.userName ? c.userName.charAt(0).toUpperCase() : 'U';
                            commentsHtml += `
                                <div class="comment-item">
                                    <div class="comment-avatar">${escapeHtml(initial)}</div>
                                    <div class="comment-body">
                                        <div class="comment-author">${escapeHtml(c.userName || 'User')}</div>
                                        <div class="comment-text">${escapeHtml(c.text)}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        commentsHtml = `<div class="comment-empty">No comments yet. Be the first! 💬</div>`;
                    }

                    const postDate = news.createdAt ? news.createdAt.toDate() : new Date();
                    const timeAgo = getTimeAgo(postDate);

                    html += `
                        <div class="post-card" data-postid="${postId}">
                            <!-- Post Header -->
                            <div class="post-header">
                                <div class="post-avatar">📢</div>
                                <div>
                                    <div class="post-author">Pureore Admin</div>
                                    <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                                        <span class="post-time">${timeAgo}</span>
                                        <span class="post-badge">Official</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Post Content -->
                            <div class="post-title">${escapeHtml(news.title)}</div>
                            <div class="post-body">${escapeHtml(news.content).replace(/\n/g, '<br>')}</div>
                            ${safeImageUrl ? `<img class="post-image" src="${escapeHtml(safeImageUrl)}" alt="${escapeHtml(news.title)}" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';">` : ''}

                            <!-- Post Actions -->
                            <div class="post-actions">
                                <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${postId}')">
                                    <span class="heart-icon">${liked ? '❤️' : '🤍'}</span>
                                    <span id="likeCount_${postId}">${likes.length}</span>
                                </button>
                                <button class="action-btn" onclick="focusComment('${postId}')">
                                    💬 <span id="commentCount_${postId}">${commentCount}</span>
                                </button>
                            </div>

                            <!-- Comment Section -->
                            <div class="comment-section" id="commentSection_${postId}">
                                <div class="comment-input-wrapper">
                                    <input type="text" id="commentInput_${postId}" placeholder="Write a comment...">
                                    <div class="emoji-picker">
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '😊')">😊</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '🔥')">🔥</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '🚀')">🚀</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '💰')">💰</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '🎉')">🎉</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '💎')">💎</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '👍')">👍</button>
                                        <button class="emoji-btn" onclick="addEmoji('${postId}', '❤️')">❤️</button>
                                    </div>
                                    <button class="comment-submit" onclick="submitComment('${postId}')">Post</button>
                                </div>
                                <div class="comments-list" id="commentsList_${postId}">
                                    ${commentsHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-msg">Error loading news. Please refresh.</div>';
            }
        }

        // ===== TIME AGO =====
        function getTimeAgo(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            return date.toLocaleDateString();
        }

        // ===== LIKE FUNCTION =====
        window.toggleLike = async function(postId) {
            if (!currentUserId) return;
            try {
                const postRef = db.collection('news').doc(postId);
                const postSnap = await postRef.get();
                if (!postSnap.exists) return;
                const data = postSnap.data();
                const likes = data.likes || [];
                const liked = likes.includes(currentUserId);

                if (liked) {
                    await postRef.update({
                        likes: firebase.firestore.FieldValue.arrayRemove(currentUserId)
                    });
                } else {
                    await postRef.update({
                        likes: firebase.firestore.FieldValue.arrayUnion(currentUserId)
                    });
                }

                // Update UI
                const likeCountSpan = document.getElementById(`likeCount_${postId}`);
                if (likeCountSpan) {
                    const newLikes = liked ? likes.length - 1 : likes.length + 1;
                    likeCountSpan.textContent = newLikes;
                }
                const actionBtn = document.querySelector(`[data-postid="${postId}"] .action-btn`);
                if (actionBtn) {
                    actionBtn.classList.toggle('liked', !liked);
                    const heart = actionBtn.querySelector('.heart-icon');
                    if (heart) heart.textContent = liked ? '🤍' : '❤️';
                }
            } catch (err) {
                console.error(err);
                showToast('Error toggling like.', true);
            }
        };

        // ===== FOCUS COMMENT INPUT =====
        window.focusComment = function(postId) {
            const input = document.getElementById(`commentInput_${postId}`);
            if (input) input.focus();
        };

        // ===== ADD EMOJI =====
        window.addEmoji = function(postId, emoji) {
            const input = document.getElementById(`commentInput_${postId}`);
            if (input) {
                input.value += emoji;
                input.focus();
            }
        };

        // ===== SUBMIT COMMENT =====
        window.submitComment = async function(postId) {
            if (!currentUserId) return;
            const input = document.getElementById(`commentInput_${postId}`);
            const text = input.value.trim();
            if (!text) {
                showToast('Please write something.', true);
                return;
            }

            try {
                // Check if user already commented on this post
                const existingComments = await db.collection('news')
                    .doc(postId)
                    .collection('comments')
                    .where('userId', '==', currentUserId)
                    .limit(1)
                    .get();

                if (!existingComments.empty) {
                    showToast('You already commented on this post.', true);
                    return;
                }

                const userName = currentUserDoc?.fullName || 'User';

                await db.collection('news')
                    .doc(postId)
                    .collection('comments')
                    .add({
                        userId: currentUserId,
                        userName: userName,
                        text: text,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                // Update comment count
                const postRef = db.collection('news').doc(postId);
                await postRef.update({
                    commentCount: firebase.firestore.FieldValue.increment(1)
                });

                // Clear input
                input.value = '';

                // Refresh comments
                await refreshComments(postId);
                showToast('✅ Comment posted!', false);
            } catch (err) {
                console.error(err);
                showToast('Error posting comment.', true);
            }
        };

        // ===== REFRESH COMMENTS =====
        async function refreshComments(postId) {
            const commentsList = document.getElementById(`commentsList_${postId}`);
            if (!commentsList) return;

            try {
                const commentsSnap = await db.collection('news')
                    .doc(postId)
                    .collection('comments')
                    .orderBy('timestamp', 'asc')
                    .limit(10)
                    .get();

                if (commentsSnap.empty) {
                    commentsList.innerHTML = `<div class="comment-empty">No comments yet. Be the first! 💬</div>`;
                    return;
                }

                let html = '';
                commentsSnap.forEach(c => {
                    const cData = c.data();
                    const initial = cData.userName ? cData.userName.charAt(0).toUpperCase() : 'U';
                    html += `
                        <div class="comment-item">
                            <div class="comment-avatar">${escapeHtml(initial)}</div>
                            <div class="comment-body">
                                <div class="comment-author">${escapeHtml(cData.userName || 'User')}</div>
                                <div class="comment-text">${escapeHtml(cData.text)}</div>
                            </div>
                        </div>
                    `;
                });

                commentsList.innerHTML = html;

                // Update comment count
                const countSpan = document.getElementById(`commentCount_${postId}`);
                if (countSpan) {
                    const count = commentsSnap.size;
                    countSpan.textContent = count;
                }
            } catch (err) {
                console.error(err);
            }
        }

        // ===== FLAGS MARQUEE =====
        const countries = [
            { name: "UK", emoji: "🇬🇧" }, { name: "Congo", emoji: "🇨🇬" },
            { name: "Tanzania", emoji: "🇹🇿" }, { name: "Ghana", emoji: "🇬🇭" },
            { name: "Zimbabwe", emoji: "🇿🇼" }, { name: "Zambia", emoji: "🇿🇲" }
        ];
        const marquee = document.getElementById('flagsMarquee');
        function buildMarquee() {
            let html = '';
            for (let i = 0; i < 2; i++) {
                countries.forEach(country => {
                    html += `<div class="flag-item"><div class="flag-icon">${country.emoji}</div><div class="flag-name">${country.name}</div></div>`;
                });
            }
            marquee.innerHTML = html;
        }
        buildMarquee();

        // ===== NAVIGATION =====
        const navItems = document.querySelectorAll('.nav-item');
        const currentPage = window.location.pathname.split('/').pop() || 'news.html';
        navItems.forEach(item => {
            const targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', () => {
                if (targetPage && !window.location.pathname.includes(targetPage)) {
                    window.location.href = targetPage;
                }
            });
        });

        // ===== AUTO-GLOW NAVIGATION =====
        const glowColors = ['glow', 'glow-gold', 'glow-purple', ''];
        let glowIndex = 0;

        function cycleGlow() {
            navItems.forEach(item => {
                item.classList.remove('glow', 'glow-gold', 'glow-purple');
            });
            if (glowColors[glowIndex]) {
                const targetIndex = glowIndex % navItems.length;
                navItems[targetIndex].classList.add(glowColors[glowIndex]);
            }
            glowIndex = (glowIndex + 1) % (navItems.length + 1);
        }
        setInterval(cycleGlow, 3000);
    </script>
</body>
</html>
