<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>News – PC • Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- COUNTRY SCROLLING (FLAGS) ----- */
        .flags-container {
            border-radius: 60px;
            padding: 0.3rem 0;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(10, 8, 21, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .flags-marquee {
            display: flex;
            animation: scrollFlags 28s linear infinite;
            width: fit-content;
            align-items: center;
        }

        .flag-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            margin: 0 1rem;
        }

        .flag-item .flag-emoji {
            font-size: 1.6rem;
            line-height: 1;
        }

        .flag-item .flag-name {
            font-size: 0.55rem;
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @keyframes scrollFlags {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* ----- NEWS CARD (glass) ----- */
        .news-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 1.2rem;
            position: relative;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .news-card .card-glow {
            position: absolute;
            top: -30%;
            right: -20%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .news-card .card-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .news-card .card-header .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0815;
            flex-shrink: 0;
        }

        .news-card .card-header .info .author {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        .news-card .card-header .info .meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
        }

        .news-card .card-header .info .meta .badge {
            background: rgba(74, 222, 128, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.06);
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-size: 0.55rem;
            color: var(--green);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .news-card .card-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .news-card .card-body {
            padding: 0.8rem 1.2rem 1rem;
        }

        .news-card .card-body .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        .news-card .card-body .content {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card .card-body .content.expanded {
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .news-card .card-footer {
            padding: 0.6rem 1.2rem 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .news-card .card-footer .read-more {
            color: var(--cyan);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.3s ease;
        }

        .news-card .card-footer .read-more:hover {
            color: var(--gold);
        }

        .news-card .card-footer .share-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .news-card .card-footer .share-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
        }

        .news-card .card-footer .share-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.8rem;
        }

        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 0.2rem;
        }

        /* ----- LOADER ----- */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .news-card .card-body .title {
                font-size: 1rem;
            }
            .news-card .card-body .content {
                font-size: 0.8rem;
            }
            .news-card .card-image {
                max-height: 200px;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item .nav-label {
                font-size: 0.45rem;
            }
            .flags-container {
                padding: 0.2rem 0;
            }
            .flag-item {
                min-width: 50px;
                margin: 0 0.6rem;
            }
            .flag-item .flag-emoji {
                font-size: 1.2rem;
            }
            .flag-item .flag-name {
                font-size: 0.5rem;
            }
        }

        @media (max-width: 400px) {
            .news-card .card-header .info .meta {
                font-size: 0.6rem;
                flex-wrap: wrap;
            }
            .news-card .card-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
            }
            .news-card .card-footer .share-btn {
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        function getTimeAgo(date) {
            var now = new Date();
            var diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            return date.toLocaleDateString();
        }

        function getSafeImageUrl(url) {
            if (!url) return null;
            var safeUrl = url.trim();
            if (safeUrl.startsWith('http://')) safeUrl = safeUrl.replace('http://', 'https://');
            if (safeUrl.startsWith('//')) safeUrl = 'https:' + safeUrl;
            if (safeUrl.includes('ibb.co/') && !safeUrl.includes('i.ibb.co')) {
                var match = safeUrl.match(/ibb\.co\/([a-zA-Z0-9]+)/);
                if (match && match[1]) safeUrl = 'https://i.ibb.co/' + match[1] + '/image.jpg';
            }
            return safeUrl;
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // LOAD NEWS
        // ================================================================
        async function loadNews() {
            var container = document.getElementById('newsContainer');
            container.innerHTML = '<div class="loader"></div>';

            try {
                var snapshot = await db.collection('news')
                    .orderBy('createdAt', 'desc')
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            <div class="title">No news available</div>
                            <div class="sub">Check back later for updates</div>
                        </div>
                    `;
                    return;
                }

                var html = '';
                snapshot.forEach(function(doc) {
                    var news = doc.data();
                    var title = news.title || 'Untitled';
                    var content = news.content || '';
                    var imageUrl = getSafeImageUrl(news.imageUrl);
                    var createdAt = news.createdAt ? news.createdAt.toDate() : new Date();
                    var timeAgo = getTimeAgo(createdAt);

                    html += `
                        <div class="news-card" data-id="${doc.id}">
                            <div class="card-glow"></div>
                            <div class="card-header">
                                <div class="avatar">📢</div>
                                <div class="info">
                                    <div class="author">Pureore Admin</div>
                                    <div class="meta">
                                        <span>${timeAgo}</span>
                                        <span class="badge">Official</span>
                                    </div>
                                </div>
                            </div>
                            ${imageUrl ? `<img class="card-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(title)}" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null; this.style.display='none';">` : ''}
                            <div class="card-body">
                                <div class="title">${escapeHtml(title)}</div>
                                <div class="content" id="content_${doc.id}">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                            </div>
                            <div class="card-footer">
                                <button class="read-more" data-id="${doc.id}">Read More</button>
                                <button class="share-btn" data-url="${encodeURIComponent(window.location.href)}">
                                    <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                                    Share
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // Attach read more toggle
                document.querySelectorAll('.read-more').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var content = document.getElementById('content_' + id);
                        if (content) {
                            content.classList.toggle('expanded');
                            this.textContent = content.classList.contains('expanded') ? 'Show Less' : 'Read More';
                        }
                    });
                });

                // Attach share button
                document.querySelectorAll('.share-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var url = decodeURIComponent(this.dataset.url);
                        if (navigator.share) {
                            navigator.share({
                                title: 'Pureore Capital News',
                                text: 'Check out this news from Pureore Capital!',
                                url: url
                            }).catch(function() {});
                        } else {
                            navigator.clipboard.writeText(url).then(function() {
                                showToast('✅ Link copied to clipboard!', false);
                            }).catch(function() {
                                // Fallback
                                var textArea = document.createElement('textarea');
                                textArea.value = url;
                                document.body.appendChild(textArea);
                                textArea.select();
                                document.execCommand('copy');
                                textArea.remove();
                                showToast('✅ Link copied!', false);
                            });
                        }
                    });
                });

            } catch (err) {
                console.error('Error loading news:', err);
                container.innerHTML = '<div class="empty-state"><div class="title">Error loading news</div><div class="sub">Please refresh the page</div></div>';
            }
        }

        // ================================================================
        // FLAGS MARQUEE
        // ================================================================
        var countries = [
            { name: "UK", emoji: "🇬🇧" },
            { name: "Tanzania", emoji: "🇹🇿" },
            { name: "Ghana", emoji: "🇬🇭" },
            { name: "Zimbabwe", emoji: "🇿🇼" },
            { name: "Congo", emoji: "🇨🇬" },
            { name: "Zambia", emoji: "🇿🇲" }
        ];
        var marquee = document.getElementById('flagsMarquee');
        var flagHtml = '';
        for (var r = 0; r < 2; r++) {
            for (var c = 0; c < countries.length; c++) {
                flagHtml += '<div class="flag-item"><div class="flag-emoji">' + countries[c].emoji +
                    '</div><div class="flag-name">' + countries[c].name + '</div></div>';
            }
        }
        marquee.innerHTML = flagHtml;

        // ================================================================
        // AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);
            loadNews();
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'news.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · News (redesigned – no likes)');
        console.log('📰 Clean announcement feed with glass-morphism');
        console.log('🔐 Firebase config untouched');
    </script>

</body>
</html>
