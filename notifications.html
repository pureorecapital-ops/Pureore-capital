<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Notifications | PureOre Nexus</title>
    <meta name="description" content="Stay updated with your PureOre Nexus account notifications." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"
            }
        }
    </script>

    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #bfa76f;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --gold-subtle: rgba(212, 175, 55, 0.08);
            --charcoal: #1a1a1a;
            --dark: #0b0b0b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.5);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ============================================================
           LOADING SCREEN
        ============================================================ */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .load-logo-symbol {
            width: 64px;
            height: 64px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: rgba(212, 175, 55, 0.04);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.06);
            position: relative;
        }
        .load-logo-symbol::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--gold);
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .load-logo-symbol svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .load-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .load-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .load-progress-wrap {
            width: 200px;
            max-width: 60vw;
            margin-top: 1.8rem;
        }
        .load-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .load-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--gold-glow);
            transition: width 0.15s linear;
        }
        .load-msg {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.7rem;
            text-align: center;
            min-height: 1.2em;
            font-weight: 300;
        }

        /* ============================================================
           MAIN PAGE
        ============================================================ */
        #main-page {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.9s ease, transform 1s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background: var(--dark);
        }
        #main-page.visible {
            opacity: 1;
            transform: scale(1);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://i.ibb.co/cXxZh1w3/20260824-014737.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.5) 0%, rgba(11, 11, 11, 0.95) 80%, #0b0b0b 100%);
            pointer-events: none;
        }

        .page-scroll {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: 0 16px 30px 16px;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(11, 11, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin: 0 -16px;
            padding: 14px 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }
        .back-btn:hover {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.04);
        }
        .back-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-header .title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-white);
            flex: 1;
            margin-left: 8px;
        }
        .page-header .title em {
            color: var(--gold);
            font-style: normal;
        }

        .mark-all-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 0.65rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .mark-all-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.04);
            border-color: var(--gold);
        }
        .mark-all-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           PAGE TITLE
        ============================================================ */
        .page-title-section {
            padding: 16px 0 8px;
        }
        .page-title-section h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .page-title-section .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-top: 2px;
        }

        /* ============================================================
           NOTIFICATION LIST
        ============================================================ */
        #notification-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 0 12px;
        }

        .notification-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
        }
        .notification-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }
        .notification-card.unread {
            border-left: 3px solid var(--gold);
            background: rgba(212, 175, 55, 0.03);
        }
        .notification-card.unread .title {
            font-weight: 600;
            color: var(--text-white);
        }

        .notification-card .top-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .notification-card .icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .notification-card .icon-wrap svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .notification-card .content {
            flex: 1;
            min-width: 0;
        }
        .notification-card .content .title {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .notification-card .content .message {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .notification-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .notification-card .bottom-row .date {
            font-size: 0.55rem;
            color: var(--text-muted);
            opacity: 0.6;
        }
        .notification-card .bottom-row .action-link {
            font-size: 0.6rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.25s ease;
        }
        .notification-card .bottom-row .action-link:hover {
            color: #dbb95c;
            text-decoration: underline;
        }
        .notification-card .bottom-row .action-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .notification-card .unread-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* ============================================================
           EMPTY STATE
        ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            width: 56px;
            height: 56px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3;
            display: inline-block;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 0.85rem;
            font-weight: 300;
            max-width: 360px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ============================================================
           SKELETON LOADING
        ============================================================ */
        .skeleton-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 14px 16px;
            animation: pulse 1.5s ease-in-out infinite;
            height: 80px;
        }
        .skeleton-card .skeleton-line {
            height: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            margin-bottom: 8px;
            width: 80%;
        }
        .skeleton-card .skeleton-line.short {
            width: 40%;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 300;
            padding: 20px 0;
        }

        /* ============================================================
           BRANDING FOOTER
        ============================================================ */
        .branding-footer {
            text-align: center;
            padding: 16px 0 8px;
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            opacity: 0.5;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 16px;
        }
        .branding-footer span {
            color: var(--gold);
            opacity: 0.7;
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-white);
            z-index: 50;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: rgba(46, 204, 113, 0.2);
        }
        .toast.error {
            border-color: rgba(231, 76, 60, 0.2);
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .page-scroll {
                padding: 0 12px 20px 12px;
            }
            .page-header {
                padding: 10px 12px;
                margin: 0 -12px;
            }
            .notification-card {
                padding: 12px 14px;
            }
            .notification-card .content .title {
                font-size: 0.75rem;
            }
            .notification-card .content .message {
                font-size: 0.65rem;
            }
            .branding-footer {
                font-size: 0.5rem;
                padding: 12px 0 6px;
            }
            .mark-all-btn {
                font-size: 0.6rem;
                padding: 3px 10px;
            }
        }

        @media (min-width: 768px) {
            .page-scroll {
                padding: 0 32px 40px 32px;
            }
            .page-header {
                padding: 16px 32px;
                margin: 0 -32px;
            }
        }

        /* ============================================================
           SCROLLBAR
        ============================================================ */
        #main-page::-webkit-scrollbar {
            width: 3px;
        }
        #main-page::-webkit-scrollbar-track {
            background: transparent;
        }
        #main-page::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 10px;
        }

        /* ============================================================
           UTILITY
        ============================================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOADING SCREEN
    ============================================================ -->
    <div id="loading-screen" role="status" aria-label="Loading">
        <div class="load-logo">
            <div class="load-logo-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="load-title">PureOre Nexus</div>
            <div class="load-sub">Notifications</div>
        </div>
        <div class="load-progress-wrap">
            <div class="load-progress-track">
                <div class="load-progress-bar" id="load-bar" style="width:0%;"></div>
            </div>
            <div class="load-msg" id="load-msg">Loading notifications...</div>
        </div>
    </div>

    <!-- ============================================================
    MAIN PAGE
    ============================================================ -->
    <div id="main-page">
        <div class="bg-wrap" aria-hidden="true"></div>
        <div class="bg-overlay" aria-hidden="true"></div>

        <div class="page-scroll">

            <!-- ===== HEADER ===== -->
            <header class="page-header">
                <button class="back-btn" id="back-btn" aria-label="Go back">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="title">Notifications</span>
                <button class="mark-all-btn" id="mark-all-btn" disabled>Mark All Read</button>
            </header>

            <!-- ===== PAGE TITLE ===== -->
            <div class="page-title-section">
                <h1>Notifications</h1>
                <div class="sub">Stay updated with your PureOre Nexus account.</div>
            </div>

            <!-- ===== NOTIFICATION LIST ===== -->
            <div id="notification-list">
                <!-- Rendered by JS, with skeletons initially -->
                <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                <div class="loading-text">Loading notifications...</div>
            </div>

            <!-- ===== BRANDING ===== -->
            <div class="branding-footer">
                <span>@pureorecapital</span> 2025
            </div>

        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================
    FIREBASE + APPLICATION LOGIC
    ============================================================ -->
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, writeBatch, getDocs, limit } from 'firebase/firestore';

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2nHDM2ebNv9pUUoIhsfJUCSLlffWYW1w",
            authDomain: "pureore-nexus.firebaseapp.com",
            projectId: "pureore-nexus",
            storageBucket: "pureore-nexus.firebasestorage.app",
            messagingSenderId: "555338198187",
            appId: "1:555338198187:web:0c510ca507fa4c835a5bee",
            measurementId: "G-L2B5FEMH2C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const loadScreen = $('loading-screen');
        const loadBar = $('load-bar');
        const loadMsg = $('load-msg');
        const mainPage = $('main-page');
        const notificationList = $('notification-list');
        const markAllBtn = $('mark-all-btn');
        const toast = $('toast');
        let toastTimeout = null;

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let notifications = [];
        let unreadCount = 0;
        let unsubscribe = null;
        let isInitialLoad = true;

        // ============================================================
        // LOADING SCREEN
        // ============================================================
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += 2.5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                loadBar.style.width = '100%';
                loadMsg.textContent = 'Ready';
                return;
            }
            loadBar.style.width = loadProgress + '%';
            if (loadProgress > 70) loadMsg.textContent = 'Almost ready...';
            else if (loadProgress > 40) loadMsg.textContent = 'Loading notifications...';
        }, 35);

        // ============================================================
        // HELPERS
        // ============================================================
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            try {
                const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                const now = new Date();
                const diff = now - d;
                if (diff < 60000) return 'Just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
                if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
                return d.toLocaleDateString('en-ZM', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) {
                return '';
            }
        }

        function getIconForType(type) {
            const svgs = {
                investment: `<svg viewBox="0 0 24 24"><path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                income: `<svg viewBox="0 0 24 24"><path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                deposit: `<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                withdrawal: `<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                dailyCheck: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                referral: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                security: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                system: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6v4M12 14h.01" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                announcement: `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
            };
            return svgs[type] || svgs.system;
        }

        // ============================================================
        // RENDER NOTIFICATIONS
        // ============================================================
        function renderNotifications() {
            if (notifications.length === 0) {
                notificationList.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <p>No notifications yet. You're all caught up.</p>
                        </div>
                    `;
                markAllBtn.disabled = true;
                return;
            }

            let html = '';
            let unreadFound = false;
            for (const n of notifications) {
                const isUnread = !n.read;
                if (isUnread) unreadFound = true;
                const iconSvg = getIconForType(n.type);
                const dateStr = formatDate(n.createdAt);
                const hasAction = n.action && n.action.page;
                let actionLink = '';
                if (hasAction) {
                    actionLink = `
                            <a href="${n.action.page}" class="action-link">
                                ${n.action.label || 'View'}
                                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            </a>
                        `;
                }
                html += `
                        <div class="notification-card ${isUnread ? 'unread' : ''}" data-id="${n.id}">
                            <div class="top-row">
                                <div class="icon-wrap">${iconSvg}</div>
                                <div class="content">
                                    <div class="title">${n.title || 'Notification'}</div>
                                    <div class="message">${n.message || ''}</div>
                                </div>
                                ${isUnread ? '<div class="unread-indicator"></div>' : ''}
                            </div>
                            <div class="bottom-row">
                                <span class="date">${dateStr}</span>
                                ${actionLink}
                            </div>
                        </div>
                    `;
            }
            notificationList.innerHTML = html;
            markAllBtn.disabled = !unreadFound;

            // Click handler for marking as read
            document.querySelectorAll('.notification-card.unread').forEach(card => {
                card.addEventListener('click', async (e) => {
                    // Prevent if clicked on action link
                    if (e.target.closest('.action-link')) return;
                    const id = card.dataset.id;
                    await markAsRead(id);
                });
            });
        }

        // ============================================================
        // MARK AS READ (single)
        // ============================================================
        async function markAsRead(id) {
            try {
                const ref = doc(db, 'notifications', id);
                await updateDoc(ref, {
                    read: true,
                    readAt: new Date()
                });
                // Update local state
                const notif = notifications.find(n => n.id === id);
                if (notif) notif.read = true;
                renderNotifications();
            } catch (error) {
                console.error('Error marking as read:', error);
                showToast('Failed to mark notification as read.', 'error');
            }
        }

        // ============================================================
        // MARK ALL AS READ
        // ============================================================
        async function markAllAsRead() {
            const unreadIds = notifications.filter(n => !n.read).map(n => n.id);
            if (unreadIds.length === 0) {
                showToast('No unread notifications.', '');
                return;
            }
            try {
                const batch = writeBatch(db);
                for (const id of unreadIds) {
                    const ref = doc(db, 'notifications', id);
                    batch.update(ref, {
                        read: true,
                        readAt: new Date()
                    });
                }
                await batch.commit();
                // Update local state
                for (const n of notifications) {
                    if (!n.read) n.read = true;
                }
                renderNotifications();
                showToast('All notifications marked as read.', 'success');
            } catch (error) {
                console.error('Error marking all as read:', error);
                showToast('Failed to mark all as read.', 'error');
            }
        }

        // ============================================================
        // LISTENER
        // ============================================================
        function startListening(uid) {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            const q = query(
                collection(db, 'notifications'),
                where('userId', '==', uid),
                orderBy('createdAt', 'desc')
            );
            unsubscribe = onSnapshot(q, (snapshot) => {
                const newNotifications = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    newNotifications.push({
                        id: doc.id,
                        ...data,
                        read: data.read === true
                    });
                });
                notifications = newNotifications;
                // Update unread count
                unreadCount = notifications.filter(n => !n.read).length;
                // Re-render
                renderNotifications();
                // If it's the first load, hide loading screen
                if (isInitialLoad) {
                    isInitialLoad = false;
                    loadScreen.classList.add('hidden');
                    mainPage.classList.add('visible');
                    document.body.style.overflow = 'auto';
                }
            }, (error) => {
                console.error('Error listening to notifications:', error);
                if (isInitialLoad) {
                    isInitialLoad = false;
                    loadScreen.classList.add('hidden');
                    mainPage.classList.add('visible');
                    document.body.style.overflow = 'auto';
                }
                notificationList.innerHTML = `
                        <div class="empty-state" style="padding:30px 20px;">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <p>Unable to load notifications. Please try again.</p>
                            <button onclick="location.reload()" style="display:inline-block;margin-top:12px;color:var(--gold);background:none;border:1px solid var(--gold);padding:8px 24px;border-radius:20px;font-family:inherit;font-size:0.75rem;cursor:pointer;">Try Again</button>
                        </div>
                    `;
                markAllBtn.disabled = true;
            });
        }

        // ============================================================
        // BACK BUTTON
        // ============================================================
        document.getElementById('back-btn').addEventListener('click', () => {
            window.history.back();
        });

        // ============================================================
        // MARK ALL BUTTON
        // ============================================================
        markAllBtn.addEventListener('click', markAllAsRead);

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            startListening(user.uid);
        });

        console.log('PureOre Nexus — Notifications page ready.');
    </script>

</body>
</html>
