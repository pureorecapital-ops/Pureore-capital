<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Register – PC • Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- BACKGROUND with brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/nNW3TyNv/andre-kaim-m777i-BIFI3-M-unsplash.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.45) saturate(1.1) contrast(1.05);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.10) 0%, transparent 50%);
            z-index: -1;
        }

        /* ----- DECORATIVE ORBS (floating) ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 350px;
            height: 350px;
            background: var(--violet);
            top: -5%;
            left: -8%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 280px;
            height: 280px;
            background: var(--cyan);
            bottom: -5%;
            right: -8%;
            animation-delay: 4s;
        }
        .orb-3 {
            width: 220px;
            height: 220px;
            background: var(--gold);
            top: 45%;
            right: 10%;
            animation-delay: 8s;
            opacity: 0.10;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(20px, -30px) scale(1.05);
            }
            66% {
                transform: translate(-10px, 20px) scale(0.95);
            }
            100% {
                transform: translate(15px, -10px) scale(1.02);
            }
        }

        /* ----- MAIN CONTAINER ----- */
        .auth-container {
            width: 100%;
            max-width: 460px;
            margin: 1.2rem;
            animation: containerIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(24px) scale(0.98);
        }

        @keyframes containerIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ----- GLASS CARD with unique gradient border ----- */
        .auth-card {
            position: relative;
            background: rgba(10, 8, 21, 0.78);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: var(--radius-lg);
            padding: 2rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        /* Animated gradient border ring */
        .auth-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-lg);
            padding: 2px;
            background: conic-gradient(from 0deg,
                    var(--violet),
                    var(--cyan),
                    var(--gold),
                    var(--violet),
                    var(--cyan),
                    var(--gold),
                    var(--violet));
            background-size: 300% 300%;
            animation: borderSpin 8s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        @keyframes borderSpin {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ----- BRAND HEADER ----- */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- WELCOME TEXT ----- */
        .welcome-text {
            margin: 1.2rem 0 1.5rem 0;
        }

        .welcome-text h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            line-height: 1.2;
        }

        .welcome-text h1 span {
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 4px;
            font-weight: 400;
        }

        /* ----- BONUS BADGE ----- */
        .bonus-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(246, 201, 110, 0.08);
            border: 1px solid rgba(246, 201, 110, 0.15);
            border-radius: 40px;
            padding: 6px 16px 6px 12px;
            margin-bottom: 1.4rem;
            backdrop-filter: blur(4px);
        }

        .bonus-badge svg {
            width: 16px;
            height: 16px;
            stroke: var(--gold);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .bonus-badge span {
            font-size: 13px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.2px;
        }

        .bonus-badge span strong {
            color: #fff;
            font-weight: 700;
        }

        /* ----- FORM ----- */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .input-group:focus-within .input-icon {
            stroke: var(--cyan);
        }

        .input-group input:not([type="checkbox"]) {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 46px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:not([type="checkbox"])::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .input-group input:not([type="checkbox"]):focus {
            border-color: rgba(93, 217, 242, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(93, 217, 242, 0.04);
        }

        .input-group input:not([type="checkbox"]):hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ----- 18+ CHECKBOX (custom) ----- */
        .age-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 4px 0 2px 0;
            cursor: pointer;
        }

        .age-check input[type="checkbox"] {
            display: none;
        }

        .age-check .check-box {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            margin-top: 1px;
        }

        .age-check .check-box svg {
            width: 14px;
            height: 14px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s ease;
        }

        .age-check input[type="checkbox"]:checked+.check-box {
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .age-check input[type="checkbox"]:checked+.check-box svg {
            opacity: 1;
            transform: scale(1);
        }

        .age-check .check-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.4;
        }

        .age-check .check-label strong {
            color: var(--gold);
            font-weight: 600;
        }

        /* ----- REFERRAL NOTE ----- */
        .referral-note {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: -4px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 4px;
        }

        .referral-note svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- SUBMIT BUTTON ----- */
        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            color: #0a0815;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 30px var(--gold-glow);
            position: relative;
            overflow: hidden;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-submit:hover::after {
            opacity: 1;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--gold-glow);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ----- GOOGLE LOGIN ----- */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 6px 0 4px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider-text {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .btn-google {
            width: 100%;
            padding: 0.85rem;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(4px);
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-google:active {
            transform: scale(0.97);
        }

        /* ----- WHERE DID YOU HEAR? ----- */
        .hear-section {
            margin: 8px 0 2px 0;
        }

        .hear-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .hear-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hear-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .hear-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            user-select: none;
        }

        .hear-option svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .hear-option:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
        }

        .hear-option.selected {
            border-color: var(--violet);
            background: rgba(124, 109, 240, 0.08);
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 109, 240, 0.05);
        }

        .hear-option input[type="checkbox"] {
            display: none;
        }

        .hear-option .check-mark {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .hear-option .check-mark svg {
            width: 10px;
            height: 10px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s ease;
        }

        .hear-option.selected .check-mark {
            border-color: var(--violet);
            background: var(--violet);
            box-shadow: 0 0 20px var(--violet-glow);
        }

        .hear-option.selected .check-mark svg {
            opacity: 1;
            transform: scale(1);
        }

        /* ----- MESSAGE BOX ----- */
        .message-box {
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            margin-top: 4px;
            display: none;
            border: 1.5px solid transparent;
        }

        .message-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .message-box.success {
            display: block;
            background: rgba(74, 222, 128, 0.08);
            border-color: rgba(74, 222, 128, 0.2);
            color: #6ee7b7;
        }

        .message-box svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* ----- FOOTER LINK ----- */
        .footer-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .footer-link a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem 1.2rem 1.5rem;
            }
            .welcome-text h1 {
                font-size: 22px;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 20px;
                height: 20px;
            }
            .brand-tag {
                font-size: 8px;
                padding: 1px 8px;
            }
            .hear-options {
                gap: 6px;
            }
            .hear-option {
                font-size: 0.72rem;
                padding: 5px 10px 5px 8px;
            }
            .hear-option svg {
                width: 14px;
                height: 14px;
            }
            .input-group input:not([type="checkbox"]) {
                padding: 0.75rem 1rem 0.75rem 40px;
                font-size: 0.88rem;
            }
            .input-group .input-icon {
                left: 13px;
                width: 16px;
                height: 16px;
            }
            .btn-submit {
                font-size: 0.92rem;
                padding: 0.85rem;
            }
            .btn-google {
                font-size: 0.85rem;
                padding: 0.75rem;
            }
        }

        @media (max-width: 380px) {
            .auth-card {
                padding: 1.2rem 0.9rem 1.2rem;
            }
            .hear-options {
                gap: 4px;
            }
            .hear-option {
                font-size: 0.65rem;
                padding: 4px 8px 4px 6px;
            }
            .welcome-text h1 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== DECORATIVE ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-container">
        <div class="auth-card">

            <!-- ===== BRAND HEADER ===== -->
            <div class="brand-header">
                <div class="brand-logo">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24">
                            <polyline points="6 6 18 6 6 18 18 18" />
                        </svg>
                    </div>
                    <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                </div>
                <span class="brand-tag">v3.0</span>
            </div>

            <!-- ===== WELCOME ===== -->
            <div class="welcome-text">
                <h1>Create your <span>account</span></h1>
                <p>Join the next generation of smart investing</p>
            </div>

            <!-- ===== BONUS BADGE ===== -->
            <div class="bonus-badge">
                <svg viewBox="0 0 24 24">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <span><strong>20 ZMW</strong> welcome bonus</span>
            </div>

            <!-- ===== FORM ===== -->
            <form id="registerForm">
                <!-- Full Name -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="regFullName" placeholder="Full name" required autocomplete="name" />
                </div>

                <!-- Email -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="2" y="4" width="20" height="16" rx="2" />

                        I confirm that I am <strong>18+ years old</strong> and agree to the terms

                <button type="submit" class="btn-submit" id="submitBtn">Register &amp; claim 20 ZMW</button>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">or continue with</span>
                    <span class="divider-line"></span>

                <button type="button" class="btn-google" id="googleBtn">
                    <svg viewBox="0 0 24 24">

            <div id="message" class="message-box"></div>

                Already have an account? <a href="login.html">Sign in</a>

    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG – untouched, exactly as provided
        // ============================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ============================================================
        // DOM REFS
        // ============================================================
        var form = document.getElementById('registerForm');
        var submitBtn = document.getElementById('submitBtn');
        var msgBox = document.getElementById('message');

        var fullName = document.getElementById('regFullName');
        var email = document.getElementById('regEmail');
        var password = document.getElementById('regPassword');
        var confirmPw = document.getElementById('regConfirmPassword');
        var referralInput = document.getElementById('regReferralCode');
        var ageCheck = document.getElementById('ageCheck');

        var googleBtn = document.getElementById('googleBtn');

        // ============================================================
        // HEAR OPTIONS – toggle selection
        // ============================================================
        document.querySelectorAll('.hear-option').forEach(function(el) {
            var checkbox = el.querySelector('input[type="checkbox"]');
            el.addEventListener('click', function(e) {
                // Toggle checkbox
                checkbox.checked = !checkbox.checked;
                el.classList.toggle('selected', checkbox.checked);
                // Prevent label default
                e.preventDefault();
            });
            // Also sync on direct checkbox change
            checkbox.addEventListener('change', function() {
                el.classList.toggle('selected', this.checked);
            });
        });

        // ============================================================
        // EXTRACT REFERRAL CODE FROM URL
        // ============================================================
        function getReferralFromUrl() {
            var url = window.location.href;
            var match = url.match(/[?&]ref=([^&#]*)/i);
            if (match) return decodeURIComponent(match[1]);
            match = url.match(/#.*[?&]ref=([^&#]*)/i);
            if (match) return decodeURIComponent(match[1]);
            return null;
        }

        function fillReferral() {
            var ref = getReferralFromUrl();
            if (ref) {
                referralInput.value = ref.toUpperCase();
                referralInput.style.borderColor = 'rgba(74, 222, 128, 0.3)';
                referralInput.style.background = 'rgba(74, 222, 128, 0.04)';
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fillReferral);
        } else {
            fillReferral();
        }

        // ============================================================
        // VALIDATE REFERRAL CODE
        // ============================================================
        function validateReferralCode(code, callback) {
            if (!code) return callback(false);
            var queryCode = code.trim().toUpperCase();
            var timedOut = false;
            var timeout = setTimeout(function() {
                timedOut = true;
                callback(false, 'timed out');
            }, 10000);

            db.collection('users').where('referralCode', '==', queryCode).limit(1).get()
                .then(function(snapshot) {
                    if (!timedOut) {
                        clearTimeout(timeout);
                        callback(!snapshot.empty);
                    }
                })
                .catch(function(err) {
                    if (!timedOut) {
                        clearTimeout(timeout);
                        callback(false, err.message);
                    }
                });
        }

        // ============================================================
        // SHOW MESSAGE
        // ============================================================
        function showMessage(type, text) {
            msgBox.className = 'message-box ' + type;
            var icon = type === 'error' ?
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' :
                '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
            msgBox.innerHTML = icon + ' ' + text;
            msgBox.style.display = 'block';
        }

        function hideMessage() {
            msgBox.style.display = 'none';
            msgBox.className = 'message-box';
        }

        // ============================================================
        // GET SELECTED HEAR OPTIONS
        // ============================================================
        function getSelectedHearOptions() {
            var selected = [];
            document.querySelectorAll('.hear-option input[type="checkbox"]:checked').forEach(function(cb) {
                selected.push(cb.value);
            });
            return selected;
        }

        // ============================================================
        // REGISTRATION SUBMIT
        // ============================================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMessage();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            var name = fullName.value.trim();
            var mail = email.value.trim();
            var pw = password.value;
            var confirm = confirmPw.value;
            var referral = referralInput.value.trim().toUpperCase();
            var ageOk = ageCheck.checked;
            var heard = getSelectedHearOptions();

            // Validation
            if (!name || !mail || !pw || !confirm || !referral) {
                showMessage('error', 'All fields are required.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register & claim 20 ZMW';
                return;
            }
            if (!ageOk) {
                showMessage('error', 'You must confirm you are 18+ years old.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register & claim 20 ZMW';
                return;
            }
            if (pw.length < 6) {
                showMessage('error', 'Password must be at least 6 characters.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register & claim 20 ZMW';
                return;
            }
            if (pw !== confirm) {
                showMessage('error', 'Passwords do not match.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register & claim 20 ZMW';
                return;
            }

            // Validate referral
            validateReferralCode(referral, function(isValid, errMsg) {
                if (!isValid) {
                    var userMsg = 'Invalid referral code. Please check and try again.';
                    if (errMsg === 'timed out') {
                        userMsg = 'Referral validation timed out. Check your connection.';
                    } else if (errMsg && errMsg.includes('permission')) {
                        userMsg = 'Unable to verify referral code. Try again later.';
                    }
                    showMessage('error', userMsg);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register & claim 20 ZMW';
                    return;
                }

                // Proceed: create user
                auth.createUserWithEmailAndPassword(mail, pw)
                    .then(function(userCred) {
                        var uid = userCred.user.uid;
                        var generatedRef = Math.random().toString(36).substring(2, 10).toUpperCase();

                        return db.collection('users').doc(uid).set({
                            fullName: name,
                            email: mail,
                            balance: 20,
                            referralCode: generatedRef,
                            referredBy: referral,
                            role: 'user',
                            isBlocked: false,
                            canRequestLoan: true,
                            referralBonusGiven: false,
                            heardFrom: heard,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(function() {
                            return db.collection('transactions').add({
                                userId: uid,
                                type: 'bonus',
                                amount: 20,
                                description: 'Welcome bonus 20 ZMW',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    })
                    .then(function() {
                        showMessage('success', 'Registration successful! Redirecting...');
                        setTimeout(function() {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    })
                    .catch(function(error) {
                        console.error('Registration error:', error);
                        var friendly = 'Registration failed. Please try again.';
                        switch (error.code) {
                            case 'auth/email-already-in-use':
                                friendly = 'Email already registered. Please login.';
                                break;
                            case 'auth/invalid-email':
                                friendly = 'Invalid email address.';
                                break;
                            case 'auth/weak-password':
                                friendly = 'Password too weak. Use at least 6 characters.';
                                break;
                            case 'auth/network-request-failed':
                                friendly = 'Network error. Check your internet connection.';
                                break;
                            default:
                                friendly = 'Registration failed. Please check your details.';
                        }
                        showMessage('error', friendly);
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Register & claim 20 ZMW';
                    });
            });
        });

        // ============================================================
        // GOOGLE LOGIN (popup)
        // ============================================================
        googleBtn.addEventListener('click', function() {
            hideMessage();
            googleBtn.disabled = true;
            googleBtn.textContent = 'Connecting...';

            var provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(function(result) {
                    var user = result.user;
                    var uid = user.uid;
                    var name = user.displayName || 'User';
                    var mail = user.email;

                    // Check if user doc exists; if not, create one with default referral
                    db.collection('users').doc(uid).get()
                        .then(function(doc) {
                            if (!doc.exists) {
                                var generatedRef = Math.random().toString(36).substring(2, 10)
                                .toUpperCase();
                                return db.collection('users').doc(uid).set({
                                    fullName: name,
                                    email: mail,
                                    balance: 20,
                                    referralCode: generatedRef,
                                    referredBy: 'GOOGLE_SIGNUP',
                                    role: 'user',
                                    isBlocked: false,
                                    canRequestLoan: true,
                                    referralBonusGiven: false,
                                    heardFrom: ['google'],
                                    createdAt: firebase.firestore.FieldValue
                                        .serverTimestamp()
                                }).then(function() {
                                    return db.collection('transactions').add({
                                        userId: uid,
                                        type: 'bonus',
                                        amount: 20,
                                        description: 'Welcome bonus 20 ZMW',
                                        createdAt: firebase.firestore.FieldValue
                                            .serverTimestamp()
                                    });
                                });
                            }
                            return Promise.resolve();
                        })
                        .then(function() {
                            showMessage('success', 'Google sign-in successful! Redirecting...');
                            setTimeout(function() {
                                window.location.href = 'dashboard.html';
                            }, 1200);
                        })
                        .catch(function(err) {
                            console.error('Google user doc error:', err);
                            showMessage('error', 'Account setup failed. Please try again.');
                            googleBtn.disabled = false;
                            googleBtn.innerHTML =
                                '<svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M12 22h8a2 2 0 0 0 2-2v-8"/><path d="M14 10l7-7"/><path d="M3.5 12.5a8 8 0 1 0 8-8"/><path d="M12 2v10"/></svg> Sign up with Google';
                        });
                })
                .catch(function(error) {
                    console.error('Google sign-in error:', error);
                    var msg = 'Google sign-in failed. Please try again.';
                    if (error.code === 'auth/popup-closed-by-user') {
                        msg = 'Sign-in cancelled. Please try again.';
                    }
                    showMessage('error', msg);
                    googleBtn.disabled = false;
                    googleBtn.innerHTML =
                        '<svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M12 22h8a2 2 0 0 0 2-2v-8"/><path d="M14 10l7-7"/><path d="M3.5 12.5a8 8 0 1 0 8-8"/><path d="M12 2v10"/></svg> Sign up with Google';
                });
        });

        // ============================================================
        // AUTO-FILL REFERRAL ON LOAD (already called above)
        // ============================================================
        console.log('✨ Pureore Capital · Register (unique design)');
        console.log('📱 No emojis — pure SVG icons');
        console.log('🔐 Firebase config untouched');
    </script>
