<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Team | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .referral-code-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: #1E1E2A;
            padding: 0.8rem 1rem;
            border-radius: 60px;
            margin: 1rem 0;
        }
        .referral-code {
            font-family: monospace;
            font-size: 1.2rem;
            letter-spacing: 1px;
            background: #0A0A0C;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            color: #2ecc71;
        }
        .copy-btn {
            background: #2ecc71;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: #0A0A0C;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stat-item {
            background: #111116;
            border-radius: 28px;
            padding: 0.8rem;
            text-align: center;
            flex: 1;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f1c40f;
        }
        .team-list {
            margin-top: 1rem;
        }
        .team-member {
            background: #111116;
            border-radius: 24px;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .member-name {
            font-weight: 600;
        }
        .member-status {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }
        .status-bonus {
            color: #2ecc71;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label { color: #2ecc71; }
        @media (max-width: 600px) {
            .animated-title { font-size: 1.5rem; }
            .referral-code { font-size: 0.9rem; }
        }
        .error-msg {
            color: #ef4444;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">👥 TEAM</div>
    <div class="card">
        <h3>📎 Your Referral Link</h3>
        <div class="referral-code-box">
            <span class="referral-code" id="referralCodeDisplay">Loading...</span>
            <button class="copy-btn" id="copyReferralBtn">Copy Link</button>
        </div>
        <div class="stats">
            <div class="stat-item"><div class="stat-number" id="teamCount">0</div><div>Team Members</div></div>
            <div class="stat-item"><div class="stat-number" id="totalBonus">0</div><div>Total Bonus Earned (ZMW)</div></div>
        </div>
    </div>
    <div class="card">
        <h3>📋 Your Team</h3>
        <div id="teamList" class="team-list">Loading...</div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item" data-page="dashboard.html">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="mkvip.html">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" data-page="jproduct.html">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" data-page="income.html">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" data-page="team.html">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" data-page="me.html">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    db.settings({ persistence: false });
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Add session cleanup (same as other pages)
    (async function cleanupStaleSession() {
        try {
            await auth.signOut();
            await new Promise(resolve => setTimeout(resolve, 300));
        } catch (e) {
            console.log("Pre-team-cleanup (non-critical):", e);
        }
    })();

    const referralCodeSpan = document.getElementById('referralCodeDisplay');
    const copyBtn = document.getElementById('copyReferralBtn');
    const teamCountSpan = document.getElementById('teamCount');
    const totalBonusSpan = document.getElementById('totalBonus');
    const teamListDiv = document.getElementById('teamList');

    let currentUserId = null;
    let currentReferralCode = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUserId = user.uid;
        await loadUserData();
        await loadTeamData();
    });

    async function loadUserData() {
        try {
            const userDoc = await db.collection('users').doc(currentUserId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                currentReferralCode = data.referralCode;
                if (referralCodeSpan) {
                    referralCodeSpan.innerText = currentReferralCode || 'N/A';
                }
            } else {
                referralCodeSpan.innerText = 'Error: No profile';
            }
        } catch (err) {
            console.error(err);
            referralCodeSpan.innerText = 'Error loading code';
        }
    }

    async function loadTeamData() {
        if (!currentReferralCode) {
            teamListDiv.innerHTML = '<div class="error-msg">Referral code not available yet.</div>';
            return;
        }

        try {
            // ✅ FIX: Query users where referredBy matches this user's referral code
            const referredQuery = await db.collection('users')
                .where('referredBy', '==', currentReferralCode)
                .get();

            const teamMembers = [];
            let totalBonus = 0;

            // For each referred user, get their referral earnings
            for (const doc of referredQuery.docs) {
                const memberData = doc.data();
                const memberId = doc.id;
                const earningsQuery = await db.collection('referralEarnings')
                    .where('referrerId', '==', currentUserId)
                    .where('referredUserId', '==', memberId)
                    .get();
                let memberBonus = 0;
                if (!earningsQuery.empty) {
                    earningsQuery.forEach(earn => {
                        memberBonus += earn.data().amount || 0;
                    });
                }
                totalBonus += memberBonus;

                teamMembers.push({
                    name: memberData.fullName || 'Anonymous',
                    email: memberData.email,
                    joinedAt: memberData.createdAt ? memberData.createdAt.toDate() : null,
                    bonus: memberBonus
                });
            }

            teamCountSpan.innerText = teamMembers.length;
            totalBonusSpan.innerText = totalBonus.toFixed(2);

            if (teamMembers.length === 0) {
                teamListDiv.innerHTML = '<p>No team members yet. Share your referral link!</p>';
                return;
            }

            let html = '';
            for (const member of teamMembers) {
                const joinedDate = member.joinedAt ? member.joinedAt.toLocaleDateString() : 'Unknown';
                html += `
                    <div class="team-member">
                        <div>
                            <div class="member-name">${escapeHtml(member.name)}</div>
                            <div class="member-email" style="font-size:0.7rem; color:#aaa;">${escapeHtml(member.email)}</div>
                            <div style="font-size:0.7rem;">Joined: ${joinedDate}</div>
                        </div>
                        <div class="member-status status-bonus">+${member.bonus.toFixed(2)} ZMW</div>
                    </div>
                `;
            }
            teamListDiv.innerHTML = html;
        } catch (err) {
            console.error(err);
            teamListDiv.innerHTML = '<div class="error-msg">Error loading team data.</div>';
        }
    }

    copyBtn.addEventListener('click', () => {
        if (!currentReferralCode) {
            alert('Referral code not loaded yet.');
            return;
        }
        const baseUrl = window.location.origin;
        const registerUrl = `${baseUrl}/register.html?ref=${currentReferralCode}`;
        navigator.clipboard.writeText(registerUrl).then(() => {
            alert('Referral link copied to clipboard! Share it with friends.');
        }).catch(() => {
            alert('Could not copy. Please copy manually: ' + registerUrl);
        });
    });

    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'team.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
