<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Team – PC • Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.5rem 1.8rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .glass-card .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .glass-card .card-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- REFERRAL CODE BOX ----- */
        .referral-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 1rem;
        }

        .referral-box .code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(246, 201, 110, 0.08);
        }

        .referral-box .copy-btn {
            background: linear-gradient(135deg, var(--gold), #f5a623);
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0815;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--gold-glow);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .referral-box .copy-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .referral-box .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px var(--gold-glow);
        }

        /* ----- QR CODE ----- */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0.5rem 0 0.8rem 0;
        }

        .qr-section .qr-wrapper {
            background: rgba(255, 255, 255, 0.02);
            padding: 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .qr-section .qr-wrapper #qrCodeCanvas {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-section .qr-wrapper #qrCodeCanvas canvas,
        .qr-section .qr-wrapper #qrCodeCanvas img {
            border-radius: 8px;
            display: block;
        }

        .qr-section .qr-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 0.4rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qr-section .qr-label svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- COMMISSION INFO ----- */
        .commission-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin: 0.5rem 0 1rem 0;
        }

        .commission-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .commission-item .badge {
            font-weight: 700;
            color: var(--gold);
            background: rgba(246, 201, 110, 0.06);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            border: 1px solid rgba(246, 201, 110, 0.06);
        }

        .commission-item .highlight {
            color: var(--green);
            font-weight: 700;
        }

        /* ----- STATS GRID ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }

        @media (max-width: 450px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.8rem 0.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        .stat-item .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .stat-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 0.1rem;
            letter-spacing: 0.3px;
        }

        /* ----- TEAM LIST ----- */
        .team-list {
            margin-top: 0.2rem;
        }

        .team-member {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.7rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .team-member:hover {
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        .team-member .member-info .member-name {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .team-member .member-info .member-email {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .team-member .member-info .member-joined {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.1);
        }

        .team-member .member-bonus {
            font-weight: 700;
            color: var(--green);
            font-size: 0.85rem;
            background: rgba(74, 222, 128, 0.04);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            border: 1px solid rgba(74, 222, 128, 0.04);
            white-space: nowrap;
        }

        .empty-msg {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 1.5rem 0;
            font-size: 0.9rem;
        }

        .empty-msg svg {
            width: 36px;
            height: 36px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .glass-card {
                padding: 1.2rem 1rem 1.4rem;
            }
            .referral-box .code {
                font-size: 0.95rem;
            }
            .stat-item .stat-number {
                font-size: 1.4rem;
            }
            .commission-item {
                font-size: 0.7rem;
            }
            .team-member .member-bonus {
                font-size: 0.75rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item .nav-label {
                font-size: 0.45rem;
            }
            .qr-section .qr-wrapper {
                padding: 0.4rem;
            }
            .qr-section .qr-wrapper #qrCodeCanvas canvas,
            .qr-section .qr-wrapper #qrCodeCanvas img {
                max-width: 130px;
                height: auto;
            }
        }

        @media (max-width: 400px) {
            .referral-box {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .referral-box .code {
                text-align: center;
            }
            .referral-box .copy-btn {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .commission-row {
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="6 6 18 6 6 18 18 18" />
                    </svg>
                </div>
                <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                <span class="brand-badge">Team</span>
            </div>
        </div>

        <!-- ===== BACK ROW ===== -->
        <div class="back-row">
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
                Back
            </button>
        </div>

        <!-- ===== PAGE TITLE ===== -->
        <div class="page-title">👥 My Team</div>
        <div class="page-sub">Invite friends and earn commissions</div>

        <!-- ===== REFERRAL CARD ===== -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Referral Link
            </div>

            <!-- Referral Code + Copy -->
            <div class="referral-box">
                <span class="code" id="referralCodeDisplay">Loading...</span>
                <button class="copy-btn" id="copyReferralBtn">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy Link
                </button>
            </div>

            <!-- QR Code -->
            <div class="qr-section">
                <div class="qr-wrapper">
                    <div id="qrCodeCanvas"></div>
                </div>
                <div class="qr-label">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="15" y="2" width="7" height="7" rx="1"/><rect x="2" y="15" width="7" height="7" rx="1"/><rect x="15" y="15" width="7" height="7" rx="1"/></svg>
                    Scan to share your referral link
                </div>
            </div>

            <!-- Commission Info -->
            <div class="commission-row">
                <div class="commission-item">
                    <span>💰 Invite & Earn</span>
                    <span class="badge">10%</span>
                    <span class="highlight">on deposits</span>
                </div>
                <div class="commission-item">
                    <span>📈 Investment Bonus</span>
                    <span class="badge">10%</span>
                    <span class="highlight">on plan purchases</span>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="teamCount">0</div>
                    <div class="stat-label">Team Members</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalBonus">0.00</div>
                    <div class="stat-label">Total Bonus (ZMW)</div>
                </div>
            </div>
        </div>

        <!-- ===== TEAM LIST CARD ===== -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Your Team
            </div>
            <div id="teamList" class="team-list">
                <div class="empty-msg">Loading your team...</div>
            </div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <img class="nav-icon" src="https://i.ibb.co/qM4qxgGj/file-00000000248871f4bb1e73df45bacb92.png" alt="Home" />
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="mkvip.html">
            <img class="nav-icon" src="https://i.ibb.co/5WSyHGRZ/IMG-20260622-183230.jpg" alt="Mkvip" />
            <span class="nav-label">Mkvip</span>
        </button>
        <button class="nav-item" data-page="jproduct.html">
            <img class="nav-icon" src="https://i.ibb.co/1fzvRd58/IMG-20260622-183217.jpg" alt="Jproduct" />
            <span class="nav-label">Jproduct</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <img class="nav-icon" src="https://i.ibb.co/60hq0ds8/IMG-20260622-183154.jpg" alt="Income" />
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item active" data-page="team.html">
            <img class="nav-icon" src="https://i.ibb.co/QRRSRzC/IMG-20260622-183120.jpg" alt="Team" />
            <span class="nav-label">Team</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <img class="nav-icon" src="https://i.ibb.co/JwY3HLVx/IMG-20260622-WA5359.jpg" alt="Me" />
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // STATE
        // ================================================================
        var currentUserId = null;
        var currentReferralCode = null;

        // ================================================================
        // DOM REFS
        // ================================================================
        var referralCodeSpan = document.getElementById('referralCodeDisplay');
        var copyBtn = document.getElementById('copyReferralBtn');
        var teamCountSpan = document.getElementById('teamCount');
        var totalBonusSpan = document.getElementById('totalBonus');
        var teamListDiv = document.getElementById('teamList');
        var qrContainer = document.getElementById('qrCodeCanvas');

        // ================================================================
        // LOAD USER DATA
        // ================================================================
        async function loadUserData() {
            try {
                var userDoc = await db.collection('users').doc(currentUserId).get();
                if (userDoc.exists) {
                    var data = userDoc.data();
                    currentReferralCode = data.referralCode;
                    referralCodeSpan.textContent = currentReferralCode || 'N/A';
                } else {
                    referralCodeSpan.textContent = 'Error: No profile';
                }
            } catch (err) {
                console.error(err);
                referralCodeSpan.textContent = 'Error loading code';
            }
        }

        // ================================================================
        // GENERATE QR CODE
        // ================================================================
        function generateQR() {
            if (!qrContainer) return;
            qrContainer.innerHTML = '';
            var link = getReferralLink();
            try {
                new QRCode(qrContainer, {
                    text: link,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (err) {
                console.warn('QR generation failed, using fallback:', err);
                qrContainer.innerHTML = `
                    <div style="
                        width:160px; height:160px;
                        display:flex; align-items:center; justify-content:center;
                        background:white; color:#000; font-size:12px;
                        border-radius:8px; text-align:center; padding:10px;
                        word-break:break-all;
                    ">${escapeHtml(link)}</div>
                `;
            }
        }

        // ================================================================
        // LOAD TEAM DATA
        // ================================================================
        async function loadTeamData() {
            if (!currentReferralCode) {
                teamListDiv.innerHTML = '<div class="empty-msg">Referral code not available yet.</div>';
                return;
            }

            try {
                var referredQuery = await db.collection('users')
                    .where('referredBy', '==', currentReferralCode)
                    .get();

                var teamMembers = [];
                var totalBonus = 0;

                for (var doc of referredQuery.docs) {
                    var memberData = doc.data();
                    var memberId = doc.id;

                    var earningsQuery = await db.collection('referralEarnings')
                        .where('referrerId', '==', currentUserId)
                        .where('referredUserId', '==', memberId)
                        .get();

                    var memberBonus = 0;
                    if (!earningsQuery.empty) {
                        earningsQuery.forEach(function(earn) {
                            memberBonus += earn.data().amount || 0;
                        });
                    }
                    totalBonus += memberBonus;

                    teamMembers.push({
                        name: memberData.fullName || 'Anonymous',
                        email: memberData.email,
                        joinedAt: memberData.createdAt ? memberData.createdAt.toDate() : null,
                        bonus: memberBonus
                    });
                }

                teamCountSpan.textContent = teamMembers.length;
                totalBonusSpan.textContent = totalBonus.toFixed(2);

                if (teamMembers.length === 0) {
                    teamListDiv.innerHTML = `
                        <div class="empty-msg">
                            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            No team members yet.<br>Share your referral link!
                        </div>
                    `;
                    return;
                }

                var html = '';
                for (var member of teamMembers) {
                    var joinedDate = member.joinedAt ? member.joinedAt.toLocaleDateString() : 'Unknown';
                    html += `
                        <div class="team-member">
                            <div class="member-info">
                                <div class="member-name">${escapeHtml(member.name)}</div>
                                <div class="member-email">${escapeHtml(member.email)}</div>
                                <div class="member-joined">Joined: ${joinedDate}</div>
                            </div>
                            <div class="member-bonus">+${member.bonus.toFixed(2)} ZMW</div>
                        </div>
                    `;
                }
                teamListDiv.innerHTML = html;
            } catch (err) {
                console.error(err);
                teamListDiv.innerHTML = '<div class="empty-msg">Error loading team data.</div>';
            }
        }

        // ================================================================
        // REFERRAL LINK
        // ================================================================
        function getReferralLink() {
            var currentUrl = window.location.href;
            var baseDir = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
            return baseDir + 'register.html?ref=' + currentReferralCode;
        }

        // ================================================================
        // COPY BUTTON
        // ================================================================
        copyBtn.addEventListener('click', function() {
            if (!currentReferralCode) {
                showToast('Referral code not loaded yet.', true);
                return;
            }
            var registerUrl = getReferralLink();
            navigator.clipboard.writeText(registerUrl).then(function() {
                showToast('✅ Referral link copied to clipboard!', false);
            }).catch(function() {
                // Fallback
                var textArea = document.createElement('textarea');
                textArea.value = registerUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Referral link copied!', false);
            });
        });

        // ================================================================
        // AUTH
        // ================================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            watchBlockStatus(currentUserId);
            await loadUserData();
            await loadTeamData();
            generateQR();
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'team.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · Team (unique design)');
        console.log('👥 Glass-morphism with SVG icons');
        console.log('🔐 Firebase config untouched');
    </script>

</body>
</html>
