<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Team | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #050505;
            color: #FFFFFF;
            padding: 1rem;
            padding-bottom: 85px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #050505 0%, #0a0a0a 25%, #111111 50%, #0a0a0a 75%, #050505 100%);
            background-size: 400% 400%;
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: -3;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 4 FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            z-index: -2;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #FFD700; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #00E5FF; bottom: -10%; right: -10%; animation-delay: 3s; }
        .orb-3 { width: 300px; height: 300px; background: #FFD700; top: 40%; left: 75%; animation-delay: 6s; }
        .orb-4 { width: 280px; height: 280px; background: #00C853; bottom: 30%; left: -5%; animation-delay: 9s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFD700;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,215,0,0.15);
            text-decoration: none;
            margin-bottom: 0.5rem;
        }
        .back-arrow:hover {
            background: #FFD700;
            color: #050505;
            transform: translateX(-4px);
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        .back-arrow svg { width: 18px; height: 18px; fill: currentColor; }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title .icon {
            font-size: 2rem;
        }

        /* ===== TEAM AVATAR ===== */
        .team-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #F59E0B, #00C853);
            background-size: 200% 200%;
            animation: avatarFlow 4s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255,215,0,0.2);
            flex-shrink: 0;
        }
        @keyframes avatarFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .team-avatar svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* ===== GLASS CARD ===== */
        .card {
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            border: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(17, 17, 17, 0.95), rgba(17, 17, 17, 0.95)),
                              linear-gradient(135deg, #FFD700, #00C853, #FFD700);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #FFD700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== REFERRAL CODE BOX ===== */
        .referral-code-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            background: rgba(255,255,255,0.03);
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            margin: 0.5rem 0 1rem;
            border: 1px solid rgba(255,215,0,0.08);
        }
        .referral-code {
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: rgba(0,0,0,0.4);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #FFD700;
            border: 1px solid rgba(255,215,0,0.1);
        }
        .copy-btn {
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: #050505;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255,215,0,0.15);
        }
        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255,215,0,0.25);
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        @media (max-width: 450px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
        .stat-item {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 1rem 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .stat-item:hover {
            border-color: rgba(255,215,0,0.1);
            background: rgba(255,215,0,0.02);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #00C853);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.2rem;
        }

        /* ===== TEAM LIST ===== */
        .team-list {
            margin-top: 0.5rem;
        }
        .team-member {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .team-member:hover {
            border-color: rgba(255,215,0,0.08);
            background: rgba(255,215,0,0.02);
        }
        .member-info .member-name {
            font-weight: 600;
            color: #ddd;
        }
        .member-info .member-email {
            font-size: 0.7rem;
            color: #666;
        }
        .member-info .member-joined {
            font-size: 0.65rem;
            color: #555;
        }
        .member-bonus {
            font-weight: 700;
            color: #00C853;
            font-size: 0.9rem;
            background: rgba(0,200,83,0.08);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            border: 1px solid rgba(0,200,83,0.1);
        }

        .empty-msg {
            text-align: center;
            color: #666;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #00C853;
            color: #050505;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            z-index: 1001;
            animation: fadeUpOut 5s ease forwards;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0,200,83,0.3);
        }
        .toast.error {
            background: #ef4444;
            color: white;
        }
        @keyframes fadeUpOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 14, 0.97);
            backdrop-filter: blur(16px);
            border-top: 2px solid transparent;
            background-clip: padding-box;
            background-image: linear-gradient(rgba(10, 10, 14, 0.97), rgba(10, 10, 14, 0.97)),
                              linear-gradient(135deg, #00E676, #00E5FF, #FFD700, #2979FF);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 6px 18px;
            z-index: 30;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
        }
        .nav-item:hover { transform: translateY(-4px); }
        .nav-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: brightness(0.5) grayscale(0.5);
            transition: 0.4s;
            border-radius: 8px;
            padding: 2px;
        }
        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(255, 215, 0, 0.7));
            transform: scale(1.05);
        }
        .nav-item.glow .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(0, 229, 255, 0.8));
            transform: scale(1.08);
        }
        .nav-item.glow-gold .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
            transform: scale(1.08);
        }
        .nav-item.glow-purple .nav-icon {
            filter: brightness(1) drop-shadow(0 0 16px rgba(41, 121, 255, 0.8));
            transform: scale(1.08);
        }
        .nav-label {
            font-size: 0.65rem;
            color: #888;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nav-item.active .nav-label { color: #FFD700; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .page-title { font-size: 1.5rem; }
            .referral-code { font-size: 1rem; }
            .stat-number { font-size: 1.5rem; }
            .team-avatar { width: 45px; height: 45px; }
            .team-avatar svg { width: 24px; height: 24px; }
            .nav-icon { width: 28px; height: 28px; }
            .nav-label { font-size: 0.55rem; }
            .card { padding: 1rem; }
            .referral-code-box { padding: 0.6rem 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 4 FLOATING ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <a href="dashboard.html" class="back-arrow">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    Back
                </a>
                <div class="page-title">
                    <span class="icon">👥</span> TEAM
                </div>
            </div>
            <!-- Team Avatar -->
            <div class="team-avatar" title="My Team">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>
        </div>

        <!-- ===== REFERRAL CARD ===== -->
        <div class="card">
            <div class="card-title">📎 Your Referral Link</div>
            <div class="referral-code-box">
                <span class="referral-code" id="referralCodeDisplay">Loading...</span>
                <button class="copy-btn" id="copyReferralBtn">📋 Copy Link</button>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="teamCount">0</div>
                    <div class="stat-label">👥 Team Members</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalBonus">0.00</div>
                    <div class="stat-label">💰 Total Bonus Earned (ZMW)</div>
                </div>
            </div>
        </div>

        <!-- ===== TEAM LIST CARD ===== -->
        <div class="card">
            <div class="card-title">📋 Your Team</div>
            <div id="teamList" class="team-list">
                <div class="empty-msg">Loading your team...</div>
            </div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <div class="nav-item" data-page="dashboard.html">
            <img class="nav-icon" src="https://i.ibb.co/qM4qxgGj/file-00000000248871f4bb1e73df45bacb92.png" alt="Home"><span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-page="mkvip.html">
            <img class="nav-icon" src="https://i.ibb.co/5WSyHGRZ/IMG-20260622-183230.jpg" alt="Mk vip"><span class="nav-label">Mkvip</span>
        </div>
        <div class="nav-item" data-page="jproduct.html">
            <img class="nav-icon" src="https://i.ibb.co/1fzvRd58/IMG-20260622-183217.jpg" alt="J product"><span class="nav-label">Jproduct</span>
        </div>
        <div class="nav-item" data-page="income.html">
            <img class="nav-icon" src="https://i.ibb.co/60hq0ds8/IMG-20260622-183154.jpg" alt="Income"><span class="nav-label">Income</span>
        </div>
        <div class="nav-item active" data-page="team.html">
            <img class="nav-icon" src="https://i.ibb.co/QRRSRzC/IMG-20260622-183120.jpg" alt="Team"><span class="nav-label">Team</span>
        </div>
        <div class="nav-item" data-page="me.html">
            <img class="nav-icon" src="https://i.ibb.co/JwY3HLVx/IMG-20260622-WA5359.jpg" alt="Me"><span class="nav-label">Me</span>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ===== TOAST =====
        function showToast(msg, isError = false) {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 5000);
        }

        // ===== BLOCK LISTENER =====
        let userBlockListener = null;

        function watchBlockStatus(userId) {
            if (userBlockListener) userBlockListener();
            userBlockListener = db.collection('users').doc(userId)
                .onSnapshot((doc) => {
                    if (doc.exists && doc.data().isBlocked === true) {
                        showToast('⚠️ Your account has been blocked. Redirecting to login...', true);
                        setTimeout(async () => {
                            await auth.signOut();
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                }, (err) => console.warn('Block listener error:', err));
        }

        window.addEventListener('beforeunload', () => {
            if (userBlockListener) userBlockListener();
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ===== DOM REFS =====
        const referralCodeSpan = document.getElementById('referralCodeDisplay');
        const copyBtn = document.getElementById('copyReferralBtn');
        const teamCountSpan = document.getElementById('teamCount');
        const totalBonusSpan = document.getElementById('totalBonus');
        const teamListDiv = document.getElementById('teamList');

        let currentUserId = null;
        let currentReferralCode = null;

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            watchBlockStatus(currentUserId);
            await loadUserData();
            await loadTeamData();
        });

        // ===== LOAD USER DATA =====
        async function loadUserData() {
            try {
                const userDoc = await db.collection('users').doc(currentUserId).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    currentReferralCode = data.referralCode;
                    if (referralCodeSpan) {
                        referralCodeSpan.innerText = currentReferralCode || 'N/A';
                    }
                } else {
                    referralCodeSpan.innerText = 'Error: No profile';
                }
            } catch (err) {
                console.error(err);
                referralCodeSpan.innerText = 'Error loading code';
            }
        }

        // ===== LOAD TEAM DATA =====
        async function loadTeamData() {
            if (!currentReferralCode) {
                teamListDiv.innerHTML = '<div class="empty-msg">Referral code not available yet.</div>';
                return;
            }

            try {
                const referredQuery = await db.collection('users')
                    .where('referredBy', '==', currentReferralCode)
                    .get();

                const teamMembers = [];
                let totalBonus = 0;

                for (const doc of referredQuery.docs) {
                    const memberData = doc.data();
                    const memberId = doc.id;

                    const earningsQuery = await db.collection('referralEarnings')
                        .where('referrerId', '==', currentUserId)
                        .where('referredUserId', '==', memberId)
                        .get();

                    let memberBonus = 0;
                    if (!earningsQuery.empty) {
                        earningsQuery.forEach(earn => {
                            memberBonus += earn.data().amount || 0;
                        });
                    }
                    totalBonus += memberBonus;

                    teamMembers.push({
                        name: memberData.fullName || 'Anonymous',
                        email: memberData.email,
                        joinedAt: memberData.createdAt ? memberData.createdAt.toDate() : null,
                        bonus: memberBonus
                    });
                }

                teamCountSpan.innerText = teamMembers.length;
                totalBonusSpan.innerText = totalBonus.toFixed(2);

                if (teamMembers.length === 0) {
                    teamListDiv.innerHTML = '<div class="empty-msg">📭 No team members yet. Share your referral link!</div>';
                    return;
                }

                let html = '';
                for (const member of teamMembers) {
                    const joinedDate = member.joinedAt ? member.joinedAt.toLocaleDateString() : 'Unknown';
                    html += `
                        <div class="team-member">
                            <div class="member-info">
                                <div class="member-name">${escapeHtml(member.name)}</div>
                                <div class="member-email">${escapeHtml(member.email)}</div>
                                <div class="member-joined">Joined: ${joinedDate}</div>
                            </div>
                            <div class="member-bonus">+${member.bonus.toFixed(2)} ZMW</div>
                        </div>
                    `;
                }
                teamListDiv.innerHTML = html;
            } catch (err) {
                console.error(err);
                teamListDiv.innerHTML = '<div class="empty-msg">Error loading team data.</div>';
            }
        }

        // ===== REFERRAL LINK =====
        function getReferralLink() {
            const currentUrl = window.location.href;
            const baseDir = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
            return `${baseDir}register.html?ref=${currentReferralCode}`;
        }

        // ===== COPY BUTTON =====
        copyBtn.addEventListener('click', () => {
            if (!currentReferralCode) {
                showToast('Referral code not loaded yet.', true);
                return;
            }
            const registerUrl = getReferralLink();
            navigator.clipboard.writeText(registerUrl).then(() => {
                showToast('✅ Referral link copied to clipboard!');
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = registerUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Referral link copied!');
            });
        });

        // ===== NAVIGATION =====
        const navItems = document.querySelectorAll('.nav-item');
        const currentPage = window.location.pathname.split('/').pop() || 'team.html';
        navItems.forEach(item => {
            const targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', () => {
                if (targetPage && !window.location.pathname.includes(targetPage)) {
                    window.location.href = targetPage;
                }
            });
        });

        // ===== AUTO-GLOW NAVIGATION =====
        const glowColors = ['glow', 'glow-gold', 'glow-purple', ''];
        let glowIndex = 0;

        function cycleGlow() {
            navItems.forEach(item => {
                item.classList.remove('glow', 'glow-gold', 'glow-purple');
            });

            if (glowColors[glowIndex]) {
                const targetIndex = glowIndex % navItems.length;
                navItems[targetIndex].classList.add(glowColors[glowIndex]);
            }

            glowIndex = (glowIndex + 1) % (navItems.length + 1);
        }

        setInterval(cycleGlow, 3000);
    </script>
</body>
</html>
