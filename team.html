<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Team – VisionCore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
            background: #000;
        }

        /* ----- FULL SCREEN BLURRED BACKGROUND IMAGE ----- */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMS5Sxbd/file-00000000ec2c820c9d79849d4a3d6b82.png');
            background-size: cover;
            background-position: center;
            filter: blur(14px) brightness(0.25) saturate(0.7);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- HEADER (DARK GLASS) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ----- PAGE HEADER ----- */
        .page-header {
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-header h1 span {
            color: #60a5fa;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.5s ease forwards;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .glass-card .card-title svg {
            width: 18px;
            height: 18px;
            stroke: #60a5fa;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- REFERRAL CODE BOX (GLASS) ----- */
        .referral-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.6rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 1rem;
        }

        .referral-box .code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #facc15;
            background: rgba(0, 0, 0, 0.15);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .referral-box .copy-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(37, 99, 235, 0.15);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .referral-box .copy-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .referral-box .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.25);
        }

        /* ----- QR CODE (GLASS) ----- */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0.5rem 0 0.8rem 0;
        }

        .qr-section .qr-wrapper {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.6rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        .qr-section .qr-wrapper #qrCodeCanvas {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-section .qr-wrapper #qrCodeCanvas canvas,
        .qr-section .qr-wrapper #qrCodeCanvas img {
            border-radius: 8px;
            display: block;
            background: #ffffff;
        }

        .qr-section .qr-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 0.4rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qr-section .qr-label svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- COMMISSION INFO (GLASS) ----- */
        .commission-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.6rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 0.5rem 0 1rem 0;
        }

        .commission-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .commission-item .badge {
            font-weight: 700;
            color: #facc15;
            background: rgba(250, 204, 21, 0.04);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            border: 1px solid rgba(250, 204, 21, 0.06);
        }

        .commission-item .highlight {
            color: #4ade80;
            font-weight: 700;
        }

        /* ----- STATS GRID (GLASS) ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }

        @media (max-width: 450px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.8rem 0.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
        }

        .stat-item .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-item .stat-number.gold {
            color: #facc15;
        }
        .stat-item .stat-number.blue {
            color: #60a5fa;
        }

        .stat-item .stat-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 0.1rem;
            letter-spacing: 0.3px;
        }

        /* ----- TEAM LIST (GLASS) ----- */
        .team-list {
            margin-top: 0.2rem;
        }

        .team-member {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.7rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .team-member:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
        }

        .team-member .member-info .member-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .team-member .member-info .member-email {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .team-member .member-info .member-joined {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.06);
        }

        .team-member .member-bonus {
            font-weight: 700;
            color: #4ade80;
            font-size: 0.8rem;
            background: rgba(74, 222, 128, 0.04);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            border: 1px solid rgba(74, 222, 128, 0.06);
            white-space: nowrap;
        }

        .empty-msg {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 1.5rem 0;
            font-size: 0.85rem;
        }

        .empty-msg svg {
            width: 36px;
            height: 36px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* ----- TOAST (GLASS) ----- */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        /* ----- BOTTOM NAV (DARK GLASS) ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }

        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        .nav-item:hover .nav-icon {
            stroke: #60a5fa;
        }

        .nav-item.marketplace .nav-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            padding: 4px;
            stroke: #fff;
            margin-bottom: 2px;
        }

        .nav-item.marketplace.active .nav-icon {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .nav-item.marketplace .nav-label {
            color: #60a5fa;
            font-weight: 700;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 500px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .logo-sub {
                font-size: 0.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .glass-card {
                padding: 1.2rem 1rem;
                border-radius: 24px;
            }
            .referral-box .code {
                font-size: 0.9rem;
            }
            .stat-item .stat-number {
                font-size: 1.4rem;
            }
            .commission-item {
                font-size: 0.65rem;
            }
            .team-member .member-bonus {
                font-size: 0.7rem;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item.marketplace .nav-icon {
                width: 30px;
                height: 30px;
            }
            .qr-section .qr-wrapper {
                padding: 0.4rem;
            }
            .qr-section .qr-wrapper #qrCodeCanvas canvas,
            .qr-section .qr-wrapper #qrCodeCanvas img {
                max-width: 130px;
                height: auto;
            }
        }

        @media (max-width: 400px) {
            .referral-box {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .referral-box .code {
                text-align: center;
            }
            .referral-box .copy-btn {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .commission-row {
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FULL SCREEN BLURRED BACKGROUND ===== -->
    <div class="hero-bg"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo-text">Vision<span class="vc">Core</span></a>
            <span class="logo-sub">powered by <span class="highlight">Pureore Capital</span></span>
        </div>
        <div class="header-right">
            <!-- No hamburger menu -->
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- Page Header -->
        <div class="page-header">
            <h1>👥 <span>My Team</span></h1>
            <p>Invite friends and earn commissions</p>
        </div>

        <!-- Referral Glass Card -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Referral Link
            </div>

            <!-- Referral Code + Copy -->
            <div class="referral-box">
                <span class="code" id="referralCodeDisplay">Loading...</span>
                <button class="copy-btn" id="copyReferralBtn">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy Link
                </button>
            </div>

            <!-- QR Code -->
            <div class="qr-section">
                <div class="qr-wrapper">
                    <div id="qrCodeCanvas"></div>
                </div>
                <div class="qr-label">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="15" y="2" width="7" height="7" rx="1"/><rect x="2" y="15" width="7" height="7" rx="1"/><rect x="15" y="15" width="7" height="7" rx="1"/></svg>
                    Scan to share your referral link
                </div>
            </div>

            <!-- Commission Info -->
            <div class="commission-row">
                <div class="commission-item">
                    <span>💰 Invite & Earn</span>
                    <span class="badge">10%</span>
                    <span class="highlight">on deposits</span>
                </div>
                <div class="commission-item">
                    <span>📈 Investment Bonus</span>
                    <span class="badge">10%</span>
                    <span class="highlight">on plan purchases</span>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number gold" id="teamCount">0</div>
                    <div class="stat-label">Team Members</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number blue" id="totalBonus">0.00</div>
                    <div class="stat-label">Total Bonus (ZMW)</div>
                </div>
            </div>
        </div>

        <!-- Team List Glass Card -->
        <div class="glass-card">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Your Team
            </div>
            <div id="teamList" class="team-list">
                <div class="empty-msg">Loading your team...</div>
            </div>
        </div>

    </main>

    <!-- ===== BOTTOM NAV (DARK GLASS) ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item marketplace" data-page="marketplace.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="nav-label">Market</span>
        </button>
        <button class="nav-item active" data-page="team.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="nav-label">Team</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // STATE
        // ================================================================
        var currentUserId = null;
        var currentReferralCode = null;

        // ================================================================
        // DOM REFS
        // ================================================================
        var referralCodeSpan = document.getElementById('referralCodeDisplay');
        var copyBtn = document.getElementById('copyReferralBtn');
        var teamCountSpan = document.getElementById('teamCount');
        var totalBonusSpan = document.getElementById('totalBonus');
        var teamListDiv = document.getElementById('teamList');
        var qrContainer = document.getElementById('qrCodeCanvas');

        // ================================================================
        // LOAD USER DATA
        // ================================================================
        async function loadUserData() {
            try {
                var userDoc = await db.collection('users').doc(currentUserId).get();
                if (userDoc.exists) {
                    var data = userDoc.data();
                    currentReferralCode = data.referralCode;
                    referralCodeSpan.textContent = currentReferralCode || 'N/A';
                } else {
                    referralCodeSpan.textContent = 'Error: No profile';
                }
            } catch (err) {
                console.error(err);
                referralCodeSpan.textContent = 'Error loading code';
            }
        }

        // ================================================================
        // GENERATE QR CODE
        // ================================================================
        function generateQR() {
            if (!qrContainer) return;
            qrContainer.innerHTML = '';
            var link = getReferralLink();
            try {
                new QRCode(qrContainer, {
                    text: link,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (err) {
                console.warn('QR generation failed, using fallback:', err);
                qrContainer.innerHTML = `
                    <div style="
                        width:160px; height:160px;
                        display:flex; align-items:center; justify-content:center;
                        background:white; color:#000; font-size:12px;
                        border-radius:8px; text-align:center; padding:10px;
                        word-break:break-all;
                    ">${escapeHtml(link)}</div>
                `;
            }
        }

        // ================================================================
        // LOAD TEAM DATA
        // ================================================================
        async function loadTeamData() {
            if (!currentReferralCode) {
                teamListDiv.innerHTML = '<div class="empty-msg">Referral code not available yet.</div>';
                return;
            }

            try {
                var referredQuery = await db.collection('users')
                    .where('referredBy', '==', currentReferralCode)
                    .get();

                var teamMembers = [];
                var totalBonus = 0;

                for (var doc of referredQuery.docs) {
                    var memberData = doc.data();
                    var memberId = doc.id;

                    var earningsQuery = await db.collection('referralEarnings')
                        .where('referrerId', '==', currentUserId)
                        .where('referredUserId', '==', memberId)
                        .get();

                    var memberBonus = 0;
                    if (!earningsQuery.empty) {
                        earningsQuery.forEach(function(earn) {
                            memberBonus += earn.data().amount || 0;
                        });
                    }
                    totalBonus += memberBonus;

                    teamMembers.push({
                        name: memberData.fullName || 'Anonymous',
                        email: memberData.email,
                        joinedAt: memberData.createdAt ? memberData.createdAt.toDate() : null,
                        bonus: memberBonus
                    });
                }

                teamCountSpan.textContent = teamMembers.length;
                totalBonusSpan.textContent = totalBonus.toFixed(2);

                if (teamMembers.length === 0) {
                    teamListDiv.innerHTML = `
                        <div class="empty-msg">
                            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            No team members yet.<br>Share your referral link!
                        </div>
                    `;
                    return;
                }

                var html = '';
                for (var member of teamMembers) {
                    var joinedDate = member.joinedAt ? member.joinedAt.toLocaleDateString() : 'Unknown';
                    html += `
                        <div class="team-member">
                            <div class="member-info">
                                <div class="member-name">${escapeHtml(member.name)}</div>
                                <div class="member-email">${escapeHtml(member.email)}</div>
                                <div class="member-joined">Joined: ${joinedDate}</div>
                            </div>
                            <div class="member-bonus">+${member.bonus.toFixed(2)} ZMW</div>
                        </div>
                    `;
                }
                teamListDiv.innerHTML = html;
            } catch (err) {
                console.error(err);
                teamListDiv.innerHTML = '<div class="empty-msg">Error loading team data.</div>';
            }
        }

        // ================================================================
        // REFERRAL LINK
        // ================================================================
        function getReferralLink() {
            var currentUrl = window.location.href;
            var baseDir = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
            return baseDir + 'register.html?ref=' + currentReferralCode;
        }

        // ================================================================
        // COPY BUTTON
        // ================================================================
        copyBtn.addEventListener('click', function() {
            if (!currentReferralCode) {
                showToast('Referral code not loaded yet.', true);
                return;
            }
            var registerUrl = getReferralLink();
            navigator.clipboard.writeText(registerUrl).then(function() {
                showToast('✅ Referral link copied to clipboard!', false);
            }).catch(function() {
                var textArea = document.createElement('textarea');
                textArea.value = registerUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Referral link copied!', false);
            });
        });

        // ================================================================
        // AUTH
        // ================================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.uid;
            watchBlockStatus(currentUserId);
            await loadUserData();
            await loadTeamData();
            generateQR();
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'team.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✅ team.html · VisionCore Capital · Blue glassmorphism design');
        console.log('📱 Bottom Nav: Home | Income | Market | Team | Me');
        console.log('👥 Referral system with QR code and team list');
    </script>
</body>
</html>
