<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vouchers | Pureore Capital</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            font-family: 'Inter', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(30,30,42,0.8);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #2ecc71;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(46,204,113,0.3);
            z-index: 20;
        }
        .back-arrow:hover {
            background: #2ecc71;
            color: #0A0A0C;
            transform: translateX(-3px);
        }
        .animated-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1rem;
            background: linear-gradient(135deg, #2ecc71, #f1c40f, #e67e22);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 1.8rem;
            border: 1px solid rgba(241, 196, 15, 0.4);
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            border: 1px solid #2C2C3A;
            background: #1E1E2A;
            color: white;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 5px rgba(46,204,113,0.3);
        }
        .claim-btn {
            width: 100%;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            padding: 1rem;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #0A0A0C;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: 0.2s;
        }
        .claim-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .claim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 30px;
            text-align: center;
            font-weight: 500;
        }
        .success {
            background: rgba(46,204,113,0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .error {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .loader {
            border: 3px solid #2C2C3A;
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 20px;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .nav-item:hover { transform: translateY(-3px); }
        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0.8);
        }
        .nav-label {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 500;
        }
        .nav-item.active .nav-label { color: #2ecc71; }
        @media (max-width: 600px) {
            .animated-title { font-size: 1.5rem; }
            .card { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-arrow" onclick="window.location.href='dashboard.html'">← Back</div>
    <div class="animated-title">🎫 Voucher Redemption</div>
    <div class="card">
        <div class="input-group">
            <label>👤 Your Name (as registered)</label>
            <input type="text" id="userName" placeholder="Full name" autocomplete="off">
        </div>
        <div class="input-group">
            <label>🔒 Your Password</label>
            <input type="password" id="userPassword" placeholder="Password">
        </div>
        <div class="input-group">
            <label>📞 Agent Number</label>
            <input type="tel" id="agentNumber" placeholder="Agent phone number">
        </div>
        <div class="input-group">
            <label>📛 Agent Name</label>
            <input type="text" id="agentName" placeholder="Agent full name">
        </div>
        <div class="input-group">
            <label>🎟️ Voucher Code (10 characters)</label>
            <input type="text" id="voucherCode" placeholder="Enter voucher code" maxlength="10">
        </div>
        <button id="claimBtn" class="claim-btn">💰 Redeem Voucher</button>
        <div id="message"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item" data-page="dashboard.html">
        <img class="nav-icon" src="https://i.ibb.co/6LG91dH/IMG-20260525-114357.jpg" alt="Home"><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="mkvip.html">
        <img class="nav-icon" src="https://i.ibb.co/MyN2M3qT/IMG-20260525-114308.jpg" alt="Mk vip"><span class="nav-label">Mk vip</span>
    </div>
    <div class="nav-item" data-page="jproduct.html">
        <img class="nav-icon" src="https://i.ibb.co/qYHdfQ2R/IMG-20260525-114242.jpg" alt="J product"><span class="nav-label">J product</span>
    </div>
    <div class="nav-item" data-page="income.html">
        <img class="nav-icon" src="https://i.ibb.co/mrsbXQrm/IMG-20260525-114226.jpg" alt="Income"><span class="nav-label">Income</span>
    </div>
    <div class="nav-item" data-page="team.html">
        <img class="nav-icon" src="https://i.ibb.co/N6R038GQ/IMG-20260525-114127.jpg" alt="Team"><span class="nav-label">Team</span>
    </div>
    <div class="nav-item" data-page="me.html">
        <img class="nav-icon" src="https://i.ibb.co/21XdB8zF/IMG-20260525-114324.jpg" alt="Me"><span class="nav-label">Me</span>
    </div>
</div>

<script>
    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
        authDomain: "pureore-capital-zambia.firebaseapp.com",
        projectId: "pureore-capital-zambia",
        storageBucket: "pureore-capital-zambia.appspot.com",
        messagingSenderId: "78967797858",
        appId: "1:78967797858:web:379b9692951429c345793b",
        measurementId: "G-FQKC29NYE9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // 🔥 DISABLE OFFLINE PERSISTENCE – Only work online
    db.settings({ persistence: false });
    
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

    const claimBtn = document.getElementById('claimBtn');
    const messageDiv = document.getElementById('message');

    function showMessage(msg, isError = true) {
        messageDiv.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${msg}</div>`;
        setTimeout(() => {
            if (messageDiv.innerHTML.includes(msg)) messageDiv.innerHTML = '';
        }, 5000);
    }

    claimBtn.addEventListener('click', async () => {
        const userName = document.getElementById('userName').value.trim();
        const userPassword = document.getElementById('userPassword').value;
        const agentNumber = document.getElementById('agentNumber').value.trim();
        const agentName = document.getElementById('agentName').value.trim();
        let voucherCode = document.getElementById('voucherCode').value.trim();

        if (!userName || !userPassword || !agentNumber || !agentName || !voucherCode) {
            showMessage('Please fill in all fields.', true);
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        // Verify user name and password
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists) {
            showMessage('User profile not found.', true);
            return;
        }
        const userData = userDoc.data();
        if (userData.fullName !== userName) {
            showMessage('Name does not match your registered name.', true);
            return;
        }
        
        // Re-authenticate user with password
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, userPassword);
        try {
            await user.reauthenticateWithCredential(credential);
        } catch (err) {
            showMessage('Incorrect password.', true);
            return;
        }

        // Verify agent
        const agentQuery = await db.collection('agents')
            .where('number', '==', agentNumber)
            .where('name', '==', agentName)
            .limit(1)
            .get();
        if (agentQuery.empty) {
            showMessage('Agent not found. Please check the number and name.', true);
            return;
        }

        // Voucher code format: 10 chars, first 6 = amount (digits + optional dot), last 4 = letters
        if (voucherCode.length !== 10) {
            showMessage('Voucher code must be exactly 10 characters.', true);
            return;
        }
        const amountPart = voucherCode.substring(0, 6);
        const suffix = voucherCode.substring(6, 10);
        const amountValue = parseFloat(amountPart);
        if (isNaN(amountValue) || amountValue <= 0) {
            showMessage('Invalid amount in voucher code (first 6 characters).', true);
            return;
        }
        if (!/^[A-Za-z]{4}$/.test(suffix)) {
            showMessage('Last 4 characters must be letters (A-Z).', true);
            return;
        }

        // Check voucher code in Firestore
        const codeQuery = await db.collection('vouchers')
            .where('code', '==', voucherCode)
            .limit(1)
            .get();
        if (codeQuery.empty) {
            showMessage('Invalid voucher code. No such code exists.', true);
            return;
        }
        const voucherDoc = codeQuery.docs[0];
        const voucherData = voucherDoc.data();
        if (voucherData.used) {
            showMessage('This voucher code has already been used.', true);
            return;
        }
        if (Math.abs(voucherData.amount - amountValue) > 0.01) {
            showMessage('Voucher amount mismatch. Please contact support.', true);
            return;
        }

        // All checks passed – credit amount
        claimBtn.disabled = true;
        claimBtn.innerText = 'Processing...';
        try {
            await db.runTransaction(async (transaction) => {
                const userRef = db.collection('users').doc(user.uid);
                const userSnap = await transaction.get(userRef);
                const newBalance = (userSnap.data().balance || 0) + amountValue;
                transaction.update(userRef, { balance: newBalance });
                transaction.update(voucherDoc.ref, {
                    used: true,
                    usedBy: user.uid,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            await db.collection('transactions').add({
                userId: user.uid,
                type: 'voucher',
                amount: amountValue,
                description: `Voucher code: ${voucherCode} (Agent: ${agentName} ${agentNumber})`,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showMessage(`✅ Success! K${amountValue.toFixed(2)} added to your balance.`, false);
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2000);
        } catch (err) {
            console.error(err);
            showMessage('Error: ' + err.message, true);
            claimBtn.disabled = false;
            claimBtn.innerText = '💰 Redeem Voucher';
        }
    });

    // Bottom navigation active state
    const navItems = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop() || 'vouchers.html';
    navItems.forEach(item => {
        const targetPage = item.getAttribute('data-page');
        if (currentPage === targetPage) item.classList.add('active');
        item.addEventListener('click', () => {
            if (targetPage && !window.location.pathname.includes(targetPage)) {
                window.location.href = targetPage;
            }
        });
    });
</script>
</body>
</html>
