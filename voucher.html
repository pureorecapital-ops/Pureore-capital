<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Vouchers – VisionCore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE (DARK BLUE THEME) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            position: relative;
            background: #000;
        }

        /* ----- FULL SCREEN BLURRED BACKGROUND IMAGE ----- */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .hero-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMS5Sxbd/file-00000000ec2c820c9d79849d4a3d6b82.png');
            background-size: cover;
            background-position: center;
            filter: blur(14px) brightness(0.25) saturate(0.7);
            transform: scale(1.1);
        }

        .hero-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- HEADER (DARK GLASS) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.4px;
        }
        .logo-text .vc {
            color: #60a5fa;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-top: -2px;
        }
        .logo-sub .highlight {
            color: rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 1.2rem;
            flex: 1;
            width: 100%;
        }

        /* ----- BACK BUTTON (GLASS) ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE HEADER ----- */
        .page-header {
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }
        .page-header h1 span {
            color: #60a5fa;
        }
        .page-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.5s ease forwards;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.04);
            border: 1px solid rgba(96, 165, 250, 0.06);
            margin-bottom: 0.6rem;
        }

        .glass-card .card-icon svg {
            width: 36px;
            height: 36px;
            stroke: #60a5fa;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .glass-card .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .glass-card .card-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        /* ----- BALANCE DISPLAY (GLASS) ----- */
        .balance-display {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-display .label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .balance-display .amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: #facc15;
        }

        /* ----- FORM ELEMENTS (GLASS) ----- */
        .form-group {
            margin-bottom: 0.8rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .form-group .input-wrap {
            position: relative;
        }

        .form-group .input-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-group .input-wrap:focus-within .input-icon {
            stroke: #60a5fa;
        }

        .form-group .input-wrap input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 44px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }

        .form-group .input-wrap input:focus {
            border-color: rgba(96, 165, 250, 0.15);
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.02);
        }

        .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.06);
        }

        .form-group .input-wrap input[readonly] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-error {
            font-size: 0.7rem;
            color: #f87171;
            margin-top: 0.2rem;
            min-height: 1.2rem;
            text-align: left;
        }

        /* ----- CLAIM BUTTON (BLUE GRADIENT) ----- */
        .btn-claim {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
            box-shadow: 0 4px 24px rgba(37, 99, 235, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-claim:hover:not(:disabled) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.25);
        }

        .btn-claim:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-claim:disabled {
            opacity: 0.3;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-claim svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- SPINNER ----- */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ----- MESSAGE BOX (GLASS) ----- */
        .msg-box {
            padding: 0.8rem 1rem;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            display: none;
            border: 1.5px solid transparent;
        }

        .msg-box.success {
            display: block;
            background: rgba(74, 222, 128, 0.06);
            border-color: rgba(74, 222, 128, 0.08);
            color: #4ade80;
        }

        .msg-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.06);
            border-color: rgba(239, 68, 68, 0.08);
            color: #f87171;
        }

        .msg-box svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            color: #f1f5f9;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1001;
            animation: toastFade 4.5s ease forwards;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.95);
            }
        }

        /* ===== BOTTOM NAV (5 icons – NO Voucher) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            stroke: #60a5fa;
            transform: scale(1.05);
        }

        .nav-item .nav-label {
            font-size: 0.45rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: #60a5fa;
        }

        .nav-item:hover .nav-icon {
            stroke: #60a5fa;
        }

        .nav-item.marketplace .nav-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            padding: 4px;
            stroke: #fff;
            margin-bottom: 2px;
        }

        .nav-item.marketplace.active .nav-icon {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .nav-item.marketplace .nav-label {
            color: #60a5fa;
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .header {
                padding: 0.6rem 1rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .logo-sub {
                font-size: 0.5rem;
            }
            .container {
                padding: 0 0.8rem;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .glass-card {
                padding: 1.2rem 1rem;
                border-radius: 24px;
            }
            .glass-card .card-icon {
                width: 60px;
                height: 60px;
            }
            .glass-card .card-icon svg {
                width: 30px;
                height: 30px;
            }
            .glass-card .card-title {
                font-size: 1rem;
            }
            .glass-card .card-subtitle {
                font-size: 0.8rem;
            }
            .form-group .input-wrap input {
                font-size: 0.9rem;
                padding: 0.65rem 1rem 0.65rem 40px;
            }
            .form-group .input-wrap .input-icon {
                left: 12px;
                width: 16px;
                height: 16px;
            }
            .btn-claim {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
            .balance-display {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
                text-align: center;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item.marketplace .nav-icon {
                width: 30px;
                height: 30px;
            }
            .back-btn {
                font-size: 0.65rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 400px) {
            .glass-card .card-icon {
                width: 52px;
                height: 52px;
            }
            .glass-card .card-icon svg {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FULL SCREEN BLURRED BACKGROUND ===== -->
    <div class="hero-bg"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo-text">Vision<span class="vc">Core</span></a>
            <span class="logo-sub">powered by <span class="highlight">Pureore Capital</span></span>
        </div>
        <div class="header-right">
            <!-- No hamburger menu -->
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- Back Row -->
        <div class="back-row">
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
                Back
            </button>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <h1>🎫 <span>Voucher</span></h1>
            <p>Redeem your voucher code to add funds</p>
        </div>

        <!-- Main Glass Card -->
        <div class="glass-card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="7" width="18" height="14" rx="2" ry="2" />
                    <line x1="3" y1="11" x2="21" y2="11" />
                    <line x1="3" y1="15" x2="21" y2="15" />
                    <line x1="8" y1="7" x2="8" y2="21" />
                </svg>
            </div>
            <div class="card-title">Enter Voucher Code</div>
            <div class="card-subtitle">Use the code from your agent</div>

            <!-- Balance Display -->
            <div class="balance-display">
                <span class="label">💰 Current Balance</span>
                <span class="amount" id="userBalance">0.00 ZMW</span>
            </div>

            <!-- Form -->
            <div class="form-group">
                <label>👤 Your Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="userName" placeholder="Full name" autocomplete="off" readonly />
                </div>
            </div>

            <div class="form-group">
                <label>🔒 Your Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="userPassword" placeholder="Enter your password" autocomplete="current-password" />
                </div>
            </div>

            <div class="form-group">
                <label>📞 Agent Number</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="2.5" />
                        <path d="M8 2v20" />
                        <path d="M16 2v20" />
                        <path d="M2 8h20" />
                        <path d="M2 16h20" />
                    </svg>
                    <input type="tel" id="agentNumber" placeholder="Agent phone number" />
                </div>
            </div>

            <div class="form-group">
                <label>📛 Agent Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="agentName" placeholder="Agent full name" />
                </div>
            </div>

            <div class="form-group">
                <label>🎟️ Voucher Code</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="text" id="voucherCode" placeholder="Enter voucher code (10 characters)" maxlength="10" autocomplete="off" />
                </div>
                <div class="input-error" id="codeError"></div>
            </div>

            <button class="btn-claim" id="claimBtn">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
                Redeem Voucher
            </button>

            <div class="msg-box" id="messageArea"></div>
        </div>

    </main>

    <!-- ===== BOTTOM NAV (5 icons – NO Voucher) ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
            </svg>
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item marketplace" data-page="marketplace.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span class="nav-label">Market</span>
        </button>
        <button class="nav-item" data-page="team.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span class="nav-label">Team</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // DOM REFS
        // ================================================================
        var claimBtn = document.getElementById('claimBtn');
        var messageArea = document.getElementById('messageArea');
        var userBalanceSpan = document.getElementById('userBalance');
        var userNameInput = document.getElementById('userName');
        var userPasswordInput = document.getElementById('userPassword');
        var agentNumberInput = document.getElementById('agentNumber');
        var agentNameInput = document.getElementById('agentName');
        var voucherCodeInput = document.getElementById('voucherCode');
        var codeError = document.getElementById('codeError');

        // ================================================================
        // LOAD USER BALANCE
        // ================================================================
        async function loadUserBalance(uid) {
            try {
                var userDoc = await db.collection('users').doc(uid).get();
                if (userDoc.exists) {
                    var balance = userDoc.data().balance || 0;
                    userBalanceSpan.textContent = balance.toFixed(2) + ' ZMW';
                }
            } catch (err) {
                console.warn("Could not load balance:", err);
            }
        }

        // ================================================================
        // VALIDATE AGENT
        // ================================================================
        async function validateAgent(agentNumber, agentName) {
            var trimmedNumber = agentNumber.trim();
            var trimmedName = agentName.trim();

            var numberQuery = await db.collection('agents')
                .where('number', '==', trimmedNumber)
                .get();

            if (!numberQuery.empty) {
                for (var doc of numberQuery.docs) {
                    var agent = doc.data();
                    if (agent.name && agent.name.toLowerCase() === trimmedName.toLowerCase()) {
                        return true;
                    }
                }
            }

            var nameQuery = await db.collection('agents')
                .where('name', '==', trimmedName)
                .get();
            if (!nameQuery.empty) {
                for (var doc of nameQuery.docs) {
                    var agent = doc.data();
                    if (agent.number && agent.number === trimmedNumber) {
                        return true;
                    }
                }
            }

            return false;
        }

        // ================================================================
        // SHOW MESSAGE
        // ================================================================
        function showMessage(msg, type) {
            messageArea.className = 'msg-box ' + type;
            var icon = type === 'error' ?
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' :
                '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
            messageArea.innerHTML = icon + ' ' + msg;
            messageArea.style.display = 'block';
            setTimeout(function() {
                messageArea.style.display = 'none';
            }, 5000);
        }

        function hideMessage() {
            messageArea.style.display = 'none';
            messageArea.className = 'msg-box';
        }

        // ================================================================
        // VOUCHER CODE VALIDATION
        // ================================================================
        voucherCodeInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
            codeError.textContent = '';
            if (this.value.length === 10) {
                var amountPart = this.value.substring(0, 6);
                var suffix = this.value.substring(6, 10);
                if (!/^\d{6}$/.test(amountPart)) {
                    codeError.textContent = 'First 6 characters must be numbers.';
                } else if (!/^[A-Z]{4}$/.test(suffix)) {
                    codeError.textContent = 'Last 4 characters must be letters (A-Z).';
                }
            }
        });

        // ================================================================
        // AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);
            await loadUserBalance(user.uid);
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                var fullName = userDoc.data().fullName;
                if (fullName) userNameInput.value = fullName;
            }
        });

        // ================================================================
        // CLAIM VOUCHER
        // ================================================================
        claimBtn.addEventListener('click', async function() {
            hideMessage();
            codeError.textContent = '';

            var userName = userNameInput.value.trim();
            var userPassword = userPasswordInput.value;
            var agentNumber = agentNumberInput.value.trim();
            var agentName = agentNameInput.value.trim();
            var voucherCodeRaw = voucherCodeInput.value.trim();
            var voucherCode = voucherCodeRaw.toUpperCase();

            // Validation
            if (!userName || !userPassword || !agentNumber || !agentName || !voucherCode) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            if (voucherCode.length !== 10) {
                showMessage('Voucher code must be exactly 10 characters.', 'error');
                return;
            }

            var amountPart = voucherCode.substring(0, 6);
            var suffix = voucherCode.substring(6, 10);
            var amountValue = parseFloat(amountPart);
            if (isNaN(amountValue) || amountValue <= 0) {
                showMessage('Invalid amount in voucher code (first 6 characters must be digits).', 'error');
                return;
            }
            if (!/^[A-Z]{4}$/.test(suffix)) {
                showMessage('Last 4 characters must be letters (A-Z).', 'error');
                return;
            }

            var user = auth.currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Verify user name matches
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists) {
                showMessage('User profile not found.', 'error');
                return;
            }
            var userData = userDoc.data();
            if (userData.fullName !== userName) {
                showMessage('Name does not match your registered name.', 'error');
                return;
            }

            // Re-authenticate
            var credential = firebase.auth.EmailAuthProvider.credential(user.email, userPassword);
            try {
                await user.reauthenticateWithCredential(credential);
            } catch (err) {
                showMessage('Incorrect password.', 'error');
                return;
            }

            // Validate agent
            var agentValid = await validateAgent(agentNumber, agentName);
            if (!agentValid) {
                showMessage('Agent not found. Please check the number and name exactly as registered.', 'error');
                return;
            }

            // Check voucher code
            var codeQuery = await db.collection('vouchers')
                .where('code', '==', voucherCode)
                .limit(1)
                .get();
            if (codeQuery.empty) {
                showMessage('Invalid voucher code. No such code exists.', 'error');
                return;
            }
            var voucherDoc = codeQuery.docs[0];
            var voucherData = voucherDoc.data();
            if (voucherData.used) {
                showMessage('This voucher code has already been used.', 'error');
                return;
            }
            if (Math.abs(voucherData.amount - amountValue) > 0.01) {
                showMessage('Voucher amount mismatch. Please contact support.', 'error');
                return;
            }

            claimBtn.disabled = true;
            claimBtn.innerHTML = '<span class="spinner"></span> Processing...';

            try {
                await db.runTransaction(async function(transaction) {
                    var userRef = db.collection('users').doc(user.uid);
                    var userSnap = await transaction.get(userRef);
                    var newBalance = (userSnap.data().balance || 0) + amountValue;
                    transaction.update(userRef, { balance: newBalance });
                    transaction.update(voucherDoc.ref, {
                        used: true,
                        usedBy: user.uid,
                        usedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                await db.collection('transactions').add({
                    userId: user.uid,
                    type: 'voucher',
                    amount: amountValue,
                    description: 'Voucher code: ' + voucherCode + ' (Agent: ' + agentName + ' ' + agentNumber + ')',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await loadUserBalance(user.uid);
                showMessage('✅ Success! K' + amountValue.toFixed(2) + ' added to your balance. Redirecting...', 'success');
                voucherCodeInput.value = '';

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (err) {
                console.error('Voucher claim error:', err);
                showMessage('Error: ' + err.message, 'error');
                claimBtn.disabled = false;
                claimBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg> Redeem Voucher';
            }
        });

        // ================================================================
        // ENTER KEY SUPPORT
        // ================================================================
        voucherCodeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                claimBtn.click();
            }
        });
        userPasswordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                claimBtn.click();
            }
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'voucher.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✅ Voucher page · VisionCore Capital · Blue glassmorphism design');
        console.log('🎫 Bottom nav has 5 icons only (NO Voucher icon)');
    </script>

</body>
</html>
