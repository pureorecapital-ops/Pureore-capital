<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Vouchers – PC • Pureore Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f6c96e;
            --gold-glow: rgba(246, 201, 110, 0.25);
            --cyan: #5dd9f2;
            --cyan-glow: rgba(93, 217, 242, 0.20);
            --violet: #7c6df0;
            --violet-glow: rgba(124, 109, 240, 0.30);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            background: #0a0815;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ----- BACKGROUND with Ravi Sharma image & brightness reduction ----- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/Vcg0rgNY/ravi-sharma-h-Nv5s6-NEYig-unsplash.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.30) saturate(1.1) contrast(1.05);
            z-index: -3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 20%, rgba(124, 109, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(93, 217, 242, 0.06) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* ----- FLOATING ORBS ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--cyan);
            bottom: -8%;
            right: -10%;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: var(--gold);
            top: 40%;
            left: 70%;
            animation-delay: 10s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(25px, -35px) scale(1.06);
            }
            66% {
                transform: translate(-15px, 25px) scale(0.94);
            }
            100% {
                transform: translate(20px, -10px) scale(1.02);
            }
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.2rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER / BRAND ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--violet-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0edff 0%, #b8b0d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-name .pc {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            font-weight: 900;
        }

        .brand-badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- BACK BUTTON ----- */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- PAGE TITLE ----- */
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1.2rem;
            font-weight: 400;
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: rgba(10, 8, 21, 0.55);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.5rem 1.8rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 109, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .glass-card .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .glass-card .card-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- BALANCE DISPLAY ----- */
        .balance-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 1.2rem;
        }

        .balance-display .label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .balance-display .amount {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ----- FORM ELEMENTS ----- */
        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group .input-wrap {
            position: relative;
        }

        .form-group .input-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-group .input-wrap:focus-within .input-icon {
            stroke: var(--cyan);
        }

        .form-group .input-wrap input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 44px;
            border-radius: var(--radius-sm);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group .input-wrap input:focus {
            border-color: rgba(93, 217, 242, 0.15);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(93, 217, 242, 0.02);
        }

        .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }

        .form-group .input-wrap input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-error {
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 0.2rem;
            min-height: 1.2rem;
        }

        /* ----- CLAIM BUTTON ----- */
        .btn-claim {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0a0815;
            background: linear-gradient(135deg, var(--gold), #f5a623);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 30px var(--gold-glow);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            margin-top: 0.3rem;
        }

        .btn-claim::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-claim:hover::after {
            opacity: 1;
        }

        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--gold-glow);
        }

        .btn-claim:active {
            transform: scale(0.97);
        }

        .btn-claim:disabled {
            opacity: 0.4;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-claim .btn-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-claim .btn-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- MESSAGE BOX ----- */
        .msg-box {
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            display: none;
            border: 1.5px solid transparent;
        }

        .msg-box.success {
            display: block;
            background: rgba(74, 222, 128, 0.06);
            border-color: rgba(74, 222, 128, 0.12);
            color: #6ee7b7;
        }

        .msg-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.06);
            border-color: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
        }

        .msg-box svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            color: #6ee7b7;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ----- SPINNER ----- */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 8, 21, 0.1);
            border-top-color: #0a0815;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 8, 21, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px 14px;
            z-index: 30;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item .nav-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(0.35) grayscale(0.6);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .nav-item.active .nav-icon {
            filter: brightness(1) drop-shadow(0 0 12px rgba(93, 217, 242, 0.35));
            transform: scale(1.06);
        }

        .nav-item .nav-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-item.active .nav-label {
            color: var(--cyan);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 600px) {
            .container {
                padding: 0.8rem 0.8rem 1.5rem;
            }
            .brand-name {
                font-size: 17px;
            }
            .brand-icon {
                width: 36px;
                height: 36px;
            }
            .brand-icon svg {
                width: 18px;
                height: 18px;
            }
            .brand-badge {
                font-size: 7px;
                padding: 2px 8px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .glass-card {
                padding: 1.2rem 1rem 1.4rem;
            }
            .balance-display .amount {
                font-size: 1.2rem;
            }
            .form-group .input-wrap input {
                font-size: 0.85rem;
                padding: 0.65rem 1rem 0.65rem 40px;
            }
            .form-group .input-wrap .input-icon {
                left: 12px;
                width: 16px;
                height: 16px;
            }
            .btn-claim {
                font-size: 0.85rem;
                padding: 0.75rem;
            }
            .back-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .nav-item .nav-icon {
                width: 22px;
                height: 22px;
            }
            .nav-item .nav-label {
                font-size: 0.45rem;
            }
        }

        @media (max-width: 400px) {
            .balance-display {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
                text-align: center;
            }
            .form-group label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="6 6 18 6 6 18 18 18" />
                    </svg>
                </div>
                <span class="brand-name">Pureore<span class="pc">·PC</span></span>
                <span class="brand-badge">Voucher</span>
            </div>
        </div>

        <!-- ===== BACK ROW ===== -->
        <div class="back-row">
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
                Back
            </button>
        </div>

        <!-- ===== PAGE TITLE ===== -->
        <div class="page-title">🎫 Voucher Redemption</div>
        <div class="page-sub">Redeem your voucher code to add funds</div>

        <!-- ===== MAIN CARD ===== -->
        <div class="glass-card">

            <!-- Balance Display -->
            <div class="balance-display">
                <span class="label">💰 Current Balance</span>
                <span class="amount" id="userBalance">0.00 ZMW</span>
            </div>

            <!-- Form -->
            <div class="form-group">
                <label>👤 Your Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="userName" placeholder="Full name" autocomplete="off" readonly />
                </div>
            </div>

            <div class="form-group">
                <label>🔒 Your Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="userPassword" placeholder="Enter your password" autocomplete="current-password" />
                </div>
            </div>

            <div class="form-group">
                <label>📞 Agent Number</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="2.5" />
                        <path d="M8 2v20" />
                        <path d="M16 2v20" />
                        <path d="M2 8h20" />
                        <path d="M2 16h20" />
                    </svg>
                    <input type="tel" id="agentNumber" placeholder="Agent phone number" />
                </div>
            </div>

            <div class="form-group">
                <label>📛 Agent Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="agentName" placeholder="Agent full name" />
                </div>
            </div>

            <div class="form-group">
                <label>🎟️ Voucher Code</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="text" id="voucherCode" placeholder="Enter voucher code (10 characters)" maxlength="10" autocomplete="off" />
                </div>
                <div class="input-error" id="codeError"></div>
            </div>

            <button class="btn-claim" id="claimBtn">
                <span class="btn-icon">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
                    Redeem Voucher
                </span>
            </button>

            <div class="msg-box" id="messageArea"></div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="dashboard.html">
            <img class="nav-icon" src="https://i.ibb.co/qM4qxgGj/file-00000000248871f4bb1e73df45bacb92.png" alt="Home" />
            <span class="nav-label">Home</span>
        </button>

            <img class="nav-icon" src="https://i.ibb.co/5WSyHGRZ/IMG-20260622-183230.jpg" alt="Mkvip" />
            <span class="nav-label">Mkvip</span>
        </button>
        <button class="nav-item" data-page="jproduct.html">
            <img class="nav-icon" src="https://i.ibb.co/1fzvRd58/IMG-20260622-183217.jpg" alt="Jproduct" />
            <span class="nav-label">Jproduct</span>
        </button>
        <button class="nav-item" data-page="income.html">
            <img class="nav-icon" src="https://i.ibb.co/60hq0ds8/IMG-20260622-183154.jpg" alt="Income" />
            <span class="nav-label">Income</span>
        </button>
        <button class="nav-item active" data-page="voucher.html">
            <img class="nav-icon" src="https://i.ibb.co/QRRSRzC/IMG-20260622-183120.jpg" alt="Voucher" />
            <span class="nav-label">Voucher</span>
        </button>
        <button class="nav-item" data-page="me.html">
            <img class="nav-icon" src="https://i.ibb.co/JwY3HLVx/IMG-20260622-WA5359.jpg" alt="Me" />
            <span class="nav-label">Me</span>
        </button>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        var blockUnsub = null;

        function watchBlockStatus(userId) {
            if (blockUnsub) blockUnsub();
            blockUnsub = db.collection('users').doc(userId).onSnapshot(function(doc) {
                if (doc.exists && doc.data().isBlocked === true) {
                    showToast('⚠️ Your account has been blocked. Redirecting...', true);
                    setTimeout(function() {
                        auth.signOut().then(function() { window.location.href = 'login.html'; });
                    }, 2000);
                }
            }, function(err) { console.warn('Block listener error:', err); });
        }
        window.addEventListener('beforeunload', function() { if (blockUnsub) blockUnsub(); });

        // ================================================================
        // DOM REFS
        // ================================================================
        var claimBtn = document.getElementById('claimBtn');
        var messageArea = document.getElementById('messageArea');
        var userBalanceSpan = document.getElementById('userBalance');
        var userNameInput = document.getElementById('userName');
        var userPasswordInput = document.getElementById('userPassword');
        var agentNumberInput = document.getElementById('agentNumber');
        var agentNameInput = document.getElementById('agentName');
        var voucherCodeInput = document.getElementById('voucherCode');
        var codeError = document.getElementById('codeError');

        // ================================================================
        // LOAD USER BALANCE
        // ================================================================
        async function loadUserBalance(uid) {
            try {
                var userDoc = await db.collection('users').doc(uid).get();
                if (userDoc.exists) {
                    var balance = userDoc.data().balance || 0;
                    userBalanceSpan.textContent = balance.toFixed(2) + ' ZMW';
                }
            } catch (err) {
                console.warn("Could not load balance:", err);
            }
        }

        // ================================================================
        // VALIDATE AGENT
        // ================================================================
        async function validateAgent(agentNumber, agentName) {
            var trimmedNumber = agentNumber.trim();
            var trimmedName = agentName.trim();

            var numberQuery = await db.collection('agents')
                .where('number', '==', trimmedNumber)
                .get();

            if (!numberQuery.empty) {
                for (var doc of numberQuery.docs) {
                    var agent = doc.data();
                    if (agent.name && agent.name.toLowerCase() === trimmedName.toLowerCase()) {
                        return true;
                    }
                }
            }

            var nameQuery = await db.collection('agents')
                .where('name', '==', trimmedName)
                .get();
            if (!nameQuery.empty) {
                for (var doc of nameQuery.docs) {
                    var agent = doc.data();
                    if (agent.number && agent.number === trimmedNumber) {
                        return true;
                    }
                }
            }

            return false;
        }

        // ================================================================
        // SHOW MESSAGE
        // ================================================================
        function showMessage(msg, type) {
            messageArea.className = 'msg-box ' + type;
            var icon = type === 'error' ?
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' :
                '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
            messageArea.innerHTML = icon + ' ' + msg;
            messageArea.style.display = 'block';
            setTimeout(function() {
                messageArea.style.display = 'none';
            }, 5000);
        }

        function hideMessage() {
            messageArea.style.display = 'none';
            messageArea.className = 'msg-box';
        }

        // ================================================================
        // VOUCHER CODE VALIDATION
        // ================================================================
        voucherCodeInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
            codeError.textContent = '';
            if (this.value.length === 10) {
                var amountPart = this.value.substring(0, 6);
                var suffix = this.value.substring(6, 10);
                if (!/^\d{6}$/.test(amountPart)) {
                    codeError.textContent = 'First 6 characters must be numbers.';
                } else if (!/^[A-Z]{4}$/.test(suffix)) {
                    codeError.textContent = 'Last 4 characters must be letters (A-Z).';
                }
            }
        });

        // ================================================================
        // AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            watchBlockStatus(user.uid);
            await loadUserBalance(user.uid);
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                var fullName = userDoc.data().fullName;
                if (fullName) userNameInput.value = fullName;
            }
        });

        // ================================================================
        // CLAIM VOUCHER
        // ================================================================
        claimBtn.addEventListener('click', async function() {
            hideMessage();
            codeError.textContent = '';

            var userName = userNameInput.value.trim();
            var userPassword = userPasswordInput.value;
            var agentNumber = agentNumberInput.value.trim();
            var agentName = agentNameInput.value.trim();
            var voucherCodeRaw = voucherCodeInput.value.trim();
            var voucherCode = voucherCodeRaw.toUpperCase();

            // Validation
            if (!userName || !userPassword || !agentNumber || !agentName || !voucherCode) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            if (voucherCode.length !== 10) {
                showMessage('Voucher code must be exactly 10 characters.', 'error');
                return;
            }

            var amountPart = voucherCode.substring(0, 6);
            var suffix = voucherCode.substring(6, 10);
            var amountValue = parseFloat(amountPart);
            if (isNaN(amountValue) || amountValue <= 0) {
                showMessage('Invalid amount in voucher code (first 6 characters must be digits).', 'error');
                return;
            }
            if (!/^[A-Z]{4}$/.test(suffix)) {
                showMessage('Last 4 characters must be letters (A-Z).', 'error');
                return;
            }

            var user = auth.currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Verify user name matches
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists) {
                showMessage('User profile not found.', 'error');
                return;
            }
            var userData = userDoc.data();
            if (userData.fullName !== userName) {
                showMessage('Name does not match your registered name.', 'error');
                return;
            }

            // Re-authenticate
            var credential = firebase.auth.EmailAuthProvider.credential(user.email, userPassword);
            try {
                await user.reauthenticateWithCredential(credential);
            } catch (err) {
                showMessage('Incorrect password.', 'error');
                return;
            }

            // Validate agent
            var agentValid = await validateAgent(agentNumber, agentName);
            if (!agentValid) {
                showMessage('Agent not found. Please check the number and name exactly as registered.', 'error');
                return;
            }

            // Check voucher code
            var codeQuery = await db.collection('vouchers')
                .where('code', '==', voucherCode)
                .limit(1)
                .get();
            if (codeQuery.empty) {
                showMessage('Invalid voucher code. No such code exists.', 'error');
                return;
            }
            var voucherDoc = codeQuery.docs[0];
            var voucherData = voucherDoc.data();
            if (voucherData.used) {
                showMessage('This voucher code has already been used.', 'error');
                return;
            }
            if (Math.abs(voucherData.amount - amountValue) > 0.01) {
                showMessage('Voucher amount mismatch. Please contact support.', 'error');
                return;
            }

            claimBtn.disabled = true;
            claimBtn.innerHTML = '<span class="btn-icon"><span class="spinner"></span> Processing...</span>';

            try {
                await db.runTransaction(async function(transaction) {
                    var userRef = db.collection('users').doc(user.uid);
                    var userSnap = await transaction.get(userRef);
                    var newBalance = (userSnap.data().balance || 0) + amountValue;
                    transaction.update(userRef, { balance: newBalance });
                    transaction.update(voucherDoc.ref, {
                        used: true,
                        usedBy: user.uid,
                        usedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                await db.collection('transactions').add({
                    userId: user.uid,
                    type: 'voucher',
                    amount: amountValue,
                    description: 'Voucher code: ' + voucherCode + ' (Agent: ' + agentName + ' ' + agentNumber + ')',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await loadUserBalance(user.uid);
                showMessage('✅ Success! K' + amountValue.toFixed(2) + ' added to your balance. Redirecting...', 'success');
                voucherCodeInput.value = '';

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (err) {
                console.error('Voucher claim error:', err);
                showMessage('Error: ' + err.message, 'error');
                claimBtn.disabled = false;
                claimBtn.innerHTML = '<span class="btn-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg> Redeem Voucher</span>';
            }
        });

        // ================================================================
        // ENTER KEY SUPPORT
        // ================================================================
        voucherCodeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                claimBtn.click();
            }
        });
        userPasswordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                claimBtn.click();
            }
        });

        // ================================================================
        // BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'voucher.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) {
                    window.location.href = target;
                }
            });
        });

        console.log('✨ Pureore Capital · Voucher (unique design)');
        console.log('🎫 Glass-morphism with SVG icons');
        console.log('🔐 Firebase config untouched');
    </script>

</body>
</html>
